<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020">
<title>Ahora caigo · Duelos de preguntas</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--line:#34425f;--text:#f4f6ff;--muted:#aab6d0;--a:#8b7cff;--gold:#ffd166;--good:#48d597;--bad:#ff5d73;--blue:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 8% 0%,#29244d 0,transparent 42%),radial-gradient(ellipse at 100% 15%,#103e4b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{width:min(720px,100%);margin:auto;padding:20px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:850}.brand span{color:#6ee7d4}a{color:inherit;text-decoration:none}.back{color:var(--muted);font-size:14px}
h1{font-size:clamp(34px,8vw,54px);line-height:1;margin:0 0 6px;letter-spacing:-.05em;background:linear-gradient(100deg,#fff,#ffd166 50%,#ff5d73);-webkit-background-clip:text;background-clip:text;color:transparent}h2{font-size:20px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
.muted,.small{color:var(--muted)}.small{font-size:12px}.card{background:linear-gradient(145deg,rgba(29,41,67,.97),rgba(17,26,45,.97));border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 12px 35px #0003}.center{text-align:center}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:10px 0 5px;text-transform:uppercase}
input,select{width:100%;border:1.5px solid var(--line);background:#0d1629;color:var(--text);border-radius:12px;padding:13px;font:inherit;outline:none}input:focus,select:focus{border-color:var(--a)}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:12px;padding:13px 15px;background:linear-gradient(100deg,var(--a),#638cff);color:#fff;font-weight:800}.btn.secondary{background:#293753;border:1px solid var(--line)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none!important}
.code{font-size:30px;letter-spacing:.22em;font-weight:950;color:var(--gold);text-align:center}.tag,.player{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px;margin:3px;background:#0d1629}.player.me{border-color:#6ee7d4;color:#6ee7d4}.player.cen{border-color:var(--gold);color:var(--gold)}.player.duel{border-color:var(--bad);color:var(--bad)}.player.out{opacity:.4;text-decoration:line-through}
.notice{color:var(--gold);font-size:13px;min-height:18px;margin:6px 0}
.pot{font-size:28px;font-weight:950;color:var(--gold);text-align:center}
.duelo{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:12px 0}.vs{font-weight:950;color:var(--muted)}
.duelist{border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;transition:.2s}.duelist.on{border-color:var(--gold);background:rgba(255,209,102,.1);box-shadow:0 0 0 4px rgba(255,209,102,.18)}.duelist .n{font-weight:800;overflow-wrap:anywhere}.duelist .c{font-size:30px;font-weight:950;font-variant-numeric:tabular-nums}.duelist .c.low{color:var(--bad)}
.q{font-size:clamp(19px,4.4vw,26px);font-weight:900;text-align:center;margin:10px 0 14px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:13px;border:2px solid var(--line);background:#101a2e;color:var(--text);font-weight:700;font-size:16px}.opt:hover:not(:disabled){border-color:var(--a);background:#16213a}.opt:disabled{opacity:.75;cursor:default}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 14px}.box{width:34px;height:42px;border-radius:8px;border:2px solid #60a5fa;background:#12264d;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff}.box.on{background:#1d4ed8;border-color:#93c5fd}.gap{width:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:#101a2e;color:var(--text);font-weight:700}.chip.on{border-color:var(--gold);background:rgba(255,209,102,.14)}
.msg{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#101a2e;margin:10px 0;text-align:center;font-weight:700}.msg.fall{border-color:var(--bad);background:#2a1119;color:#ffc2cc;animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.foot{font-size:11px;color:var(--muted);text-align:center;margin:18px 0}
@media(max-width:520px){.duelo{grid-template-columns:1fr;}.vs{display:none}}
</style></head>
<body><div class="wrap">
<header class="top"><a class="brand" href="/">Ahora <span>caigo</span></a><a class="back" href="/">← Juegos</a></header>
<main id="app"></main>
<p class="foot">Ahora caigo · Salas en directo · de 2 a 11 jugadores · juego de fans, no oficial</p></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),app=$('app');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='cmc_caigo_session_v1',CID='cmc_caigo_cid_v1',KEY='cmc_caigo_key_v1';
const MAXP=11,MINP=2,CLOCK=20000,PASSES=2,STEP=10000,PENALTY=3000;
const rand=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const canon=s=>norm(s).replace(/ /g,'');
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
const isMatch=(guess,ans)=>{const g=canon(guess);return !!g&&ans.split('|').some(a=>{const c=canon(a);return g===c||(c.length>=6&&lev(g,c)<=1)})};
const disp=ch=>ch.toLowerCase()==='ñ'?'Ñ':ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
function mkReveal(main){const ch=[...main],rv=ch.map((c,i)=>c!==' '&&(i===0||ch[i-1]===' '));const hid=shuffle(ch.map((c,i)=>(!rv[i]&&c!==' ')?i:-1).filter(i=>i>=0));hid.slice(0,Math.round(hid.length*.3)).forEach(i=>rv[i]=true);return rv}
const mainAns=q=>CATS[q.c][1][q.i][1].split('|')[0];

// ---------- Preguntas: [pregunta,[correcta,fallo1,fallo2]] ----------
const CATS_RAW=[
['🌍 Geografía',[['Capital de Australia',['Canberra']],['Río más largo de la península ibérica',['Tajo']],['País más poblado de Sudamérica',['Brasil']],['Océano más grande del planeta',['Pacífico']],['Capital de Canadá',['Ottawa']],['Montaña más alta del mundo',['Everest']],['País donde está Machu Picchu',['Perú']],['Isla más grande del Mediterráneo',['Sicilia']]]],
['📜 Historia',[['Navegante que llegó a América en 1492',['Colón|Cristóbal Colón']],['Primer presidente de Estados Unidos',['Washington|George Washington']],['Ciudad alemana cuyo muro cayó en 1989',['Berlín']],['Civilización que levantó Machu Picchu',['Inca|Incas']],['Reina de Egipto que conquistó a César y a Marco Antonio',['Cleopatra']],['Emperador francés derrotado en Waterloo',['Napoleón|Napoleon Bonaparte']],['Ciudad romana sepultada por el Vesubio',['Pompeya']],['Faraón niño cuya tumba descubrió Howard Carter',['Tutankamón|Tutankamon']]]],
['🔬 Ciencia',[['Metal precioso de color amarillo',['Oro']],['Planeta más cercano al Sol',['Mercurio']],['Gas que respiramos y necesitan los seres vivos',['Oxígeno']],['Órgano que bombea la sangre',['Corazón']],['Planeta conocido como el planeta rojo',['Marte']],['Científico autor de la teoría de la relatividad',['Einstein|Albert Einstein']],['Fuerza que nos mantiene pegados al suelo',['Gravedad']],['Satélite natural de la Tierra',['Luna']]]],
['🎬 Cine y series',[['Director de «Titanic»',['Cameron|James Cameron']],['Ogro verde protagonista de una película de animación',['Shrek']],['Actor que da vida a Jack Sparrow',['Depp|Johnny Depp']],['Serie de Netflix con una niña llamada Eleven',['Stranger Things']],['Película de Almodóvar que ganó el Oscar en el año 2000',['Todo sobre mi madre']],['Saga que dice «que la fuerza te acompañe»',['Star Wars|La guerra de las galaxias']],['Director de «El Padrino»',['Coppola|Francis Ford Coppola']],['Joven mago con gafas creado por J. K. Rowling',['Harry Potter|Potter']]]],
['🎵 Música',[['Rey del pop, autor de «Thriller»',['Michael Jackson|Jackson']],['Grupo de Freddie Mercury',['Queen']],['Instrumento de seis cuerdas muy popular en España',['Guitarra']],['País del grupo ABBA',['Suecia']],['Cantante colombiana de «Hips Don\'t Lie»',['Shakira']],['Instrumento que tocaba Yehudi Menuhin',['Violín']],['Compositor de «La flauta mágica»',['Mozart']],['Instrumento de teclas blancas y negras',['Piano']]]],
['⚽ Deportes',[['País campeón del Mundial de fútbol de 2010',['España']],['Deporte que practica Rafael Nadal',['Tenis']],['Ciudad española de los Juegos Olímpicos de 1992',['Barcelona']],['Deporte que se juega con una canasta',['Baloncesto']],['País de origen del judo',['Japón']],['Ciclista español de cinco Tours seguidos',['Induráin|Miguel Induráin']],['Deporte con raqueta y volante',['Bádminton']],['Prueba de atletismo de 42 kilómetros',['Maratón']]]],
['🐾 Naturaleza',[['Mamífero más grande del planeta',['Ballena azul|Ballena']],['Animal terrestre más veloz',['Guepardo']],['Único mamífero capaz de volar',['Murciélago']],['Animal australiano que come eucalipto',['Koala']],['Animal marino con ocho tentáculos',['Pulpo']],['Insecto que fabrica miel',['Abeja']],['Ave símbolo de la paz',['Paloma']],['Felino conocido como el rey de la selva',['León']]]],
['🎨 Cultura general',[['Autor de «Don Quijote de la Mancha»',['Cervantes|Miguel de Cervantes']],['Pintor de «Las Meninas»',['Velázquez']],['Pintor de «La Gioconda»',['Leonardo da Vinci|Leonardo|Da Vinci']],['Ciudad de la Sagrada Familia',['Barcelona']],['Autor de «Cien años de soledad»',['García Márquez|Gabriel García Márquez']],['Pintor del «Guernica»',['Picasso|Pablo Picasso']],['Dramaturgo inglés autor de «Romeo y Julieta»',['Shakespeare']],['Museo madrileño donde cuelga «Las Meninas»',['Prado|El Prado|Museo del Prado']]]]
];
const CATS=CATS_RAW.map(([n,qs])=>[n,qs.map(([c,a])=>[c,a[0]])]);

// ---------- Estado local y red ----------
const load=()=>{try{return JSON.parse(sessionStorage.getItem(STORE)||'null')}catch{return null}};
let saved=load(),name=saved?.name||'',roomCode=saved?.room||'',isHost=!!saved?.host,state=saved?.state||null,
 myKey=sessionStorage.getItem(KEY)||Math.random().toString(36).slice(2,11),cid=sessionStorage.getItem(CID)||Math.random().toString(36).slice(2)+Date.now().toString(36),
 socket=null,peers=[],closed=false,retry=0,connecting=false,curSig='',myPres={},offset=0,selOpp=null,absentSince=0,selSeq=-1;
sessionStorage.setItem(KEY,myKey);sessionStorage.setItem(CID,cid);
const persist=()=>sessionStorage.setItem(STORE,JSON.stringify({name,room:roomCode,host:isHost,state}));
const P=x=>x.p||{};
const playerList=()=>peers.map(x=>P(x)).filter(p=>p.c_key).map(p=>({key:p.c_key,name:p.c_name||'Jugador',p}));
const pname=k=>state?.names?.[k]||playerList().find(p=>p.key===k)?.name||'Jugador';
function publish(extra={}){Object.assign(myPres,extra);if(!socket||socket.readyState!==1)return;socket.send(JSON.stringify({t:'pres',p:{c_name:name,c_key:myKey,c_host:isHost?1:0,...myPres}}))}
function commit(){if(!isHost)return;state.v=(state.v||0)+1;state.hostNow=Date.now();publish({c_state:state});persist();render()}
function connect(){if(connecting||!roomCode)return;connecting=true;closed=false;
 socket=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);
 socket.onopen=()=>socket.send(JSON.stringify({t:'join',room:'cmb-caigo-'+roomCode.toLowerCase(),cid}));
 socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.t==='hello')return;
  if(m.t==='err'){closed=true;connecting=false;try{socket.close()}catch{}const msg=m.code==='room_full'?'La sala está llena.':'No se ha podido entrar en esa sala.';roomCode='';state=null;renderHome(msg);return}
  if(m.t==='peers'){peers=m.peers||[];connecting=false;
   if(!peers.some(x=>P(x).c_key===myKey))publish(isHost&&state?{c_state:state}:{});
   if(!isHost){const hp=peers.find(x=>P(x).c_host===1&&P(x).c_state),inc=hp&&P(hp).c_state;if(inc&&(!state||inc.v!==state.v)){state=inc;offset=(inc.hostNow||Date.now())-Date.now();persist()}}
   hostStep();render()}};
 socket.onclose=()=>{connecting=false;if(closed)return;retry++;setTimeout(()=>{if(!closed)connect()},Math.min(1000*retry,8000))};socket.onerror=()=>{}}
const code5=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=c[rand(c.length)];return s};
function createRoom(){name=($('name')?.value.trim()||'Jugador').slice(0,16);roomCode=code5();isHost=true;myPres={};offset=0;state={v:0,phase:'lobby'};persist();connect();render()}
function joinRoom(){name=($('name')?.value.trim()||'Jugador').slice(0,16);const c=($('code')?.value||'').trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(c))return renderHome('Escribe un código de sala de cinco caracteres.');roomCode=c;isHost=false;myPres={};state=null;persist();connect();render()}
function leaveRoom(){closed=true;try{socket?.close()}catch{}socket=null;peers=[];roomCode='';state=null;curSig='';myPres={};sessionStorage.removeItem(STORE);renderHome()}

// ---------- Lógica del anfitrión ----------
const other=(d,k)=>k===d.a?d.b:d.a;
const left=k=>{const d=state.duel;if(!d)return 0;let l=d.clock[k];if(state.phase==='duel'&&k===state.turnKey)l-=Date.now()+offset-state.turnAt;return Math.max(0,l)};
function startGame(){const ps=playerList().sort((a,b)=>(b.p.c_host?1:0)-(a.p.c_host?1:0)).slice(0,MAXP);if(ps.length<MINP)return;
 const order=ps.map(p=>p.key),names={};ps.forEach(p=>names[p.key]=p.name);
 Object.assign(state,{order,names,alive:order.slice(),out:[],central:order[rand(order.length)],pot:0,used:{},seq:0,duel:null,fall:null,q:null});startPick()}
function startPick(){state.cats=shuffle(CATS.map((_,i)=>i)).slice(0,2);state.pickUntil=Date.now()+30000;state.phase='pick';state.seq++;commit()}
function nextQuestion(){const c=state.duel.cat,qs=CATS[c][1];state.used[c]=state.used[c]||[];let av=qs.map((_,i)=>i).filter(i=>!state.used[c].includes(i));if(!av.length){state.used[c]=[];av=qs.map((_,i)=>i)}
 const i=av[rand(av.length)];state.used[c].push(i);state.q={c,i,rv:mkReveal(qs[i][1].split('|')[0])}}
function startDuel(opp,cat){const a=state.central;state.duel={a,b:opp,cat,clock:{[a]:CLOCK,[opp]:CLOCK},passes:{[a]:0,[opp]:0}};state.turnKey=opp;state.last=null;nextQuestion();state.turnAt=Date.now();state.phase='duel';state.seq++;absentSince=0;commit()}
function charge(){const d=state.duel;d.clock[state.turnKey]-=Date.now()-state.turnAt}
function endDuel(loser,why){why=why+' · era «'+mainAns(state.q)+'»';const d=state.duel,winner=other(d,loser);state.alive=state.alive.filter(k=>k!==loser);state.out.push(loser);state.pot+=STEP;state.central=winner;state.fall={loser,why};state.phase='fall';state.until=Date.now()+4500;state.seq++;commit()}
function hostStep(){if(!isHost||!state||!state.alive)return;const pls=playerList(),pl={};pls.forEach(p=>pl[p.key]=p.p);
 if(state.phase==='pick'){const c=pl[state.central]&&pl[state.central].c_act;
  if(c&&c.s===state.seq&&c.type==='duel'&&state.alive.includes(c.opp)&&c.opp!==state.central&&state.cats.includes(c.cat))return startDuel(c.opp,c.cat);
  if(Date.now()>state.pickUntil){const opps=state.alive.filter(k=>k!==state.central);return startDuel(opps[rand(opps.length)],state.cats[0])}return}
 if(state.phase==='duel'){const cur=state.turnKey,d=state.duel,c=pl[cur]&&pl[cur].c_act;
  if(c&&c.s===state.seq){
   if(c.type==='ans'&&typeof c.text==='string'&&c.text.trim()){const txt=c.text.trim().slice(0,40);charge();if(d.clock[cur]<=0)return endDuel(cur,'se le acabó el tiempo');
    if(isMatch(txt,CATS[state.q.c][1][state.q.i][1])){state.last={k:cur,txt,ok:true};state.turnKey=other(d,cur);nextQuestion();state.turnAt=Date.now();state.seq++;return commit()}
    d.clock[cur]-=PENALTY;if(d.clock[cur]<=0)return endDuel(cur,'se quedó sin tiempo tras fallar');
    const hid=state.q.rv.map((v,k)=>!v&&[...mainAns(state.q)][k]!==' '?k:-1).filter(k=>k>=0);if(hid.length>1)state.q.rv[hid[rand(hid.length)]]=true;
    state.last={k:cur,txt,ok:false};state.turnAt=Date.now();state.seq++;return commit()}
   if(c.type==='pass'&&cur===state.central&&d.passes[cur]<PASSES){charge();if(d.clock[cur]<=0)return endDuel(cur,'se le acabó el tiempo');d.passes[cur]++;state.last={k:cur,pass:true};state.turnKey=other(d,cur);state.turnAt=Date.now();state.seq++;return commit()}}
  if(left(cur)<=0)return endDuel(cur,'se le acabó el tiempo');
  if(!pl[cur]){absentSince=absentSince||Date.now();if(Date.now()-absentSince>10000)return endDuel(cur,'se desconectó')}else absentSince=0;return}
 if(state.phase==='fall'&&Date.now()>=state.until){if(state.alive.length<=1){state.phase='finished';return commit()}startPick()}}

// ---------- Acciones del jugador ----------
function sendDuel(cat){const m=$('amsg');if(!selOpp)return m&&(m.textContent='Primero toca a tu rival.');publish({c_act:{s:state.seq,type:'duel',opp:selOpp,cat}})}
function sendAns(){const el=$('ans'),t=(el?.value||'').trim();if(!t)return;publish({c_act:{s:state.seq,type:'ans',text:t.slice(0,40)}});el.value='';el.disabled=true;$('sbtn')&&($('sbtn').disabled=true)}
function sendPass(){publish({c_act:{s:state.seq,type:'pass'}})}

// ---------- Vistas ----------
function mount(sig,html,bind){if(sig===curSig)return;curSig=sig;app.innerHTML=html;bind&&bind()}
function setHTML(el,html){if(!el)return;if(el._h!==html){el._h=html;el.innerHTML=html}}
function renderHome(msg=''){curSig='';app.innerHTML='<section class="card center"><h1>AHORA CAIGO</h1><p class="muted">Un concursante central contra todos. Gana los duelos de preguntas o caerás por la trampilla. 🕳️</p></section><section class="card"><label for="name">Tu nombre</label><input id="name" maxlength="16" placeholder="¿Cómo te llamas?" value="'+safe(name)+'"><div class="row" style="margin-top:14px"><button class="btn" id="create">Crear sala</button><button class="btn secondary" id="tj">Unirme con código</button></div><div id="ja" class="hidden"><label for="code">Código de sala</label><input id="code" maxlength="5" placeholder="ABCDE" autocapitalize="characters"><button class="btn secondary" id="join" style="width:100%;margin-top:10px">Entrar</button></div><p class="notice" id="notice">'+safe(msg)+'</p></section><section class="card"><h3>Cómo se juega</h3><p class="muted small">Hay un <b>concursante central</b> (⭐) y hasta 10 rivales, todos en la sala. El central elige a un rival y una de dos categorías: ¡empieza el <b>duelo</b>!<br><br>• Cada duelista tiene <b>20 segundos</b>. El reloj solo corre en su turno.<br>• En tu turno aparece una definición y la respuesta en <b>huecos con letras</b>: escríbela completa. Si aciertas, el turno pasa a tu rival, que responde otra pregunta.<br>• Si fallas pierdes 3 segundos, se destapa otra letra y puedes volver a intentarlo.<br>• Si se acaba tu tiempo… <b>¡caes por la trampilla!</b> 🕳️ Empieza respondiendo el rival. El central tiene <b>2 comodines</b> para pasarle la pregunta.<br>• El ganador es el nuevo central. Cada caída suma 10.000 € al <b>bote</b>.<br>• El último en pie se lo lleva todo.</p></section>';
 $('create').onclick=createRoom;$('tj').onclick=()=>{$('ja').classList.toggle('hidden');$('code')?.focus()};$('join').onclick=joinRoom;$('code')?.addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5))}
function renderLobby(){
 mount('lobby|'+isHost,'<section class="card center"><div class="tag">CÓDIGO DE SALA</div><div class="code">'+safe(roomCode)+'</div><button class="btn secondary" id="copy">Copiar código</button><div id="pl" style="margin-top:10px"></div></section>'
 +(isHost?'<section class="card"><button class="btn" id="start" style="width:100%">Empezar partida</button><p class="small muted center" style="margin-top:8px">Se necesitan entre '+MINP+' y '+MAXP+' jugadores. Quien se conecte después, verá la partida como espectador.</p></section>':'<section class="card center"><p class="muted">El anfitrión iniciará la partida cuando estéis listos…</p></section>')
 +'<button class="btn ghost" id="leave" style="width:100%">Salir de la sala</button>',
 ()=>{$('copy').onclick=()=>navigator.clipboard?.writeText(roomCode).then(()=>$('copy').textContent='¡Copiado!').catch(()=>{});$('leave').onclick=leaveRoom;$('start')&&($('start').onclick=startGame)});
 const ps=playerList();$('pl').innerHTML=ps.map(p=>'<span class="player '+(p.key===myKey?'me':'')+'">'+safe(p.name)+(p.p.c_host?' · anfitrión':'')+(p.key===myKey?' · tú':'')+'</span>').join('')+'<p class="small muted">'+ps.length+' conectados'+(ps.length<MINP?' · hacen falta al menos '+MINP:'')+'</p>';
 const s=$('start');if(s)s.disabled=ps.length<MINP}
function playersHtml(){return state.order.map(k=>{const out=state.out.includes(k),d=state.duel;
 const cls=out?'out':(k===state.central?'cen':(d&&state.phase==='duel'&&(k===d.a||k===d.b)?'duel':''));
 return'<span class="player '+cls+(k===myKey?' me':'')+'">'+(out?'🕳️ ':(k===state.central?'⭐ ':''))+safe(pname(k))+(k===myKey?' · tú':'')+'</span>'}).join('')}
function qboxHtml(){const ph=state.phase;
 if(ph==='pick'){const c=state.central===myKey;
  if(!c)return'<div class="msg">⭐ '+safe(pname(state.central))+' está eligiendo rival y categoría…</div>';
  const opps=state.alive.filter(k=>k!==state.central);
  return'<h3>Elige a tu rival</h3><div class="chips">'+opps.map(k=>'<button class="chip '+(selOpp===k?'on':'')+'" data-o="'+k+'">'+safe(pname(k))+'</button>').join('')+'</div><h3>Y la categoría del duelo</h3><div class="chips">'+state.cats.map(i=>'<button class="chip" data-c="'+i+'">'+safe(CATS[i][0])+'</button>').join('')+'</div><p class="notice" id="amsg"></p>'}
 if(ph==='duel'){const d=state.duel,q=CATS[state.q.c][1][state.q.i],chars=[...q[1].split('|')[0]],mine=state.turnKey===myKey,rv=state.q.rv;
  const word='<div class="word">'+chars.map((ch,k)=>ch===' '?'<span class="gap"></span>':'<span class="box'+(rv[k]?' on':'')+'">'+(rv[k]?safe(disp(ch)):'')+'</span>').join('')+'</div>';
  const last=state.last?'<div class="msg">'+safe(pname(state.last.k))+': '+(state.last.pass?'usa un comodín y pasa la pregunta ⤴':'«'+safe(state.last.txt)+'» '+(state.last.ok?'✔':'✖ (−3 s y se destapa una letra)'))+'</div>':'';
  return'<div class="small muted center">'+safe(CATS[d.cat][0])+' · turno de <b>'+safe(pname(state.turnKey))+'</b></div><div class="q">'+safe(q[0])+'</div>'+word+last
   +(mine?'<div class="row" style="margin-top:8px"><input id="ans" maxlength="40" autocomplete="off" placeholder="Completa la respuesta…" style="flex:3"><button class="btn" id="sbtn">Responder</button></div>'+(myKey===state.central&&d.passes[myKey]<PASSES?'<button class="btn ghost" id="pass" style="width:100%;margin-top:8px">Comodín: pasar la pregunta al rival ('+(PASSES-d.passes[myKey])+' restantes)</button>':''):'')}
 if(ph==='fall'){const f=state.fall;return'<div class="msg fall">💥 ¡'+safe(pname(f.loser))+' cae por la trampilla!<br><span class="small">'+safe(f.why)+'</span></div>'}
 return''}
function renderGame(){const ph=state.phase,sig='g|'+ph+'|'+state.seq+'|'+(state.central===myKey);
 mount(sig,'<section class="card"><div class="pot" id="pot"></div><div class="small muted center">BOTE ACUMULADO</div><div class="duelo" id="duelo"></div><div id="qbox"></div></section><section class="card"><h3>Concursantes</h3><div id="players"></div></section>',
 ()=>{selOpp=null;
  $('qbox').onclick=e=>{const o=e.target.closest('[data-o]');if(o){selOpp=o.dataset.o;return updateGame()}const c=e.target.closest('[data-c]');if(c)return sendDuel(Number(c.dataset.c));
   if(e.target.closest('#sbtn'))return sendAns();if(e.target.closest('#pass'))sendPass()};
  $('qbox').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='ans')sendAns()}});
 updateGame();const inp=$('ans');if(inp)inp.focus()}
function updateGame(){if(!state||!state.alive)return;const d=state.duel,ph=state.phase;
 setHTML($('pot'),(state.pot).toLocaleString('es-ES')+' €');
 setHTML($('duelo'),d&&(ph==='duel'||ph==='fall')?['a','b'].map((x,idx)=>{const k=d[x];return(idx?'<div class="vs">VS</div>':'')+'<div class="duelist '+(ph==='duel'&&state.turnKey===k?'on':'')+'"><div class="n">'+(k===state.central&&ph!=='fall'?'⭐ ':'')+safe(pname(k))+'</div><div class="c" id="clk'+x+'">'+(left(k)/1000).toFixed(1)+' s</div></div>'}).join(''):'');
 setHTML($('qbox'),qboxHtml());setHTML($('players'),playersHtml());tick()}
function tick(){if(!state||state.phase!=='duel'||!state.duel)return;['a','b'].forEach(x=>{const el=$('clk'+x);if(el){const l=left(state.duel[x]);el.textContent=(l/1000).toFixed(1)+' s';el.classList.toggle('low',l<5000)}})}
function renderFinished(){const w=state.alive[0];
 mount('fin','<section class="card center"><div class="tag">PARTIDA TERMINADA</div><div style="font-size:78px">🏆</div><h1>'+safe(pname(w))+' gana</h1><div class="pot" style="margin-top:8px">'+state.pot.toLocaleString('es-ES')+' €</div><p class="muted">¡Se lleva todo el bote!</p></section>'
 +'<section class="card"><h3>Orden de caída</h3>'+state.out.map((k,i)=>'<div class="player">'+(i+1)+'. 🕳️ '+safe(pname(k))+'</div>').join('')+'</section>'
 +(isHost?'<button class="btn" id="again" style="width:100%">Volver a la sala</button>':'')+'<button class="btn ghost" id="leave" style="width:100%;margin-top:9px">Salir</button>',
 ()=>{$('again')&&($('again').onclick=()=>{state.phase='lobby';commit()});$('leave').onclick=leaveRoom})}
function render(){if(!roomCode)return renderHome();
 if(!socket||socket.readyState!==1){mount('conn','<section class="card center"><h2>Entrando en la sala…</h2><p class="muted">'+safe(roomCode)+'</p><button class="btn ghost" id="c">Cancelar</button></section>',()=>$('c').onclick=leaveRoom);return}
 if(!state)return mount('wait','<section class="card center"><h2>Esperando al anfitrión…</h2><p class="muted">Sala '+safe(roomCode)+'</p><button class="btn ghost" id="l">Salir</button></section>',()=>$('l').onclick=leaveRoom);
 if(state.phase==='lobby')renderLobby();else if(state.phase==='finished')renderFinished();else renderGame()}
setInterval(()=>{if(roomCode&&state)hostStep()},400);
setInterval(tick,100);
if(saved?.room&&saved?.name){connect();render()}else renderHome();
})();
</script></body></html>
