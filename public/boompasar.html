<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Tic Tac Boom · Pasar</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--line:#2b3854;--text:#f4f7ff;--muted:#a8b4cc;--accent:#ff9f43;--green:#39d6a0;--yellow:#ffd166;--red:#ff5d73;--blue:#6cb6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#4a2a3d,transparent 48%),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:auto;min-height:100%;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.brand{font-weight:850}.brand span{color:var(--accent)}
.card{background:linear-gradient(145deg,#1c2238,#111a2d);border:1px solid var(--line);border-radius:20px;padding:20px;margin:10px 0}.center{text-align:center}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:850}.title{font-size:clamp(32px,9vw,52px);line-height:1.04;margin:8px 0 10px;font-weight:900}
.muted{color:var(--muted)}.small{font-size:13px}
label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 6px}
select{width:100%;padding:13px 14px;border:1px solid #3b4a69;border-radius:12px;background:#0d1628;color:var(--text);font:inherit}
.btn{border:0;border-radius:16px;padding:16px 18px;background:linear-gradient(135deg,#ff9f43,#ff5d73);color:#fff;font:inherit;font-weight:900;cursor:pointer;width:100%;box-shadow:0 7px 20px #ff5d7330}.btn.s{background:#263451;border:1px solid #405174;box-shadow:none}.btn:disabled{opacity:.4}
.ico{background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:6px 10px;font:inherit;cursor:pointer}
.game{flex:1;display:flex;flex-direction:column}.game .card{flex:0 0 auto}
.bomb{font-size:96px;line-height:1.1;display:inline-block;animation:pulse var(--beat,1s) ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}@keyframes flash{0%{background:#ffd16655}100%{background:transparent}}
.syl{font-size:clamp(46px,15vw,88px);font-weight:950;letter-spacing:.04em;background:linear-gradient(145deg,#ff9f43,#ff5d73);border-radius:24px;display:inline-block;padding:4px 26px;box-shadow:0 14px 40px #ff5d7355;margin:6px 0}
.die{display:inline-block;border-radius:10px;padding:3px 12px;font-weight:950;letter-spacing:.08em;color:#0b1020}.d-TIC{background:var(--green)}.d-TAC{background:var(--blue)}.d-BOUM{background:var(--red);color:#fff}
.event{color:var(--yellow);font-weight:800;min-height:28px;margin:8px 0}
.pass{flex:1;min-height:140px;font-size:clamp(30px,9vw,44px);margin-top:10px;border-radius:24px;background:linear-gradient(135deg,#1fb98a,#39d6a0);color:#06241b;box-shadow:0 10px 30px #39d6a040}.pass:active{transform:scale(.98)}
.boom{font-size:110px;animation:pop .5s}.hidden{display:none!important}
.flash{animation:flash .5s}
</style></head><body><div class="wrap">
<header class="top"><span class="brand">Tic Tac <span>Boom</span></span><button class="ico" id="snd" aria-label="Sonido">🔊</button></header>
<main id="app" class="game"></main></div>
<script>
(()=>{'use strict';
const $=i=>document.getElementById(i),app=$('app'),rand=n=>Math.floor(Math.random()*n);
const SYL={a:'ca co cu da de di do la le li lo ma me mi mo na ne ni no pa pe pi po ra re ri ro sa se si so ta te ti to ba be bo ga go va ve vi tar ter tor mar can ten ton par cer cor sal sol pal pel pol tin tan'.split(' '),
 s:'pre pro tra bra cla gra pla tri con des com ant est pri fra flo fre'.split(' '),
 e:'ción dor dad mente ero era ista ura ico ica ble ado ido oso osa aje'.split(' ')};
const MODES={TIC:'empiecen por',TAC:'acaben en',BOUM:'contengan'},ALLOWED={a:['TIC','TAC','BOUM'],s:['TIC','BOUM'],e:['TAC','BOUM']};
let cfg={time:60,dice:1,syl:0},G=null,muted=false,lastPass=0,nb=0,seen=[],rounds=0,ac=null;
try{Object.assign(cfg,JSON.parse(localStorage.getItem('boompasar')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('boompasar',JSON.stringify(cfg))}catch(e){}};
function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f,d,v=.06){if(muted)return;const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.stop(c.currentTime+d)}
function boomSound(){if(!muted){const c=audio();if(c){const n=c.sampleRate*.8,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.frequency.value=700;g.gain.value=.7;s.buffer=b;s.connect(f);f.connect(g);g.connect(c.destination);s.start()}}try{navigator.vibrate&&navigator.vibrate([200,80,300])}catch(e){}}
function pickMode(type){const a=ALLOWED[type];return cfg.dice?a[rand(a.length)]:a[0]}
function newSyl(){const pool=[];for(const t of['a','s','e'])SYL[t].forEach(s=>pool.push([s,t]));let c;for(let i=0;i<30;i++){c=pool[rand(pool.length)];if(!seen.includes(c[0]))break}
 if(seen.length>60)seen=[];seen.push(c[0]);G.syl=c[0];G.type=c[1];G.mode=pickMode(c[1])}
function startRound(){audio();rounds++;const now=Date.now();G={start:now,end:now+(cfg.time?cfg.time*1000:(25+rand(86))*1000),passes:0,over:0};newSyl();nb=0;
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}renderPlay('')}
function pass(){if(!G||G.over)return;const n=Date.now();if(n-lastPass<250)return;lastPass=n;G.passes++;let ev='';
 if(cfg.syl)newSyl();else if(cfg.dice&&Math.random()<.3){const m=ALLOWED[G.type].filter(x=>x!==G.mode);if(m.length){G.mode=m[rand(m.length)];ev='🎲 ¡El dado cambia a '+G.mode+'!'}}
 tone(900,.05,.08);try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}renderPlay(ev)}
function explode(){G.over=1;boomSound();renderBoom()}
function renderHome(){const opt=(arr,v)=>arr.map(([k,t])=>'<option value="'+k+'"'+(String(k)===String(v)?' selected':'')+'>'+t+'</option>').join('');
 app.innerHTML='<section class="card center"><div class="eyebrow">Un solo dispositivo · sin jugadores</div><h1 class="title">TIC TAC BOOM 💣</h1><p class="muted">Una sílaba, un dado y una bomba oculta. Di una palabra en voz alta, pulsa PASAR y pasa el móvil. A quien le explote en la mano, pierde.</p></section>'+
 '<section class="card"><label for="time">⏱ Duración de la bomba</label><select id="time">'+opt([[30,'30 segundos'],[60,'60 segundos'],[90,'90 segundos'],[120,'120 segundos'],[0,'🎲 Sorpresa (25–110 s)']],cfg.time)+'</select>'+
 '<label for="dice">🎲 Dado (cambia el modo a veces)</label><select id="dice">'+opt([[1,'Activado'],[0,'Desactivado']],cfg.dice)+'</select>'+
 '<label for="syl">🔤 Sílaba</label><select id="syl">'+opt([[0,'La misma durante toda la ronda'],[1,'Nueva en cada pase']],cfg.syl)+'</select></section>'+
 '<section class="card"><p class="muted small" style="margin:0"><b>🟢 TIC</b>: palabras que empiecen por la sílaba · <b>🔵 TAC</b>: que acaben en ella · <b>🔴 BOUM</b>: que la contengan. La bomba no se reinicia al pasarla: solo late más rápido cuanto menos queda.</p></section>'+
 '<button class="btn" id="go" style="margin-top:auto">¡Empezar!</button>';
 $('go').onclick=()=>{cfg.time=+$('time').value;cfg.dice=+$('dice').value;cfg.syl=+$('syl').value;save();startRound()}}
function renderPlay(ev){const t=G.syl.toUpperCase(),s=G.mode==='TIC'?t+'…':G.mode==='TAC'?'…'+t:'…'+t+'…';
 app.innerHTML='<section class="card center'+(ev?' flash':'')+'"><div class="eyebrow">Ronda '+rounds+' · '+G.passes+' pases</div><div class="bomb" id="bomb">💣</div><br><div class="syl">'+s+'</div><p style="margin:8px 0 0"><span class="die d-'+G.mode+'">'+G.mode+'</span> Palabras que <b>'+MODES[G.mode]+'</b> «'+G.syl+'»</p><div class="event">'+ev+'</div></section><button class="btn pass" id="pass">PASAR 💣</button>';
 const b=$('pass');b.addEventListener('pointerdown',e=>{e.preventDefault();pass()})}
function renderBoom(){app.innerHTML='<section class="card center"><div class="boom">💥</div><h1 class="title">¡BOOM!</h1><p>Pierde quien tenga el móvil en la mano 😈</p><p class="muted small">Sílaba «'+G.syl+'» · '+G.mode+' · '+G.passes+' pases</p></section><div style="margin-top:auto"><button class="btn" id="again" disabled>Otra ronda</button><button class="btn s" id="cfgb" style="margin-top:10px" disabled>Ajustes</button></div>';
 setTimeout(()=>{const a=$('again'),c=$('cfgb');if(a)a.disabled=false;if(c)c.disabled=false},1200);$('again').onclick=startRound;$('cfgb').onclick=()=>{G=null;renderHome()}}
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊'};
setInterval(()=>{if(!G||G.over)return;const now=Date.now();if(now>=G.end){explode();return}
 const f=(G.end-now)/(G.end-G.start),beat=f>.35?1:.2+f/.35*.8,b=$('bomb');if(b)b.style.setProperty('--beat',beat+'s');
 if(now>=nb){tone(f>.35?600:f>.15?800:1000,.07);nb=now+beat*1000}},60);
renderHome();
})();
</script></body></html>
