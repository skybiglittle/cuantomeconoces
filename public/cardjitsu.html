<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d1c">
<title>Card-Jitsu · Duelos de cartas</title>

<style>
:root{
  color-scheme:dark;
  --bg:#080d1c;
  --bg2:#10182b;
  --card:#121d33;
  --card2:#17243d;
  --line:#344766;
  --text:#f5f7ff;
  --muted:#9eacc8;
  --a:#8b7cff;
  --a2:#5f8cff;
  --gold:#ffd166;
  --good:#48d597;
  --bad:#ff667d;
  --cyan:#5eead4;
  --shadow:0 18px 45px #0006;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,#32255c 0,transparent 35%),
    radial-gradient(circle at 100% 10%,#0c4951 0,transparent 32%),
    radial-gradient(circle at 50% 100%,#161d46 0,transparent 35%),
    var(--bg);
  font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer}

.wrap{
  width:min(720px,100%);
  margin:auto;
  padding:18px 14px 70px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.brand{
  font-weight:950;
  font-size:17px;
  letter-spacing:-.03em;
}

.brand span{color:var(--cyan)}
.back{color:var(--muted);font-size:14px;text-decoration:none}

h1{
  font-size:clamp(38px,9vw,60px);
  line-height:.95;
  margin:0 0 8px;
  letter-spacing:-.06em;
  background:linear-gradient(100deg,#fff,#ffb49e 42%,#70e1ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

h2{font-size:22px;margin:0 0 8px}
h3{font-size:15px;margin:0 0 8px}

.card{
  background:linear-gradient(145deg,rgba(23,35,59,.97),rgba(13,22,40,.97));
  border:1px solid var(--line);
  border-radius:22px;
  padding:17px;
  margin:12px 0;
  box-shadow:var(--shadow);
}

.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:12px;color:var(--muted)}

.row{
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap;
}

.row>*{flex:1;min-width:0}

label{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  margin:10px 0 5px;
  text-transform:uppercase;
  letter-spacing:.06em;
}

input,select{
  width:100%;
  border:1.5px solid var(--line);
  background:#0a1325;
  color:var(--text);
  border-radius:13px;
  padding:13px;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--a);
  box-shadow:0 0 0 3px #8b7cff20;
}

.btn{
  border:0;
  border-radius:13px;
  padding:13px 15px;
  background:linear-gradient(100deg,var(--a),var(--a2));
  color:white;
  font-weight:900;
  box-shadow:0 7px 18px #5f5cff30;
  transition:.15s;
}

.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}

.btn.secondary{
  background:#293854;
  border:1px solid var(--line);
}

.btn.ghost{
  background:transparent;
  border:1px solid var(--line);
  color:var(--text);
  box-shadow:none;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none;
}

.hidden{display:none!important}

.code{
  font-size:34px;
  letter-spacing:.2em;
  font-weight:950;
  color:var(--gold);
  text-align:center;
  margin:4px 0 9px;
}

.tag,.player{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 10px;
  border:1px solid var(--line);
  border-radius:99px;
  color:var(--muted);
  font-size:12px;
  margin:3px;
  background:#0b1528;
}

.player.me{
  border-color:var(--cyan);
  color:var(--cyan);
}

.player.duel{
  border-color:var(--gold);
  color:var(--gold);
}

.notice{
  color:var(--gold);
  font-size:13px;
  min-height:18px;
  margin:7px 0;
}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* ---------- DUELO ---------- */

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.match-meta{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.timer{
  font-weight:950;
  font-size:19px;
  color:var(--gold);
  min-width:50px;
  text-align:right;
}

.timer.low{
  color:var(--bad);
  animation:pulse .55s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.08)}
}

.bar{
  height:7px;
  background:#26344e;
  border-radius:8px;
  overflow:hidden;
  margin:9px 0 14px;
}

.bar>div{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#fb923c,#facc15,#38bdf8);
  transition:width .25s linear;
}

.vs{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:9px;
  align-items:stretch;
}

.vs>b{
  align-self:center;
  color:#71809d;
  font-weight:950;
  font-size:13px;
}

.duelist{
  border:1.5px solid var(--line);
  border-radius:17px;
  padding:11px;
  text-align:center;
  min-width:0;
  background:#0c1629;
  transition:.25s;
}

.duelist.me{
  border-color:var(--cyan);
  box-shadow:0 0 0 1px #5eead420;
}

.duelist.ok{
  border-color:var(--good);
  box-shadow:0 0 20px #48d59720;
}

.duelist .n{
  font-weight:900;
  overflow-wrap:anywhere;
}

.duelist .b{
  font-size:11px;
  color:var(--gold);
  margin-top:1px;
}

.dojo{
  margin-top:7px;
  text-align:left;
}

.dojo div{
  display:flex;
  align-items:center;
  gap:3px;
  min-height:20px;
}

.dot{
  display:inline-block;
  width:13px;
  height:13px;
  border-radius:50%;
  border:2px solid #fff8;
  box-shadow:0 1px 3px #0008;
}

/* ---------- CARTAS ---------- */

.hand{
  display:flex;
  gap:9px;
  justify-content:center;
  flex-wrap:wrap;
  margin:14px 0;
}

.cj{
  position:relative;
  width:78px;
  aspect-ratio:3/4;
  border-radius:15px;
  border:3px solid #fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:7px 4px 5px;
  color:white;
  user-select:none;
  overflow:hidden;
  box-shadow:0 8px 18px #0008;
  transition:transform .18s,box-shadow .18s;
}

.cj:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,#ffffff20,transparent 35%,#0004);
  pointer-events:none;
}

.cj .ci{
  position:relative;
  font-size:24px;
  line-height:1;
}

.cj .cn{
  position:relative;
  font-size:32px;
  line-height:1;
  font-weight:1000;
  text-shadow:0 3px 5px #0009;
}

.cj .cb{
  position:relative;
  width:78%;
  height:10px;
  border-radius:6px;
  border:1px solid #fff8;
  box-shadow:0 2px 4px #0005;
}

.cj .ct{
  position:absolute;
  bottom:17px;
  font-size:7px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.08em;
  opacity:.8;
}

.cj.big{
  width:116px;
}

.cj.big .ci{font-size:34px}
.cj.big .cn{font-size:50px}

.hand .cj{
  cursor:pointer;
}

.hand .cj:hover{
  transform:translateY(-6px) rotate(-1deg);
}

.hand .cj:nth-child(even):hover{
  transform:translateY(-6px) rotate(1deg);
}

.hand .cj.sel{
  transform:translateY(-13px);
  box-shadow:
    0 0 0 4px var(--gold),
    0 0 28px #ffd16670,
    0 12px 25px #0009;
}

.hand.off .cj{
  cursor:default;
  opacity:.55;
}

.hand.off .cj:hover{
  transform:none;
}

/* ---------- ARENA ---------- */

.arena{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  min-height:190px;
  margin:8px 0;
}

.arena .cj{
  animation:cardIn .5s cubic-bezier(.2,.9,.25,1.2) both;
}

@keyframes cardIn{
  from{
    transform:rotateY(90deg) scale(.65) translateY(15px);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}

.arena .win{
  box-shadow:
    0 0 0 5px var(--good),
    0 0 35px #48d59780,
    0 12px 28px #0009;
  animation:winningCard .7s .15s both;
}

@keyframes winningCard{
  0%{transform:scale(.85)}
  55%{transform:scale(1.13) rotate(-2deg)}
  100%{transform:scale(1)}
}

.arena .lose{
  opacity:.38;
  filter:grayscale(.6);
  transform:scale(.92);
}

.card-back{
  background:
    radial-gradient(circle,#ffffff14 1px,transparent 1px),
    linear-gradient(145deg,#272d62,#171b3b)!important;
  background-size:8px 8px,100% 100%!important;
  border-color:#737bd0!important;
}

/* ---------- RESULTADO ---------- */

.res{
  text-align:center;
  font-weight:900;
  font-size:16px;
  margin:5px 0;
}

.res.big{
  color:var(--gold);
  font-size:23px;
}

.result-box{
  text-align:center;
  padding:12px;
  border-radius:16px;
  background:#0b1528;
  border:1px solid var(--line);
}

.result-title{
  font-size:27px;
  font-weight:1000;
  margin-bottom:3px;
}

.win-glow{
  animation:glow .8s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 0 #48d59700}
  to{box-shadow:0 0 28px #48d59755}
}

/* ---------- COLA / RANKING ---------- */

.queue{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
}

.sc{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 11px;
  border-radius:12px;
  background:#0c172a;
  border:1px solid #23334e;
  margin:5px 0;
}

.sc.me{
  border-color:#5eead455;
}

.sc strong{
  color:var(--gold);
}

.rank-medal{
  width:25px;
  display:inline-block;
}

.progress{
  height:5px;
  background:#293853;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.progress>div{
  height:100%;
  background:linear-gradient(90deg,#ffd166,#f97316);
}

/* ---------- FIN ---------- */

.champion{
  padding:18px;
  border:1px solid #ffd16655;
  border-radius:20px;
  background:
    radial-gradient(circle at 50% 0%,#ffd1661c,transparent 55%),
    #0c1729;
}

.trophy{
  font-size:82px;
  filter:drop-shadow(0 8px 20px #ffd16655);
  animation:trophyIn .7s cubic-bezier(.2,1.5,.3,1) both;
}

@keyframes trophyIn{
  from{transform:scale(.2) rotate(-20deg);opacity:0}
  to{transform:scale(1) rotate(0);opacity:1}
}

.foot{
  font-size:11px;
  color:var(--muted);
  text-align:center;
  margin:18px 0;
}

@media(max-width:480px){
  .wrap{padding-left:10px;padding-right:10px}
  .card{padding:14px;border-radius:18px}
  .cj{width:63px}
  .cj .cn{font-size:27px}
  .cj .ci{font-size:21px}
  .cj.big{width:91px}
  .cj.big .cn{font-size:40px}
  .arena{gap:12px}
}

@media(max-width:360px){
  .cj{width:58px}
  .hand{gap:5px}
}
</style>
</head>

<body>
<div class="wrap">

<header class="top">
  <a class="brand" href="/">Card-<span>Jitsu</span></a>
  <a class="back" href="/">← Juegos</a>
</header>

<main id="app"></main>

<p class="foot">
  Card-Jitsu · Salas en directo · 2–12 jugadores · juego de fans, no oficial
</p>

</div>

<script>
(()=>{'use strict';

const $=id=>document.getElementById(id);
const app=$('app');

const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[c]));

const STORE='cmc_cj_session_v2';
const CID='cmc_cj_cid_v2';
const KEY='cmc_cj_key_v2';

const MAXP=12;
const MINP=2;

const rand=n=>Math.floor(Math.random()*n);

const shuffle=a=>{
  for(let i=a.length-1;i>0;i--){
    const j=rand(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
};

/* ---------- CARTAS ---------- */

const EL={
  f:{
    n:'Fuego',
    i:'🔥',
    bg:'linear-gradient(160deg,#7f1d1d,#ea580c)'
  },
  w:{
    n:'Agua',
    i:'💧',
    bg:'linear-gradient(160deg,#1e3a8a,#2563eb)'
  },
  s:{
    n:'Nieve',
    i:'❄️',
    bg:'linear-gradient(160deg,#0e7490,#22d3ee)'
  }
};

const COL=[
  '#ef4444',
  '#3b82f6',
  '#22c55e',
  '#eab308',
  '#f97316',
  '#a855f7'
];

const BELTS=[
  {
    name:'Cinturón blanco',
    icon:'⚪',
    need:0
  },
  {
    name:'Cinturón amarillo',
    icon:'🟡',
    need:3
  },
  {
    name:'Cinturón naranja',
    icon:'🟠',
    need:7
  },
  {
    name:'Cinturón verde',
    icon:'🟢',
    need:12
  },
  {
    name:'Cinturón azul',
    icon:'🔵',
    need:18
  },
  {
    name:'Cinturón rojo',
    icon:'🔴',
    need:25
  },
  {
    name:'Cinturón morado',
    icon:'🟣',
    need:35
  },
  {
    name:'Cinturón marrón',
    icon:'🟤',
    need:45
  },
  {
    name:'Cinturón negro',
    icon:'⚫',
    need:60
  }
];

const beltInfo=w=>{
  let result=BELTS[0];

  for(const b of BELTS){
    if((w||0)>=b.need) result=b;
  }

  return result;
};

const belt=w=>{
  const b=beltInfo(w);
  return b.icon+' '+b.name;
};

const nextBelt=w=>{
  const wins=w||0;

  for(const b of BELTS){
    if(b.need>wins){
      return {
        current:b,
        left:b.need-wins,
        need:b.need
      };
    }
  }

  return null;
};

const rc=()=>({
  e:'fws'[rand(3)],
  n:2+rand(11),
  c:rand(6),
  id:Math.random().toString(36).slice(2,8)
});

const validCard=c=>
  c &&
  'fws'.includes(c.e) &&
  Number.isInteger(c.n) &&
  c.n>=2 &&
  c.n<=12 &&
  Number.isInteger(c.c) &&
  c.c>=0 &&
  c.c<6;

const beats=(a,b)=>
  (a==='f'&&b==='s')||
  (a==='s'&&b==='w')||
  (a==='w'&&b==='f');

function cmp(a,b){
  if(a.e===b.e){
    if(a.n>b.n)return'A';
    if(a.n<b.n)return'B';
    return null;
  }

  return beats(a.e,b.e)?'A':'B';
}

/* Gana si consigue:
   - 3 cartas del mismo elemento con colores distintos
   - 1 carta de cada elemento con colores distintos
*/
function won(d){

  for(const e of 'fws'){
    if(new Set(d[e]).size>=3)return true;
  }

  for(const c1 of new Set(d.f)){
    for(const c2 of new Set(d.w)){
      for(const c3 of new Set(d.s)){
        if(c1!==c2&&c2!==c3&&c1!==c3)return true;
      }
    }
  }

  return false;
}

/* ---------- HTML DE CARTAS ---------- */

const cardHtml=(c,cls='',attrs='')=>`
<div
  class="cj ${cls}"
  style="background:${EL[c.e].bg};border-color:${COL[c.c]}"
  ${attrs}
>
  <span class="ci">${EL[c.e].i}</span>
  <span class="cn">${c.n}</span>
  <span class="ct">${EL[c.e].n}</span>
  <span class="cb" style="background:${COL[c.c]}"></span>
</div>`;

const backCardHtml=(cls='')=>`
<div class="cj big card-back ${cls}">
  <span class="ci">🥋</span>
  <span class="cn">?</span>
  <span class="cb" style="background:#737bd0"></span>
</div>`;

const dojoHtml=d=>`
<div class="dojo">
  ${'fws'.split('').map(e=>`
    <div>
      ${EL[e].i}
      ${d[e].map(c=>`
        <i
          class="dot"
          style="background:${COL[c]}"
          title="${EL[e].n}"
        ></i>
      `).join('')}
    </div>
  `).join('')}
</div>`;

/* ---------- ESTADO ---------- */

const load=()=>{
  try{
    return JSON.parse(sessionStorage.getItem(STORE)||'null');
  }catch{
    return null;
  }
};

let saved=load();

let name=saved?.name||'';
let roomCode=saved?.room||'';
let isHost=!!saved?.host;
let state=saved?.state||null;

let own=saved?.own||{
  mid:-1,
  hand:[],
  pick:null,
  sel:null
};

let myKey=
  sessionStorage.getItem(KEY)||
  Math.random().toString(36).slice(2,11);

let cid=
  sessionStorage.getItem(CID)||
  Math.random().toString(36).slice(2)+Date.now().toString(36);

let socket=null;
let peers=[];
let closed=false;
let retry=0;
let connecting=false;
let curSig='';

let myPres={};
let offset=0;
let hostPicks={};
let absent={A:0,B:0};

sessionStorage.setItem(KEY,myKey);
sessionStorage.setItem(CID,cid);

const persist=()=>{
  sessionStorage.setItem(
    STORE,
    JSON.stringify({
      name,
      room:roomCode,
      host:isHost,
      state,
      own
    })
  );
};

const P=x=>x.p||{};

const playerList=()=>peers
  .map(x=>P(x))
  .filter(p=>p.c_key)
  .map(p=>({
    key:p.c_key,
    name:p.c_name||'Jugador',
    p
  }));

const pname=k=>
  state?.names?.[k]||
  playerList().find(p=>p.key===k)?.name||
  'Jugador';

function publish(extra={}){
  Object.assign(myPres,extra);

  if(!socket||socket.readyState!==1)return;

  socket.send(JSON.stringify({
    t:'pres',
    p:{
      c_name:name,
      c_key:myKey,
      c_host:isHost?1:0,
      ...myPres
    }
  }));
}

function commit(){
  if(!isHost)return;

  state.v=(state.v||0)+1;
  state.hostNow=Date.now();

  publish({c_state:state});
  persist();
  render();
}

/* ---------- CONEXIÓN ---------- */

function connect(){

  if(connecting||!roomCode)return;

  connecting=true;
  closed=false;

  socket=new WebSocket(
    (location.protocol==='https:'?'wss:':'ws:')+
    '//'+location.host
  );

  socket.onopen=()=>{
    socket.send(JSON.stringify({
      t:'join',
      room:'cmb-cardjitsu-'+roomCode.toLowerCase(),
      cid
    }));
  };

  socket.onmessage=e=>{

    let m;

    try{
      m=JSON.parse(e.data);
    }catch{
      return;
    }

    if(m.t==='hello')return;

    if(m.t==='err'){

      closed=true;
      connecting=false;

      try{socket.close()}catch{}

      const msg=
        m.code==='room_full'
        ?'La sala está llena.'
        :'No se ha podido entrar en esa sala.';

      roomCode='';
      state=null;

      renderHome(msg);
      return;
    }

    if(m.t==='peers'){

      peers=m.peers||[];
      connecting=false;

      if(!peers.some(x=>P(x).c_key===myKey)){
        publish(isHost&&state?{c_state:state}:{});
      }

      if(!isHost){

        const hp=peers.find(
          x=>P(x).c_host===1&&P(x).c_state
        );

        const inc=hp&&P(hp).c_state;

        if(
          inc &&
          (!state||inc.v!==state.v)
        ){
          state=inc;
          offset=(inc.hostNow||Date.now())-Date.now();
          persist();
        }
      }

      hostStep();
      render();
    }
  };

  socket.onclose=()=>{

    connecting=false;

    if(closed)return;

    retry++;

    setTimeout(()=>{
      if(!closed)connect();
    },Math.min(1000*retry,8000));
  };

  socket.onerror=()=>{};
}

const code5=()=>{
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';

  for(let i=0;i<5;i++){
    s+=c[rand(c.length)];
  }

  return s;
};

/* ---------- LÓGICA DEL ANFITRIÓN ---------- */

const oth=s=>s==='A'?'B':'A';

const conn=()=>new Set(
  playerList().map(p=>p.key)
);

function startGame(){

  const ps=playerList()
    .sort(
      (a,b)=>
        (b.p.c_host?1:0)-
        (a.p.c_host?1:0)
    )
    .slice(0,MAXP);

  if(ps.length<MINP)return;

  const order=shuffle(ps.map(p=>p.key));

  const names={};
  const wins={};
  const stats={};

  ps.forEach(p=>{
    names[p.key]=p.name;
    wins[p.key]=0;

    stats[p.key]={
      rounds:0,
      wins:0,
      streak:0,
      bestStreak:0
    };
  });

  Object.assign(state,{
    names,
    wins,
    stats,
    q:order.slice(2),
    mid:0,
    champ:null
  });

  startMatch(order[0],order[1]);
}

function startMatch(a,b){

  state.A=a;
  state.B=b;

  state.mid++;
  state.rd=1;

  state.dojo={
    A:{f:[],w:[],s:[]},
    B:{f:[],w:[],s:[]}
  };

  state.picked={
    A:false,
    B:false
  };

  state.rev=null;
  state.over=false;
  state.mw=null;
  state.note='';

  state.phase='match';

  state.endsAt=Date.now()+state.secs*1000;

  hostPicks={};
  absent={A:0,B:0};

  commit();
}

function resolveRound(){

  const a=hostPicks.A;
  const b=hostPicks.B;

  let w=null;

  if(a&&b)w=cmp(a,b);
  else if(a)w='A';
  else if(b)w='B';

  if(w){

    const c=w==='A'?a:b;

    state.dojo[w][c.e].push(c.c);

    state.stats[state[w]].rounds++;
    state.stats[state[w]].wins++;

    if(state.wins[state[w]]!==undefined){
      /* marcador de duelo, no victoria global */
    }
  }

  state.rev={
    a:a||null,
    b:b||null,
    w
  };

  state.over=!!(w&&won(state.dojo[w]));

  if(state.over){
    state.mw=w;
  }

  state.phase='reveal';

  state.until=Date.now()+
    (state.over?5000:3500);

  commit();
}

function forfeit(side){

  state.mw=oth(side);
  state.over=true;
  state.rev=null;

  state.note=
    pname(state[side])+
    ' se ha desconectado';

  state.phase='reveal';
  state.until=Date.now()+3000;

  commit();
}

function endMatch(){

  const w=state[state.mw];
  const l=state[oth(state.mw)];

  state.wins[w]=(state.wins[w]||0)+1;

  const st=state.stats[w];

  st.streak=(st.streak||0)+1;
  st.bestStreak=Math.max(
    st.bestStreak||0,
    st.streak
  );

  if(state.stats[l]){
    state.stats[l].streak=0;
  }

  if(state.wins[w]>=state.target){

    state.champ=w;
    state.phase='finished';

    return commit();
  }

  state.q.push(l);

  nextChallenger(w);
}

function nextChallenger(w){

  const c=conn();

  const i=state.q.findIndex(
    k=>c.has(k)
  );

  if(i<0){

    state.A=w;
    state.B=null;
    state.phase='waiting';

    return commit();
  }

  const [ch]=state.q.splice(i,1);

  startMatch(w,ch);
}

function hostStep(){

  if(
    !isHost||
    !state||
    state.phase==='lobby'||
    state.phase==='finished'
  )return;

  const pls=playerList();
  const pl={};

  pls.forEach(p=>{
    pl[p.key]=p.p;
  });

  let ch=false;

  for(const p of pls){

    if(!state.names[p.key]){

      state.names[p.key]=p.name;
      state.wins[p.key]=0;

      state.stats[p.key]={
        rounds:0,
        wins:0,
        streak:0,
        bestStreak:0
      };

      state.q.push(p.key);

      ch=true;

    }else if(
      state.names[p.key]!==p.name
    ){

      state.names[p.key]=p.name;
      ch=true;
    }
  }

  if(state.phase==='waiting'){

    const c=conn();

    const i=state.q.findIndex(
      k=>c.has(k)
    );

    if(i>=0&&pl[state.A]){

      const [x]=state.q.splice(i,1);

      return startMatch(state.A,x);
    }

    if(ch)commit();

    return;
  }

  if(state.phase==='match'){

    for(const s of ['A','B']){

      const k=state[s];

      if(hostPicks[s])continue;

      const c=pl[k]&&pl[k].c_pick;

      if(
        c &&
        c.m===state.mid &&
        c.rd===state.rd &&
        validCard(c.card)
      ){

        hostPicks[s]=c.card;
        state.picked[s]=true;
        ch=true;
      }
    }

    if(
      (hostPicks.A&&hostPicks.B)||
      Date.now()>state.endsAt+3000
    ){
      return resolveRound();
    }

    for(const s of ['A','B']){

      if(!pl[state[s]]){

        absent[s]=absent[s]||Date.now();

        if(Date.now()-absent[s]>10000){
          return forfeit(s);
        }

      }else{
        absent[s]=0;
      }
    }

    if(ch)commit();

    return;
  }

  if(
    state.phase==='reveal' &&
    Date.now()>=state.until
  ){

    if(state.over){
      return endMatch();
    }

    state.rd++;
    hostPicks={};

    state.picked={
      A:false,
      B:false
    };

    state.phase='match';

    state.endsAt=
      Date.now()+state.secs*1000;

    return commit();
  }

  if(ch)commit();
}

/* ---------- JUGADOR ---------- */

const mySide=()=>{

  if(!state||!state.A)return null;

  if(state.A===myKey)return'A';

  if(state.B===myKey)return'B';

  return null;
};

const hasPicked=()=>
  own.pick &&
  state &&
  own.pick.mid===state.mid &&
  own.pick.rd===state.rd;

function syncHand(){

  const s=mySide();

  if(!s||!state.mid)return;

  if(own.mid!==state.mid){

    own.mid=state.mid;
    own.hand=Array.from(
      {length:5},
      rc
    );

    own.sel=null;
    own.pick=null;

    persist();
  }
}

function sendPick(card){

  if(
    !state||
    state.phase!=='match'||
    hasPicked()||
    !mySide()
  )return;

  const msg={
    m:state.mid,
    rd:state.rd,
    card:{
      e:card.e,
      n:card.n,
      c:card.c
    }
  };

  own.pick={
    mid:state.mid,
    rd:state.rd,
    msg
  };

  /* Se repone la carta inmediatamente,
     como en el sistema original. */
  own.hand=own.hand.filter(
    x=>x.id!==card.id
  );

  own.hand.push(rc());
  own.sel=null;

  persist();

  publish({
    c_pick:msg
  });

  updateGame();
}

const leftS=()=>Math.max(
  0,
  Math.ceil(
    (state.endsAt-(Date.now()+offset))/1000
  )
);

function tick(){

  if(!state||state.phase!=='match')return;

  const l=leftS();

  const t=$('tl');
  const f=$('tf');

  if(t){

    t.textContent=l+' s';

    t.classList.toggle(
      'low',
      l<=5
    );
  }

  if(f){

    f.style.width=
      Math.min(
        100,
        l/state.secs*100
      )+'%';
  }

  if(
    l<=0 &&
    mySide() &&
    !hasPicked() &&
    own.hand.length
  ){

    sendPick(
      own.hand[
        rand(own.hand.length)
      ]
    );
  }
}

        <div
          class="result-box"
          style="grid-column:1/-1"
        >
          <div class="result-title">
            ⏳ Esperando rival
          </div>

          <div class="small muted">
            El siguiente jugador de la cola
            entrará automáticamente.
          </div>
        </div>
      `
    );
  }

  setHTML(
    $('arena'),
    arenaHtml()
  );

  setHTML(
    $('hand'),
    handHtml()
  );

  setHTML(
    $('queue'),
    queueHtml()
  );

  setHTML(
    $('rank'),
    rankHtml()
  );

  const bar=$('barw');

  if(bar){

    bar.classList.toggle(
      'hidden',
      state.phase!=='match'
    );
  }

  tick();
}

/* ---------- VISTA JUEGO ---------- */

function renderGame(){

  mount(
    'g',
    `

<section class="card">

  <div id="hdr"></div>

  <div
    class="bar"
    id="barw"
  >
    <div id="tf"></div>
  </div>

  <div
    class="vs"
    id="vs"
  ></div>

  <div id="arena"></div>

  <div id="hand"></div>

</section>

<section class="card">

  <h3>👑 Rey de la pista</h3>

  <div
    class="small muted"
    style="margin-bottom:8px"
  >
    El ganador se queda.
    Los demás esperan su turno.
  </div>

  <div id="queue" class="queue"></div>

</section>

<section class="card">

  <h3>🏆 Clasificación</h3>

  <div id="rank"></div>

</section>
`,
    ()=>{

      $('hand').onclick=e=>{

        const c=e.target.closest('[data-c]');

        if(
          c&&
          state.phase==='match'&&
          !hasPicked()
        ){

          own.sel=c.dataset.c;

          updateGame();

          return;
        }

        if(e.target.closest('#play')){

          const card=
            own.hand.find(
              x=>x.id===own.sel
            );

          if(card)sendPick(card);
        }
      };
    }
  );

  updateGame();
}

/* ---------- FINAL ---------- */

function renderFinished(){

  const ws=Object.keys(state.names)
    .sort(
      (a,b)=>
        (state.wins[b]||0)-
        (state.wins[a]||0)
    );

  const champ=state.champ;
  const st=state.stats[champ]||{};

  mount(
    'fin',
    `

<section class="card center">

  <div class="champion">

    <div class="tag">
      🏆 PARTIDA TERMINADA
    </div>

    <div class="trophy">
      🏆
    </div>

    <h1>
      ${safe(pname(champ))}
    </h1>

    <div class="result-title">
      ¡CAMPEÓN!
    </div>

    <p class="muted">
      ${belt(state.wins[champ])}
    </p>

    <div class="row">

      <div class="tag">
        🏆 ${state.wins[champ]} victorias
      </div>

      <div class="tag">
        🔥 Racha ${st.bestStreak||0}
      </div>

    </div>

  </div>

</section>

<section class="card">

  <h3>📊 Clasificación final</h3>

  ${ws.map((k,i)=>`

    <div class="sc">

      <span>

        <span class="rank-medal">
          ${['🥇','🥈','🥉'][i]||(
            (i+1)+'.'
          )}
        </span>

        ${safe(pname(k))}

        <span class="small muted">
          ${belt(state.wins[k])}
        </span>

      </span>

      <strong>
        ${state.wins[k]||0} 🏆
      </strong>

    </div>

  `).join('')}

</section>

${
  isHost
  ?`
    <button
      class="btn"
      id="again"
      style="width:100%"
    >
      🔄 Volver a jugar
    </button>
  `
  :''
}

<button
  class="btn ghost"
  id="leave"
  style="width:100%;margin-top:9px"
>
  Salir
</button>
`,
    ()=>{

      if($('again')){

        $('again').onclick=()=>{

          state.phase='lobby';
          state.champ=null;

          commit();
        };
      }

      $('leave').onclick=leaveRoom;
    }
  );
}

/* ---------- RENDER GENERAL ---------- */

function render(){

  if(!roomCode){

    return renderHome();
  }

  if(
    !socket||
    socket.readyState!==1
  ){

    mount(
      'conn',
      `

<section class="card center">

  <div style="font-size:48px">
    🔌
  </div>

  <h2>
    Entrando en la sala…
  </h2>

  <p class="muted">
    Sala ${safe(roomCode)}
  </p>

  <button
    class="btn ghost"
    id="c"
  >
    Cancelar
  </button>

</section>
`,
      ()=>$('c').onclick=leaveRoom
    );

    return;
  }

  if(!state){

    return mount(
      'wait',
      `

<section class="card center">

  <div style="font-size:48px">
    🥋
  </div>

  <h2>
    Esperando al anfitrión…
  </h2>

  <p class="muted">
    Sala ${safe(roomCode)}
  </p>

  <button
    class="btn ghost"
    id="l"
  >
    Salir
  </button>

</section>
`,
      ()=>$('l').onclick=leaveRoom
    );
  }

  if(state.phase==='lobby'){
    renderLobby();
  }else if(state.phase==='finished'){
    renderFinished();
  }else{
    renderGame();
  }
}

/* ---------- CICLOS ---------- */

setInterval(()=>{
  if(roomCode&&state){
    hostStep();
  }
},500);

setInterval(tick,250);

/* ---------- ARRANQUE ---------- */

if(saved?.room&&saved?.name){

  connect();
  render();

}else{

  renderHome();
}

})();
</script>

</body>
</html>
