<style>
:root{color-scheme:dark;--bg:#0b1020;--line:#34425f;--text:#f4f6ff;--muted:#aab6d0;--a:#8b7cff;--b:#43d9c5;--gold:#ffd166;--good:#48d597}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 8% 0%,#29244d 0,transparent 42%),radial-gradient(ellipse at 100% 15%,#103e4b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}

.muted,.small{color:var(--muted)}.small{font-size:12px}.card{background:linear-gradient(145deg,rgba(29,41,67,.97),rgba(17,26,45,.97));border:1px solid var(--line);border-radius:19px;padding:17px;margin:12px 0;box-shadow:0 12px 35px #0003}.center{text-align:center}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}label{display:block;color:var(--muted);font-size:13px;margin:9px 0 4px}
input,select{width:100%;border:1px solid var(--line);background:#0d1629;color:var(--text);border-radius:11px;padding:12px;font:inherit;outline:none}input:focus,select:focus{border-color:var(--a)}

.code{font-size:30px;letter-spacing:.22em;font-weight:950;color:var(--gold);text-align:center}.tag,.player{display:inline-flex;align-items:center;padding:5px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px;margin:3px}.player.me{border-color:var(--b);color:var(--b)}.player.act{border-color:var(--gold);color:var(--gold)}

.secret{font-size:clamp(24px,6vw,40px);font-weight:900;text-align:center;margin:8px 0;color:var(--gold);overflow-wrap:anywhere}
.board{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:84px;padding:10px;border:1px dashed #536381;border-radius:13px;background:#0b1426}
.piece{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:66px;min-height:72px;padding:6px 8px;border:2px solid var(--line);border-radius:11px;background:#18243b;user-select:none}.piece.edit{cursor:pointer}.piece b{font-weight:400;line-height:1.1}.piece small{font-size:10px;color:#fff;margin-top:2px}.piece button{position:absolute;right:-7px;top:-8px;border:0;border-radius:50%;width:21px;height:21px;background:#ff6c7f;color:#fff;font-size:13px;padding:0}
.palette{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.swatch{width:30px;height:30px;border:3px solid transparent;border-radius:50%;padding:0}.swatch.on{border-color:#fff;outline:2px solid #fff5}
.cats{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin-top:8px}.cats button{flex:0 0 auto;border:1px solid var(--line);background:#101a2e;color:var(--text);border-radius:99px;padding:6px 11px;font-size:13px}.cats button.on{background:var(--a);border-color:var(--a)}

.sc{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:#101a2e;margin:5px 0}.sc strong{color:var(--gold)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foot{font-size:11px;color:var(--muted);text-align:center;margin:18px 0}
@media(max-width:600px){.settings{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));max-height:280px}}
</style></head>

      const COLORS=['#35a66b','#327fd1','#e58a31','#915bd1','#d84d55','#e8e8e8'],SIZES=[20,32,54];
const norm=s=>String(s||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const normC=s=>norm(s).replace(/^(el|la|los|las|un|una|unos|unas) /,'');
const hash=s=>{let h=5381;for(const c of normC(s))h=((h<<5)+h+c.charCodeAt(0))|0;return(h>>>0).toString(36)};
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
// Acierto flexible: frase casi exacta, o aparecen las palabras significativas del concepto (con erratas leves)
const STOP=new Set(['de','del','la','el','los','las','un','una','en','a','al','con','por','para','y','o','que','se','su','sus','lo']);
const toks=s=>norm(s).split(' ').filter(w=>w&&!STOP.has(w));
function matches(g,ans){const a=normC(g),b=normC(ans);if(!a)return false;
 if(a===b||(b.length>6&&lev(a,b)<=Math.floor(b.length/6)))return true;
 const gt=toks(g),at=toks(ans);if(!gt.length||!at.length)return false;
 const hit=at.filter(w=>gt.some(x=>x===w||(w.length>4&&lev(x,w)<=1))).length;
 return hit>=Math.max(1,Math.ceil(at.length*.75))}
const rand=n=>Math.floor(Math.random()*n);
const load=()=>{try{return JSON.parse(sessionStorage.getItem(STORE)||'null')}catch{return null}};
let saved=load(),name=saved?.name||'',roomCode=saved?.room||'',isHost=!!saved?.host,state=saved?.state||null,
 myKey=sessionStorage.getItem(KEY)||Math.random().toString(36).slice(2,11),cid=sessionStorage.getItem(CID)||Math.random().toString(36).slice(2)+Date.now().toString(36),
 own=saved?.own||{turn:0,ans:'',board:[],gn:0,g:null,win:null,pn:0,prop:null,ansTurn:0},
 socket=null,peers=[],closed=false,retry=0,connecting=false,curSig='',color=0,cat=0,missing=0,log=[],seenG=new Set(),seenP=new Set(),logTurn=-1,myPres={};
sessionStorage.setItem(KEY,myKey);sessionStorage.setItem(CID,cid);
const persist=()=>sessionStorage.setItem(STORE,JSON.stringify({name,room:roomCode,host:isHost,state,own}));
const P=x=>x.p||{};
const playerList=()=>peers.map(x=>P(x)).filter(p=>p.c_key).map(p=>({key:p.c_key,name:p.c_name||'Jugador',p}));
const pname=k=>state?.names?.[k]||playerList().find(p=>p.key===k)?.name||'Jugador';
// La presencia se acumula en local: cada envío incluye todo lo anterior, así un publish nuevo no borra tablero, estado ni respuestas
function publish(extra={}){Object.assign(myPres,extra);if(!socket||socket.readyState!==1)return;socket.send(JSON.stringify({t:'pres',p:{c_name:name,c_key:myKey,c_host:isHost?1:0,...myPres}}))}
function commit(){if(!isHost)return;state.v=(state.v||0)+1;publish({c_state:state});persist();render()}
function connect(){if(connecting||!roomCode)return;connecting=true;closed=false;
 socket=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);
 socket.onopen=()=>socket.send(JSON.stringify({t:'join',room:'cmb-concept-'+roomCode.toLowerCase(),cid}));
 socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.t==='hello')return;
  if(m.t==='err'){closed=true;connecting=false;try{socket.close()}catch{}const msg=m.code==='room_full'?'La sala está llena (máx. 30).':'No se ha podido entrar en esa sala.';roomCode='';state=null;renderHome(msg);return}
  if(m.t==='peers'){peers=m.peers||[];connecting=false;
   if(!peers.some(x=>P(x).c_key===myKey))publish(isHost&&state?{c_state:state}:{});
   if(!isHost){const hp=peers.find(x=>P(x).c_host===1&&P(x).c_state),inc=hp&&P(hp).c_state;if(inc&&(!state||inc.v!==state.v)){state=inc;persist()}}
   collectGuesses();hostStep();performerStep();render()}};
 socket.onclose=()=>{connecting=false;if(closed)return;retry++;setTimeout(()=>{if(!closed)connect()},Math.min(1000*retry,8000))};socket.onerror=()=>{}}
const code5=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=c[rand(c.length)];return s};

function joinRoom(){name=($('name')?.value.trim()||'Jugador').slice(0,16);const c=($('code')?.value||'').trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(c))return renderHome('Escribe un código de sala de cinco caracteres.');roomCode=c;isHost=false;myPres={};state=null;own={turn:0,ans:'',board:[],gn:0,g:null,win:null,pn:0,prop:null,ansTurn:0};persist();connect();render()}

// ---------- Lógica del anfitrión (turnos, puntos, propuestas) ----------
const activePeer=()=>peers.find(x=>P(x).c_key===state?.activeKey);
function startGame(){const ps=playerList();if(ps.length<2)return;const order=ps.map(p=>p.key).sort(()=>Math.random()-.5),names={},scores={};ps.forEach(p=>{names[p.key]=p.name;scores[p.key]=0});
 Object.assign(state,{order,names,scores,turn:0,total:order.length*state.rpp,used:[],winKey:'',note:''});nextTurn()}
function nextTurn(){if(state.turn>=state.total){state.phase='finished';return commit()}
 state.turn++;state.activeKey=state.order[(state.turn-1)%state.order.length];state.phase='play';state.winKey='';state.note='';missing=0;commit()}
function endTurn(winKey,note){if(state.phase!=='play')return;state.phase='result';state.winKey=winKey||'';state.note=note||'';if(winKey){state.scores[winKey]=(state.scores[winKey]||0)+1;state.scores[state.activeKey]=(state.scores[state.activeKey]||0)+1}commit()}
function hostStep(){if(!isHost||!state)return;
 const pool=CONCEPTS.map(norm).concat((state.customWords||[]).map(w=>norm(w.w)));
 for(const pl of playerList()){const pr=pl.p.c_prop;if(!pr||seenP.has(pl.key+':'+pr.n))continue;seenP.add(pl.key+':'+pr.n);
  const w=String(pr.w||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,50);
  if(w.length>=3&&!pool.includes(norm(w))&&(state.customWords||[]).length<100){state.customWords.push({w,by:pl.name});commit()}}
 if(state.phase!=='play')return;const ap=activePeer(),a=ap&&P(ap);
 if(a?.c_h&&a.c_h.t===state.turn&&!(state.used||[]).includes(a.c_h.h)){state.used.push(a.c_h.h);state.used=state.used.slice(-200);commit()}
 if(a?.c_win&&a.c_win.t===state.turn&&state.order.includes(a.c_win.key))return endTurn(a.c_win.key,'');
 if(a?.c_end&&a.c_end===state.turn)return endTurn('','Se ha revelado la respuesta.');
 if(!ap){missing=missing||Date.now();if(Date.now()-missing>6000)endTurn('','El jugador del turno se ha desconectado.')}else missing=0}

// ---------- Lógica del jugador que representa ----------
function pickWord(){const pool=CONCEPTS.concat((state.customWords||[]).map(w=>w.w)),used=state.used||[];const av=pool.filter(w=>!used.includes(hash(w)));const l=av.length?av:pool;return l[rand(l.length)]}
function performerStep(){if(!state||!state.order||!state.order.includes(myKey)||state.activeKey!==myKey)return;
 if(state.phase==='play'&&own.turn!==state.turn){own={...own,turn:state.turn,ans:pickWord(),board:[],win:null,ansTurn:0};persist();publish({c_h:{t:state.turn,h:hash(own.ans)},c_hint:{t:state.turn,n:own.ans.trim().split(/\s+/).length},c_b:[],c_bt:state.turn,c_win:null,c_end:null,c_ans:null})}
 if(state.phase==='play'&&own.ans&&!own.win)for(const pl of playerList()){const g=pl.p.c_g;if(pl.key===myKey||!g||g.t!==state.turn||!state.order.includes(pl.key))continue;
  const id=pl.key+':'+g.t+':'+g.n;if(seenG.has('w'+id))continue;seenG.add('w'+id);if(matches(g.g,own.ans)){own.win={t:state.turn,key:pl.key};persist();publish({c_win:own.win,c_ans:{t:state.turn,a:own.ans}});own.ansTurn=state.turn;break}}
 if(state.phase==='result'&&own.turn===state.turn&&own.ansTurn!==state.turn){own.ansTurn=state.turn;persist();publish({c_ans:{t:state.turn,a:own.ans}})}}
function collectGuesses(){if(!state)return;if(logTurn!==state.turn){logTurn=state.turn;log=[];seenG=new Set([...seenG].filter(x=>x[0]==='w'))}
 for(const pl of playerList()){const g=pl.p.c_g;if(!g||g.t!==state.turn)continue;const id='l'+pl.key+':'+g.n;if(seenG.has(id))continue;seenG.add(id);log.unshift({n:pl.name,g:g.g,k:pl.key});log=log.slice(0,30)}}
const pushBoard=()=>{own.board=board();persist();publish({c_b:own.board,c_bt:state.turn})};
function board(){return own.board}
function curBoard(){if(state?.activeKey===myKey)return own.board;const a=activePeer(),p=a&&P(a);return p&&p.c_bt===state.turn&&Array.isArray(p.c_b)?p.c_b:[]}
function curAnswer(){if(state?.activeKey===myKey)return own.ans;const a=activePeer(),p=a&&P(a);return p?.c_ans&&p.c_ans.t===state.turn?p.c_ans.a:''}

 +'<div class="status hidden" id="res"></div></section><section class="card"><h3>Marcador</h3><div id="scores"></div>'+(isHost&&play?'<button class="btn secondary" id="reveal" style="width:100%;margin-top:8px">Saltar turno y revelar</button>':'')+(isHost&&state.phase==='result'?'<button class="btn" id="next" style="width:100%;margin-top:8px">'+(state.turn>=state.total?'Ver resultado final 🏆':'Siguiente turno')+'</button>':'')+(!isHost&&state.phase==='result'?'<p class="small muted">Esperando al anfitrión…</p>':'')+'</section>',
 ()=>{if($('colors')){$('colors').innerHTML=COLORS.map((c,i)=>'<button class="swatch '+(i===color?'on':'')+'" style="background:'+c+'" data-c="'+i+'"></button>').join('');$('colors').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;color=Number(b.dataset.c);$('colors').querySelectorAll('.swatch').forEach(x=>x.classList.toggle('on',x===b))};
   $('cats').innerHTML=CATS.map((c,i)=>'<button class="'+(i===cat?'on':'')+'" data-k="'+i+'">'+safe(c[0])+'</button>').join('');$('cats').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;cat=Number(b.dataset.k);$('cats').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderGrid()};
   $('search').oninput=renderGrid;$('grid').onclick=e=>{const b=e.target.closest('[data-p]');if(b)addPicto(Number(b.dataset.p))};renderGrid();
   $('clear').onclick=()=>{own.board=[];pushBoard();updateGame()};$('giveup').onclick=giveUp;
   $('board').onclick=e=>{const r=e.target.closest('[data-rm]');if(r){own.board.splice(Number(r.dataset.rm),1);pushBoard();return updateGame()}const p=e.target.closest('[data-i]');if(p){const b=own.board[Number(p.dataset.i)];b[2]=(b[2]+1)%3;pushBoard();updateGame()}}}
  if(act&&play&&$('log'))$('log').onclick=e=>{const b=e.target.closest('[data-ok]');if(!b||own.win)return;const x=log[Number(b.dataset.ok)];if(!x)return;own.win={t:state.turn,key:x.k};own.ansTurn=state.turn;persist();publish({c_win:own.win,c_ans:{t:state.turn,a:own.ans}})};
  if($('gb')){$('gb').onclick=sendGuess;$('guess').addEventListener('keydown',e=>{if(e.key==='Enter')sendGuess()})}
  $('reveal')&&($('reveal').onclick=()=>endTurn('','El anfitrión ha saltado el turno.'));$('next')&&($('next').onclick=nextTurn)});
 updateGame()}
function updateGame(){if(!state||state.phase==='lobby'||state.phase==='finished')return;const act=state.activeKey===myKey;
 $('tags').innerHTML='<span class="tag">TURNO '+state.turn+' / '+state.total+'</span><span class="tag">✏️ '+safe(pname(state.activeKey))+'</span>';
 $('head').textContent=act?'¡Representa el concepto!':'¿Qué ha representado '+pname(state.activeKey)+'?';
 if($('secret'))$('secret').textContent=own.ans||'…';
 const hEl=$('hint');if(hEl){const ap=activePeer(),pp=ap&&P(ap),h=pp&&pp.c_hint;hEl.textContent=h&&h.t===state.turn?'💡 Pista: '+h.n+(h.n===1?' palabra':' palabras'):''}
 const edit=act&&state.phase==='play';$('board').innerHTML=renderBoardHtml(curBoard(),edit);
 if($('log'))$('log').innerHTML=log.map((x,i)=>'<div><b>'+safe(x.n)+':</b> '+safe(x.g)+(edit?' <button class="btn good" style="padding:3px 9px;font-size:12px;margin-left:6px" data-ok="'+i+'">✔ correcto</button>':'')+'</div>').join('');
 const r=$('res');if(state.phase==='result'){const ans=curAnswer();r.classList.remove('hidden');r.classList.toggle('no',!state.winKey);
  r.innerHTML=state.winKey?'🎉 <b>'+safe(pname(state.winKey))+'</b> ha acertado: <b>'+safe(ans||'…')+'</b> (+1 para él/ella y +1 para '+safe(pname(state.activeKey))+')':safe(state.note||'Nadie acertó.')+' Era: <b>'+safe(ans||'…')+'</b>'}else r.classList.add('hidden');
 $('scores').innerHTML=state.order.map(k=>[k,state.scores[k]||0]).sort((a,b)=>b[1]-a[1]).map(([k,s])=>'<div class="sc"><span>'+safe(pname(k))+(k===state.activeKey&&state.phase==='play'?' · ✏️':'')+(k===myKey?' (tú)':'')+'</span><strong>'+s+' pts</strong></div>').join('')}
function renderFinished(){const r=state.order.map(k=>[k,state.scores[k]||0]).sort((a,b)=>b[1]-a[1]);
 mount('fin','<section class="card center"><div class="tag">PARTIDA TERMINADA</div><div style="font-size:80px">🏆</div><h1>'+safe(pname(r[0][0]))+' gana</h1></section><section class="card">'+r.map(([k,s],i)=>'<div class="sc"><span>'+(['🥇','🥈','🥉'][i]||i+1)+' '+safe(pname(k))+'</span><strong>'+s+' pts</strong></div>').join('')+'</section>'+(isHost?'<button class="btn" id="again" style="width:100%">Volver a la sala</button>':'')+'<button class="btn ghost" id="leave" style="width:100%;margin-top:9px">Salir</button>',
 ()=>{$('again')&&($('again').onclick=()=>{state.phase='lobby';commit()});$('leave').onclick=leaveRoom})}
function render(){if(!roomCode)return renderHome();
 if(!socket||socket.readyState!==1){mount('conn','<section class="card center"><h2>Entrando en la sala…</h2><p class="muted">'+safe(roomCode)+'</p><button class="btn ghost" id="c">Cancelar</button></section>',()=>$('c').onclick=leaveRoom);return}
 if(!state)return mount('wait','<section class="card center"><h2>Esperando al anfitrión…</h2><p class="muted">Sala '+safe(roomCode)+'</p><button class="btn ghost" id="l">Salir</button></section>',()=>$('l').onclick=leaveRoom);
 if(state.phase==='lobby')renderLobby();else if(state.phase==='finished')renderFinished();else renderGame()}
setInterval(()=>{if(roomCode&&state){hostStep()}},700);
if(saved?.room&&saved?.name){connect();render()}else renderHome();
})();
</script></body></html>
