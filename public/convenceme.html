var $=function(i){return document.getElementById(i)},deck=[],hist=[],h=-1;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function draw(){
  if(!deck.length){deck=sh(C);if(hist.length&&deck[deck.length-1]===hist[hist.length-1]){deck.unshift(deck.pop())}}
  return deck.pop();
}
function show(){
  $("txt").textContent="«"+hist[h]+"»";
  $("tag").textContent="Afirmación "+(h+1);
  $("prev").disabled=h<=0;
  var s=$("sign");s.classList.remove("swing");void s.offsetWidth;s.classList.add("swing");
}
function next(){if(h<hist.length-1)h++;else{hist.push(draw());h++}show()}
function prev(){if(h>0){h--;show()}}
$("next").onclick=next;$("prev").onclick=prev;
$("sign").onclick=next;
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter"){if(e.target.tagName!=="BUTTON"){e.preventDefault();next()}}

});
