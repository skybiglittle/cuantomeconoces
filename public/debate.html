function clean(s,n){return String(s||'').replace(/[|@]/g,' ').replace(/\s+/g,' ').trim().slice(0,n)}

// ====================== Salas en directo (mismo sistema que el resto de tus juegos) ======================
// Las salas de debate usan el prefijo "cmd-" (hasta 200 personas en tu server.js).
var ROOM_PREFIX='cmd-';
function makeWsRoom(){
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
  return {join:function(name,cid){return new Promise(function(resolve,reject){
    var ws=null,id=null,pres={},arr=[],subs=[],done=false,closed=false,retry=0;
    var room={
      peers:function(){return arr},
      onPeers:function(fn){subs.push(fn)},
      onStatus:function(fn){room._st=fn},
      presence:function(p){Object.keys(p).forEach(function(k){if(p[k]===null)delete pres[k];else pres[k]=p[k]});send({t:'pres',p:p})},
      leave:function(){closed=true;try{ws.close()}catch(e){}}
    };
    function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
    function open(){
      ws=new WebSocket(url);
      ws.onopen=function(){retry=0;send({t:'join',room:name,cid:cid});if(Object.keys(pres).length)send({t:'pres',p:pres});if(room._st)room._st(true)};
      ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
        if(m.t==='hello'){id=m.id}
        else if(m.t==='peers'){
          arr=m.peers.map(function(q){return{peer:q.id,isMe:q.id===id,presence:q.p||{}}});
          if(!done){done=true;resolve(room)}
          subs.slice().forEach(function(f){f(arr)});
        }else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}
      };
      ws.onclose=function(){if(room._st)room._st(false);if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
    }
    open();
    setTimeout(function(){if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},20000);
  })}};
}
var RM=makeWsRoom();

var S={view:'home',code:'',host:false,room:null,peers:[],g:null,v:{g:0,r:{}},subs:[],name:ls('deb-name')||'',cd:(new URLSearchParams(location.search).get('sala')||'').toUpperCase().slice(0,6),
  err:'',flash:'',online:true,cfg:{m:'gracioso',n:3,R:6,tm:120},busy:false,sub:false,sf:{t:'',a:'',b:'',c:'',three:false},sferr:'',dirty:false};

function players(){
  return S.peers.filter(function(p){return p.presence&&p.presence.u&&p.presence.n}).map(function(p){return{u:p.presence.u,n:p.presence.n,h:p.presence.h===1,v:p.presence.v,s:p.presence.s,me:p.isMe}});
}
function G(){
  if(S.host)return S.g;
  var h=S.peers.filter(function(p){return p.presence&&p.presence.h===1&&p.presence.g})[0];
  return h?h.presence.g:null;
}
function pub(){
  if(!S.room)return;
  S.room.presence({u:uid,n:S.name,h:S.host?1:0,v:S.v,g:S.host?S.g:null,s:S.subs.length?S.subs:null});
  if(S.host)ls('deb-g-'+S.code,JSON.stringify(S.g));
  ls('deb-v-'+S.code,JSON.stringify(S.v));
  ls('deb-s-'+S.code,JSON.stringify(S.subs));
}
function setG(patch){S.g=Object.assign({},S.g,patch);pub();render(true)}

// ====================== Lógica del debate ======================
function isThree(g,i){var N=g.ro.length;return N>=3&&(N===3?i%2===1:i%3===2)}
function topicAt(g,i){
  if(g.o&&g.o[i])return parseT(g.o[i]);
  var m=MODES[g.m],r=rng(g.s),a=shuffle(m.t2,r),b=shuffle(m.t3,r),ai=0,bi=0;
  for(var j=0;j<i;j++){if(isThree(g,j))bi++;else ai++}
  return parseT(isThree(g,i)?b[bi%b.length]:a[ai%a.length]);
}
function assign(g,i,k){
  var order=shuffle(g.ro.map(function(x){return x[0]}),rng(g.s*7+i*131+1)),map={};
  order.forEach(function(u,j){map[u]=j%k});
  return map;
}
function votes(g){
  var tot={};g.ro.forEach(function(x){tot[x[0]]=0});
  players().forEach(function(p){
    if(!p.v||p.v.g!==g.id)return;
    Object.keys(p.v.r||{}).forEach(function(r){var t=p.v.r[r];if(t!==p.u&&tot[t]!==undefined&&+r<g.R)tot[t]++});
  });
  return tot;
}
// Temas enviados por los jugadores que aún no se han jugado
function pendingSubs(g,N){
  var used={};(g.u||[]).forEach(function(h){used[h]=1});
  var out=[];
  players().forEach(function(pl){
    (pl.s||[]).forEach(function(raw){
      if(typeof raw!=='string')return;
      var t=parseT(raw),h=hs(t.t);
      if(used[h]||t.p.length<2||t.p.length>3||(N&&t.p.length>N))return;
      used[h]=1;out.push({raw:raw,h:h,by:pl.n});
    });
  });
  return out;
}

// ====================== Acciones ======================
function cleanName(){S.name=clean(S.name,18);ls('deb-name',S.name);return S.name}
async function enter(code,host,cfg){
  if(S.busy)return;S.busy=true;S.err='';render(true);
  try{
    var room=await RM.join(ROOM_PREFIX+code.toLowerCase(),uid);
    S.room=room;S.code=code;S.host=host;S.view='room';
    room.onPeers(function(arr){S.peers=arr;onPeers()});
    room.onStatus(function(ok){S.online=ok;if(ok)pub();render()});
    S.peers=room.peers();
    var sv=null;try{sv=JSON.parse(ls('deb-v-'+code))}catch(e){}if(sv&&sv.r)S.v=sv;
    var ss=null;try{ss=JSON.parse(ls('deb-s-'+code))}catch(e){}S.subs=Array.isArray(ss)?ss:[];
    if(host){
      var g=null;try{g=JSON.parse(ls('deb-g-'+code))}catch(e){}
      S.g=g||Object.assign({id:Date.now(),s:Math.floor(Math.random()*1e9),ph:'lobby',r:0,ro:[],o:{},u:[]},cfg);
    }
    ls('deb-last',JSON.stringify({code:code,host:host}));
    pub();
  }catch(e){
    S.err=e&&e.code==='room_full'?'La sala está llena.':'No se ha podido conectar con la sala. Inténtalo de nuevo.';
    S.view='home';
  }
  S.busy=false;render(true);
}
function onPeers(){
  var ps=players(),dup=ps.filter(function(p){return !p.me&&p.n.toLowerCase()===S.name.toLowerCase()}).length;
  if(dup&&!S.renamed){S.renamed=1;S.name=S.name+' 2';ls('deb-name',S.name);pub()}
  var g=G();
  if(g&&S.v.g!==g.id){S.v={g:g.id,r:{}};pub()}
  render();
}
function leaveRoom(){
  if(S.room)S.room.leave();
  ls('deb-last',null);S.room=null;S.peers=[];S.g=null;S.host=false;S.view='home';S.renamed=0;S.sub=false;S.flash='';render(true);
}
function nextPatch(g,idx){ // si hay un tema enviado, lo coloca en la ronda idx
  var ps=pendingSubs(g,g.ro.length),p={o:{}};
  if(ps.length){p.o[idx]=ps[0].raw+'|@'+ps[0].by;p.u=(g.u||[]).concat(ps[0].h)}
  return p;
}
function startGame(){
  var g=S.g,ps=players().slice(0,g.n);
  if(ps.length<2)return;
  var g2=Object.assign({},g,{ro:ps.map(function(p){return[p.u,p.n]})});
  setG(Object.assign({ph:'debate',r:0,R:Math.min(g.R,15),id:Date.now(),ro:g2.ro,t0:Date.now()},nextPatch(g2,0)));
}
function nextStep(){
  var g=S.g;
  if(g.ph==='debate')return setG({ph:'vote'});
  if(g.ph==='vote'){
    var nr=g.r+1,np=nextPatch(g,nr);
    if(nr>=g.R){if(!np.o[nr])return setG({ph:'end',o:{}});np.R=nr+1}
    return setG(Object.assign({ph:'debate',r:nr,t0:Date.now()},np));
  }
}
function again(){setG({ph:'lobby',r:0,ro:[],o:{},id:Date.now(),s:Math.floor(Math.random()*1e9)})}
function vote(u){var g=G();S.v.r[g.r]=u;pub();render(true)}
function sendTopic(){
  var f=S.sf,t=clean(f.t,90),a=clean(f.a,45),b=clean(f.b,45),c=f.three?clean(f.c,45):'';
  S.sferr='';
  if(t.length<5)S.sferr='Escribe el tema (mínimo 5 letras).';
  else if(!a||!b)S.sferr='Escribe las dos posturas.';
  else if(a.toLowerCase()===b.toLowerCase())S.sferr='Las posturas tienen que ser distintas.';
  else if(f.three&&(!c||c.toLowerCase()===a.toLowerCase()||c.toLowerCase()===b.toLowerCase()))S.sferr='Escribe una tercera postura distinta.';
  else if(f.three&&players().length<3)S.sferr='Para 3 posturas hacen falta al menos 3 jugadores en la sala.';
  else if(S.subs.some(function(x){return hs(parseT(x).t)===hs(t)}))S.sferr='Ya has enviado ese tema.';
  if(!S.sferr&&S.subs.length>=4){
    var g=G(),used=(g&&g.u)||[],i=-1;
    S.subs.forEach(function(x,k){if(i<0&&used.indexOf(hs(parseT(x).t))>-1)i=k});
    if(i<0)S.sferr='Ya tienes 4 temas en cola; espera a que salgan.';else S.subs.splice(i,1);
  }
  if(S.sferr)return render(true);
  S.subs.push([t,a,b].concat(c?[c]:[]).join('|'));
  S.sf={t:'',a:'',b:'',c:'',three:false};S.sub=false;
  S.flash='✅ ¡Tema enviado! Saldrá en uno de los próximos turnos de esta sala.';
  clearTimeout(S.ft);S.ft=setTimeout(function(){S.flash='';render(true)},6000);
  pub();render(true);
}

function nameList(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1]}
function stanceBlocks(g,it,as){
  var mi=as[uid],h='';
  if(mi!==undefined){
    var mates=g.ro.filter(function(x){return as[x[0]]===mi&&x[0]!==uid}).map(function(x){return esc(x[1])});
    h+='<div class="me" style="--sc:'+COL[mi]+'"><div class="lb">🎯 TÚ DEFIENDES</div><div class="tx">'+esc(it.p[mi])+'</div>'+(mates.length?'<div class="small" style="color:var(--text)">Defiendes lo mismo que: <b>'+nameList(mates)+'</b></div>':'<div class="small" style="color:var(--text)">Esta postura la defiendes tú solo/a 💪</div>')+'</div>';
  }
  var first=true;
  it.p.forEach(function(t,i){
    if(i===mi)return;
    var who=g.ro.filter(function(x){return as[x[0]]===i}).map(function(x){return esc(x[1])});
    if(first){h+='<div class="kick" style="margin-top:16px">'+(mi!==undefined?'Lo que defienden los demás':'Posturas (estás mirando)')+'</div>';first=false}
    h+='<div class="st" style="--sc:'+COL[i]+'"><div class="lb">'+(who.length?nameList(who)+(who.length>1?' defienden':' defiende'):'Postura '+LET[i])+'</div><div class="tx">'+esc(t)+'</div></div>';

}

function viewRoom(){

function formFocused(){var a=document.activeElement;return !!(S.sub&&a&&a.closest&&a.closest('#subform'))}
function render(force){
  if(!force&&formFocused()){S.dirty=true;return} // no rompas lo que están escribiendo
  S.dirty=false;
  var a=document.activeElement,keep=null;
  if(a&&a.tagName==='INPUT'&&a.id)keep={id:a.id,s:a.selectionStart,e:a.selectionEnd};
  app.innerHTML=S.view==='home'?viewHome():viewRoom();
  if(keep&&$(keep.id)){var el=$(keep.id);el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}
  tick();
}
function tick(){
  var g=G(),el=$('tm');
  if(!el||!g||g.ph!=='debate'||!g.tm)return;
  var left=Math.max(0,g.tm-Math.floor((Date.now()-g.t0)/1000));
  el.textContent=left>0?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'⏰ ¡Tiempo!';
  el.className='tm'+(left?'':' end');
}
setInterval(tick,500);

// ====================== Eventos ======================
app.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='nm')S.name=e.target.value;
  else if(id==='cd')S.cd=e.target.value.toUpperCase();
  else if(id&&id.indexOf('sf-')===0)S.sf[id.slice(3)]=e.target.value;
});
app.addEventListener('focusout',function(){
  setTimeout(function(){if(S.dirty&&!formFocused())render(true)},300);
});
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a'),v=b.getAttribute('data-v');
  if(a==='mode'){S.cfg.m=v;render(true)}
  else if(a==='n'){S.cfg.n=Math.max(2,Math.min(8,S.cfg.n+(+v)));render(true)}
  else if(a==='rounds'){S.cfg.R=+v;render(true)}
  else if(a==='tm'){S.cfg.tm=+v;render(true)}
  else if(a==='create'){if(!cleanName()){S.err='Escribe tu nombre primero.';return render(true)}enter(rid(4),true,S.cfg)}
  else if(a==='join'){
    var c=(S.cd||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!cleanName()){S.err='Escribe tu nombre primero.';return render(true)}
    if(c.length<3){S.err='Escribe el código de la sala.';return render(true)}
    enter(c,false);
  }
  else if(a==='resume'){var l=JSON.parse(ls('deb-last'));if(!cleanName()){S.err='Escribe tu nombre primero.';return render(true)}enter(l.code,l.host,S.cfg)}
  else if(a==='leave'){if(confirm('¿Salir de la sala?'))leaveRoom()}
  else if(a==='share'){
    var url=location.origin+location.pathname+'?sala='+S.code;
    if(navigator.share)navigator.share({title:'Debate',text:'Únete a mi debate: sala '+S.code,url:url}).catch(function(){});
    else if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){b.textContent='✅ Enlace copiado'});
  }
  else if(a==='start')startGame();
  else if(a==='next')nextStep();
  else if(a==='again')again();
  else if(a==='vote')vote(v);
  else if(a==='subopen'){S.sub=!S.sub;S.sferr='';render(true);if(S.sub&&$('sf-t'))$('sf-t').focus()}
  else if(a==='subclose'){S.sub=false;S.sferr='';render(true)}
  else if(a==='sf3'){S.sf.three=!S.sf.three;render(true)}
  else if(a==='sendtopic')sendTopic();
});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='cd')app.querySelector('[data-a=join]').click()});
render(true);
</script>
</body>
</html>
