function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}

function rid(n){var c='ABCDEFGHJKMNPQRSTUVWXYZ',s='';for(var i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function hs(s){s=String(s).toLowerCase().trim();var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)}

var ROOM_PREFIX='cmd-deb-';
function makeWsRoom(){
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
  return {join:function(name,cid){return new Promise(function(resolve,reject){
    var ws=null,id=null,pres={},arr=[],subs=[],done=false,closed=false,retry=0;
    var room={
      peers:function(){return arr},
      onPeers:function(fn){subs.push(fn)},
      onStatus:function(fn){room._st=fn},
      presence:function(p){Object.keys(p).forEach(function(k){if(p[k]===null)delete pres[k];else pres[k]=p[k]});send({t:'pres',p:p})},
      leave:function(){closed=true;try{ws.close()}catch(e){}}
    };
    function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
    function open(){
      ws=new WebSocket(url);
      ws.onopen=function(){retry=0;send({t:'join',room:name,cid:cid});if(Object.keys(pres).length)send({t:'pres',p:pres});if(room._st)room._st(true)};
      ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
        if(m.t==='hello'){id=m.id}
        else if(m.t==='peers'){
          arr=m.peers.map(function(q){return{peer:q.id,isMe:q.id===id,presence:q.p||{}}});
          if(!done){done=true;resolve(room)}
          subs.slice().forEach(function(f){f(arr)});
        }else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}
      };
      ws.onclose=function(){if(room._st)room._st(false);if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
    }
    open();
    setTimeout(function(){if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},20000);
  })}};
}

// ====================== Lógica del debate ======================
function isThree(g,i){var N=RO(g).length;return N>=3&&(N===3?i%2===1:i%3===2)}
function topicAt(g,i){
  if(g.o&&g.o[i])return parseT(g.o[i]);
  var m=MODES[g.m],r=rng(g.s),a=shuffle(m.t2,r),b=shuffle(m.t3,r),ai=0,bi=0;
  for(var j=0;j<i;j++){if(isThree(g,j))bi++;else ai++}
  return parseT(isThree(g,i)?b[bi%b.length]:a[ai%a.length]);
}
function assign(g,i,k){
  var order=shuffle(RO(g).map(function(x){return x[0]}),rng(g.s*7+i*131+1)),map={};
  order.forEach(function(u,j){map[u]=(j+((i===g.r&&g.cb)?(g.sw||0):0))%k});
  return map;
}
function votes(g){
  var tot={};RO(g).forEach(function(x){tot[x[0]]=0});
  players().forEach(function(p){
    if(!p.v||p.v.g!==g.id)return;
    Object.keys(p.v.r||{}).forEach(function(r){var t=p.v.r[r];if(t!==p.u&&tot[t]!==undefined&&+r<g.R)tot[t]+=(t===devil(g,+r)?2:1)});
  });
  return tot;
}
// Temas enviados por los jugadores que aún no se han jugado
function pendingSubs(g,N){
  var used={};(g.u||[]).forEach(function(h){used[h]=1});
  var out=[];
  players().forEach(function(pl){
    (pl.s||[]).forEach(function(raw){
      if(typeof raw!=='string')return;
      var t=parseT(raw),h=hs(t.t);
      if(used[h]||t.p.length<2||t.p.length>3||(N&&t.p.length>N))return;
      used[h]=1;out.push({raw:raw,h:h,by:pl.n});
    });
  });
  return out;
}

    var g=G(),used=(g&&g.u)||[],i=-1;
    S.subs.forEach(function(x,k){if(i<0&&used.indexOf(hs(parseT(x).t))>-1)i=k});
    if(i<0)S.sferr='Ya tienes 4 temas en cola; espera a que salgan.';else S.subs.splice(i,1);
  }
  if(S.sferr)return render(true);
  S.subs.push([t,a,b].concat(c?[c]:[]).join('|'));
  S.sf={t:'',a:'',b:'',c:'',three:false};S.sub=false;
  S.flash='✅ ¡Tema enviado! Saldrá en uno de los próximos turnos de esta sala.';
  clearTimeout(S.ft);S.ft=setTimeout(function(){S.flash='';render(true)},6000);
  pub();render(true);
}

// ====================== Vistas ======================
function viewHome(){
  var m=S.cfg,last=null;try{last=JSON.parse(ls('deb-last'))}catch(e){}
  var h='<a href="/" class="link" style="padding:0">← ¿Cuánto me conoces?</a><br><div class="tag">🎙️ MULTIJUGADOR · SALAS PRIVADAS</div><h1>Debate</h1><p class="sub">Cada uno defiende una postura… ¡aunque no sea la suya!</p>';
  if(S.err)h+='<div class="err">'+esc(S.err)+'</div>';
  h+='<div class="panel"><label style="margin-top:0">Tu nombre</label><input id="nm" type="text" maxlength="18" placeholder="¿Cómo te llamas?" value="'+esc(S.name)+'" autocomplete="off"></div>';
  if(last&&last.code)h+='<button class="btn secondary" data-a="resume">↩️ Volver a la sala '+esc(last.code)+'</button>';
  h+='<div class="panel"><h2>Crear sala</h2><div class="kick">Modo</div><div class="grid">'+
    Object.keys(MODES).map(function(k){var x=MODES[k];return '<button class="opt mode'+(m.m===k?' on':'')+'" data-a="mode" data-v="'+k+'"><span class="em">'+x.e+'</span><span><b>'+x.n+'</b><small>'+x.d+'</small></span></button>'}).join('')+
    '</div><div class="row" style="margin-top:16px"><div><div class="kick" style="margin:0">Jugadores</div><span class="small">De 2 a 100. Con 3 o más hay temas de 3 posturas.</span></div><div class="step"><button data-a="n" data-v="-1">−</button><b>'+m.n+'</b><button data-a="n" data-v="1">+</button></div></div>'+
    '<div class="grid g4" style="margin-top:10px">'+[4,8,20,50].map(function(n){return '<button class="opt'+(m.n===n?' on':'')+'" data-a="np" data-v="'+n+'">'+n+'</button>'}).join('')+'</div><div class="kick" style="margin-top:16px">Número de temas</div><div class="grid g4">'+[4,6,8,10].map(function(r){return '<button class="opt'+(m.R===r?' on':'')+'" data-a="rounds" data-v="'+r+'">'+r+'</button>'}).join('')+'</div>'+
    '<div class="kick" style="margin-top:16px">Tiempo por debate</div><div class="grid g4">'+[[0,'Libre'],[60,'1 min'],[120,'2 min'],[180,'3 min']].map(function(t){return '<button class="opt'+(m.tm===t[0]?' on':'')+'" data-a="tm" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>'+
    '<div class="kick" style="margin-top:16px">Mecánicas extra</div><div class="grid" style="grid-template-columns:1fr 1fr"><button class="opt'+(m.cb?' on':'')+'" data-a="tog" data-v="cb">🔄 Cambio de bando</button><button class="opt'+(m.dv?' on':'')+'" data-a="tog" data-v="dv">😈 Abogado del diablo</button></div><p class="small" style="margin:8px 0 0">Cambio: el anfitrión rota las posturas a mitad de debate. Abogado: un jugador por tema, sus votos valen ×2.</p>'+
    '<button class="btn" data-a="create">Crear sala</button></div>';
  h+='<div class="panel"><h2>Unirme a una sala</h2><input id="cd" type="text" maxlength="6" placeholder="CÓDIGO" value="'+esc(S.cd)+'" style="text-transform:uppercase;letter-spacing:.25em;text-align:center;font-weight:800" autocomplete="off"><button class="btn" data-a="join">Unirme</button></div>';
  return h;
}
function subForm(){
  var f=S.sf,g=G(),used=(g&&g.u)||[];
  var h='<div class="panel" id="subform"><h2>💡 Enviar un tema</h2><p class="small" style="margin:0 0 6px">Escribe una pregunta y las posturas que se pueden defender. Saldrá en uno de los próximos turnos y a cada jugador le tocará defender una.</p>';
  if(S.sferr)h+='<div class="err">'+esc(S.sferr)+'</div>';
  h+='<label>Tema o pregunta</label><input id="sf-t" type="text" maxlength="90" placeholder="Ej.: ¿Tortilla de patatas con o sin cebolla?" value="'+esc(f.t)+'" autocomplete="off">'+
     '<label>Postura A</label><input id="sf-a" type="text" maxlength="45" placeholder="Ej.: Con cebolla" value="'+esc(f.a)+'" autocomplete="off">'+
     '<label>Postura B</label><input id="sf-b" type="text" maxlength="45" placeholder="Ej.: Sin cebolla" value="'+esc(f.b)+'" autocomplete="off">';
  if(f.three)h+='<label>Postura C</label><input id="sf-c" type="text" maxlength="45" placeholder="Tercera postura" value="'+esc(f.c)+'" autocomplete="off"><button class="link" data-a="sf3">Quitar la tercera postura</button>';
  else h+='<button class="link" data-a="sf3">+ Añadir una tercera postura</button>';
  h+='<button class="btn" data-a="sendtopic">Enviar tema</button><button class="btn ghost" data-a="subclose">Cancelar</button>';
  if(S.subs.length)h+='<div class="kick" style="margin-top:16px">Tus temas enviados</div>'+S.subs.map(function(x){var t=parseT(x);return '<div class="qi">'+(used.indexOf(hs(t.t))>-1?'✅ jugado':'⏳ en cola')+' · '+esc(t.t)+'</div>'}).join('');
  return h+'</div>';
}
function topbar(left){
  return '<div class="row" style="margin-bottom:4px"><span class="small"><span class="dot'+(S.online?'':' off')+'"></span>'+left+'</span><span><button class="linkb" data-a="subopen">💡 Enviar tema</button> <button class="link" data-a="leave">Salir</button></span></div>'+
    (S.flash?'<div class="ok">'+esc(S.flash)+'</div>':'')+(S.sub?subForm():'');
}
function viewLobby(g){
  var ps=players(),inRoom=ps.slice(0,g.n),extra=ps.slice(g.n),x=MODES[g.m];
  var mine=inRoom.some(function(p){return p.me});
  var h=topbar(S.online?'Conectado':'Reconectando…');
  h+='<div class="panel" style="text-align:center"><div class="kick">Código de la sala</div><div class="code">'+esc(S.code)+'</div><button class="btn secondary" data-a="share" style="margin-top:6px">🔗 Compartir enlace</button></div>';
  h+='<div class="panel"><div class="row"><h2 style="margin:0">'+x.e+' '+x.n+'</h2><span class="small">'+g.R+' temas · '+(g.tm?Math.round(g.tm/60)+' min':'sin tiempo')+'</span></div><div class="kick" style="margin-top:12px">Jugadores ('+Math.min(ps.length,g.n)+'/'+g.n+')</div>'+
    inRoom.map(function(p,i){return '<div class="pl'+(i?'':' first')+'"><div class="av">'+esc(p.n[0].toUpperCase())+'</div><b>'+esc(p.n)+(p.me?' (tú)':'')+'</b>'+(p.h?'<span class="small" style="margin-left:auto">👑 anfitrión</span>':'')+'</div>'}).join('');
  for(var i=ps.length;i<g.n;i++)h+='<div class="pl muted"><div class="av" style="background:var(--line);color:var(--muted)">?</div>esperando…</div>';
  h+='</div>';
  if(extra.length)h+='<p class="small">'+extra.length+' persona(s) de más no entrarán: la sala es de '+g.n+' jugadores.</p>';
  if(!mine&&!S.host)h+='<div class="err">La sala está completa: puedes mirar, pero no jugar.</div>';
  if(S.host){
    h+='<button class="btn" data-a="start"'+(ps.length<2?' disabled':'')+'>'+(ps.length>=g.n?'¡Empezar el debate!':'Empezar con los que hay ('+Math.min(ps.length,g.n)+')')+'</button>';
    if(ps.length<g.n)h+='<p class="small" style="text-align:center">Comparte el código para que se una el resto.</p>';
  }else h+='<p class="muted" style="text-align:center">Esperando a que el anfitrión empiece…</p>';
  return h;
}
function nameList(a){if(a.length>6)return a.slice(0,5).join(', ')+' y '+(a.length-5)+' más';return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1]}
function stanceBlocks(g,it,as,onlyMe){
  var mi=as[uid],h='';
  if(devil(g,g.r)===uid)h+='<div class="err" style="border-color:var(--gold);background:#ffd16622">😈 <b>Eres el abogado del diablo.</b> Defiéndelo con el argumento más exagerado y teatral. Si te votan, tus votos valen doble.</div>';
  if(mi!==undefined){
    var mates=RO(g).filter(function(x){return as[x[0]]===mi&&x[0]!==uid}).map(function(x){return esc(x[1])});
    h+='<div class="me" style="--sc:'+COL[mi]+'"><div class="lb">'+(g.cb&&g.sw?'🔄 ¡CAMBIO DE BANDO! AHORA DEFIENDES':'🎯 TÚ DEFIENDES')+'</div><div class="tx">'+esc(it.p[mi])+'</div>'+(mates.length?'<div class="small" style="color:var(--text)">Defiendes lo mismo que: <b>'+nameList(mates)+'</b></div>':'<div class="small" style="color:var(--text)">Esta postura la defiendes tú solo/a 💪</div>')+'</div>';
  }
  if(onlyMe)return h;
  var first=true;
  it.p.forEach(function(t,i){
    if(i===mi)return;
    var who=RO(g).filter(function(x){return as[x[0]]===i}).map(function(x){return esc(x[1])});
    if(first){h+='<div class="kick" style="margin-top:16px">'+(mi!==undefined?'Lo que defienden los demás':'Posturas (estás mirando)')+'</div>';first=false}
    h+='<div class="st" style="--sc:'+COL[i]+'"><div class="lb">'+(who.length?nameList(who)+(who.length>1?' defienden':' defiende'):'Postura '+LET[i])+'</div><div class="tx">'+esc(t)+'</div></div>';
  });
  return h;
}
function viewPlay(g){
  var it=topicAt(g,g.r),k=it.p.length,as=assign(g,g.r,k),x=MODES[g.m];
  var h=topbar(x.e+' '+x.n+' · Tema '+(g.r+1)+' de '+g.R);
  h+='<div class="panel"><div class="kick">'+(k===3?'Tres posturas':'Dos posturas')+(it.by?' · 💡 enviado por '+esc(it.by):'')+'</div><div class="topic">'+esc(it.t)+'</div>';
  if(g.ph==='debate'&&g.tm)h+='<div class="tm" id="tm"></div>';
  h+='</div>';
  var dv=devil(g,g.r);if(dv)h+='<div class="tag" style="margin-bottom:6px">😈 Abogado del diablo: <b>&nbsp;'+esc(NM[dv]||'?')+'</b>&nbsp;(votos ×2)</div>';
  if(g.ph==='debate'){
    h+=stanceBlocks(g,it,as);
    h+=S.host?(g.cb?'<button class="btn secondary" data-a="swap">🔄 ¡Cambio de bando!'+(g.sw?' ('+g.sw+')':'')+'</button>':'')+'<button class="btn" data-a="next">Pasar a la votación →</button>':'<p class="small" style="text-align:center">El anfitrión pasará a la votación cuando acabe el debate.</p>';
  }else{
    h+=stanceBlocks(g,it,as,1);
    var mine=S.v.r[g.r],ps=players(),nv=ps.filter(function(p){return p.v&&p.v.g===g.id&&p.v.r&&p.v.r[g.r]}).length;
    h+='<div class="panel"><h2>¿Quién ha defendido mejor su postura?</h2><div class="small" style="margin-bottom:6px">No vale votarte a ti mismo/a.</div>'+
      RO(g).filter(function(r){return r[0]!==uid}).map(function(r){var s=as[r[0]];return '<button class="votebtn'+(mine===r[0]?' on':'')+'" style="border-left:6px solid '+COL[s]+'" data-a="vote" data-v="'+esc(r[0])+'"><b>'+esc(r[1])+(r[0]===devil(g,g.r)?' 😈 ×2':'')+'</b><div class="small">defendía: '+esc(it.p[s])+'</div></button>'}).join('')+
      '<div class="small" style="margin-top:8px">Han votado '+nv+' de '+RO(g).length+'</div></div>';
    h+=S.host?'<button class="btn" data-a="next">'+(g.r+1>=g.R&&!pendingSubs(g,RO(g).length).length?'Ver resultados 🏆':'Siguiente tema →')+'</button>':'<p class="small" style="text-align:center">Esperando al anfitrión…</p>';
  }
  return h;
}
function viewEnd(g){
  var tot=votes(g),rk=RO(g).slice().sort(function(a,b){return tot[b[0]]-tot[a[0]]}),med=['🥇','🥈','🥉'],top=tot[rk[0][0]];
  var h=topbar('🏆 Resultados');
  h+='<div class="panel"><h2>'+(top>0?'¡'+esc(rk[0][1])+' ha sido el/la más convincente!':'Fin del debate')+'</h2>'+
    rk.map(function(r,i){return '<div class="rk'+(i?'':' first')+'"><span class="n">'+(med[i]||(i+1))+'</span><b>'+esc(r[1])+(r[0]===uid?' (tú)':'')+'</b><span class="v">'+tot[r[0]]+' voto'+(tot[r[0]]===1?'':'s')+'</span></div>'}).join('')+'</div>';
  h+=S.host?'<button class="btn" data-a="again">Jugar otra vez</button>':'<p class="muted" style="text-align:center">El anfitrión puede empezar otra partida.</p>';
  return h;
}
function viewRoom(){
  var g=G(),hostHere=players().some(function(p){return p.h});
  if(!g)return '<div class="panel"><p>'+(hostHere?'Conectando con el anfitrión…':'Esperando al anfitrión…')+'</p><p class="small">Si no aparece: comprueba el código y que el anfitrión tenga la sala abierta y haya recargado la página.</p><button class="link" data-a="leave">Salir</button></div>';
  if(!hostHere&&!S.host)return '<div class="err">El anfitrión se ha desconectado. Si vuelve, la partida continuará.</div><button class="btn secondary" data-a="leave">Salir</button>';
  if(g.ph==='lobby')return viewLobby(g);
  if(g.ph==='end')return viewEnd(g);
  return viewPlay(g);
}
function formFocused(){var a=document.activeElement;return !!(S.sub&&a&&a.closest&&a.closest('#subform'))}
function render(force){
  if(!force&&formFocused()){S.dirty=true;return} // no rompas lo que están escribiendo
  S.dirty=false;
  var a=document.activeElement,keep=null;
  if(a&&a.tagName==='INPUT'&&a.id)keep={id:a.id,s:a.selectionStart,e:a.selectionEnd};
  app.innerHTML=S.view==='home'?viewHome():viewRoom();
  if(keep&&$(keep.id)){var el=$(keep.id);el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}
  tick();
}
function tick(){
  var g=G(),el=$('tm');
  if(!el||!g||g.ph!=='debate'||!g.tm)return;
  var left=Math.max(0,g.tm-Math.floor((Date.now()-g.t0)/1000));
  el.textContent=left>0?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'⏰ ¡Tiempo!';
  el.className='tm'+(left?'':' end');
}
setInterval(tick,500);

// ====================== Eventos ======================
app.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='nm')S.name=e.target.value;
  else if(id==='cd')S.cd=e.target.value.toUpperCase();
  else if(id&&id.indexOf('sf-')===0)S.sf[id.slice(3)]=e.target.value;
});
app.addEventListener('focusout',function(){
  setTimeout(function(){if(S.dirty&&!formFocused())render(true)},300);
});
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a'),v=b.getAttribute('data-v');
  if(a==='mode'){S.cfg.m=v;render(true)}
  else if(a==='n'){S.cfg.n=Math.max(2,Math.min(100,S.cfg.n+(+v)));render(true)}
  else if(a==='rounds'){S.cfg.R=+v;render(true)}
  else if(a==='tm'){S.cfg.tm=+v;render(true)}
  else if(a==='create'){if(!cleanName()){S.err='Escribe tu nombre primero.';return render(true)}enter(rid(4),true,S.cfg)}
  else if(a==='join'){
    var c=(S.cd||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!cleanName()){S.err='Escribe tu nombre primero.';return render(true)}
    if(c.length<3){S.err='Escribe el código de la sala.';return render(true)}
    enter(c,false);
  }
  else if(a==='resume'){var l=JSON.parse(ls('deb-last'));if(!cleanName()){S.err='Escribe tu nombre primero.';return render(true)}enter(l.code,l.host,S.cfg)}
  else if(a==='leave'){if(confirm('¿Salir de la sala?'))leaveRoom()}
  else if(a==='share'){
    var url=location.origin+location.pathname+'?sala='+S.code;
    if(navigator.share)navigator.share({title:'Debate',text:'Únete a mi debate: sala '+S.code,url:url}).catch(function(){});
    else if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){b.textContent='✅ Enlace copiado'});
  }
  else if(a==='start')startGame();
  else if(a==='next')nextStep();
  else if(a==='swap')setG({sw:(S.g.sw||0)+1,t0:Date.now()});
  else if(a==='tog'){S.cfg[v]=S.cfg[v]?0:1;render(true)}
  else if(a==='np'){S.cfg.n=+v;render(true)}
  else if(a==='again')again();
  else if(a==='vote')vote(v);
  else if(a==='subopen'){S.sub=!S.sub;S.sferr='';render(true);if(S.sub&&$('sf-t'))$('sf-t').focus()}
  else if(a==='subclose'){S.sub=false;S.sferr='';render(true)}
  else if(a==='sf3'){S.sf.three=!S.sf.three;render(true)}
  else if(a==='sendtopic')sendTopic();
});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='cd')app.querySelector('[data-a=join]').click()});
render(true);
</script>
</body>
