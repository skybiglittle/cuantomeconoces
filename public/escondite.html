<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Escondite GPS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1c1b19;--mut:#6b675f;--ac:#d9481c;--ok:#1f8a4c;--bd:#e3dfd6;--me:#2563eb;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#15140f;--card:#201f1a;--tx:#f1eee6;--mut:#a09b8f;--ac:#ff7a4d;--ok:#4cc88a;--bd:#34322b;--me:#6ea0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
button{padding:12px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-size:16px;font-weight:600;width:100%;margin-top:8px}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg button{margin-top:0}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#st{font-weight:700;font-size:18px}
.warn{background:#c62828;color:#fff;border-radius:10px;padding:10px;margin-bottom:12px;font-weight:600}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:14px;margin:0 6px 6px 0;border:1px solid var(--bd)}
.h{border-color:var(--ok);color:var(--ok)}.s{border-color:var(--ac);color:var(--ac)}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:14px;background:var(--card);border:1px solid var(--bd)}
.mut{color:var(--mut);font-size:14px}
.hide{display:none}
#code{font-size:26px;letter-spacing:4px;font-weight:800}
</style></head><body><main>
<h1>Escondite GPS</h1>

<div id="join" class="card">
  <label>Tu nombre</label><input id="nm" maxlength="14" autocomplete="off">
  <label>Tu equipo</label>
  <div class="row seg"><button class="alt on" id="rh">Escondido</button><button class="alt" id="rs">Buscador</button></div>
  <label>Código de sala (déjalo vacío si vas a crear una)</label>
  <input id="cd" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="p. ej. K7QX">
  <button id="join2">Unirme a la sala</button>
  <button class="alt" id="mk">Crear sala nueva</button>
  <p class="mut" id="jmsg"></p>
</div>

<div id="game" class="hide">
  <div class="card"><div class="mut">Código de sala (compártelo)</div><div id="code"></div>
    <button class="alt" id="shr">Copiar enlace</button></div>
  <div id="note" class="warn hide"></div>
  <div id="warn" class="warn hide">Estás fuera de la zona. Vuelve dentro.</div>
  <div class="card"><div id="st"></div><div class="mut" id="sub"></div></div>
  <canvas id="cv"></canvas>
  <div class="mut" id="gps"></div>
  <button class="alt" id="mapb">Ocultar mapa</button>
  <p class="mut" id="legend">Verde: escondidos. Naranja: buscadores. Azul: tú. Norte arriba.</p>
  <div class="card"><div id="roster"></div></div>
  <button id="fnd" class="hide">Me han encontrado</button>
  <button id="swap" class="alt hide">Cambiar de equipo</button>
  <div id="host" class="card hide">
    <b>Anfitrión</b>
    <div class="row"><div><label>Radio zona (m)</label><input id="zr" type="number" value="300"></div>
    <div><label>Min. para esconderse</label><input id="hm" type="number" value="10"></div>
    <div><label>Pista cada (min)</label><input id="pm" type="number" value="5"></div></div>
    <div class="row"><div><label>Encoger cada (min, 0 = no)</label><input id="sm" type="number" value="0"></div>
    <div><label>Encoger (%)</label><input id="sp" type="number" value="25"></div>
    <div><label>Radio mínimo (m)</label><input id="mr" type="number" value="50"></div></div>
    <button class="alt" id="zset">Fijar zona en mi posición</button>
    <button id="start">Empezar partida</button>
    <button class="alt" id="end">Terminar partida</button>
    <button class="alt" id="nr">Nueva ronda (vuelve a la sala)</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const PFX="escgps-";
let peer=null,myId=null,hostConn=null,conns=[],states={},peers=[],roomCode="";
let me={lat:null,lng:null},my={n:"",role:"h",found:false,ping:null,host:false,g:{z:null,ph:"lobby",t0:0,hm:10,pm:5,sm:0,sp:25,mr:50}};
let lastSend=0,lastK=-1,pend=false,started=false,wasOut=false,gpsErr="",mapOn=true,lastRd=0,retries=0,retryPending=false,gone=false,joinCode="";
const timers={},seenPing={};
const team=p=>p.found?"s":p.role;
function xy(p,c){const k=Math.cos(c.lat*Math.PI/180);return{x:(p.lng-c.lng)*111320*k,y:(p.lat-c.lat)*110540}}
function dist(a,b){const d=xy(a,b);return Math.hypot(d.x,d.y)}
function fmt(ms){ms=Math.max(0,Math.round(ms/1000));return Math.floor(ms/60)+":"+String(ms%60).padStart(2,"0")}

$("rh").onclick=()=>{my.role="h";$("rh").classList.add("on");$("rs").classList.remove("on")};
$("rs").onclick=()=>{my.role="s";$("rs").classList.add("on");$("rh").classList.remove("on")};
const qs=new URLSearchParams(location.search).get("sala");if(qs)$("cd").value=qs.toUpperCase();

function name(){const n=$("nm").value.trim();if(!n){$("jmsg").textContent="Pon tu nombre.";return null}my.n=n;return n}
function newCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}

/* ---------- Red (PeerJS: el anfitrión es el servidor de la sala) ---------- */
/* El anfitrión guarda el estado completo (states) y a cada jugador le manda una vista filtrada:
   los buscadores NO reciben la posición en vivo de los escondidos, solo sus pistas. */
function view(forId){
  const mine=states[forId],hider=mine&&team(mine)==="h";
  if(hider)return states;
  const o={};
  for(const id in states){const q=states[id];o[id]=(id!==forId&&team(q)==="h")?Object.assign({},q,{lat:null,lng:null}):q}
  return o;
}
function applyStates(st){
  peers=Object.entries(st).map(([id,p])=>({peer:id,isMe:id===myId,presence:p}));
  if(team(my)!=="h")peers.forEach(p=>{const pg=p.presence.ping;if(!pg||p.isMe)return;
    if(seenPing[p.peer]!==undefined&&seenPing[p.peer]!==pg.t)try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}
    seenPing[p.peer]=pg.t});
  render();
}
function broadcast(){
  applyStates(view(myId));
  conns.forEach(c=>{try{c.open&&c.send({t:"s",st:view(c.peer)})}catch(e){}});
}
/* El anfitrión valida lo que llega de los clientes y evita nombres repetidos */
function clean(p,id){
  const num=v=>typeof v==="number"&&isFinite(v)?v:null;
  const base=String(p.n||"?").slice(0,14);let name=base,i=2;
  while(Object.keys(states).some(k=>k!==id&&states[k].n===name))name=base.slice(0,11)+" "+i++;
  const pg=p.ping&&num(p.ping.lat)!==null&&num(p.ping.lng)!==null?{lat:p.ping.lat,lng:p.ping.lng,t:num(p.ping.t)||0}:null;
  return{n:name,role:p.role==="s"?"s":"h",found:!!p.found,lat:num(p.lat),lng:num(p.lng),ping:pg,host:null,g:null};
}
function myPresence(){return{n:my.n,role:my.role,found:my.found,lat:me.lat,lng:me.lng,ping:my.ping,host:my.host?1:null,g:my.host?my.g:null}}
function send(force){
  const now=Date.now();
  if(!force&&now-lastSend<3000){pend=true;return}
  lastSend=now;pend=false;
  if(my.host){states[myId]=myPresence();broadcast()}
  else if(hostConn&&hostConn.open){hostConn.send({t:"p",p:myPresence()})}
}
function createRoom(tries){
  const code=newCode();
  peer=new Peer(PFX+code);
  peer.on("open",id=>{myId=id;roomCode=code;my.host=true;enter();
    peer.on("connection",c=>{
      c.on("open",()=>{clearTimeout(timers[c.peer]);conns=conns.filter(x=>x.peer!==c.peer);conns.push(c);c.send({t:"s",st:view(c.peer)})});
      c.on("data",m=>{if(m&&m.t==="p"&&m.p&&typeof m.p==="object"){states[c.peer]=clean(m.p,c.peer);broadcast()}});
      c.on("close",()=>{conns=conns.filter(x=>x!==c);clearTimeout(timers[c.peer]);
        /* 15 s de margen por si el jugador se reconecta */
        timers[c.peer]=setTimeout(()=>{if(!conns.some(x=>x.peer===c.peer)){delete states[c.peer];broadcast()}},15000)});
    });
  });
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    if(e.type==="unavailable-id"&&tries<5){peer.destroy();createRoom(tries+1)}
    else if(!started)$("jmsg").textContent="No se pudo crear la sala ("+e.type+").";
  });
}
function note(t){$("note").textContent=t;$("note").classList.toggle("hide",!t)}
function joinRoom(code){
  joinCode=code;peer=new Peer();
  peer.on("open",id=>{myId=id;connectHost()});
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    if(started)retry();
    else $("jmsg").textContent=e.type==="peer-unavailable"?"Esa sala no existe.":"Error de conexión ("+e.type+").";
  });
}
function connectHost(){
  const c=peer.connect(PFX+joinCode,{reliable:true});hostConn=c;
  c.on("open",()=>{retries=0;roomCode=joinCode;note("");enter();send(true)});
  c.on("data",m=>{if(m&&m.t==="s"&&m.st)applyStates(m.st)});
  c.on("close",()=>{if(c===hostConn)retry()});
}
function retry(){
  if(gone||retryPending)return;
  if(retries>=8){gone=true;note("El anfitrión se ha desconectado. La partida ha terminado.");return}
  retries++;retryPending=true;note("Reconectando… ("+retries+"/8)");
  setTimeout(()=>{retryPending=false;try{if(peer.disconnected)peer.reconnect();connectHost()}catch(e){retry()}},3000);
}
$("mk").onclick=()=>{if(!name())return;$("jmsg").textContent="Creando sala…";createRoom(0)};
$("join2").onclick=()=>{if(!name())return;const c=$("cd").value.trim().toUpperCase();
  if(!c){$("jmsg").textContent="Escribe el código de sala.";return}$("jmsg").textContent="Conectando…";joinRoom(c)};

function enter(){
  if(started)return;started=true;
  $("join").classList.add("hide");$("game").classList.remove("hide");$("code").textContent=roomCode;
  if(window.isSecureContext===false)gpsErr="El GPS solo funciona si abres la página con https.";
  if(navigator.geolocation){
    navigator.geolocation.watchPosition(pos=>{me.lat=pos.coords.latitude;me.lng=pos.coords.longitude;me.acc=pos.coords.accuracy;gpsErr="";send(false);render()},
      e=>{gpsErr=e&&e.code===1?"Has denegado el permiso de ubicación. Actívalo en los ajustes del navegador.":"No consigo tu ubicación. Sal a cielo abierto y comprueba que el GPS está activado."},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  }
  const wl=()=>{try{navigator.wakeLock&&navigator.wakeLock.request("screen")}catch(e){}};wl();document.addEventListener("visibilitychange",()=>{if(!document.hidden){wl();send(true)}});
  send(true);setInterval(tick,1000);render();
}
$("shr").onclick=async()=>{const u=location.origin+location.pathname+"?sala="+roomCode;
  try{await navigator.clipboard.writeText(u);$("shr").textContent="¡Copiado!"}catch(e){prompt("Copia el enlace:",u)}};

/* ---------- Controles de anfitrión ---------- */
$("zset").onclick=()=>{if(me.lat==null){alert("Aún no tengo tu ubicación.");return}
  my.g.z={lat:me.lat,lng:me.lng,r:Math.max(30,+$("zr").value||300)};send(true);render()};
$("start").onclick=()=>{if(!my.g.z){alert("Primero fija la zona.");return}
  my.g.hm=Math.max(1,+$("hm").value||10);my.g.pm=Math.max(1,+$("pm").value||5);
  my.g.sm=Math.max(0,+$("sm").value||0);my.g.sp=Math.min(90,Math.max(5,+$("sp").value||25));my.g.mr=Math.max(10,+$("mr").value||50);
  my.g.t0=Date.now();my.g.ph="hide";send(true);render()};
/* Radio actual: se encoge de forma continua durante la búsqueda */
function curR(g,now){
  const r0=g.z.r;if(!g.sm||now===undefined)return r0;
  const ss=g.t0+g.hm*6e4;if(now<ss||g.ph==="lobby")return r0;
  const t=(now-ss)/(g.sm*6e4),k=Math.floor(t),f=t-k,q=1-g.sp/100,rk=r0*Math.pow(q,k);
  return Math.max(Math.min(g.mr,r0),rk+(rk*q-rk)*f);
}
$("end").onclick=()=>{my.g.ph="end";send(true);render()};
$("nr").onclick=()=>{my.g.ph="lobby";my.g.t0=0;my.g.rd=(my.g.rd||0)+1;send(true);render()};
$("swap").onclick=()=>{my.role=my.role==="h"?"s":"h";my.found=false;my.ping=null;send(true);render()};
$("mapb").onclick=()=>{mapOn=!mapOn;$("mapb").textContent=mapOn?"Ocultar mapa":"Mostrar mapa";render()};
$("fnd").onclick=()=>{my.found=true;send(true);render()};

/* ---------- Lógica de juego ---------- */
function curG(){
  if(my.host)return my.g;
  const hs=peers.filter(p=>p.presence&&p.presence.host&&p.presence.g);
  return hs.length?hs[0].presence.g:null;
}
function phase(g){
  if(!g)return{ph:"lobby",ss:0};
  const ss=g.t0+g.hm*6e4;
  if(g.ph==="hide")return{ph:Date.now()>=ss?"seek":"hide",ss};
  if(g.ph==="seek")return{ph:"seek",ss};
  return{ph:g.ph,ss};
}
function tick(){
  const g=curG(),{ph,ss}=phase(g);
  if(g&&(g.rd||0)!==lastRd){lastRd=g.rd||0;my.found=false;my.ping=null;lastK=-1;send(true)}
  if(g&&ph==="seek"&&team(my)==="h"&&!my.found&&me.lat!=null){
    const k=Math.floor((Date.now()-ss)/(g.pm*6e4));
    if(k!==lastK){lastK=k;my.ping={lat:me.lat,lng:me.lng,t:Date.now()};send(true)}
  }
  if(pend&&Date.now()-lastSend>=3000)send(false);
  render();
}
function render(){
  if(!started)return;
  const g=curG(),{ph,ss}=phase(g),now=Date.now(),mt=team(my);
  const hiders=peers.filter(p=>p.presence.n&&team(p.presence)==="h");
  let st="",sub="";
  if(ph==="lobby"){st="Sala de espera";sub=g&&g.z?"Zona fijada. Esperando a que empiece.":"El anfitrión debe fijar la zona."}
  else if(ph==="hide"){st="Escondiéndose: "+fmt(ss-now);sub=mt==="h"?"Corre a esconderte dentro de la zona.":"Quédate quieto. Saldrás cuando acabe el tiempo."}
  else if(ph==="seek"){
    const nxt=ss+(Math.floor((now-ss)/(g.pm*6e4))+1)*g.pm*6e4;
    st="¡A buscar!";sub=mt==="h"?"Cada "+g.pm+" min revelas tu posición. Próxima en "+fmt(nxt-now):"Próxima pista de los escondidos en "+fmt(nxt-now);
    if(hiders.length===0&&peers.length>1){st="¡Fin! Han encontrado a todos";sub=""}
  }else{st="Partida terminada";sub=""}
  $("st").textContent=st;$("sub").textContent=sub;
  $("host").classList.toggle("hide",!my.host);
  $("fnd").classList.toggle("hide",!(my.role==="h"&&!my.found&&ph==="seek"));
  $("swap").classList.toggle("hide",ph!=="lobby"&&ph!=="end");
  let out=false;const R=g&&g.z?curR(g,now):0;
  if(g&&g.z&&me.lat!=null&&mt==="h"&&(ph==="hide"||ph==="seek"))out=dist(me,g.z)>R;
  if(ph==="seek"&&g.sm)$("sub").textContent+=" · Zona: "+Math.round(R)+" m"+(R<=Math.min(g.mr,g.z.r)+0.5?" (mínima)":" y encogiéndose");
  if(out&&!wasOut)try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  wasOut=out;
  $("warn").classList.toggle("hide",!out);
  $("gps").textContent=gpsErr||(me.lat==null?"Buscando señal GPS…":"GPS: ±"+Math.round(me.acc||0)+" m"+(me.acc>30?" · señal floja, sal a cielo abierto":""));
  const ro=$("roster");ro.textContent="";
  peers.forEach(p=>{const q=p.presence;if(!q.n)return;const s=document.createElement("span");const t=team(q);
    s.className="chip "+t;s.textContent=(p.isMe?"Tú: ":"")+q.n+(q.found?" (encontrado)":t==="h"?" (escondido)":" (buscador)")+(q.host?" ★":"");ro.appendChild(s)});
  draw(g,mt);
}
const tiles={};
function tileImg(z,tx,ty){const k=z+"/"+tx+"/"+ty;let t=tiles[k];
  if(!t){t=tiles[k]={img:new Image(),ok:false};t.img.onload=()=>{t.ok=true;render()};t.img.src="https://tile.openstreetmap.org/"+k+".png"}
  return t}
/* Mapa de OpenStreetMap debajo del radar: elige el zoom según la escala y dibuja los mosaicos visibles */
function drawMap(x,c,sc,cx,cy,w){
  const k=Math.cos(c.lat*Math.PI/180);
  const z=Math.max(3,Math.min(19,Math.round(Math.log2(156543.03*k*sc)))),n=Math.pow(2,z);
  const ts=256*(156543.03*k/n)*sc,lr=c.lat*Math.PI/180;
  const wx=(c.lng+180)/360*n,wy=(1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n;
  const x0=Math.floor(wx-cx/ts),x1=Math.floor(wx+(w-cx)/ts),y0=Math.floor(wy-cy/ts),y1=Math.floor(wy+(w-cy)/ts);
  if((x1-x0+1)*(y1-y0+1)>40)return;
  for(let i=x0;i<=x1;i++)for(let j=y0;j<=y1;j++){if(j<0||j>=n)continue;
    const t=tileImg(z,((i%n)+n)%n,j);if(t.ok)x.drawImage(t.img,cx+(i-wx)*ts,cy+(j-wy)*ts,ts+0.5,ts+0.5)}
  x.fillStyle="#333";x.font="10px system-ui";x.textAlign="right";x.fillText("© OpenStreetMap",w-6,w-6);
}
function draw(g,mt){
  const cv=$("cv"),dpr=window.devicePixelRatio||1,w=cv.clientWidth;if(!w)return;
  cv.width=w*dpr;cv.height=w*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim();
  const c=g&&g.z?g.z:(me.lat!=null?{lat:me.lat,lng:me.lng,r:200}:null);
  x.clearRect(0,0,w,w);
  if(!c){x.fillStyle=col("--mut");x.font="15px system-ui";x.textAlign="center";x.fillText("Esperando tu ubicación…",w/2,w/2);return}
  const half=w/2-12,sc=half/(c.r*1.25),cx=w/2,cy=w/2;
  const pt=p=>{const d=xy(p,c);let px=d.x*sc,py=-d.y*sc;const L=Math.hypot(px,py);if(L>half){px*=half/L;py*=half/L}return[cx+px,cy+py]};
  const R=g&&g.z?curR(g,Date.now()):c.r;
  if(mapOn){drawMap(x,c,sc,cx,cy,w);x.beginPath();x.rect(0,0,w,w);x.arc(cx,cy,R*sc,0,7);x.fillStyle="rgba(0,0,0,.3)";x.fill("evenodd")}
  const lab=(t,a,b)=>{x.font="bold 12px system-ui";x.textAlign="center";if(mapOn){x.lineWidth=3;x.strokeStyle="#fff";x.strokeText(t,a,b)}x.fillStyle=mapOn?"#111":col("--tx");x.fillText(t,a,b)};
  if(R<c.r-0.5){x.strokeStyle=col("--mut");x.globalAlpha=.4;x.lineWidth=1;x.setLineDash([3,5]);x.beginPath();x.arc(cx,cy,c.r*sc,0,7);x.stroke();x.globalAlpha=1}
  x.strokeStyle=col("--ok");x.lineWidth=2;x.setLineDash([6,5]);x.beginPath();x.arc(cx,cy,R*sc,0,7);x.stroke();x.setLineDash([]);
  lab("zona "+Math.round(R)+" m",cx,cy-R*sc-4);
  const dot=(p,color,label,ring)=>{const[a,b]=pt(p);x.beginPath();x.arc(a,b,ring?9:7,0,7);
    if(ring){x.strokeStyle=color;x.lineWidth=2;x.stroke()}else{x.fillStyle=color;x.fill()}
    lab(label,a,b-12)};
  peers.forEach(p=>{const q=p.presence;if(p.isMe||!q.n)return;const t=team(q);
    if(t==="h"&&!q.found){
      if(mt==="h"&&q.lat!=null)dot(q,col("--ok"),q.n);
      else if(mt!=="h"&&q.ping)dot(q.ping,col("--ok"),q.n+" "+Math.round((Date.now()-q.ping.t)/60000)+"m",true);
    }else if(q.lat!=null)dot(q,col("--ac"),q.n)});
  if(me.lat!=null&&me.acc){const[a,b]=pt(me);x.beginPath();x.arc(a,b,Math.max(9,me.acc*sc),0,7);x.fillStyle="rgba(37,99,235,.18)";x.fill()}
  if(me.lat!=null)dot(me,col("--me"),"tú");
  if(mt!=="h"&&me.lat!=null){let best=null;peers.forEach(p=>{const q=p.presence;if(q.ping&&team(q)==="h"){const d=dist(me,q.ping);if(best===null||d<best)best=d}});
    $("legend").textContent=best!==null?"Última pista más cercana: a "+Math.round(best)+" m de ti. Los aros son pistas pasadas.":"Verde: escondidos. Naranja: buscadores. Azul: tú. Norte arriba."}
}
addEventListener("resize",render);
</script></main></body></html>
