<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filtros Webcam</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--txt:#f2f3f5;--ac:#7c5cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;gap:12px}
h1{margin:0;font-size:1.3rem}
#stage{position:relative;width:100%;max-width:760px;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
canvas{width:100%;height:100%;display:block;object-fit:contain}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#bbb}
#filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px}
button{background:var(--card);color:var(--txt);border:1px solid #2c303a;border-radius:10px;padding:9px 14px;font-size:.9rem;cursor:pointer}
button:hover{border-color:var(--ac)}
button.on{background:var(--ac);border-color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
label{font-size:.85rem;display:flex;gap:8px;align-items:center}
input[type=range]{accent-color:var(--ac)}
</style>
</head>
<body>
<h1>📷 Filtros Webcam</h1>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="msg">Pulsa «Iniciar cámara» y permite el acceso.</div>
</div>
<div id="filters"></div>
<div class="row">
  <label>Intensidad <input type="range" id="k" min="0" max="100" value="100"></label>
  <button id="start">▶ Iniciar cámara</button>
  <button id="mirror" class="on">↔ Espejo</button>
  <button id="flip">🔄 Cambiar cámara</button>
  <button id="snap">📸 Foto</button>
</div>
<video id="v" playsinline muted hidden></video>

<script>
const v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d',{willReadFrequently:true});
const msg=document.getElementById('msg');
let stream=null, filter='normal', mirror=true, facing='user', K=1, t=0;

const FILTERS={
  normal:'Normal', bn:'Blanco y negro', sepia:'Sepia', invertir:'Invertir', calido:'Cálido', frio:'Frío',
  pixel:'Pixelar', comic:'Cómic', termico:'Térmico', glitch:'Glitch', bordes:'Neón', matrix:'Matrix'
};
const fbox=document.getElementById('filters');
for(const [id,name] of Object.entries(FILTERS)){
  const b=document.createElement('button'); b.textContent=name; b.dataset.id=id;
  if(id===filter)b.classList.add('on');
  b.onclick=()=>{filter=id;[...fbox.children].forEach(x=>x.classList.toggle('on',x===b))};
  fbox.appendChild(b);
}
document.getElementById('k').oninput=e=>K=e.target.value/100;
document.getElementById('mirror').onclick=e=>{mirror=!mirror;e.target.classList.toggle('on',mirror)};
document.getElementById('start').onclick=start;
document.getElementById('flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};
document.getElementById('snap').onclick=()=>{
  const a=document.createElement('a'); a.download='foto-'+Date.now()+'.png'; a.href=c.toDataURL('image/png'); a.click();
};

async function start(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
    v.srcObject=stream; await v.play();
    msg.style.display='none';
    document.getElementById('start').textContent='⏹ Reiniciar cámara';
  }catch(e){
    msg.style.display='flex';
    msg.textContent='No se pudo acceder a la cámara ('+e.name+'). Abre el archivo desde http://localhost o https y permite el acceso.';
  }
}

// Mezcla filtrado/original según intensidad
function mix(o,f){return o+(f-o)*K}
const clamp=x=>x<0?0:x>255?255:x;

function frame(){
  requestAnimationFrame(frame);
  if(!stream||v.readyState<2) return;
  t++;
  const W=Math.min(v.videoWidth,720), H=Math.round(W*v.videoHeight/v.videoWidth);
  if(c.width!==W||c.height!==H){c.width=W;c.height=H}
  ctx.save();
  if(mirror){ctx.translate(W,0);ctx.scale(-1,1)}
  ctx.drawImage(v,0,0,W,H);
  ctx.restore();
  if(filter==='normal') return;

  if(filter==='pixel'){
    const s=Math.max(2,Math.round(4+K*28));
    const tmp=frame.tmp||(frame.tmp=document.createElement('canvas'));
    tmp.width=Math.ceil(W/s); tmp.height=Math.ceil(H/s);
    const tc=tmp.getContext('2d');
    tc.drawImage(c,0,0,tmp.width,tmp.height);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(tmp,0,0,tmp.width,tmp.height,0,0,tmp.width*s,tmp.height*s);
    return;
  }

  const img=ctx.getImageData(0,0,W,H), d=img.data;

  if(filter==='glitch'){
    const src=new Uint8ClampedArray(d);
    const off=Math.round(K*24)*4, rows=Math.round(K*3);
    for(let y=0;y<H;y++){
      const jit=(Math.random()<0.02*K)?Math.round((Math.random()-.5)*60)*4:0;
      for(let x=0;x<W;x++){
        const i=(y*W+x)*4;
        const ir=Math.min(Math.max(i+off+jit,0),d.length-4);
        const ib=Math.min(Math.max(i-off+jit,0),d.length-4);
        d[i]=src[ir]; d[i+2]=src[ib+2];
      }
    }
    ctx.putImageData(img,0,0); return;
  }

  if(filter==='bordes'){
    const g=new Float32Array(W*H);
    for(let i=0,p=0;p<g.length;i+=4,p++) g[p]=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
      const p=y*W+x;
      const gx=-g[p-W-1]-2*g[p-1]-g[p+W-1]+g[p-W+1]+2*g[p+1]+g[p+W+1];
      const gy=-g[p-W-1]-2*g[p-W]-g[p-W+1]+g[p+W-1]+2*g[p+W]+g[p+W+1];
      const m=Math.min(255,Math.sqrt(gx*gx+gy*gy)*1.5), i=p*4;
      const hue=(t*2+x*.3)%360, [r,gg,b]=hsl(hue);
      d[i]=mix(d[i],m*r/255);d[i+1]=mix(d[i+1],m*gg/255);d[i+2]=mix(d[i+2],m*b/255);
    }
    ctx.putImageData(img,0,0); return;
  }

  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2],l=.299*r+.587*g+.114*b;
    let R=r,G=g,B=b;
    switch(filter){
      case 'bn': R=G=B=l; break;
      case 'sepia': R=.393*r+.769*g+.189*b; G=.349*r+.686*g+.168*b; B=.272*r+.534*g+.131*b; break;
      case 'invertir': R=255-r;G=255-g;B=255-b; break;
      case 'calido': R=r*1.2+10;G=g*1.05;B=b*.8; break;
      case 'frio': R=r*.85;G=g*1.0;B=b*1.25+10; break;
      case 'comic': {
        const q=v=>Math.round(v/64)*64; const c2=v=>(v-128)*1.3+128;
        R=q(c2(r));G=q(c2(g));B=q(c2(b)); break;
      }
      case 'termico': {
        const n=l/255;
        R=255*Math.min(1,Math.max(0,n*3-1)); G=255*Math.min(1,Math.max(0,n<.5?n*2:2-n*2)); B=255*Math.min(1,Math.max(0,1.5-n*3)); break;
      }
      case 'matrix': R=l*.1; G=l*1.3; B=l*.2; break;
    }
    d[i]=clamp(mix(r,R)); d[i+1]=clamp(mix(g,G)); d[i+2]=clamp(mix(b,B));
  }
  ctx.putImageData(img,0,0);
}

function hsl(h){
  const a=h/60,x=1-Math.abs(a%2-1);let r=0,g=0,b=0;
  if(a<1)[r,g,b]=[1,x,0];else if(a<2)[r,g,b]=[x,1,0];else if(a<3)[r,g,b]=[0,1,x];
  else if(a<4)[r,g,b]=[0,x,1];else if(a<5)[r,g,b]=[x,0,1];else[r,g,b]=[1,0,x];
  return [r*255,g*255,b*255];
}
frame();
</script>
</body>
</html>
