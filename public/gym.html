
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceae4">
<title>Guía de máquinas</title>
<style>
:root{
 --bg:#eceae4;--card:#fbfaf6;--ink:#1c1e20;--mut:#5d6468;
 --line:#1c1e20;--bad:#c9372c;--ok:#18864d;--soft:#dcd9d0;
 box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);
 padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--bg:#17191b;--card:#222527;--ink:#f1efe8;--mut:#a3abb0;--line:#f1efe8;--bad:#ff7a6e;--ok:#4fd18b;--soft:#33373a}
}
:root[data-theme="dark"]{--bg:#17191b;--card:#222527;--ink:#f1efe8;--mut:#a3abb0;--line:#f1efe8;--bad:#ff7a6e;--ok:#4fd18b;--soft:#33373a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:"Arial Black",Impact,system-ui,sans-serif;line-height:1.05;margin:0}
h1{font-size:clamp(34px,11vw,52px);margin:8px 0}
h2{font-size:clamp(28px,9vw,40px);margin:8px 0 6px}
h3{font-size:19px;margin:22px 0 8px}
p{margin:0 0 12px}
.mut{color:var(--mut);font-size:15px}
.back{background:none;border:0;color:var(--mut);font:inherit;font-size:15px;padding:8px 0;cursor:pointer;text-decoration:underline}
.search{width:100%;padding:13px 15px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:15px 0 8px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}
.filter{border:2px solid var(--line);border-radius:30px;padding:7px 12px;background:var(--card);color:var(--ink);font:700 13px system-ui;cursor:pointer}
.filter.active{background:var(--ink);color:var(--bg)}
.mc{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px;margin:12px 0;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;box-shadow:5px 5px 0 var(--line)}
.mc:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.mc svg{flex:none;width:92px;height:72px;border-radius:8px;background:var(--soft)}
.mc b{display:block;font-family:"Arial Black",Impact,sans-serif;font-size:19px;line-height:1.1}
.mc span{font-size:14px;color:var(--mut)}
.mc .category{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.fig{background:var(--soft);border:3px solid var(--line);border-radius:14px;padding:6px;margin:12px 0}
.fig svg{display:block;width:100%;height:auto;max-height:230px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:4px 12px;border-radius:99px;border:2px solid var(--line);font-size:14px;font-weight:700;background:var(--mcol);color:#14161a}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft)}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;border:3px solid var(--line);background:var(--mcol);color:#14161a;font:900 15px/26px "Arial Black",sans-serif;text-align:center}
.steps b{display:block}
.err{list-style:none;padding:0;margin:0}
.err li{padding:10px 12px;margin:8px 0;border-left:6px solid var(--bad);background:var(--card);border-radius:0 10px 10px 0}
.err b{color:var(--bad)}
.ok{border-left-color:var(--ok)!important}.ok b{color:var(--ok)!important}
.box{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.warn{font-size:14px;color:var(--mut);border-top:2px dashed var(--soft);padding-top:12px;margin-top:24px}
.tag{display:inline-block;background:var(--soft);padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;margin:0 4px 4px 0}
.empty{text-align:center;color:var(--mut);padding:25px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* Esquemas ilustrativos: no representan las dimensiones exactas de cada máquina. */

{
 id:'prensa',name:'Prensa de piernas',cat:'Piernas',col:'#3a7bff',

 ['Regula el asiento','Colócate de forma que puedas bajar la plataforma sin que la pelvis se levante ni la espalda baja se redondee.'],
 ['Coloca los pies','Aproximadamente a la anchura de los hombros, en una posición cómoda y con las puntas ligeramente hacia fuera.'],
 ['Apoya la espalda','Mantén la espalda y la pelvis en contacto con el respaldo durante el ejercicio.'],

 ],

 ],
 como:['Extiende las rodillas de forma controlada.','Evita dar impulso con el tronco.','Haz una pequeña pausa arriba si te resulta cómodo.','Baja lentamente sin dejar caer el peso.','Mantén la espalda apoyada.'],
 errores:['Utilizar demasiado peso.','Dar patadas o impulsos bruscos.','Bloquear las rodillas con fuerza.','Colocar el rodillo sobre el pie en lugar de la espinilla.'],

},

 ],

 ajustes:[

 ],

 errores:['Separar la espalda del respaldo.','Bajar demasiado y forzar los hombros.','Doblar las muñecas.','Rebotar al regresar.','Usar un peso que impida controlar el movimiento.'],

},

 ],
 como:['Lleva los codos hacia atrás, cerca del cuerpo.','Acerca las empuñaduras hacia el abdomen.','Junta suavemente los omóplatos al final.','Regresa despacio, dejando que los brazos se estiren.','Evita mover el tronco para conseguir impulso.'],
 errores:['Redondear la espalda.','Echar el cuerpo hacia atrás para tirar.','Encoger los hombros.','Tirar solo con las manos.','Utilizar demasiado peso.'],
 serie:'3 series de 10 a 12 repeticiones. Descansa 60-90 segundos.'
},
{
 id:'contractora',name:'Contractora de pecho',cat:'Pecho',col:'#e58bba',
 sub:'Aísla principalmente los pectorales',
 muscles:['Pectoral mayor','Deltoides anterior (ayuda)'],
 ajustes:[
 ['Regula el asiento','Ajusta la altura para que los brazos queden aproximadamente a la altura del pecho.'],
 ['Ajusta los brazos','Si tiene regulación, evita empezar con los codos demasiado retrasados.'],
 ['Apoya la espalda','Mantén la espalda en contacto con el respaldo.'],

 ],
 como:['Acerca los brazos delante del pecho.','Haz el movimiento sin golpear las almohadillas.','Aprieta suavemente el pecho al juntar los brazos.','Abre lentamente hasta una posición cómoda.','Mantén los hombros bajos.'],

},
{
 id:'abductores',name:'Abductores',cat:'Piernas',col:'#9b83e8',
 sub:'Parte externa de la cadera y glúteos',
 muscles:['Glúteo medio','Glúteo menor','Abductores de cadera'],
 ajustes:[
 ['Regula el asiento','Siéntate con la espalda apoyada y la pelvis estable.'],
 ['Coloca las piernas','Apoya la parte externa de las rodillas o los muslos contra las almohadillas.'],
 ['Elige la posición inicial','Empieza con las piernas juntas o ligeramente separadas, según tu comodidad.'],
 ['Ajusta el peso','Empieza con poca carga para aprender a controlar el movimiento.']
 ],

 errores:['Impulsar las piernas con golpes.','Inclinarse hacia delante para mover más peso.','Abrir más de lo que permite la movilidad de la cadera.','Dejar que las piernas se cierren de golpe.'],
 serie:'2-3 series de 12 a 15 repeticiones. Descansa 60 segundos.'
},
{

 ['Coloca los pies','Apoya la parte delantera de los pies en la plataforma, dejando libres los talones si el diseño lo permite.'],
 ['Ajusta el apoyo','El soporte debe sujetarte sin comprimir el cuello ni los hombros.'],

 ],
 como:['Eleva los talones empujando con la parte delantera de los pies.','Sube hasta una altura cómoda.','Baja lentamente los talones.','Evita rebotar en la parte inferior.','Mantén las rodillas en una posición estable.'],
 errores:['Hacer rebotes rápidos.','Utilizar demasiado peso.','Hacer repeticiones muy cortas.','Dejar que los tobillos se inclinen hacia dentro o fuera.'],
 serie:'3 series de 12 a 15 repeticiones. Descansa 60 segundos.'
},
{
 id:'crunch',name:'Abdominales en máquina',cat:'Abdomen',col:'#d8a34e',
 sub:'Trabajo de la musculatura abdominal',
 muscles:['Recto abdominal','Oblicuos (ayudan)'],
 ajustes:[
 ['Regula el asiento','Colócate de forma que el eje o las almohadillas queden en la posición indicada por la máquina.'],
 ['Ajusta los apoyos','Las almohadillas deben apoyar cómodamente sobre el pecho o los hombros, según el modelo.'],
 ['Sujeta las asas','Mantén un agarre cómodo sin tirar del cuello.'],

 ],

}
];

var app=document.getElementById('app');
var currentFilter='Todas';
var searchText='';

function esc(t){
 return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* Ilustración esquemática genérica de una máquina de gimnasio. */
function drawing(m){
 var accent=m.col;
 var shapes={
  prensa:'<path d="M55 145 L90 65 L170 65 L220 145"/><path d="M90 65 L90 35 L210 35"/><path d="M175 35 L245 35 L245 55"/><path d="M210 55 L245 55"/>',
  jalon:'<path d="M70 155 L70 25 L220 25 L220 155"/><path d="M145 25 V65"/><path d="M95 65 H195"/><path d="M110 65 L110 85 M180 65 L180 85"/>',
  extension:'<path d="M75 145 L75 55 L145 55 L180 100 L225 100"/><path d="M145 55 L145 25"/><path d="M225 100 L225 145"/><path d="M75 145 H235"/>',
  curl:'<path d="M70 145 L70 45 L145 45 L180 95 L225 95"/><path d="M145 45 L145 25"/><path d="M225 95 L225 145"/><path d="M70 145 H235"/>',
  chest:'<path d="M75 145 V45 H225 V145"/><path d="M110 45 V95 L80 110"/><path d="M190 45 V95 L220 110"/><path d="M80 110 L80 145 M220 110 L220 145"/>',
  remo:'<path d="M55 145 H245"/><path d="M80 145 L95 55 L205 55 L220 145"/><path d="M95 85 H205"/><path d="M150 85 V115"/><path d="M115 115 H185"/>',
  contractora:'<path d="M75 145 V45 H225 V145"/><path d="M150 45 V95"/><path d="M150 95 L95 65 L80 95"/><path d="M150 95 L205 65 L220 95"/>',
  abductores:'<path d="M75 145 V55 H225 V145"/><path d="M150 55 V95"/><path d="M150 95 L90 120"/><path d="M150 95 L210 120"/><path d="M90 120 L75 145 M210 120 L225 145"/>',
  gemelos:'<path d="M60 145 H240"/><path d="M95 145 L115 55 L185 55 L205 145"/><path d="M115 55 L150 25 L185 55"/><path d="M100 110 H200"/>',
  crunch:'<path d="M75 145 V45 H225 V145"/><path d="M100 55 L150 100 L200 55"/><path d="M150 100 V135"/><path d="M100 135 H200"/>'
 };
 return '<svg viewBox="0 0 300 180" role="img" aria-label="Esquema ilustrativo de '+esc(m.name)+'"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".8"><path d="M20 155 H280" stroke-width="4" opacity=".3"/>'+shapes[m.id]+'</g><circle cx="150" cy="15" r="8" fill="'+accent+'"/><path d="M150 25 V55" stroke="'+accent+'" stroke-width="7" stroke-linecap="round"/><path d="M135 75 H165" stroke="'+accent+'" stroke-width="7" stroke-linecap="round"/><text x="150" y="174" text-anchor="middle" font-size="11" fill="currentColor" opacity=".65">ESQUEMA ORIENTATIVO</text></svg>';
}

function home(){
 document.title='Guía de máquinas';
 var categories=['Todas'].concat([...new Set(M.map(function(m){return m.cat}))]);
 var filtered=M.filter(function(m){
  var matchCat=currentFilter==='Todas'||m.cat===currentFilter;
  var matchText=(m.name+' '+m.sub+' '+m.muscles.join(' ')).toLowerCase().includes(searchText.toLowerCase());
  return matchCat&&matchText;
 });
 app.innerHTML=
 '<h1>Guía de máquinas</h1>'+
 '<p>Aprende a regular las máquinas del gimnasio, colocarte correctamente y entrenar con control.</p>'+
 '<div class="box"><b>'+M.length+' máquinas disponibles</b><p class="mut" style="margin:4px 0 0">Selecciona una máquina para consultar sus instrucciones.</p></div>'+
 '<input class="search" id="search" type="search" placeholder="Buscar máquina o músculo..." value="'+esc(searchText)+'">'+
 '<div class="filters">'+categories.map(function(c){return '<button class="filter '+(currentFilter===c?'active':'')+'" data-filter="'+esc(c)+'">'+esc(c)+'</button>'}).join('')+'</div>'+
 (filtered.length?filtered.map(function(m){
  return '<button class="mc" style="--mcol:'+m.col+'" data-id="'+m.id+'">'+drawing(m)+
  '<span><span class="category">'+esc(m.cat)+'</span><b>'+esc(m.name)+'</b><span>'+esc(m.sub)+'</span></span></button>';
 }).join(''):'<div class="empty">No se han encontrado máquinas.</div>')+
 '<p class="warn">Empieza con poco peso y aprende primero el movimiento. Si notas dolor agudo, mareo o molestias importantes, detén el ejercicio. Ante dudas, pide a un profesional que te enseñe a regular la máquina.</p>';
 var input=document.getElementById('search');
 input.addEventListener('input',function(){
  searchText=this.value;
  var pos=this.selectionStart;
  home();
  var next=document.getElementById('search');
  next.focus();
  next.setSelectionRange(pos,pos);
 });
 window.scrollTo(0,0);
}

function detail(id){
 var m=M.find(function(x){return x.id===id});
 if(!m)return home();
 document.title=m.name+' · Guía de máquinas';
 app.innerHTML=
 '<button class="back" data-id="">← Todas las máquinas</button>'+
 '<div style="--mcol:'+m.col+'">'+
 '<span class="tag">'+esc(m.cat)+'</span>'+
 '<h2>'+esc(m.name)+'</h2>'+
 '<p class="mut">'+esc(m.sub)+'</p>'+
 '<div class="fig" style="color:var(--ink)">'+drawing(m)+'</div>'+
 '<p class="mut" style="font-size:13px">Esquema ilustrativo. La forma y los ajustes pueden variar según el modelo de máquina.</p>'+
 '<div class="chips">'+m.muscles.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join('')+'</div>'+
 '<h3>Antes de empezar</h3>'+
 '<ol class="steps">'+m.ajustes.map(function(a){return '<li><div><b>'+esc(a[0])+'</b>'+esc(a[1])+'</div></li>'}).join('')+'</ol>'+
 '<h3>Cómo hacerlo bien</h3>'+
 '<ul class="err">'+m.como.map(function(x){return '<li class="ok"><b>✓</b> '+esc(x)+'</li>'}).join('')+'</ul>'+
 '<h3>Errores frecuentes</h3>'+
 '<ul class="err">'+m.errores.map(function(x){return '<li><b>✗</b> '+esc(x)+'</li>'}).join('')+'</ul>'+
 '<div class="box"><b>Para empezar</b><br>'+esc(m.serie)+'</div>'+
 '<p class="warn">Las series y repeticiones son orientativas, no una obligación. Ajusta el peso para poder completar el movimiento con buena técnica y sin dolor. Si tienes alguna lesión o una limitación física, consulta con un profesional antes de realizar el ejercicio.</p>'+
 '</div>';
 window.scrollTo(0,0);
}

app.addEventListener('click',function(e){
 var filter=e.target.closest('[data-filter]');
 if(filter){
  currentFilter=filter.getAttribute('data-filter');
  home();
  return;
 }
 var b=e.target.closest('[data-id]');
 if(!b)return;
 var id=b.getAttribute('data-id');
 if(id)location.hash=id;
 else{
  history.replaceState(null,'',location.pathname+location.search);
  searchText='';
  currentFilter='Todas';
  home();
 }
});

window.addEventListener('hashchange',function(){
 var id=location.hash.replace('#','');
 if(id)detail(id);else home();
});
if(location.hash)detail(location.hash.replace('#',''));else home();
