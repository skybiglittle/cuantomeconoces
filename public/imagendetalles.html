//HAY QUE MEJORARLO PARA AÑADIR MAS IMAGENES AHORA SOLO HAY TRES
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memoria Visual — CuántoMeConoces</title>
<style>
:root{--bg:#080b14;--card:#111827;--card2:#172033;--text:#f5f7fb;--muted:#9ca8bd;--accent:#7c5cff;--ok:#35d07f;--bad:#ff5577}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top,#1b2340,#080b14 55%);
  color:var(--text);
  font-family:Inter,system-ui,Arial,sans-serif;
  min-height:100vh
}
button,input{font:inherit}
.wrap{width:min(920px,94%);margin:auto;padding:20px 0 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-weight:900}
.back{color:var(--muted);text-decoration:none}
.card{
  background:rgba(17,24,39,.94);
  border:1px solid #27334a;
  border-radius:24px;
  padding:26px;
  box-shadow:0 18px 50px #0005;
  margin:16px 0
}
.center{text-align:center}
.emoji{font-size:60px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
h1{font-size:clamp(2rem,7vw,4rem);margin:8px 0}
h2{font-size:1.6rem}

.btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:16px;
  margin-top:14px;
  background:var(--accent);
  color:white;
  font-weight:800;
  cursor:pointer
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#26334c}

.stats{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap
}
.pill{
  padding:8px 12px;
  border-radius:999px;
  background:#202b40;
  color:#dce3f2
}

.scene-wrap{
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:#dfe8f2;
  margin:16px auto;
  max-width:760px
}

.scene{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  object-fit:cover
}

.timer{
  font-size:1.4rem;
  font-weight:900;
  margin:10px
}

.bar{
  height:9px;
  background:#27334a;
  border-radius:99px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:var(--accent);
  width:100%;
  transition:width .1s linear
}

.question{
  font-size:1.35rem;
  font-weight:800;
  margin:12px 0 20px
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.answer{
  border:1px solid #33415d;
  background:#1a2539;
  color:white;
  padding:15px;
  border-radius:15px;
  cursor:pointer;
  font-weight:700
}

.answer:hover{background:#263550}

.answer.correct{
  background:#145c3b;
  border-color:var(--ok)
}

.answer.wrong{
  background:#65223a;
  border-color:var(--bad)
}

.answer:disabled{cursor:default}

.feedback{
  padding:15px;
  border-radius:15px;
  margin-top:15px
}

.good{background:#113c2b}
.bad{background:#4b1d2e}
.hidden{display:none!important}

@media(max-width:600px){
  .card{padding:18px}
  .answers{grid-template-columns:1fr}
  .wrap{padding-top:12px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="brand">🧠 CuántoMeConoces</div>
    <a class="back" href="#">← Juegos</a>
  </div>

  <main id="app"></main>

</div>

<script>

const app=document.getElementById('app');

const rounds=[

{
  image:"https://images.unsplash.com/photo-1715765036065-32539cf43710?fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-4.0.3&q=80&w=1600",
  q:"¿De qué color era la camiseta de la mujer sentada en el picnic?",
  a:["Roja","Azul","Verde","Amarilla"],
  correct:0
},

{
  image:"https://media.estatesit.uk/data/SEYMOURGREEN/PHOTOS/seymo-001868-p-w-79u13uu4n.jpg",
  q:"¿Qué color tenía el horno de la cocina?",
  a:["Negro","Blanco","Rojo","Azul"],
  correct:0
},

{
  image:"https://images.squarespace-cdn.com/content/v1/60c031c765d57a47e1eed764/6a1d82e4-f247-413a-9e8d-a09c45d45ece/Shop%2BIn%2BEthnic%2BGrocery%2BStores.jpg?format=1500w",
  q:"¿Qué tipo de alimentos destacaban en los puestos del mercado?",
  a:["Frutas y verduras","Pan y dulces","Pescado","Carne"],
  correct:0
}

];

let index=0;
let score=0;
let timer=null;

function renderStart(){

 app.innerHTML=`

 <section class="card center">

   <div class="emoji">👀</div>

   <h1>MEMORIA VISUAL</h1>

   <p class="muted">
     Mira una fotografía real con atención.
     Solo tendrás unos segundos para memorizar
     los detalles. Después desaparecerá y tendrás
     que responder una pregunta.
   </p>

   <div class="stats">

     <span class="pill">
       🖼️ ${rounds.length} rondas
     </span>

     <span class="pill">
       ⏱️ 7 segundos
     </span>

     <span class="pill">
       🏆 1 punto por acierto
     </span>

   </div>

   <button class="btn" id="start">
     🎬 Empezar
   </button>

 </section>

 `;

 document.getElementById('start').onclick=()=>{

   index=0;
   score=0;

   showRound();

 };

}


function showRound(){

 const r=rounds[index];

 app.innerHTML=`

 <section class="card center">

   <div class="stats">

     <span class="pill">
       Ronda ${index+1}/${rounds.length}
     </span>

     <span class="pill">
       🏆 ${score} puntos
     </span>

   </div>

   <h2>
     👀 ¡Mira todos los detalles!
   </h2>

   <div class="scene-wrap">

     <img
       class="scene"
       src="${r.image}"
       alt="Imagen de la ronda"
       loading="eager"
     >

   </div>

   <div class="timer" id="timer">
     7.0 s
   </div>

   <div class="bar">
     <i id="bar"></i>
   </div>

   <p class="muted small">
     Fíjate en colores, objetos, personas,
     posiciones y pequeños detalles.
   </p>

 </section>

 `;

 let left=7000;
 let start=performance.now();

 function tick(now){

   left=7000-(now-start);

   if(left<=0){

     clearInterval(timer);

     ask();

     return;

   }

   const t=document.getElementById('timer');
   const bar=document.getElementById('bar');

   if(t)
     t.textContent=(left/1000).toFixed(1)+' s';

   if(bar)
     bar.style.width=(left/7000*100)+'%';

 }

 timer=setInterval(
   ()=>tick(performance.now()),
   50
 );

}


function ask(){

 const r=rounds[index];

 app.innerHTML=`

 <section class="card center">

   <div class="stats">

     <span class="pill">
       Ronda ${index+1}/${rounds.length}
     </span>

     <span class="pill">
       🏆 ${score} puntos
     </span>

   </div>

   <div class="emoji">
     🧠
   </div>

   <h2>
     ¡A ver qué recuerdas!
   </h2>

   <div class="question">
     ${r.q}
   </div>

   <div class="answers">

     ${r.a.map((x,i)=>`

       <button
         class="answer"
         data-i="${i}"
       >
         ${x}
       </button>

     `).join('')}

   </div>

   <div id="feedback"></div>

 </section>

 `;

 document
   .querySelectorAll('.answer')
   .forEach(
     b=>b.onclick=
       ()=>answer(Number(b.dataset.i))
   );

}


function answer(i){

 const r=rounds[index];

 const buttons=[
   ...document.querySelectorAll('.answer')
 ];

 buttons.forEach(
   b=>b.disabled=true
 );

 buttons[r.correct]
   .classList
   .add('correct');

 const ok=i===r.correct;

 if(ok)
   score++;

 if(!ok)
   buttons[i].classList.add('wrong');

 document.getElementById('feedback').innerHTML=`

   <div class="feedback ${ok?'good':'bad'}">

     ${
       ok
       ? '✅ ¡Correcto!'
       : '❌ Incorrecto.'
     }

     ${
       ok
       ? ''
       : 'La respuesta era <b>'+
         r.a[r.correct]+
         '</b>.'
     }

   </div>

   <button class="btn" id="next">

     ${
       index===rounds.length-1
       ? '🏆 Ver resultado'
       : '➡️ Siguiente ronda'
     }

   </button>

 `;

 document.getElementById('next').onclick=()=>{

   index++;

   if(index<rounds.length)
     showRound();
   else
     finish();

 };

}


function finish(){

 const pct=
   Math.round(
     score/rounds.length*100
   );

 let msg=
   pct===100
   ? '¡Memoria de campeón! 🧠🔥'
   : pct>=66
   ? '¡Muy buena memoria! 👀👏'
   : pct>=33
   ? 'No está mal, pero hay que fijarse más 😄'
   : '¡Hay que entrenar esa memoria! 😂';

 app.innerHTML=`

 <section class="card center">

   <div class="emoji">
     🏆
   </div>

   <h1>
     Resultado
   </h1>

   <h2>
     ${score} / ${rounds.length}
   </h2>

   <p class="muted">
     ${msg}
   </p>

   <button class="btn" id="again">
     🔄 Jugar otra vez
   </button>

 </section>

 `;

 document.getElementById('again').onclick=()=>{

   index=0;
   score=0;

   showRound();

 };

}


renderStart();

</script>

</body>
</html>
