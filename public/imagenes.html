<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Cuánto me conoces?</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#2a2230;--mut:#7a7083;--ac:#e0457b;--ac2:#7c4dff;--ok:#1f9d63;--ko:#d6453d;--bd:#eadfe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131c;--card:#221c2b;--tx:#f3eef7;--mut:#a99fb5;--bd:#352c40}}
:root[data-theme="dark"]{--bg:#17131c;--card:#221c2b;--tx:#f3eef7;--mut:#a99fb5;--bd:#352c40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 8px;font-size:22px}
p{margin:0 0 12px}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin:14px 0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .25s}
.kick{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:4px}
.q{font-size:21px;font-weight:650;line-height:1.3;margin:0 0 16px}
.who{font-size:14px;color:var(--mut);margin-bottom:10px}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx)}
.opt:active,.opt:hover{border-color:var(--ac)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:700;margin-top:10px}
.btn[disabled]{opacity:.45}
.btn.sec{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;padding:0;font-size:14px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:6px 0 10px}
.big{font-size:64px;font-weight:800;text-align:center;line-height:1;margin:6px 0}
.center{text-align:center}
.score{display:flex;gap:10px}
.score div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.score b{display:block;font-size:26px}
ul{list-style:none;padding:0;margin:0}
li{padding:10px 12px;border-radius:12px;margin:8px 0;border:1px solid var(--bd);background:var(--card);font-size:15px}
li.ok{border-left:5px solid var(--ok)}
li.ko{border-left:5px solid var(--ko)}
li small{display:block;color:var(--mut)}
/* ---------- Animaciones ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:var(--from,0%)}}
@keyframes pop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{to{background-position:200% 0}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#app>*:not(.top):not(.bar):not(h1){animation:rise .4s ease both}
#app>*:nth-child(3){animation-delay:.05s}
#app>*:nth-child(4){animation-delay:.1s}
#app>*:nth-child(5){animation-delay:.15s}
#app>h1{background-size:200% 100%;animation:rise .4s ease both,shimmer 6s linear infinite}
.card>.opt{animation:rise .4s ease both;animation-delay:var(--d,0ms)}
.opt{transition:transform .15s,border-color .15s,background .15s}
.opt:hover{transform:translateX(3px)}
.opt.picked{transform:scale(.97);border-color:var(--ac);background:rgba(224,69,123,.12);font-weight:700}
.btn{transition:transform .15s,box-shadow .15s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(124,77,255,.28)}
.btn:active{transform:scale(.98)}
.big{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
li{animation:rise .4s ease both;animation-delay:var(--d,0ms)}
.bar i{animation:fill .35s ease both}
.dots i{display:inline-block;width:6px;height:6px;margin-left:5px;border-radius:50%;background:var(--ac);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear both}
.chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bd);color:#fff}
.chip.new{animation:pop .3s both}
.chip.me{outline:2px solid var(--tx)}
#app.still *{animation:none!important}
#app.still .chip.new,#app.still .pill.new{animation:pop .35s both!important}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(224,69,123,.55)}100%{box-shadow:0 0 0 14px rgba(224,69,123,0)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes boom{0%{transform:scale(1)}40%{transform:scale(1.05);box-shadow:0 0 0 8px rgba(31,157,99,.25)}100%{transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes floatup{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-62vh) translateX(var(--sx)) scale(1.25)}}
@keyframes gleam{to{background-position:200% 0}}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font:700 12px/1 system-ui;font-style:normal;margin-right:8px;flex:none}
.av.big{width:48px;height:48px;font-size:20px;margin:0;animation:ring 1.6s infinite}
.spot{display:flex;align-items:center;gap:14px;padding:14px 18px}
.pl{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;padding:4px 12px 4px 4px;border:1px solid var(--bd);border-radius:99px;font-size:14px}
.pill.new{animation:pop .35s both}
.pill .av{width:22px;height:22px;font-size:11px;margin-right:6px}
.seg{display:flex;gap:8px;margin-top:6px}
.seg button{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx)}
.seg button.on{border-color:var(--ac);background:rgba(224,69,123,.12);font-weight:700}
.tbar{height:7px;border-radius:7px;background:var(--bd);overflow:hidden;margin:4px 0 10px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#1f9d63,#ffb020);transition:width .25s linear}
.tbar.hot i{background:var(--ko)}
.gold{text-align:center;font-weight:700;padding:6px;border-radius:12px;color:#7a5200;background:linear-gradient(90deg,#ffe08a,#fff3c4,#ffe08a);background-size:200% 100%;animation:gleam 3s linear infinite;margin-top:10px}
.card.goldc{border-color:#e8b923;box-shadow:0 0 0 2px rgba(232,185,35,.25)}
.pts{font-size:54px;font-weight:800;text-align:center;line-height:1;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both;margin-top:6px}
.pts.up{color:var(--ok)}.pts.dn{color:var(--ko)}
.rxs{display:flex;justify-content:center;gap:8px;margin:12px 0}
.rxs button{font-size:22px;padding:6px 12px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);transition:transform .12s}
.rxs button:active{transform:scale(1.35)}
.card>.opt.right{animation:boom .7s ease both}
.card>.opt.wrong{border-color:var(--ko);background:rgba(214,69,61,.1);animation:shake .5s both}
.card.shake{animation:shake .5s both}
li.rk{display:flex;justify-content:space-between;align-items:center}
li.rk span:first-child{display:flex;align-items:center}
li.rk .sc{font-weight:800;font-size:18px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:14px}
.pod{flex:1;max-width:120px;text-align:center;font-size:14px}
.pod span{display:block;color:var(--mut)}
.pod .blk{height:var(--h);margin-top:6px;border-radius:12px 12px 0 0;background:linear-gradient(180deg,var(--ac),var(--ac2));transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:var(--d);display:flex;justify-content:center;padding-top:8px;font-size:28px}
.qm{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:70}
.qm .card{max-width:520px;width:100%;margin:8px 0}
.qm textarea{width:100%;min-height:70px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:6px 0 10px}
.fe{position:fixed;bottom:12px;font-size:36px;pointer-events:none;z-index:60;text-align:center;animation:floatup 2.5s ease-out forwards}
.fe small{display:block;font-size:11px;background:var(--card);color:var(--tx);border-radius:8px;padding:0 6px;margin-top:2px}
.opt.mine{border-color:var(--ac);background:rgba(224,69,123,.1)}
.opt.right{border-color:var(--ok);background:rgba(31,157,99,.14)}
.seg.tabs{margin:10px 0 0}
.seg.tabs button{font-weight:600;padding:12px 4px;font-size:14px}
.eds label{display:block;margin-top:10px;font-size:14px}
.eds li .seg{margin-top:8px}
.eds li .seg button{padding:6px;font-size:13px}
.or{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 4px}
.combo{text-align:center;font-weight:700;color:var(--ac);margin-top:8px;animation:pop .4s both}
.vo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between}
.vo .chips{width:100%}
.vrow{display:flex;align-items:center}
.vc{font-weight:800;color:var(--ac)}
.qm select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:6px 0 10px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dg .opt{padding:8px;text-align:center;margin:0}.dg .opt[disabled]{opacity:.45}.dcv{width:100%;max-width:260px;aspect-ratio:1;border-radius:10px;background:#fff;display:block;margin:0 auto 6px;touch-action:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"><div class="card"><p class="mut" style="margin:0">Cargando preguntas…</p></div></main>
<script>
// ---------- Banco de preguntas (generado de forma determinista) ----------
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
var QN=[],QD=[],QG=[];
var PROB=['se quede dormido/a en el cine', 'llegue tarde a su propia boda', 'se pierda con el GPS puesto', 'gane un concurso de baile', 'se ría en un momento serio', 'olvide su propio cumpleaños', 'sobreviva en una isla desierta', 'acabe siendo famoso/a', 'se coma el último trozo de pizza sin avisar', 'hable solo/a por la calle', 'pierda las llaves esta semana', 'llore con un anuncio', 'monte una empresa absurda', 'le cante en público a alguien', 'se haga amigo/a de un desconocido en el autobús', 'acabe viviendo en otro país', 'gaste una broma pesada', 'tenga una mascota rarísima', 'gane la lotería y lo pierda todo', 'se apunte a un plan sin saber de qué va', 'mande un mensaje a la persona equivocada', 'se duerma en una videollamada', 'hable con su mascota como si fuera una persona', 'aguante más tiempo sin móvil', 'cocine mejor que un chef', 'se tropiece en una entrada triunfal', 'haga la mejor imitación', 'organice un viaje sin planificar nada', 'sea el último en irse de la fiesta', 'se haga un tatuaje absurdo', 'llegue el primero a todo', 'cuente el mismo chiste cinco veces', 'haga trampas en un juego de mesa', 'aprenda un idioma rarísimo', 'se quede encerrado/a en un ascensor', 'se enamore en un viaje', 'salve el día en una emergencia', 'acabe con un disfraz en un día normal', 'compre algo inútil por impulso', 'diga una frase que se haga viral'];
var TAB='grupo';
var QS=QN,ROUNDS=Math.floor(QN.length/10),MODE='normal';
function modeName(m){return m==='profundo'?'Profundo':m==='gracioso'?'Gracioso':'Clásico'}
function setMode(m){MODE=m;QS=m==='profundo'?QD:m==='gracioso'?QG:QN;ROUNDS=Math.floor(QS.length/10)}

// ---------- Estado ----------
var S=null,app=document.getElementById('app');
function KEY(m){return m==='profundo'?'cuanto-me-conoces-v1-profundo':m==='gracioso'?'cuanto-me-conoces-v1-gracioso':'cuanto-me-conoces-v1'}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(){try{localStorage.setItem(S.online?'cmc-online':S.remote?'cmc-remote':KEY(S.mode),JSON.stringify(S))}catch(e){}}
function load(m){try{return JSON.parse(localStorage.getItem(KEY(m)))}catch(e){return null}}
function ids(){return S.order.slice(S.round*10,S.round*10+10)}
function ans(){return S.round%2}
function gue(){return 1-S.round%2}
function nm(i){return esc(S.names[i])}
function pct(i){return S.played[i]?Math.round(S.scores[i]/S.played[i]*100):0}

function board(){
  return '<div class="score"><div><span class="mut">'+nm(0)+'</span><b>'+S.scores[0]+'</b><span class="mut">'+pct(0)+'% aciertos</span></div><div><span class="mut">'+nm(1)+'</span><b>'+S.scores[1]+'</b><span class="mut">'+pct(1)+'% aciertos</span></div></div>';
}
function head(){
  return '<div class="top"><span>Ronda '+(S.round+1)+' de '+ROUNDS+'</span><button class="link" data-a="end">Terminar</button></div>';
}

// ---------- Online (sala con código, sin apps extra) ----------
var RM=null,NR=null,OMSG='';
function makeWsRoom(){
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
  return {join:function(name){return new Promise(function(resolve,reject){
    var ws=null,id=null,pres={},arr=[],subs=[],done=false,closed=false,retry=0,cid=Math.random().toString(36).slice(2);
    var room={
      peers:function(){return arr},
      onPeers:function(fn){subs.push(fn);return function(){subs=subs.filter(function(x){return x!==fn})}},
      presence:function(p){Object.keys(p).forEach(function(k){if(p[k]===null)delete pres[k];else pres[k]=p[k]});send({t:'pres',p:p});return Promise.resolve()},
      leave:function(){closed=true;try{ws.close()}catch(e){}return Promise.resolve()}
    };
    function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
    function open(){
      ws=new WebSocket(url);
      ws.onopen=function(){retry=0;send({t:'join',room:name,cid:cid});if(Object.keys(pres).length)send({t:'pres',p:pres})};
      ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
        if(m.t==='hello'){id=m.id}
        else if(m.t==='peers'){
          arr=m.peers.map(function(q){return{peer:q.id,isMe:q.id===id,sameTab:q.id===id,kind:'viewer',guest:false,by:null,presence:q.p||{},updatedAt:Date.now()}});
          if(!done){done=true;resolve(room)}
          subs.slice().forEach(function(f){f({peers:arr})});
        }
        else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}
      };
      ws.onclose=function(){if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
    }
    open();
    setTimeout(function(){if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},70000);
  })}};
}
RM=makeWsRoom();
function homeKeep(){var ids=['n0','n1','on','oc','rn','rc','gn','gc','dn','dc','tn','tc'],v=ids.map(function(i){var e=document.getElementById(i);return e?e.value:''});home();ids.forEach(function(i,k){var e=document.getElementById(i);if(e)e.value=v[k]})}
function loadOn(){try{return JSON.parse(localStorage.getItem('cmc-online'))}catch(e){return null}}
function mkOrder(seed){return shuffle(QS.map(function(_,i){return i}),rng(seed))}
function newCode(){var c='abcdefghjkmnpqrstuvwxyz23456789',s='';for(var i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function otherPeer(){if(!NR)return null;var ps=NR.peers();for(var i=0;i<ps.length;i++){var p=ps[i];if(!p.isMe&&p.kind==='viewer'&&p.presence&&p.presence.n)return p}return null}
function pub(){if(!NR||!S||!S.online)return;var p={n:S.names[S.online.me],h:S.online.me,rd:S.round,st:S.ost||'',g:S.gstr||null,res:S.res||null};if(S.online.me===0){p.m=S.mode;p.sd=S.online.seed}NR.presence(p).catch(function(){})}
function createRoom(){
  var n=(document.getElementById('on').value||'').trim()||'Jugador 1',seed=Math.floor(Math.random()*16777215)+1;
  S={mode:MODE,names:[n,'…'],order:mkOrder(seed),round:0,i:0,scores:[0,0],played:[0,0],answers:[],guesses:[],phase:'lobby',online:{code:newCode(),me:0,seed:seed}};
  enter();
}
function joinRoom(){
  var n=(document.getElementById('on').value||'').trim()||'Jugador 2',code=(document.getElementById('oc').value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!code){OMSG='Escribe el código de sala.';homeKeep();return}
  S={mode:MODE,names:['…',n],order:null,round:0,i:0,scores:[0,0],played:[0,0],answers:[],guesses:[],phase:'lobby',online:{code:code,me:1,seed:0}};
  enter();
}
function enter(){
  if(!RM){OMSG='Online no disponible en este navegador.';S=null;home();return}
  OMSG='';setPhase(S.phase||'lobby');
  RM.join('cmc-'+S.online.code).then(function(r){NR=r;NR.onPeers(syncOnline);pub();syncOnline()}).catch(function(e){OMSG='No se pudo entrar a la sala ('+((e&&e.code)||'error')+').';S=null;home()});
}
function syncOnline(){
  if(!S||!S.online||!NR)return;
  var me=S.online.me,o=otherPeer(),pr=o&&o.presence;
  if(pr&&pr.n)S.names[1-me]=String(pr.n).slice(0,20);
  if(S.phase==='lobby'){
    if(!pr)return;
    if(me===1){if(pr.h!==0||!pr.sd)return;if(!S.order){S.mode=(pr.m==='profundo'||pr.m==='gracioso')?pr.m:'normal';setMode(S.mode);S.online.seed=pr.sd|0;S.order=mkOrder(S.online.seed)}}
    setPhase('intro');return;
  }
  if(S.phase!=='await'||!pr)return;
  var a=S.round%2===me;
  if(!a&&S.ost==='wait'&&pr.rd===S.round&&pr.st==='done'){S.i=0;S.ost='gue';pub();setPhase('guess');return}
  if(a&&S.ost==='done'&&pr.rd===S.round&&pr.st==='gdone'&&typeof pr.g==='string'&&pr.g.length===10){S.guesses=pr.g.split('').map(Number);onlineFin(true)}
  else if(!a&&S.ost==='gdone'&&pr.res&&pr.res.rd===S.round&&typeof pr.res.a==='string'&&pr.res.a.length===10){S.answers=pr.res.a.split('').map(Number);onlineFin(false)}
}
function onlineFin(isAns){
  var n=0;S.answers.forEach(function(x,k){if(x===S.guesses[k])n++});
  var g=isAns?1-S.online.me:S.online.me;S.scores[g]+=n;S.played[g]+=10;S.ost='res';
  if(isAns)S.res={rd:S.round,a:S.answers.join(''),n:n};
  pub();setPhase('result');
}
function onlineAnswered(){S.ost='done';pub();setPhase('await');syncOnline()}
function onlineGuessed(){S.gstr=S.guesses.join('');S.ost='gdone';pub();setPhase('await');syncOnline()}
function lobbyV(){
  var host=S.online.me===0,c=esc(S.online.code.toUpperCase());
  app.innerHTML='<div class="card center"><div class="kick">Sala online</div>'+(host?'<h2>Código: <span style="letter-spacing:.12em">'+c+'</span></h2><p class="mut">Pásale este código a la otra persona y espera a que se una…</p>':'<h2>Entrando<span class="dots"><i></i><i></i><i></i></span></h2><p class="mut">Conectando con la sala '+c+'. Esperando al anfitrión…</p>')+'<button class="btn sec" data-a="new">Cancelar</button></div>';
}
function introOn(){
  var me=S.online.me,a=S.round%2===me;

function loadRem(){try{return JSON.parse(localStorage.getItem('cmc-remote'))}catch(e){return null}}
function cleanName(n){return String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7b\x7d-\x7e]/g,'').slice(0,20)||'Jugador'}

  if(create){mode=MODE;seed=Math.floor(Math.random()*900000)+100000;me=0}
  else{var m=code.match(/^([cpg])-?(\d{6})$/);if(!m){OMSG='Escribe el código de partida (ejemplo: c-123456).';homeKeep();return}mode=m[1]==='p'?'profundo':m[1]==='g'?'gracioso':'normal';seed=+m[2];me=1}

function remoteAnswered(){var me=S.remote.me;S.rcode=enc(S.round+'|'+S.answers.join('')+'|'+S.scores[me]+'|'+S.played[me]+'|'+cleanName(S.names[me]),S.remote.seed);setPhase('rcode')}
function copyCode(){var b=document.querySelector('[data-a="r-copy"]');try{navigator.clipboard.writeText(S.rcode).then(function(){b.textContent='Copiado ✓'},function(){b.textContent='Selecciona el código y cópialo'})}catch(e){b.textContent='Selecciona el código y cópialo'}}
function reveal(){
  var t=dec(document.getElementById('rcode').value,S.remote.seed),m=t&&t.match(/^(\d+)\|(\d{10})\|(\d+)\|(\d+)\|(.{1,20})$/);
  if(!m){S.rerr='Ese código no es válido. Cópialo completo, tal como te lo han enviado.';rpasteV();return}
  if(+m[1]!==S.round){S.rerr='Ese código es de la ronda '+(+m[1]+1)+' y ahora toca la ronda '+(S.round+1)+'.';rpasteV();return}
  var me=S.remote.me,ot=1-me,n=0;
  S.answers=m[2].split('').map(Number);
  S.answers.forEach(function(x,k){if(x===S.guesses[k])n++});
  S.scores[me]+=n;S.played[me]+=10;S.scores[ot]=+m[3];S.played[ot]=+m[4];S.names[ot]=m[5];S.rerr='';

var G=null,GT=20000,gTimer=null;
function hue(n){var h=0;n=String(n);for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}
function av(n,big){return '<i class="av'+(big?' big':'')+'" style="background:hsl('+hue(n)+',62%,46%)">'+esc((String(n).trim().charAt(0)||'?').toUpperCase())+'</i>'}
function gSave(){try{if(G){var c=Object.assign({},G);['order','sn','rxs','rh','rk'].forEach(function(k){delete c[k]});localStorage.setItem('cmc-group',JSON.stringify(c))}}catch(e){}}
function gLoad(){try{return JSON.parse(localStorage.getItem('cmc-group'))}catch(e){return null}}
function pidN(x){return parseInt(String(x.id).slice(1))||0}
function gPeers(){if(!NR)return[];return NR.peers().filter(function(p){return p.presence&&p.presence.gm}).map(function(p){return{id:p.peer,me:p.isMe,p:p.presence}}).sort(function(a,b){return pidN(a)-pidN(b)})}
function nameOf(ps,k){for(var i=0;i<ps.length;i++)if(ps[i].p.k===k)return ps[i].p.n;return '?'}
function floatEmoji(e,n){if(RED)return;var s=document.createElement('div');s.className='fe';s.style.left=(8+Math.random()*78)+'%';s.style.setProperty('--sx',(Math.random()*70-35)+'px');s.innerHTML=esc(e)+'<small>'+esc(n)+'</small>';document.body.appendChild(s);setTimeout(function(){s.remove()},2700)}
function gStart(create,resume){

function gPub(){if(!NR||!G)return;var p={n:G.name,k:G.me,gm:1,sc:G.sc,c:G.c||null,a:G.a||null,rx:G.rx||null,qs:(G.qs&&G.qs.length)?G.qs:null};p.xf=G.xf||null;if(G.host){p.h=1;p.ph=G.ph;p.sd=G.seed;p.m=G.mode;p.q=G.q;p.tot=G.tot;p.ro=G.ro;p.sk=G.sk;p.cq=G.cq||null;p.pb=G.pb==null?null:G.pb;p.pr=G.pr||null}else{p.h=null;p.ph=null;p.sd=null;p.m=null;p.q=null;p.tot=null;p.ro=null;p.sk=null;p.cq=null;p.pb=null;p.pr=null}NR.presence(p).catch(function(){});gSave()}
function gState(){
  var ps=gPeers(),q=G.q,sk=G.sk||null;
  var gs=ps.filter(function(x){return x.p.k!==sk&&G.ro.indexOf(x.p.k)>-1});
  var done=gs.filter(function(x){return x.p.c&&x.p.c.q===q&&typeof x.p.c.v==='number'}).length;
  var sp=ps.filter(function(x){return x.p.k===sk})[0],a=sp&&sp.p.a&&sp.p.a.q===q?sp.p.a:null;
  return{ps:ps,q:q,sk:sk,isSub:sk===G.me,gs:gs,done:done,rv:a?a.v:null,bm:a?a.bm:0,gold:(q+1)%5===0};
}
function gTrySub(st){
  if(!st.isSub||G.my===null||G.a||!st.gs.length)return false;
  if(st.done<st.gs.length&&Date.now()-(G.qt||0)<GT)return false;
  var ok=st.gs.filter(function(x){return x.p.c&&x.p.c.q===st.q&&x.p.c.v===G.my}).length,bm=ok===0;
  if(bm)G.sc+=st.gold?4:2;

var NHT=7000;
function gTick(){
  if(!G||!NR||!G.order)return;
  var ps=gPeers();
  if(!G.host){
    if(ps.some(function(x){return x.p.h===1}))G.nh=0;
    else{
      G.nh=G.nh||Date.now();
      if(Date.now()-G.nh>NHT){
        var el=ps.filter(function(x){return G.ph==='lobby'||G.ro.indexOf(x.p.k)>-1});
        if(el.length&&el[0].me){gBecomeHost(null);syncG();return}
      }
    }
  }
  if(G.ph!=='play'||!G.ro.length)return;
  var f=Math.max(0,1-(Date.now()-(G.qt||0))/GT),b=document.getElementById('tb');
  if(G.pb!=null){
    if(b&&!G.pr){b.style.width=(f*100)+'%';b.parentNode.classList.toggle('hot',f<.3)}
    if(gTryProb())syncG();
    return;
  }
  var st=gState();
  if(b&&st.rv===null){b.style.width=(f*100)+'%';b.parentNode.classList.toggle('hot',f<.3)}
  if(gTrySub(st))syncG();
}
function syncG(){
  if(!G||!NR)return;
  var rxs=G.rxs;
  gPeers().forEach(function(x){if(x.me)return;var r=x.p.rx,k=x.p.k;if(!(k in rxs)){rxs[k]=r?r.n:0;return}if(r&&r.n>rxs[k]){rxs[k]=r.n;floatEmoji(r.e,x.p.n)}});
  gPeers().forEach(function(x){if(!G.host&&!x.me&&x.p.xf&&x.p.xf.to===G.me)gBecomeHost(x.p.xf)});
  if(G.xf&&gPeers().some(function(x){return x.p.h===1&&x.p.k===G.xf.to})){G.xf=null;gPub()}
  if(!G.host){
    var hp=null;gPeers().forEach(function(x){if(x.p.h===1)hp=x.p});
    if(hp){
      if(hp.sd&&!G.order){G.mode=(hp.m==='profundo'||hp.m==='gracioso')?hp.m:'normal';setMode(G.mode);G.seed=hp.sd;G.order=mkOrder(hp.sd)}
      G.ph=hp.ph;G.tot=hp.tot||G.tot;G.ro=hp.ro||[];G.sk=hp.sk||null;var cq0=cleanQ(hp.cq);G.cq=(cq0&&hp.cq.q===hp.q)?cq0:null;G.pb=hp.pb==null?null:hp.pb;G.pr=(hp.pr&&hp.pr.q===hp.q)?hp.pr:null;
      if(hp.ph!=='lobby'&&hp.q!==G.q){G.q=hp.q;G.my=null;G.c=null;G.a=null;G.scored=-1;G.dblQ=-1;G.last=null;G.qt=Date.now();gPub()}
    }
  }

    var st=gState();

    if(G.cq&&G.cq.by===G.me&&(G.qs||[]).some(function(x){return x.i===G.cq.i})){G.qs=G.qs.filter(function(x){return x.i!==G.cq.i});gPub();qmList()}

      G.scored=st.q;
      var cor=!!(G.c&&G.c.q===st.q&&G.c.v===st.rv),dbl=G.dblQ===st.q&&G.c&&typeof G.c.v==='number',d=0,tag=[];
      var ok=st.gs.filter(function(x){return x.p.c&&x.p.c.q===st.q&&x.p.c.v===st.rv}).length;
      if(cor){d=dbl?2:1;G.streak=(G.streak||0)+1;if(G.streak%3===0){d++;tag.push('🔥 Racha')}if(ok===1){d++;tag.push('🎯 Francotirador')}if(G.gcombo>=3){d++;tag.push('🤝 Combo x'+G.gcombo)}}

      if(st.gold)d*=2;
      if(dbl)G.dblUsed=true;
      G.dblQ=-1;G.sc+=d;G.last={q:st.q,d:d,cor:cor,dbl:dbl,tag:tag.join(' · ')};
      if(cor)confetti();
      gPub();
    }
    }
  }
  gRender();
}
function gBegin(){
  var ps=gPeers();if(ps.length<2)return;
  G.ro=ps.map(function(x){return x.p.k});G.q=0;G.ph='play';G.sc=0;G.streak=0;G.dblUsed=false;G.dblQ=-1;G.last=null;G.my=null;G.c=null;G.a=null;G.scored=-1;G.qt=Date.now();G.rp=0;G.sp=0;G.pbn=0;G.gcombo=0;G.used={};gPick();
  gPub();syncG();
}
function gNext(){
  G.q++;if(G.q>=G.tot)G.ph='end';
  G.my=null;G.c=null;G.a=null;G.scored=-1;G.dblQ=-1;G.last=null;G.qt=Date.now();if(G.ph==='play')gPick();gPub();syncG();
}
function cleanQ(x){
  if(!x||typeof x.t!=='string'||!Array.isArray(x.o))return null;
  var o=x.o.slice(0,4).map(function(t){return String(t).slice(0,30)}).filter(function(t){return t.trim()});
  if(o.length<2||x.t.trim().length<3)return null;
  return{q:x.q,i:String(x.i).slice(0,12),k:x.k,by:x.by,to:String(x.to||'any').slice(0,8),t:x.t.slice(0,120),o:o};
}
function gConn(){var ps=gPeers();return G.ro.filter(function(k){return ps.some(function(x){return x.p.k===k})})}
function gPick(){
  var ps=gPeers(),n=G.ro.length,u=G.used=G.used||{},conn=gConn(),sq=null,by=null;
  G.pb=null;G.cq=null;G.pr=null;
  if(!n)return;
  var pool=conn.length?conn:G.ro;
  // 1) preguntas enviadas por los jugadores (por turnos entre quienes las envían)
  for(var s=0;s<n&&!sq;s++){
    var k=G.ro[(G.rp+s)%n],pe=ps.filter(function(x){return x.p.k===k})[0];
    if(!pe||!Array.isArray(pe.p.qs))continue;
    for(var j=0;j<pe.p.qs.length;j++){var c=cleanQ(pe.p.qs[j]);if(c&&!u[c.i]){sq=c;by=k;G.rp=((G.rp+s)+1)%n;break}}
  }
  if(sq){
    var tgt=(sq.to!=='any'&&pool.indexOf(sq.to)>-1)?sq.to:null;
    if(!tgt){
      var opts=pool.filter(function(x){return x!==by&&x!==G.sk});
      if(!opts.length)opts=pool.filter(function(x){return x!==by});
      if(!opts.length)opts=pool;
      tgt=opts[Math.floor(Math.random()*opts.length)];
    }
    G.sk=tgt;u[sq.i]=1;G.cq={q:G.q,i:sq.i,k:tgt,by:by,t:sq.t,o:sq.o};return;
  }
  // 2) cada 4 preguntas: ronda de votación "¿quién es más probable?"
  if((G.q+1)%4===0&&n>=2){G.pbn=(G.pbn||0)+1;G.pb=((G.seed||0)+G.pbn*7)%PROB.length;G.sk=null;return}
  // 3) pregunta del mazo para el siguiente jugador conectado
  var pick=null;
  for(var s2=0;s2<n&&!pick;s2++){var i2=(G.sp+s2)%n;if(pool.indexOf(G.ro[i2])>-1){pick=G.ro[i2];G.sp=(i2+1)%n}}
  G.sk=pick||G.ro[G.sp%n];
}
function gBecomeHost(x){

  if(x){G.rp=x.rp||0;G.sp=x.sp||0;G.pbn=x.pbn||0;G.used={};(x.used||[]).forEach(function(i){G.used[i]=1})}
  G.xf=null;G.nh=0;gPub();
}
function gHandOver(k){

  G.xf={to:k,rp:G.rp||0,sp:G.sp||0,pbn:G.pbn||0,used:Object.keys(G.used||{}).slice(-30)};
  G.host=false;gPub();syncG();
}
function hmOpen(){

    m.addEventListener('click',function(e){

    });

  m.style.display='flex';

function gTryProb(){
  if(!G.host||G.pb==null||G.pr)return false;
  var ps=gPeers().filter(function(x){return G.ro.indexOf(x.p.k)>-1}),cnt={},n=0;
  ps.forEach(function(x){var c=x.p.c;if(c&&c.q===G.q&&typeof c.v==='string'){cnt[c.v]=(cnt[c.v]||0)+1;n++}});
  if(!n||(n<ps.length&&Date.now()-(G.qt||0)<GT))return false;
  var mx=0;Object.keys(cnt).forEach(function(k){if(cnt[k]>mx)mx=cnt[k]});
  G.pr={q:G.q,w:Object.keys(cnt).filter(function(k){return cnt[k]===mx}).slice(0,10),n:mx,t:n};
  gPub();return true;
}
function probScore(){
  if(!G.pr||G.pbScored===G.q)return;
  G.pbScored=G.q;

  var ps=tActive(),subs=tActiveSubmissions(),counts={};subs.forEach(function(x){counts[x.presence.tk]=0});
  ps.forEach(function(x){var v=x.presence.tv;if(x.presence.tpr===T.round&&v&&counts[v]!==undefined)counts[v]++});
  var max=0;Object.keys(counts).forEach(function(k){if(counts[k]>max)max=counts[k]});
  if(!T.totals)T.totals={};Object.keys(counts).forEach(function(k){T.totals[k]=(T.totals[k]||0)+counts[k]*2});
  if(max>0)ps.forEach(function(x){if(x.presence.tpr===T.round&&counts[x.presence.tv]===max&&x.presence.tv)T.totals[x.presence.tk]=(T.totals[x.presence.tk]||0)+1});
}
function tTick(){
  if(!T||!TR)return;var now=Date.now(),bar=document.getElementById('ttbar');
  if(bar&&(T.ph==='write'||T.ph==='vote')){var dur=T.ph==='write'?TT_WRITE:TT_VOTE;bar.style.width=Math.max(0,Math.min(100,(T.deadline-now)/dur*100))+'%'}
  if(T.ph==='write'){var st=document.getElementById('tstatus');if(st)st.textContent='Han enviado '+tActiveSubmissions().length+' de '+tActive().length+' respuestas.'}
  if(T.ph==='vote'){var sv=document.getElementById('tstatus'),subsNow=tActiveSubmissions(),eligibleNow=tActive().filter(function(x){return subsNow.some(function(y){return y.presence.tk!==x.presence.tk})});if(sv)sv.textContent='Han votado '+tActive().filter(function(x){return x.presence.tpr===T.round&&!!x.presence.tv}).length+' de '+eligibleNow.length+' jugadores.'}
  if(!T.host)return;
  if(T.ph==='write'){
    var ps=tActive(),sn=tActiveSubmissions().length;
    if(ps.length&&((sn===ps.length&&sn>=2)||now>=T.deadline)){
      T.ph=sn>=2?'vote':'reveal';T.deadline=now+(T.ph==='vote'?TT_VOTE:0);tPub();tSync();
    }
  }else if(T.ph==='vote'){
    var subs=tActiveSubmissions(),eligible=tActive().filter(function(x){return subs.some(function(y){return y.presence.tk!==x.presence.tk})}),voted=eligible.filter(function(x){return x.presence.tpr===T.round&&!!x.presence.tv}).length;

  }
}

var CQ=[],EK='',EM='normal',EMSG='',EOK=false,DRF=null;
var EMODES=[['normal','Clásico'],['profundo','Profundo'],['gracioso','Gracioso']];
function ea(t){return esc(t).replace(/"/g,'&quot;')}
function tabsHtml(){return '<div class="seg tabs"><button data-tab="grupo"'+(TAB==='grupo'?' class="on"':'')+'>👥 Multijugador</button><button data-tab="test"'+(TAB==='test'?' class="on"':'')+'>🧪 Pruebas</button><button data-tab="edit"'+(TAB==='edit'?' class="on"':'')+'>✏️ Editor</button></div>'}
function api(method,path,body){
  var h={'Content-Type':'application/json'};if(EK)h['x-admin-code']=EK;
  return fetch(path,{method:method,headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){throw{error:'no_api'}}).then(function(d){if(!r.ok||!d||typeof d!=='object')throw d||{error:'server'};return d})});
}
function shortOf(x){
  if(x.q==='¿Qué prefieres?')return x.o.join(' / ');
  if(x.k==='Elige una'&&/^¿.*\?$/.test(x.q))return x.q.slice(1,-1)+': '+x.o.join(' / ');
  return x.q;
}
function modeArr(m){return m==='profundo'?QD:m==='gracioso'?QG:QN}
function applyCQ(list){
  CQ=Array.isArray(list)?list:[];
  [QN,QD,QG].forEach(function(a){for(var i=a.length-1;i>=0;i--)if(a[i].c)a.splice(i,1)});
  CQ.forEach(function(x){modeArr(x.mode).push({k:x.k,q:x.q,s:shortOf(x),o:x.o,c:x.id})});
  ROUNDS=Math.floor(QS.length/10);
}
function readDraft(){

function errMsg(e){return e&&e.error==='no_api'?'El servidor no tiene activada la API del editor: sube el server.js nuevo y questions-api.js y redespliega.':e&&e.error==='no_database'?'Falta DATABASE_URL en Render (Environment).':e&&e.error==='too_many'?'Demasiados intentos. Espera unos minutos.':e&&e.error==='unauthorized'?'Código incorrecto.':e&&e.error==='invalid'?'Datos no válidos (revisa longitudes y opciones).':'No se pudo conectar con el servidor.'}

app.addEventListener('click',function(e){

// ---------- Backups de las preguntas ----------
// Se guardan en este dispositivo (IndexedDB), uno por día a partir de las 9:00 (hora de Madrid), y se
// descargan como archivo. No existe ninguna función que los borre. Solo se activan en los dispositivos
// donde has entrado al editor (para que los invitados no reciban descargas).
var BK_DL_EVERY_OPEN=false; // true = descargar un archivo CADA vez que se abre el juego (por defecto: 1 al día)
var BKDB=null,BKL=[],BKB=null,BKALL=false;
function madridSlot(){
  var o={};new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){o[x.type]=x.value});
  var d=new Date(Date.UTC(+o.year,+o.month-1,+o.day));if(+o.hour<9)d=new Date(d.getTime()-864e5);
  return d.toISOString().slice(0,10);
}
function bkOpen(){
  if(BKDB)return BKDB;
  BKDB=new Promise(function(res,rej){
    if(!window.indexedDB)return rej(new Error('no_idb'));
    var r=indexedDB.open('cmc-backups',1);
    r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('m',{keyPath:'slot'});d.createObjectStore('b',{keyPath:'slot'})};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
  });
  BKDB.catch(function(){BKDB=null});
  return BKDB;
}
function bkReq(store,mode,make){return bkOpen().then(function(db){return new Promise(function(res,rej){var t=db.transaction(store,mode),r=make(t);t.oncomplete=function(){res(r&&r.result)};t.onerror=t.onabort=function(){rej(t.error)}})})}
function bkMetas(){return bkReq('m','readonly',function(t){return t.objectStore('m').getAll()})}
function bkGet(slot){return bkReq('b','readonly',function(t){return t.objectStore('b').get(slot)})}
function bkHas(slot){return bkReq('m','readonly',function(t){return t.objectStore('m').get(slot)}).then(function(x){return !!x})}
function bkPut(meta,data){return bkOpen().then(function(db){return new Promise(function(res,rej){var t=db.transaction(['m','b'],'readwrite');t.objectStore('m').put(meta);t.objectStore('b').put({slot:meta.slot,data:data});t.oncomplete=res;t.onerror=t.onabort=function(){rej(t.error)}})})}
function bkData(list,slot){
  var qs=list.map(function(x){return{mode:x.mode,k:x.k,q:x.q,o:x.o}});
  return JSON.stringify({app:'cuanto-me-conoces',version:1,slot:slot,created:new Date().toISOString(),count:qs.length,questions:qs});
}
function dlFile(data,name){
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
  }catch(e){}
}
function autoBackup(list){
  if(!list||!list.length)return Promise.resolve();
  var owner=false;try{owner=localStorage.getItem('cmc-owner')==='1'}catch(e){}
  if(!owner)return Promise.resolve();
  var slot=madridSlot(),data=bkData(list,slot);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  var saved=bkHas(slot).then(function(has){if(!has)return bkPut({slot:slot,ts:Date.now(),count:list.length,label:slot+' · 9:00',kind:'daily'},data)}).catch(function(){});
  var done='';try{done=localStorage.getItem('cmc-bk-dl')}catch(e){}
  if(BK_DL_EVERY_OPEN||done!==slot){dlFile(data,'backup-preguntas-'+slot+'.json');try{localStorage.setItem('cmc-bk-dl',slot)}catch(e){}}
  return saved;
}
function loadBK(){
  return bkMetas().then(function(a){
    BKL=(a||[]).sort(function(x,y){return y.ts-x.ts});
    var ign='';try{ign=localStorage.getItem('cmc-bk-ign')||''}catch(e){}
    BKB=BKL.filter(function(m){return m.kind!=='pre-restore'&&m.count>CQ.length&&(m.slot+':'+CQ.length)!==ign})[0]||null;
  }).catch(function(){BKL=[];BKB=null});
}
function bkCard(){
  var h='<div class="card eds"><div class="kick">💾 Backups</div>';
  if(BKB)h+='<div style="border:1px solid var(--ko);border-radius:12px;padding:10px;margin-bottom:12px"><p style="font-size:14px;margin:0 0 8px">⚠️ El servidor tiene <b>'+CQ.length+'</b> preguntas y tu backup de <b>'+esc(BKB.label||BKB.slot)+'</b> tiene <b>'+BKB.count+'</b>. ¿Se ha borrado la base de datos?</p><button class="btn" data-e="bkrestore" data-slot="'+ea(BKB.slot)+'">♻️ Restaurar ese backup</button><button class="btn sec" data-e="bkign">Ahora no</button></div>';
  h+='<p class="mut" style="font-size:14px;margin:0 0 10px">Al abrir el juego (en este dispositivo) se guarda un backup al día, a partir de las 9:00 de Madrid, y se descarga como archivo. Los backups nunca se borran.</p><button class="btn" data-e="bknow">⬇️ Descargar backup ahora</button>';
  var shown=BKALL?BKL:BKL.slice(0,8);
  if(shown.length)h+='<ul>'+shown.map(function(m){return '<li><b>'+esc(m.label||m.slot)+'</b><small>'+m.count+' preguntas</small><div class="seg"><button data-e="bkdl" data-slot="'+ea(m.slot)+'">⬇️ Descargar</button><button data-e="bkrestore" data-slot="'+ea(m.slot)+'">♻️ Restaurar</button></div></li>'}).join('')+'</ul>'+(BKL.length>8?'<button class="btn sec" data-e="bkall">'+(BKALL?'Ver solo los últimos':'Ver todos ('+BKL.length+')')+'</button>':'');
  else h+='<p class="mut" style="font-size:14px">Aún no hay backups guardados en este dispositivo.</p>';
  h+='<label style="margin-top:12px">Restaurar desde un archivo de backup<input id="bkfile" type="file" accept=".json,application/json"></label></div>';
  return h;
}
function restoreFrom(obj,src){
  var list=Array.isArray(obj)?obj:obj&&obj.questions;
  if(!Array.isArray(list)||!list.length){EMSG='Ese backup no tiene preguntas válidas.';EOK=false;home();return}
  if(!confirm('Se sustituirán TODAS las preguntas actuales ('+CQ.length+') por las de '+src+' ('+list.length+'). Antes se guardará una copia de lo actual. ¿Continuar?'))return;
  readDraft();var ts=Date.now(),r0=null;
  var pre=CQ.length?bkPut({slot:'pre-'+ts,ts:ts,count:CQ.length,label:'Antes de restaurar · '+new Date(ts).toLocaleString('es-ES'),kind:'pre-restore'},bkData(CQ,'pre-'+ts)).catch(function(){}):Promise.resolve();
  pre.then(function(){return api('POST','/api/questions/restore',{questions:list})}).then(function(r){r0=r;return reloadCQ()}).then(loadBK).then(function(){DRF=null;EMSG='Backup restaurado: '+r0.restored+' preguntas'+(r0.skipped?' ('+r0.skipped+' no válidas omitidas)':'')+' ✅';EOK=true;home();window.scrollTo(0,0)}).catch(function(er){EMSG=errMsg(er);EOK=false;home()});
}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-e^="bk"]');if(!b||TAB!=='edit')return;
  var a=b.getAttribute('data-e'),slot=b.getAttribute('data-slot');
  if(a==='bkall'){readDraft();BKALL=!BKALL;home()}
  else if(a==='bkign'){try{localStorage.setItem('cmc-bk-ign',(BKB?BKB.slot:'')+':'+CQ.length)}catch(x){}BKB=null;readDraft();home()}
  else if(a==='bknow'){
    var ts=Date.now(),sl='manual-'+ts,d=bkData(CQ,sl);
    dlFile(d,'backup-preguntas-'+new Date(ts).toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json');
    bkPut({slot:sl,ts:ts,count:CQ.length,label:'Manual · '+new Date(ts).toLocaleString('es-ES'),kind:'manual'},d).then(loadBK).then(function(){readDraft();home()}).catch(function(){});
  }else if(a==='bkdl'){bkGet(slot).then(function(r){if(r)dlFile(r.data,'backup-preguntas-'+slot+'.json')})}
  else if(a==='bkrestore'){
    bkGet(slot).then(function(r){var o=null;try{o=JSON.parse(r.data)}catch(x){}restoreFrom(o,'el backup '+slot)}).catch(function(){EMSG='No se pudo leer ese backup.';EOK=false;home()});
  }
});
app.addEventListener('change',function(e){
  if(e.target.id!=='bkfile'||!e.target.files[0])return;
  var f=e.target.files[0],fr=new FileReader();
  fr.onload=function(){var o=null;try{o=JSON.parse(fr.result)}catch(x){}restoreFrom(o,'el archivo '+f.name)};
  fr.readAsText(f);e.target.value='';
});
app.addEventListener('input',function(e){
  if(e.target.id!=='efilter')return;
  var t=e.target.value.trim().toLowerCase();
  [].forEach.call(app.querySelectorAll('.egrp'),function(g){var any=false;[].forEach.call(g.querySelectorAll('li'),function(li){var m=!t||li.textContent.toLowerCase().indexOf(t)>-1;li.style.display=m?'':'none';if(m)any=true});g.style.display=any?'':'none'});
});

// ---------- Carga de preguntas (todas vienen de la base de datos) ----------
var started=false;
function noQ(){app.innerHTML='<div class="card"><div class="kick">No se han podido cargar las preguntas</div><p class="mut" style="font-size:14px">Comprueba la conexión e inténtalo de nuevo.</p><button class="btn" onclick="location.reload()">Reintentar</button></div>'}
function go(){if(started)return;started=true;if(!QN.length&&!QD.length&&!QG.length){noQ();return}home()}
function fromCache(){try{var c=JSON.parse(localStorage.getItem('cmc-qcache'));if(Array.isArray(c)&&c.length)applyCQ(c)}catch(e){}}
fetch('/api/questions',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
  if(!d||!Array.isArray(d.questions)||!d.questions.length)throw new Error('empty');
  applyCQ(d.questions);try{localStorage.setItem('cmc-qcache',JSON.stringify(d.questions))}catch(e){}
  autoBackup(d.questions);
}).catch(fromCache).then(go);
setTimeout(function(){if(!started){fromCache();go()}},20000);
</script>
</body>
</html>
