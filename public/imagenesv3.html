function hue(n){var h=0;n=String(n);for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}

// ---------- Conexión: WebSocket (servidor del juego) o pestañas del navegador (pruebas) ----------
function makeWsRoom(name){
  return new Promise(function(resolve,reject){
    var url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
    var ws=null,id=null,pres={},arr=[],subs=[],done=false,closed=false,retry=0,cid=Math.random().toString(36).slice(2);
    var room={
      peers:function(){return arr},
      onPeers:function(fn){subs.push(fn)},
      presence:function(p){Object.keys(p).forEach(function(k){if(p[k]===null)delete pres[k];else pres[k]=p[k]});send({t:'pres',p:p});return Promise.resolve()},
      leave:function(){closed=true;try{ws.close()}catch(e){}return Promise.resolve()}
    };
    function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
    function open(){
      try{ws=new WebSocket(url)}catch(e){done=true;reject({code:'nows'});return}
      ws.onopen=function(){retry=0;send({t:'join',room:name,cid:cid});if(Object.keys(pres).length)send({t:'pres',p:pres})};
      ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
        if(m.t==='hello'){id=m.id}
        else if(m.t==='peers'){
          arr=m.peers.map(function(q){return{peer:q.id,isMe:q.id===id,presence:q.p||{}}});
          if(!done){done=true;resolve(room)}
          subs.slice().forEach(function(f){f()});
        }else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}
      };
      ws.onclose=function(){if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
    }
    open();
    setTimeout(function(){if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},6000);
  });
}
function makeBcRoom(name){
  return new Promise(function(resolve){
    var ch=new BroadcastChannel(name),id='p'+Date.now()+Math.floor(Math.random()*10),pres={},others={},subs=[],arr=[];
    function build(){var a=[{peer:id,isMe:true,presence:pres}];Object.keys(others).forEach(function(k){a.push({peer:k,isMe:false,presence:others[k].p||{}})});return a}
    function emit(){arr=build();subs.slice().forEach(function(f){f()})}
    function send(){try{ch.postMessage({id:id,p:pres})}catch(e){}}
    ch.onmessage=function(e){var m=e.data;if(!m||!m.id||m.id===id)return;
      if(m.bye)delete others[m.id];else{var nw=!others[m.id];others[m.id]={p:m.p,t:Date.now()};if(nw)send()}
      emit()};
    var timer=setInterval(function(){send();var now=Date.now(),g=false;Object.keys(others).forEach(function(k){if(now-others[k].t>6000){delete others[k];g=true}});if(g)emit()},1500);
    resolve({
      peers:function(){return arr},
      onPeers:function(fn){subs.push(fn)},
      presence:function(p){Object.keys(p).forEach(function(k){if(p[k]===null)delete pres[k];else pres[k]=p[k]});send();emit();return Promise.resolve()},
      leave:function(){try{ch.postMessage({id:id,bye:1})}catch(e){}clearInterval(timer);ch.close();return Promise.resolve()}
    });
    arr=build();send();
  });
}
function joinRoom(name){
  var viaTabs=function(){if(typeof BroadcastChannel==='undefined')return Promise.reject({code:'noroom'});return makeBcRoom(name).then(function(r){return{room:r,bc:true}})};
  if(location.protocol==='file:'||!location.host)return viaTabs();
  return makeWsRoom(name).then(function(r){return{room:r,bc:false}}).catch(function(e){if(e&&e.code==='room_full')throw e;return viaTabs()});
}

// ---------- Fotos de Wikimedia ----------
function tClean(s){return String(s||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/\s+/g,' ').trim().slice(0,180)}
var BADIMG=/(nude|nudity|erotic|sexual|weapon|firearm|blood|corpse|gore|war photograph|violent|murder|injury|death)/i;
function tCand(pg){
  var ii=(pg.imageinfo||[])[0]||{},ex=ii.extmetadata||{};
  return{title:pg.title||'',url:ii.thumburl||ii.url||'',page:ii.descriptionurl||'',mime:ii.thumbmime||ii.mime||'',w:ii.width||0,license:tClean(ex.LicenseShortName&&ex.LicenseShortName.value),author:tClean((ex.Artist&&ex.Artist.value)||(ex.Credit&&ex.Credit.value)),desc:tClean((ex.ImageDescription&&ex.ImageDescription.value)||(ex.ObjectName&&ex.ObjectName.value)),idx:pg.index||0};
}
function tOk(x){return x.url&&x.page&&x.license&&/^image\/(jpeg|png|webp|gif)$/i.test(x.mime)&&!BADIMG.test(x.title+' '+x.desc)}
async function tQuery(term,random){
  var o={action:'query',format:'json',generator:'search',gsrnamespace:'6',gsrlimit:'30',gsrsearch:'filetype:bitmap '+term,prop:'imageinfo',iiprop:'url|mime|size|extmetadata',iiurlwidth:'1000',iiextmetadatafilter:'LicenseShortName|Artist|Credit|ImageDescription|ObjectName',origin:'*'};
  if(random)o.gsrsort='user_random';
  var r=await fetch('https://commons.wikimedia.org/w/api.php?'+new URLSearchParams(o).toString(),{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error('No se pudo consultar Wikimedia Commons.');
  var d=await r.json();
  return Object.keys((d.query&&d.query.pages)||{}).map(function(k){return tCand(d.query.pages[k])}).sort(function(a,b){return a.idx-b.idx});
}
async function tFetchRandom(){
  for(var i=0;i<3;i++){
    var l=(await tQuery(pick(TTOPICS),true)).filter(function(x){return tOk(x)&&x.w>=500});
    var f=l.filter(function(x){return T.seen.indexOf(x.title)<0});if(f.length)l=f;
    if(l.length)return pick(l);
  }
  throw new Error('No se han encontrado fotografías adecuadas. Prueba otra vez.');
}
function tDoSearch(){
  if(!T||!T.host||T.ph!=='pick'||T.sbusy)return;

  T.sbusy=true;T.serr='';T.rk='';tRender();

    if(!T||T.ph!=='pick')return;
    T.sres=l.filter(tOk);T.soff=0;T.sbusy=false;T.serr=T.sres.length?'':'No hay fotos para esa búsqueda. Prueba con otras palabras (en inglés suele dar más resultados).';T.rk='';tRender();
  }).catch(function(e){if(!T||T.ph!=='pick')return;T.sbusy=false;T.serr=(e&&e.message)||'No se pudo buscar.';T.rk='';tRender()});
}

  }).catch(function(e){if(!T||!T.host||T.round!==my)return;T.err=(e&&e.message)||'No se pudo cargar la fotografía.';T.ph='error';tPub();tSync()});

function tVote(k){
  if(!T||T.ph!=='vote'||T.vote||k===T.me)return;

  T.vote=k;tPub();tRender();

function tTally(){
  var ps=tActive(),subs=tSubs(),cnt={},d={};
  subs.forEach(function(x){cnt[x.presence.k]=0});
  ps.forEach(function(x){var p=x.presence;if(p.pr===T.round&&p.v&&p.v!==p.k&&cnt[p.v]!==undefined)cnt[p.v]++});
  var max=0;Object.keys(cnt).forEach(function(k){if(cnt[k]>max)max=cnt[k]});
  var win=max>0?Object.keys(cnt).filter(function(k){return cnt[k]===max}):[],wb=[],mult=isLastRound()?2:1;
  Object.keys(cnt).forEach(function(k){d[k]=cnt[k]*2});
  ps.forEach(function(x){var p=x.presence;if(p.pr===T.round&&p.v&&win.indexOf(p.v)>-1)d[p.k]=(d[p.k]||0)+1});
  subs.forEach(function(x){var k=x.presence.k;if(win.indexOf(k)>-1&&tHas(x.presence.x)){d[k]+=1;wb.push(k)}});
  Object.keys(d).forEach(function(k){d[k]*=mult;T.totals[k]=(T.totals[k]||0)+d[k]});
  ps.forEach(function(x){T.nm[x.presence.k]=x.presence.n});
  T.res={r:T.round,mult:mult,win:win,wb:wb,d:d,items:subs.map(function(x){return{k:x.presence.k,x:x.presence.x,c:cnt[x.presence.k]}}).sort(function(a,b){return b.c-a.c})};

  if(st&&T.ph==='vote'){var el=tVoters();st.textContent='Han votado '+el.filter(function(x){return x.presence.pr===T.round&&x.presence.v}).length+' de '+el.length+' jugadores.'}
  if(!T.host){if(T.nh&&now-T.nh>15000)tRender();return}

    var r=T.ro.slice().sort(function(a,b){return (T.totals[b]||0)-(T.totals[a]||0)});
    var pod=[1,0,2].filter(function(i){return r[i]}).map(function(i){return '<div class="pod"><div>'+av(nameOf(r[i]))+'</div><b>'+esc(nameOf(r[i]))+'</b><span>'+(T.totals[r[i]]||0)+' pts</span><div class="blk" style="--h:'+[130,100,76][i]+'px;--d:'+(300+(2-i)*250)+'ms">'+['🥇','🥈','🥉'][i]+'</div></div>'}).join('');
    paint('end','<h1>¡Fin de la partida!</h1><div class="card center" data-confetti="1"><div class="kick">Mente más creativa</div><h2>'+esc(r[0]?nameOf(r[0]):'—')+'</h2><div class="podium">'+pod+'</div></div><div class="card"><div class="kick">Clasificación final</div><ul>'+rankHtml()+'</ul></div>'+(T.host?'<button class="btn" data-ta="again">Jugar otra vez</button>':'')+'<button class="btn sec" data-ta="leave">Salir</button>');
  }
}
function home(){
  var msg=OMSG?'<p style="color:var(--ko);font-size:14px">'+esc(OMSG)+'</p>':'';
  app.innerHTML='<h1>¿Qué te inspira esta imagen?</h1><div class="card"><div class="kick">🖼️ Juego de imaginación · 2 o más jugadores</div><p class="mut" style="font-size:14px">Aparece una fotografía y una pregunta creativa relacionada con ella. Cada jugador responde, después votáis en anónimo la respuesta más ingeniosa y sumáis puntos. El anfitrión puede dejar la foto al azar o buscarla él mismo en Wikimedia.</p></div>'
  +'<div class="card"><label>Tu nombre<input id="tn" maxlength="20" placeholder="Nombre"></label><button class="btn" data-ta="tcreate">Crear sala</button><div class="or">o únete a una sala</div><input id="tc" maxlength="8" placeholder="Código de sala (ej: k7f3m)" autocapitalize="none"><button class="btn sec" data-ta="tjoin">Unirme a una sala</button>'+msg+'</div>'
  +'<p class="mut center" style="font-size:12px">Sin servidor del juego, las salas funcionan igualmente entre pestañas del mismo navegador (modo pruebas).</p>';
}

// ---------- Eventos ----------
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-ta]'),a=b&&b.getAttribute('data-ta');
  if(a==='tcreate'){tStart(true);return}
  if(a==='tjoin'){tStart(false);return}
  if(!T)return;
  var st=e.target.closest('[data-ts]');
  if(st){if(T.host&&T.ph==='lobby'){var k=st.getAttribute('data-ts'),v=+st.getAttribute('data-v');if(k==='rounds')T.rounds=v;else T.wt=v;T.rk='';tPub();tRender()}return}
  var pk=e.target.closest('[data-tpick]');if(pk){tPickImg(+pk.getAttribute('data-tpick'));return}
  var vt=e.target.closest('[data-tvote]');if(vt&&!vt.disabled){tVote(vt.getAttribute('data-tvote'));return}
  if(!a)return;
  if(a==='leave')tLeave();
  else if(a==='start'&&T.host&&T.ph==='lobby')tBegin(false);
  else if(a==='startpick'&&T.host&&T.ph==='lobby')tBegin(true);
  else if(a==='submit')tSubmit();
  else if(a==='continue'&&T.host&&T.ph==='reveal')tRoundRandom(true);
  else if(a==='pickstart'&&T.host&&T.ph==='reveal')tEnterPick();
  else if(a==='skip'&&T.host&&(T.ph==='write'||T.ph==='vote'||T.ph==='error'))tRoundRandom(false);
  else if(a==='skipq'&&T.host&&T.ph==='write'){T.q=nextFrom(TQ,T.usedQ,40);T.round++;T.localRound=T.round;T.sub='';T.vote='';T.deadline=Date.now()+T.wt;tPub();tSync()}
  else if(a==='finish'&&T.host&&T.ph==='reveal'){T.ph='end';tPub();tSync()}
  else if(a==='again'&&T.host&&T.ph==='end'){T.ph='lobby';T.round++;T.rn=-1;T.res=null;T.img=null;T.sub='';T.vote='';T.ro=[];T.totals={};T.localRound=T.round;T.rk='';tPub();tSync()}
  else if(a==='search')tDoSearch();
  else if(a==='more'&&T.host&&T.sres){T.soff=T.soff+6>=T.sres.length?0:T.soff+6;tRender()}
  else if(a==='pickrandom'&&T.host&&T.ph==='pick')tRoundRandom(true);
  else if(a==='pickback'&&T.host&&T.ph==='pick'){T.ph='reveal';tPub();tSync()}
});
app.addEventListener('input',function(e){
  if(e.target.id==='tsq'&&T)T.sq=e.target.value;
  if(e.target.id==='tcaption'){var bt=document.querySelector('[data-ta="submit"]');if(bt)bt.textContent='Enviar respuesta ('+e.target.value.length+'/180)'}
});
app.addEventListener('keydown',function(e){if(e.target.id==='tsq'&&e.key==='Enter'){e.preventDefault();tDoSearch()}});
home();
</script>
</body>
