function makeWsRoom(){
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
  return {join:function(name){return new Promise(function(resolve,reject){
    var ws=null,id=null,pres={},arr=[],subs=[],done=false,closed=false,retry=0,cid=Math.random().toString(36).slice(2);
    var room={
      peers:function(){return arr},
      onPeers:function(fn){subs.push(fn);return function(){subs=subs.filter(function(x){return x!==fn})}},
      presence:function(p){Object.keys(p).forEach(function(k){if(p[k]===null)delete pres[k];else pres[k]=p[k]});send({t:'pres',p:p});return Promise.resolve()},
      leave:function(){closed=true;try{ws.close()}catch(e){}return Promise.resolve()}
    };
    function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
    function open(){
      ws=new WebSocket(url);
      ws.onopen=function(){retry=0;send({t:'join',room:name,cid:cid});if(Object.keys(pres).length)send({t:'pres',p:pres})};
      ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
        if(m.t==='hello'){id=m.id}
        else if(m.t==='peers'){
          arr=m.peers.map(function(q){return{peer:q.id,isMe:q.id===id,sameTab:q.id===id,kind:'viewer',guest:false,by:null,presence:q.p||{},updatedAt:Date.now()}});
          if(!done){done=true;resolve(room)}
          subs.slice().forEach(function(f){f({peers:arr})});
        }
        else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}
      };
      ws.onclose=function(){if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
    }
    open();
    setTimeout(function(){if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},70000);
  })}};
}

    +(EMSG?'<p style="font-size:14px;color:'+(EOK?'var(--ok)':'var(--ko)')+'">'+esc(EMSG)+'</p>':'')+'</div>';
  var by={};list.forEach(function(x){(by[x.k]=by[x.k]||[]).push(x)});
  var rows=Object.keys(by).sort().map(function(c){return '<div class="kick" style="margin-top:14px">'+esc(c)+' ('+by[c].length+')</div><ul>'+by[c].map(function(x){return '<li><b>'+esc(x.q)+'</b><small>'+x.o.map(esc).join(' · ')+'</small><div class="seg"><button data-e="edit" data-id="'+x.id+'">✏️ Editar</button><button data-e="del" data-id="'+x.id+'">🗑 Borrar</button></div></li>'}).join('')+'</ul>'}).join('');
  app.innerHTML=h+'<div class="card eds"><div class="kick">Editor de preguntas</div><p class="mut" style="font-size:14px;margin:0">Las que añadas se suman a las originales y se guardan para siempre. Modo:</p>'+modes+'</div>'+form
    +'<div class="card eds"><div class="kick">Tus preguntas en modo '+modeName(EM)+' ('+list.length+')</div>'+(rows||'<p class="mut" style="font-size:14px">Aún no has añadido ninguna en este modo.</p>')+'</div><button class="btn sec" data-e="exit">Cerrar el editor</button>';
}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-e]');if(!b||TAB!=='edit')return;
  var a=b.getAttribute('data-e'),id=+b.getAttribute('data-id');
  if(a==='login'){
    EK=(document.getElementById('ecode').value||'').trim();EMSG='';
    api('POST','/api/questions/auth').then(reloadCQ).then(function(){EMSG='';home()}).catch(function(er){EK='';EMSG=errMsg(er);home()});
  }else if(a==='mode'){readDraft();if(DRF&&DRF.id)DRF=null;EM=b.getAttribute('data-v');EMSG='';home()}
  else if(a==='cancel'){DRF=null;EMSG='';home()}
  else if(a==='exit'){EK='';DRF=null;EMSG='';TAB='grupo';home()}
  else if(a==='edit'){
    var x=CQ.filter(function(q){return q.id===id})[0];if(!x)return;
    EM=x.mode;DRF={id:x.id,k:x.k,q:x.q,o:x.o.concat(['','','','']).slice(0,4)};EMSG='';home();window.scrollTo(0,0);
  }else if(a==='del'){
    if(!confirm('¿Borrar esta pregunta para siempre?'))return;
    readDraft();
    api('DELETE','/api/questions/'+id).then(reloadCQ).then(function(){if(DRF&&DRF.id===id)DRF=null;EMSG='Pregunta borrada';EOK=true;home()}).catch(function(er){EMSG=errMsg(er);EOK=false;home()});
  }else if(a==='save'){
    var d=readDraft(),o=d.o.map(function(v){return v.trim()}).filter(Boolean);
    if(!d.k.trim()||!d.q.trim()){EMSG='Falta la categoría o la pregunta.';EOK=false;home();return}
    if(o.length<2){EMSG='Pon al menos 2 opciones.';EOK=false;home();return}
    var body={mode:EM,k:d.k.trim(),q:d.q.trim(),o:o};
    (d.id?api('PUT','/api/questions/'+d.id,body):api('POST','/api/questions',body)).then(reloadCQ).then(function(){DRF=null;EMSG='Guardado ✅';EOK=true;home()}).catch(function(er){EMSG=errMsg(er);EOK=false;home()});
  }
});
var started=false;function go(){if(started)return;started=true;home()}
fetch('/api/questions').then(function(r){return r.json()}).then(function(d){applyCQ(d.questions)}).catch(function(){}).then(go);
setTimeout(go,4000);
</script>
