var RM=null,NR=null,OMSG='';
function makeWsRoom(){
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
  return {join:function(name){return new Promise(function(resolve,reject){
    var ws=null,id=null,pres={},arr=[],subs=[],done=false,closed=false,retry=0,cid=Math.random().toString(36).slice(2);
    var room={
      peers:function(){return arr},
      onPeers:function(fn){subs.push(fn);return function(){subs=subs.filter(function(x){return x!==fn})}},
      presence:function(p){Object.keys(p).forEach(function(k){if(p[k]===null)delete pres[k];else pres[k]=p[k]});send({t:'pres',p:p});return Promise.resolve()},
      leave:function(){closed=true;try{ws.close()}catch(e){}return Promise.resolve()}
    };
    function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
    function open(){
      ws=new WebSocket(url);
      ws.onopen=function(){retry=0;send({t:'join',room:name,cid:cid});if(Object.keys(pres).length)send({t:'pres',p:pres})};
      ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
        if(m.t==='hello'){id=m.id}
        else if(m.t==='peers'){
          arr=m.peers.map(function(q){return{peer:q.id,isMe:q.id===id,sameTab:q.id===id,kind:'viewer',guest:false,by:null,presence:q.p||{},updatedAt:Date.now()}});
          if(!done){done=true;resolve(room)}
          subs.slice().forEach(function(f){f({peers:arr})});
        }
        else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}
      };
      ws.onclose=function(){if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
    }
    open();
    setTimeout(function(){if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},70000);
  })}};
}

  if(!RM){OMSG='Online no disponible en este navegador.';S=null;home();return}
  OMSG='';setPhase(S.phase||'lobby');
  RM.join('cmc-'+S.online.code).then(function(r){NR=r;NR.onPeers(syncOnline);pub();syncOnline()}).catch(function(e){OMSG='No se pudo entrar a la sala ('+((e&&e.code)||'error')+').';S=null;home()});
}
function syncOnline(){
  if(!S||!S.online||!NR)return;
  var me=S.online.me,o=otherPeer(),pr=o&&o.presence;
  if(pr&&pr.n)S.names[1-me]=String(pr.n).slice(0,20);
  if(S.phase==='lobby'){
    if(!pr)return;
    if(me===1){if(pr.h!==0||!pr.sd)return;if(!S.order){S.mode=pr.m==='profundo'?'profundo':'normal';setMode(S.mode);S.online.seed=pr.sd|0;S.order=mkOrder(S.online.seed)}}
    setPhase('intro');return;
  }
  if(S.phase!=='await'||!pr)return;
  var a=S.round%2===me;
  if(!a&&S.ost==='wait'&&pr.rd===S.round&&pr.st==='done'){S.i=0;S.ost='gue';pub();setPhase('guess');return}
  if(a&&S.ost==='done'&&pr.rd===S.round&&pr.st==='gdone'&&typeof pr.g==='string'&&pr.g.length===10){S.guesses=pr.g.split('').map(Number);onlineFin(true)}
  else if(!a&&S.ost==='gdone'&&pr.res&&pr.res.rd===S.round&&typeof pr.res.a==='string'&&pr.res.a.length===10){S.answers=pr.res.a.split('').map(Number);onlineFin(false)}
}
function onlineFin(isAns){
  var n=0;S.answers.forEach(function(x,k){if(x===S.guesses[k])n++});
  var g=isAns?1-S.online.me:S.online.me;S.scores[g]+=n;S.played[g]+=10;S.ost='res';
  if(isAns)S.res={rd:S.round,a:S.answers.join(''),n:n};
  pub();setPhase('result');
}
function onlineAnswered(){S.ost='done';pub();setPhase('await');syncOnline()}
function onlineGuessed(){S.gstr=S.guesses.join('');S.ost='gdone';pub();setPhase('await');syncOnline()}
function lobbyV(){
  var host=S.online.me===0,c=esc(S.online.code.toUpperCase());
  app.innerHTML='<div class="card center"><div class="kick">Sala online</div>'+(host?'<h2>Código: <span style="letter-spacing:.12em">'+c+'</span></h2><p class="mut">Pásale este código a la otra persona y espera a que se una…</p>':'<h2>Entrando…</h2><p class="mut">Conectando con la sala '+c+'. Esperando al anfitrión…</p>')+'<button class="btn sec" data-a="new">Cancelar</button></div>';
}
function introOn(){
  var me=S.online.me,a=S.round%2===me;
  app.innerHTML=head()+'<div class="card center"><div class="kick">Ronda '+(S.round+1)+' · Sala '+esc(S.online.code.toUpperCase())+'</div><h2>'+(a?'Te toca responder':'Te toca adivinar')+'</h2><p class="mut">'+(a?nm(1-me)+' intentará adivinar lo que contestes.':'Esperarás a que '+nm(1-me)+' responda y después adivinarás sus respuestas.')+'</p><button class="btn" data-a="o-go">Estoy listo/a</button></div>'+board();
}
function awaitV(){
  var me=S.online.me,a=S.round%2===me,msg=a?nm(1-me)+' está adivinando tus respuestas…':(S.ost==='wait'?nm(1-me)+' está respondiendo…':nm(1-me)+' está revisando tus respuestas…');
  app.innerHTML=head()+'<div class="card center"><div class="kick">Sala '+esc(S.online.code.toUpperCase())+'</div><h2>Esperando</h2><p class="mut">'+msg+'</p></div>'+board();
}

// ---------- A distancia sin sesión (códigos) ----------
function loadRem(){try{return JSON.parse(localStorage.getItem('cmc-remote'))}catch(e){return null}}
function cleanName(n){return String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7b\x7d-\x7e]/g,'').slice(0,20)||'Jugador'}
function enc(t,seed){var r=rng(seed),o='';for(var i=0;i<t.length;i++){var k=Math.floor(r()*256),c=(t.charCodeAt(i)&255)^k;o+=(c<16?'0':'')+c.toString(16)}return o.replace(/(.{4})(?=.)/g,'$1-')}
function dec(h,seed){h=String(h).toLowerCase().replace(/[^0-9a-f]/g,'');if(!h||h.length%2)return null;var r=rng(seed),o='';for(var i=0;i<h.length;i+=2){var k=Math.floor(r()*256);o+=String.fromCharCode(parseInt(h.substr(i,2),16)^k)}return o}
function remoteStart(create){
  var n=cleanName((document.getElementById('rn').value||'').trim()||(create?'Jugador 1':'Jugador 2')),code=(document.getElementById('rc').value||'').trim().toLowerCase(),seed,mode,me;
  if(create){mode=MODE;seed=Math.floor(Math.random()*900000)+100000;me=0}
  else{var m=code.match(/^([cp])-?(\d{6})$/);if(!m){OMSG='Escribe el código de partida (ejemplo: c-123456).';homeKeep();return}mode=m[1]==='p'?'profundo':'normal';seed=+m[2];me=1}
  OMSG='';setMode(mode);
  S={mode:mode,names:me?['La otra persona',n]:[n,'La otra persona'],order:mkOrder(seed),round:0,i:0,scores:[0,0],played:[0,0],answers:[],guesses:[],phase:'intro',remote:{me:me,seed:seed,code:(mode==='profundo'?'p':'c')+'-'+seed}};
  setPhase('intro');
}
function remoteAnswered(){var me=S.remote.me;S.rcode=enc(S.round+'|'+S.answers.join('')+'|'+S.scores[me]+'|'+S.played[me]+'|'+cleanName(S.names[me]),S.remote.seed);setPhase('rcode')}
function copyCode(){var b=document.querySelector('[data-a="r-copy"]');try{navigator.clipboard.writeText(S.rcode).then(function(){b.textContent='Copiado ✓'},function(){b.textContent='Selecciona el código y cópialo'})}catch(e){b.textContent='Selecciona el código y cópialo'}}
function reveal(){
  var t=dec(document.getElementById('rcode').value,S.remote.seed),m=t&&t.match(/^(\d+)\|(\d{10})\|(\d+)\|(\d+)\|(.{1,20})$/);
  if(!m){S.rerr='Ese código no es válido. Cópialo completo, tal como te lo han enviado.';rpasteV();return}
  if(+m[1]!==S.round){S.rerr='Ese código es de la ronda '+(+m[1]+1)+' y ahora toca la ronda '+(S.round+1)+'.';rpasteV();return}
  var me=S.remote.me,ot=1-me,n=0;
  S.answers=m[2].split('').map(Number);
  S.answers.forEach(function(x,k){if(x===S.guesses[k])n++});
  S.scores[me]+=n;S.played[me]+=10;S.scores[ot]=+m[3];S.played[ot]=+m[4];S.names[ot]=m[5];S.rerr='';
  setPhase('result');
}
function introR(){
  var me=S.remote.me,a=S.round%2===me,o=nm(1-me),c=esc(S.remote.code.toUpperCase());
  app.innerHTML=head()+'<div class="card center"><div class="kick">Ronda '+(S.round+1)+' · Partida '+c+'</div><h2>'+(a?'Te toca responder':'Te toca adivinar')+'</h2><p class="mut">'+(a?'Responde con sinceridad. Al terminar tendrás un código para enviarselo a '+o+'.':'Adivina lo que respondió '+o+'. Al terminar pegarás el código que te envíe para ver el resultado.')+'</p>'+(S.round===0&&me===0?'<p class="mut" style="font-size:14px">Pásale el código de partida <b>'+c+'</b> a la otra persona para que se una.</p>':'')+'<button class="btn" data-a="r-go">Estoy listo/a</button></div>'+board();
}
function rcodeV(){
  var o=nm(1-S.remote.me),last=S.round+1>=ROUNDS;
  app.innerHTML=head()+'<div class="card center"><div class="kick">Código de respuestas</div><div style="font-size:20px;font-weight:700;word-break:break-all;line-height:1.4;margin:8px 0">'+esc(S.rcode)+'</div><button class="btn" data-a="r-copy">Copiar código</button><p class="mut" style="margin:12px 0 0">Envíaselo a '+o+' (por WhatsApp, por ejemplo). Con él verá cuánto te conoce cuando termine de adivinar.</p></div>'+board()+'<button class="btn sec" data-a="'+(last?'end':'next')+'">'+(last?'Ver resultado final':'Siguiente ronda')+'</button>';
}
function rpasteV(){
  var o=nm(1-S.remote.me);
  app.innerHTML=head()+'<div class="card"><div class="kick">Ver resultado</div><h2>Pega el código de '+o+'</h2><p class="mut">Es el código de respuestas de la ronda '+(S.round+1)+' que te ha enviado '+o+'. Si aún no te lo ha mandado, puedes cerrar y volver más tarde: tu partida queda guardada.</p><textarea id="rcode" rows="3" style="width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit" placeholder="xxxx-xxxx-xxxx…"></textarea>'+(S.rerr?'<p style="color:var(--ko);font-size:14px">'+esc(S.rerr)+'</p>':'')+'<button class="btn" data-a="r-reveal">Ver resultado</button></div>'+board();
}

// ---------- Pantallas ----------
function sel(m){return MODE===m?'border-color:var(--ac);background:rgba(224,69,123,.1);font-weight:700':''}
function home(){
  var old3=loadRem();if(old3&&(!old3.remote||old3.phase==='final'))old3=null;
  var old2=loadOn();if(old2&&(!old2.online||old2.phase==='final'))old2=null;
  var old=load(MODE),can=old&&old.phase&&old.phase!=='final'&&old.order;
  app.innerHTML='<h1>¿Cuánto me conoces?</h1><p class="mut">'+QS.length+' preguntas, rondas de 10. Uno responde en secreto y el otro intenta adivinar sus respuestas. Después, se cambian los papeles.</p>'
  +'<div class="card"><div class="kick">Modo de juego</div><button class="opt" data-m="normal" style="'+sel('normal')+'">Clásico · 500 preguntas ligeras y divertidas</button><button class="opt" data-m="profundo" style="'+sel('profundo')+'">Profundo · 500 preguntas personales para conocerse de verdad</button><label>Jugador 1<input id="n0" maxlength="20" placeholder="Nombre"></label><label>Jugador 2<input id="n1" maxlength="20" placeholder="Nombre"></label>'
  +'<button class="btn" data-a="start">Empezar partida</button>'
  +(can?'<button class="btn sec" data-a="resume">Continuar partida guardada ('+esc(old.names[0])+' y '+esc(old.names[1])+', ronda '+(old.round+1)+')</button>':'')+'</div>'
  +'<div class="card"><div class="kick">A distancia sin sesión</div><p class="mut" style="font-size:14px">Funciona solo con el enlace, sin iniciar sesión. Cada uno juega en su móvil a su ritmo y se pasan por WhatsApp un código al final de cada ronda.</p><label>Tu nombre<input id="rn" maxlength="20" placeholder="Nombre"></label><button class="btn" data-a="rcreate">Crear partida (modo '+(MODE==='profundo'?'Profundo':'Clásico')+')</button><label>Código de partida<input id="rc" maxlength="9" placeholder="Ej: c-123456" autocapitalize="none"></label><button class="btn sec" data-a="rjoin">Unirme con código de partida</button>'+(old3?'<button class="btn sec" data-a="rreconnect">Continuar partida a distancia ('+esc(old3.remote.code.toUpperCase())+', ronda '+(old3.round+1)+')</button>':'')+(OMSG?'<p style="color:var(--ko);font-size:14px">'+esc(OMSG)+'</p>':'')+'</div>'
  +'<div class="card"><div class="kick">Jugar online en directo</div><p class="mut" style="font-size:14px">Cada uno en su móvil, con un código de sala. Solo hace falta el enlace. Si el servidor estaba dormido, la primera conexión puede tardar medio minuto.</p><label>Tu nombre<input id="on" maxlength="20" placeholder="Nombre"></label><button class="btn" data-a="create"'+(RM?'':' disabled')+'>Crear sala (modo '+(MODE==='profundo'?'Profundo':'Clásico')+')</button><label>Código de sala<input id="oc" maxlength="8" placeholder="Ej: k7f3m" autocapitalize="none"></label><button class="btn sec" data-a="join"'+(RM?'':' disabled')+'>Unirme con código</button>'+(old2?'<button class="btn sec" data-a="reconnect">Reconectar a la sala '+esc(old2.online.code.toUpperCase())+'</button>':'')+(OMSG?'<p style="color:var(--ko);font-size:14px">'+esc(OMSG)+'</p>':'')+(RM?'':'<p class="mut" style="font-size:14px">El modo online no está disponible en este navegador.</p>')+'</div>'
  +'<p class="mut center" style="font-size:14px">Si juegan en un solo dispositivo, se lo pasan entre rondas.</p>';
}
function intro(){if(S.online)return introOn();if(S.remote)return introR();
  app.innerHTML=head()+'<div class="card center"><div class="kick">Ronda '+(S.round+1)+'</div><h2>Responde '+nm(ans())+'</h2><p class="mut">'+nm(gue())+', no mires la pantalla. Responde con sinceridad: luego te toca adivinar.</p><button class="btn" data-a="go-answer">Estoy listo/a</button></div>'+board();
}
function question(mode){
  var list=ids(),Q=QS[list[S.i]];
  var who=mode==='a'?nm(ans())+' responde':nm(gue())+' adivina lo que respondió '+nm(ans());
  app.innerHTML=head()+'<div class="bar"><i style="width:'+(S.i/10*100)+'%"></i></div><div class="top"><span>Pregunta '+(S.i+1)+' de 10</span></div>'
  +'<div class="card"><div class="who">'+who+'</div><div class="kick">'+esc(Q.k)+'</div><p class="q">'+esc(Q.q)+'</p>'
  +Q.o.map(function(t,j){return '<button class="opt" data-j="'+j+'">'+esc(t)+'</button>'}).join('')+'</div>';
}
function pass(){
  app.innerHTML=head()+'<div class="card center"><div class="kick">Cambio de turno</div><h2>Pasa el dispositivo a '+nm(gue())+'</h2><p class="mut">Ahora adivina lo que respondió '+nm(ans())+' en las mismas 10 preguntas.</p><button class="btn" data-a="go-guess">Empezar a adivinar</button></div>';
}
function result(){
  var list=ids(),n=0,rows='';
  list.forEach(function(id,k){var Q=QS[id],ok=S.answers[k]===S.guesses[k];if(ok)n++;
    rows+='<li class="'+(ok?'ok':'ko')+'"><b>'+esc(Q.s)+'</b><small>'+nm(ans())+' respondió: '+esc(Q.o[S.answers[k]])+'</small><small>'+nm(gue())+' adivinó: '+esc(Q.o[S.guesses[k]])+(ok?' ✓':' ✗')+'</small></li>'});
  var msg=n>=9?'¡Telepatía total!':n>=7?'¡Te conoce de sobra!':n>=5?'Vas por buen camino':n>=3?'Hay que conocerse más':'Casi desconocidos…';
  var last=S.round+1>=ROUNDS;
  app.innerHTML=head()+'<div class="card center"><div class="kick">Resultado de la ronda</div><div class="big">'+n+'/10</div><h2>'+msg+'</h2><p class="mut">'+nm(gue())+' acertó '+n+' de las respuestas de '+nm(ans())+'.</p></div>'+board()
  +'<ul>'+rows+'</ul>'
  +(last?'<button class="btn" data-a="end">Ver resultado final</button>':'<button class="btn" data-a="next">Siguiente ronda (ahora responde '+nm(gue())+')</button>');
}
function final(){
  S.phase='final';save();
  var a=pct(0),b=pct(1),t=S.played[0]+S.played[1];
  var txt=!t?'Aún no se ha jugado ninguna ronda.':a===b?'Empate: se conocen exactamente igual de bien.':(a>b?nm(0)+' conoce mejor a '+nm(1):nm(1)+' conoce mejor a '+nm(0))+'.';
  var avg=t?Math.round((S.scores[0]+S.scores[1])/t*100):0;
  app.innerHTML='<h1>Resultado final</h1><div class="card center"><div class="big">'+avg+'%</div><p class="mut">de aciertos entre los dos</p><h2>'+txt+'</h2></div>'+board()
  +(S.online||S.remote?'':'<button class="btn" data-a="keep">Seguir jugando</button>')+'<button class="btn sec" data-a="new">Nueva partida</button>';
}

function show(){
  if(S.phase==='rcode')rcodeV();
  else if(S.phase==='rpaste')rpasteV();
  else if(S.phase==='lobby')lobbyV();
  else if(S.phase==='await')awaitV();
  else if(S.phase==='intro')intro();
  else if(S.phase==='answer')question('a');
  else if(S.phase==='pass')pass();
  else if(S.phase==='guess')question('g');
  else if(S.phase==='result')result();
  else final();
}
function setPhase(p){S.phase=p;save();show();window.scrollTo(0,0)}

app.addEventListener('click',function(e){
  var m=e.target.closest('[data-m]');
  if(m){setMode(m.getAttribute('data-m'));homeKeep();return}
  var o=e.target.closest('[data-j]');
  if(o&&S){
    var j=+o.getAttribute('data-j');
    if(S.phase==='answer'){S.answers.push(j);S.i++;if(S.i>=10){S.i=0;if(S.online)onlineAnswered();else if(S.remote)remoteAnswered();else setPhase('pass')}else{save();show()}}
    else if(S.phase==='guess'){S.guesses.push(j);S.i++;
      if(S.i>=10&&S.online){S.i=0;onlineGuessed()}
      else if(S.i>=10&&S.remote){S.i=0;setPhase('rpaste')}
      else if(S.i>=10){var n=0;S.answers.forEach(function(x,k){if(x===S.guesses[k])n++});var g=gue();S.scores[g]+=n;S.played[g]+=10;S.i=0;setPhase('result')}
      else{save();show()}}
    return;
  }
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a');
  if(a==='start'){
    var n0=document.getElementById('n0').value.trim()||'Jugador 1',n1=document.getElementById('n1').value.trim()||'Jugador 2';
    var order=shuffle(QS.map(function(_,i){return i}),rng(Date.now()&0xffffff));
    S={mode:MODE,names:[n0,n1],order:order,round:0,i:0,scores:[0,0],played:[0,0],answers:[],guesses:[],phase:'intro'};
    setPhase('intro');
  }
  else if(a==='resume'){S=load(MODE);S.mode=MODE;show()}
  else if(a==='go-answer'){S.i=0;S.answers=[];S.guesses=[];setPhase('answer')}
  else if(a==='go-guess'){S.i=0;setPhase('guess')}
  else if(a==='rcreate')remoteStart(true);
  else if(a==='rjoin')remoteStart(false);
  else if(a==='rreconnect'){S=loadRem();if(S){setMode(S.mode);show()}}
  else if(a==='r-go'){S.i=0;S.answers=[];S.guesses=[];setPhase(S.round%2===S.remote.me?'answer':'guess')}
  else if(a==='r-copy')copyCode();
  else if(a==='r-reveal')reveal();
  else if(a==='create')createRoom();
  else if(a==='join')joinRoom();
  else if(a==='reconnect'){S=loadOn();if(S){setMode(S.mode);enter()}}
  else if(a==='o-go'){
    S.i=0;S.answers=[];S.guesses=[];S.gstr=null;S.res=null;
    if(S.round%2===S.online.me){S.ost='ans';pub();setPhase('answer')}
    else{S.ost='wait';pub();setPhase('await');syncOnline()}
  }
  else if(a==='next'){S.round++;S.i=0;S.answers=[];S.guesses=[];S.gstr=null;S.res=null;S.ost='';S.rcode=null;S.rerr='';if(S.online)pub();setPhase('intro')}
  else if(a==='end'){final()}
  else if(a==='keep'){
    if(S.answers.length===10&&S.guesses.length===10&&S.round+1<ROUNDS){S.round++}
    else if(S.guesses.length<10&&S.answers.length===10){}
    S.i=0;S.answers=[];S.guesses=[];setPhase('intro');
  }
  else if(a==='new'){try{localStorage.removeItem(S.online?'cmc-online':S.remote?'cmc-remote':KEY(S.mode))}catch(e2){}if(NR){NR.leave().catch(function(){});NR=null}S=null;home()}
});
home();
</script>
</body>
</html>
