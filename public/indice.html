<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Índice</title>
<!-- no-menu -->
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#2a2230;--mut:#7a7083;--ac:#e0457b;--ac2:#7c4dff;--bd:#eadfe6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#17131c;--card:#221c2b;--tx:#f3eef7;--mut:#a99fb5;--bd:#352c40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:30px;line-height:1.15;margin:8px 0 4px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
a.it{display:block;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 18px;margin:10px 0;color:var(--tx);text-decoration:none}
a.it:hover,a.it:active{border-color:var(--ac)}
a.it b{display:block;font-size:18px}
a.it small{color:var(--mut)}
.msg{color:var(--mut);text-align:center;padding:24px 0}
</style>
</head>
<body>
<main>
  <h1>Índice</h1>
  <p class="sub" id="sub">Cargando…</p>
  <div id="list"></div>
</main>
<script>
(function(){
  var list=document.getElementById('list'),sub=document.getElementById('sub');
  function here(href){
    var h=decodeURIComponent(href),p=location.pathname;
    return h===p||h.replace(/\.html?$/,'')===p||(p==='/'&&h==='/indice.html');
  }
  fetch('/_games',{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);return r.json();
  }).then(function(items){
    items=items.filter(function(g){return !here(g.href)});
    sub.textContent=items.length?items.length+' página'+(items.length>1?'s':'')+' en public':'';
    if(!items.length){list.innerHTML='<p class="msg">No hay más archivos .html en public.</p>';return}
    items.forEach(function(g){
      var a=document.createElement('a'),b=document.createElement('b'),s=document.createElement('small');
      a.className='it';a.href=g.href;
      b.textContent=g.title;s.textContent=decodeURIComponent(g.href).replace(/^\//,'');
      a.appendChild(b);a.appendChild(s);list.appendChild(a);
    });
  }).catch(function(){
    sub.textContent='';
    list.innerHTML='<p class="msg">No se pudo cargar la lista. Comprueba que el servidor está activo.</p>';
  });
})();
</script>
</body>
</html>
