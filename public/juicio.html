const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const roleCounts=n=>{const w=n>=9?2:n>=7?1:0;return{w,j:n-3-w}};
function assign(P){
  const n=P.length,{w}=roleCounts(n),left=P.map((_,i)=>i);
  const pick=k=>{const s=left.map(i=>({i,v:P[i][k]*10+(['acu','fis','abo'].includes(P[i].last)?3:0)+Math.random()})).sort((x,y)=>x.v-y.v)[0].i;left.splice(left.indexOf(s),1);return s};
  const acu=pick('acu'),fis=pick('fis'),abo=pick('abo'),tes=[];
  for(let k=0;k<w;k++)tes.push(pick('tes'));
  P.forEach(p=>p.last='jur');
  P[acu].acu++;P[acu].last='acu';P[fis].fis++;P[fis].last='fis';P[abo].abo++;P[abo].last='abo';
  tes.forEach(i=>{P[i].tes++;P[i].last='tes'});
  return{acu,fis,abo,tes,jur:left.slice()};
}
const verdict=v=>{const c=v.filter(x=>x==='C').length,i=v.length-c;return c>i?'C':i>c?'I':'N'};
function score(r,ver,sp,mp){
  const o=[],add=(i,p,t)=>o.push([i,p,t]);
  if(ver==='C')add(r.fis,4,'Condena lograda');
  else if(ver==='I'){add(r.acu,2,'Absuelto');add(r.abo,2,'Absolución lograda')}
  else[r.acu,r.fis,r.abo].forEach(i=>add(i,1,'Juicio nulo'));
  if(!r.quick)r.vot.forEach((i,k)=>{if(ver!=='N'&&r.votes[k]===ver)add(i,1,'Voto acertado')});r.tes.forEach(i=>{if(ver!=='N')add(i,1,'Declaración prestada')});
  const c={};sp.forEach(i=>c[i]=(c[i]||0)+1);
  Object.keys(c).forEach(i=>add(+i,c[i],c[i]+(c[i]>1?' votos especiales':' voto especial')));
  mp.forEach(i=>add(i,2,'Misión cumplida'));
  return o;
}

// Giros: eventos aleatorios que cambian las reglas en pleno juicio [título, texto, segundos extra]
const EVT=[
['🔇 Silencio en la sala','El acusado solo puede responder «sí», «no» o «depende» durante los próximos 20 segundos.'],
['🎵 Rima obligatoria','El fiscal debe hablar en rima hasta que termine esta fase.'],
['🙇 Con todos mis respetos','El abogado debe acabar cada frase con «con todos mis respetos» hasta que termine la fase.'],
['🤫 Susurros','Todos hablan en susurros hasta el final de la fase.'],
['🔄 Mundo al revés','Durante 20 segundos, el fiscal defiende al acusado y el abogado lo acusa.'],
['⏱️ Prórroga del juez','El juez concede 15 segundos más. ¡Aprovechadlos!',15],
['🎭 Ofendidísimo','El acusado debe responder como si estuviera profundamente ofendido.'],
['🕵️ Dato nuevo','Quien esté en el jurado más cerca de la ventana debe aportar un dato nuevo y absurdo sobre el caso.'],
['📣 ¡Protesto!','Cualquiera puede gritar «¡Protesto!» una vez: quien hablaba debe repetir su última frase con otras palabras.'],
['🐌 Cámara lenta','Todos hablan muy despacio durante los próximos 20 segundos.']
];
EVT.push(['🙋 Pregunta del jurado','{j} hace una pregunta al acusado, que debe responder con total sinceridad… o casi.'],['🔎 Careo','El fiscal y el abogado se hacen una pregunta el uno al otro y deben responder sin mentir.'],['🗣️ Testigo de última hora','{j} entra como testigo sorpresa y tiene 15 segundos para contar algo que «vio». Puede inventarlo.'],['🎬 Repetición','El acusado debe repetir su última frase, pero exagerando mucho más.'],['🚨 Sospecha','{j} señala a una persona de la sala y dice por qué sospecha de ella. Esa persona debe defenderse.']);
// Fases en las que tiene sentido cada giro (mismo orden que EVT)
const EVP=[['int','alc'],['int','tes','alf'],['int','tes','ala'],['int','tes','alf','ala','alc'],['int','tes'],['int','tes','alf','ala','alc'],['int','alc'],['int','tes'],['int','tes'],['int','tes','alf','ala','alc'],['int','tes'],['int','tes'],['tes','alf'],['int','alc'],['tes','alf','ala']];
// Misiones secretas (+2 puntos si se cumplen sin que nadie sospeche)
const MIS=['Consigue decir la palabra «patata» sin que nadie sospeche.','Haz reír a alguien sin contar ningún chiste.','Menciona un animal que no haya salido en el juicio.','Termina una frase con «y esa es la verdad».','Consigue que alguien asienta con la cabeza dos veces.','Pide permiso para beber agua en mitad de tu intervención.','Usa la palabra «evidentemente» tres veces.','Guiña un ojo al jurado una sola vez, con disimulo.'];
const PH=[
{k:'del',g:0,n:'El delito',d:0},
{k:'pre',g:1,n:'Preparación',d:45,i:'El acusado y su abogado preparan la defensa. El fiscal prepara la acusación.'},
{k:'int',g:2,n:'Interrogatorio',d:45,i:'El fiscal interroga al acusado, que responde en directo. El abogado puede intervenir UNA vez.'},
{k:'tes',g:3,n:'Testigos',d:60,i:'Los testigos declaran (pueden mentir). El fiscal y el abogado pueden hacerles preguntas.'},
{k:'alf',g:4,n:'Alegato del fiscal',d:30,i:'El fiscal presenta sus conclusiones al jurado.'},
{k:'ala',g:4,n:'Alegato de la defensa',d:30,i:'El abogado defensor intenta convencer al jurado.'},
{k:'alc',g:4,n:'Última palabra',d:15,i:'El acusado hace su última declaración.'}
];
const GR=['El delito','Defensa','Interrogatorio','Testigos','Alegatos','Veredicto'];
const VER={C:'CULPABLE',I:'INOCENTE',N:'JUICIO NULO'};

const $a=document.getElementById('app'),KEY='juicio-partida-v3';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let G=null,S={names:['','','',''],R:5,T:1},M=null,AC,LT=Date.now();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}};
const saved=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const beep=(f=660,d=.15)=>{try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
const nm=i=>esc(G.P[i].n);
const fill=s=>s.replace(/\{a\}/g,G.P[G.r.acu].n).replace(/\{d\}/g,CASOS[G.r.caso][0]);
const rem=r=>r.rem!=null?r.rem:r.dur-(Date.now()-r.t0);
function pickUnused(n,used){let c=[...Array(n).keys()].filter(i=>!used.includes(i));if(!c.length){used.length=0;c=[...Array(n).keys()]}const i=c[Math.floor(Math.random()*c.length)];used.push(i);return i}

function newRound(){
  const ci=pickUnused(CASOS.length,G.used.c),roles=assign(G.P);
  const r={...roles,caso:ci,ph:0,votes:[],vot:sh([roles.fis,roles.abo,...roles.tes,...roles.jur]),sp:[],mp:[],proofs:[],queue:[roles.acu,roles.fis,roles.abo,...roles.tes],q:0,show:false,t0:0,dur:0,rem:null,mis:{}};
  r.pist=sh(CASOS[ci][5]||GEN).slice(0,roles.tes.length);
  const ms=sh(MIS);r.queue.forEach((i,k)=>r.mis[i]=ms[k]);
  const ok=['int','tes','alf','ala','alc'].filter(k=>k!=='tes'||roles.tes.length);
  const slots=['int',roles.tes.length?'tes':'alf','ala'];
  G.r=r;
  for(const [n,s] of slots.entries()){const pi=PH.findIndex(p=>p.k===s),pr=pickUnused(PRUEBAS.length,G.used.p),pe=n?PRUEBAS[pr]:sh(CP)[0];r.proofs.push({c:pe[0],t:pe[1],ph:pi,at:n?5+Math.random()*(PH[pi].d-12):2,sh:0})}
  const ne=Math.random()<.75?(Math.random()<.4?2:1):0;
  sh(EVT.map((e,k)=>[e,EVP[k].filter(x=>ok.includes(x))])).filter(x=>x[1].length).slice(0,ne).forEach(([ev,ks])=>{const pi=PH.findIndex(p=>p.k===sh(ks)[0]);r.proofs.push({c:ev[0],t:ev[1].replace(/\{j\}/g,G.P[sh(roles.jur.length?roles.jur:[roles.fis])[0]].n),x:ev[2]||0,e:1,ph:pi,at:3+Math.random()*Math.max(3,PH[pi].d-10),sh:0})});
  G.scr='phase';save();render();
}
function startPh(){const r=G.r;r.t0=Date.now();r.dur=PH[r.ph].d*1000*(G.T||1);r.rem=null;beep(520,.2)}
function nextPh(){
  const r=G.r;r.proofs.forEach(p=>{if(p.ph===r.ph&&!p.sh&&!p.e)p.sh=1});r.ph++;
  if(PH[r.ph]&&PH[r.ph].k==='tes'&&!r.tes.length)r.ph++;
  if(r.ph>=PH.length){G.scr='vote';r.q=0;r.show=false}else startPh();
  save();render();
}
function startGame(){
  let names=S.names.map(x=>x.trim()).filter(Boolean);
  if(names.length<4){alert('Hacen falta al menos 4 jugadores con nombre.');return}
  const seen={};names=names.map(n=>{seen[n]=(seen[n]||0)+1;return seen[n]>1?n+' '+seen[n]:n});
  G={P:names.map(n=>({n,s:0,acu:0,fis:0,abo:0,tes:0,last:''})),R:S.R,T:S.T,k:1,used:{c:[],p:[]},hist:[],scr:'phase'};
  newRound();
}
function finishRound(skipped){
  const r=G.r;
  G.hist.push({k:G.k,d:CASOS[r.caso][0],a:G.P[r.acu].n,v:skipped?'Ronda saltada':VER[r.ver]});
  if(skipped)r.pts=[];
  G.scr='summary';save();render();
}
function act(a,v,i){
  const r=G&&G.r;
  switch(a){
  case 'add':if(S.names.length<12)S.names.push('');break;
  case 'del':S.names.splice(+i,1);break;
  case 'start':return startGame();
  case 'cont':G=saved();break;
  case 'rev':G.scr='reveal';r.q=0;r.show=false;break;
  case 'show':r.show=true;break;
  case 'hide':r.show=false;r.q++;if(r.q>=r.queue.length){G.scr='phase';r.ph=1;startPh()}break;
  case 'pz':if(r.rem==null)r.rem=r.dur-(Date.now()-r.t0);else{r.t0=Date.now()-(r.dur-r.rem);r.rem=null}break;
  case 'pp':if(r.rem==null){r.rem=r.dur-(Date.now()-r.t0);r.pkp=1}else r.pkp=0;r.pk=null;G.scr='peek';break;
  case 'pk':r.pk=+i;break;
  case 'pkx':if(r.pkp){r.t0=Date.now()-(r.dur-r.rem);r.rem=null;r.pkp=0}r.pk=null;G.scr='phase';break;
  case 'p15':r.dur+=15000;break;
  case 'nx':return nextPh();
  case 'skip':if(!confirm('¿Saltar esta ronda? No se darán puntos.'))return;return finishRound(true);
  case 'vt':if(v!=='C'&&v!=='I')return;r.votes.push(v);r.show=false;r.q++;
    if(r.q>=r.vot.length){r.ver=verdict(r.votes);G.scr='verdict'}break;
  case 'qv0':G.scr='qv';break;
  case 'qv':{const c=+document.getElementById('qc').value||0,n=+document.getElementById('qi').value||0;if(c+n<2){alert('Hace falta al menos 2 votos.');return}r.votes=[...Array(c).fill('C'),...Array(n).fill('I')];r.quick=1;r.ver=verdict(r.votes);G.scr='verdict';break}
  case 'spgo':G.scr='special';r.q=0;r.show=false;break;
  case 'sp':{
    const p=r.q;[0,1,2].forEach(c=>{const el=document.getElementById('sp'+c);if(!el||el.value==='')return;const t=+el.value;
      if(t===p||t<0||t>=G.P.length||(c===2&&!r.tes.includes(t)))return;r.sp.push(t);G.P[t]['k'+c]=(G.P[t]['k'+c]||0)+1});
    r.show=false;r.q++;
    if(r.q>=G.P.length)G.scr='mis';break}
  case 'mi':{r.mp=r.queue.filter(j=>{const e=document.getElementById('mi'+j);return e&&e.checked});
    if(r.ver==='C')G.P[r.acu].cnd=(G.P[r.acu].cnd||0)+1;r.pts=score(r,r.ver,r.sp,r.mp);r.pts.forEach(([j,p])=>G.P[j].s+=p);return finishRound(false)}
  case 'next':if(G.k>=G.R)G.scr='final';else{G.k++;return newRound()}break;
  case 'new':G=null;try{localStorage.removeItem(KEY)}catch(e){}break;
  case 'm':M={k:v};break;
  case 'mc':M=null;break;
  case 'tv':document.body.classList.toggle('tv');break;
  }
  save();render();
}

const priv=i=>{const r=G.r,c=CASOS[r.caso];return i===r.acu?c[2]:i===r.fis?c[3]:i===r.abo?c[4]:r.pist[r.tes.indexOf(i)]};
const roleName=i=>{const r=G.r;return i===r.acu?'🔒 Eres el ACUSADO':i===r.fis?'⚖️ Eres el FISCAL':i===r.abo?'🛡️ Eres el ABOGADO DEFENSOR':'🎤 Eres TESTIGO'};
const skipBtn=()=>'<button class="sec" data-a="skip">⏭ Saltar ronda</button>';
function court(){
  const r=G.r,s=(c,l,i)=>`<div class="seat ${c}"><small>${l}</small><b>${nm(i)}</b></div>`;
  return `<div class="card"><div class="row">${s('','⚖️ Fiscal',r.fis)}${s('acu','🔒 Estrado · Acusado',r.acu)}${s('','🛡️ Abogado',r.abo)}</div>`+
    (r.tes.length?`<div class="row">${r.tes.map(i=>s('','🎤 Testigo',i)).join('')}</div>`:'')+
    `<div class="row">${r.jur.map(i=>s('','👥 Jurado',i)).join('')}</div></div>`;
}
const board=()=>`<div class="card"><h3>🏆 Ranking</h3>${G.P.map(p=>[p.n,p.s]).sort((a,b)=>b[1]-a[1]).map(([n,s],k)=>`<div class="rk"><span>${k+1}. ${esc(n)}</span><b>${s}</b></div>`).join('')}</div>`;
function side(){
  const vis=G.r.proofs.filter(p=>p.sh&&!p.e);
  return `<div class="card"><h3>🔎 Pruebas</h3>${vis.length?vis.map(p=>`<div class="pr"><small>${p.c}</small><br>${esc(fill(p.t))}</div>`).join(''):'<p class="mut">Pronto aparecerá la primera prueba del caso…</p>'}<p class="mut small">⚡ En cualquier momento puede haber un giro inesperado.</p></div>`+board();
}
function setup(){
  const sv=saved();
  return `<div class="card"><h2>Jugadores</h2><p class="mut">De 4 a 12 (mejor 5 o más). Jugáis en persona y usáis la web para repartir papeles, misiones secretas, tiempos, giros y votos: cada uno ve su información secreta cuando le pasáis el móvil.</p>`+
  S.names.map((n,i)=>`<div class="pl"><input data-n="${i}" value="${esc(n)}" placeholder="Jugador ${i+1}" maxlength="16">${S.names.length>4?`<button class="sec" data-a="del" data-i="${i}" aria-label="Quitar">✕</button>`:''}</div>`).join('')+
  `<button class="sec" data-a="add">+ Jugador</button><p>Rondas: <select data-r="1" style="width:auto">${[3,5,8,10].map(x=>`<option ${x===S.R?'selected':''}>${x}</option>`).join('')}</select> · Ritmo: <select data-t="1" style="width:auto">${[['Rápido',.7],['Normal',1],['Largo',1.5]].map(([l,x])=>`<option value="${x}" ${x===S.T?'selected':''}>${l}</option>`).join('')}</select></p><button data-a="start">Abrir la sesión ▶</button>${sv&&sv.scr?'<button class="sec" data-a="cont">Continuar partida guardada</button>':''}</div>`;
}
function opening(){
  const r=G.r,c=CASOS[r.caso];
  return `<div class="card center"><div class="stamp">SE ABRE LA SESIÓN</div><p class="big">Se acusa a <b>${nm(r.acu)}</b> de <b>${esc(c[0])}</b>.</p><p class="mut">${esc(c[1])}</p>${c[6]?'<div class="pr">🧠 <b>Caso con dilema:</b> no basta con saber qué pasó. El jurado debe decidir si estuvo bien o mal.</div>':''}</div>${court()}<div class="card"><p>Ahora cada jugador con papel secreto verá su información y su <b>misión secreta</b> en privado. Pasad el móvil cuando se indique.</p><button data-a="rev">Repartir papeles ▶</button>${skipBtn()}</div>`;
}
function timed(){
  const r=G.r,p=PH[r.ph];
  return `<div class="grid"><div>${court()}${r.ev&&r.ev.ph===r.ph?`<div class="card center" style="border-color:var(--red)"><b>⚡ ${esc(r.ev.c)}</b><br>${esc(r.ev.t)}</div>`:''}<div class="card center"><h2>${p.n}</h2><p class="big">${esc(p.i)}</p><button class="sec" data-a="pz">${r.rem!=null?'▶ Reanudar':'⏸ Pausa'}</button><button class="sec" data-a="pp">🔒 Ver mi papel</button><button class="sec" data-a="p15">+15 s</button><button data-a="nx">Siguiente fase ▶</button>${skipBtn()}</div></div><div>${side()}</div></div>`;
}
const pass=(i,a,t)=>`<div class="card center"><p>Pasa el móvil a</p><h2 class="big">${nm(i)}</h2><p class="mut">El resto, mirad a otro lado 👀</p><button data-a="${a}">Soy ${nm(i)} · ${t}</button></div>`;
function reveal(){
  const r=G.r,i=r.queue[r.q];
  return r.show?`<div class="card center"><h3>${roleName(i)}</h3><p class="big">${esc(fill(priv(i)))}</p><div class="pr">🎯 <b>Misión secreta (+2 puntos):</b> ${esc(r.mis[i])}</div><p class="mut">Solo tú puedes ver esto.</p><button data-a="hide">Ya lo leí · ocultar</button></div>`:pass(i,'show','ver mi papel');
}
function voteScr(){
  const r=G.r,i=r.vot[r.q],c=CASOS[r.caso];
  return r.show?`<div class="card center"><h3>Tu voto es secreto</h3><p class="big">¿${esc(G.P[r.acu].n)} es culpable?</p>${c[6]?'<p class="mut">Piensa: ¿estuvo bien o mal lo que hizo?</p>':''}<button class="bad" data-a="vt" data-v="C">CULPABLE</button><button class="good" data-a="vt" data-v="I">INOCENTE</button></div>`:pass(i,'show','votar')+'<div class="center"><button class="sec" data-a="qv0">⚡ Votación rápida (todos a la vez)</button></div>';
}
function verdictScr(){
  const r=G.r,c=r.votes.filter(x=>x==='C').length;
  return `<div class="card center"><p class="mut">El jurado ha votado…</p><div class="res ${r.ver}">${VER[r.ver]}</div><p>Culpable: <b>${c}</b> · Inocente: <b>${r.votes.length-c}</b>${r.ver==='N'?' · ¡Empate!':''}</p><button data-a="spgo">Votaciones especiales ▶</button></div>${court()}`;
}
function specialScr(){
  const r=G.r,i=r.q;
  if(!r.show)return pass(i,'show','votar');
  const opts=l=>`<option value="">— nadie —</option>`+l.filter(j=>j!==i).map(j=>`<option value="${j}">${nm(j)}</option>`).join('');
  const all=G.P.map((_,j)=>j);
  return `<div class="card"><h3 class="center">Votaciones especiales</h3><p class="mut center">Cada voto recibido vale 1 punto. No puedes votarte a ti mismo.</p><label>🎭 Mejor actuación<select id="sp0">${opts(all)}</select></label><label>💡 Mejor argumento<select id="sp1">${opts(all)}</select></label>${r.tes.length?`<label>🤪 Testimonio más absurdo<select id="sp2">${opts(r.tes)}</select></label>`:''}<div class="center"><button data-a="sp">Enviar y pasar</button></div></div>`;
}
function peekScr(){const r=G.r;if(r.pk==null)return `<div class="card center"><h3>🔒 Ver mi papel</h3><p class="mut">El tiempo está en pausa. Pulsa tu nombre; el resto, mirad a otro lado 👀</p>${r.queue.map((j,k)=>`<button data-a="pk" data-i="${k}">Soy ${nm(j)}</button>`).join('')}<br><button class="sec" data-a="pkx">Volver</button></div>`;const i=r.queue[r.pk];return `<div class="card center"><h3>${roleName(i)}</h3><p class="big">${esc(fill(priv(i)))}</p><div class="pr">🎯 <b>Misión secreta (+2 puntos):</b> ${esc(r.mis[i])}</div><button data-a="pkx">Ocultar y volver</button></div>`}
function qvScr(){return `<div class="card center"><h3>⚡ Votación rápida</h3><p class="mut">Todos cierran los ojos, el acusado se tapa los oídos y quien lleve el móvil cuenta las manos alzadas (máximo ${G.r.vot.length} votos). Esta forma no da puntos por voto acertado.</p><label>Culpable<input id="qc" type="number" min="0" value="0"></label><label>Inocente<input id="qi" type="number" min="0" value="0"></label><button data-a="qv">Ver veredicto ▶</button></div>`}
function misScr(){
  const r=G.r;
  return `<div class="card"><h3 class="center">🎯 Misiones secretas</h3><p class="mut center">Cada uno revela su misión. Cuenta si lo hizo y la mayoría lo admite al revelarlo; si hay dudas, se vota a mano alzada. Marca las cumplidas (+2 puntos).</p>${r.queue.map(i=>`<label class="ml"><input type="checkbox" id="mi${i}"><span><b>${nm(i)}</b>: ${esc(r.mis[i])}</span></label>`).join('')}<div class="center"><button data-a="mi">Contar puntos ▶</button></div></div>`;
}
function summary(){
  const r=G.r,by={};(r.pts||[]).forEach(([i,p,t])=>{(by[i]=by[i]||[]).push([p,t])});
  const rows=Object.keys(by).map(i=>`<div class="rk"><span>${nm(i)}: ${by[i].map(x=>esc(x[1])).join(', ')}</span><b>+${by[i].reduce((s,x)=>s+x[0],0)}</b></div>`).join('')||'<p class="mut">Sin puntos esta ronda.</p>';
  return `<div class="grid"><div class="card"><h2>${r.ver?'Veredicto: '+VER[r.ver]:'Ronda saltada'}</h2>${rows}<button data-a="next">${G.k>=G.R?'Ver ranking final ▶':'Siguiente juicio ▶'}</button></div><div>${board()}</div></div>`;
}
function final(){
  const m=['🥇','🥈','🥉'],T=[['🎭 Mejor actor','k0'],['💡 Mejor orador','k1'],['🤪 Rey del absurdo','k2'],['🚨 El más condenado','cnd']].map(([t,k])=>{const b=G.P.slice().sort((x,y)=>(y[k]||0)-(x[k]||0))[0];return b[k]?`<div class="pr">${t}: <b>${esc(b.n)}</b> (${b[k]})</div>`:''}).join('');
  return `<div class="card center"><div class="stamp">SE LEVANTA LA SESIÓN</div>${T}${G.P.map(p=>[p.n,p.s]).sort((a,b)=>b[1]-a[1]).map(([n,s],k)=>`<div class="rk big"><span>${m[k]||k+1+'.'} ${esc(n)}</span><b>${s}</b></div>`).join('')}<button data-a="new">Nueva partida</button></div>`;
}
function tools(){return `<div class="center"><button class="sec" data-a="m" data-v="tut">Tutorial</button><button class="sec" data-a="tv">📺 Modo tele</button>${G?'<button class="sec" data-a="m" data-v="hist">Historial</button><button class="sec" data-a="new">Salir</button>':''}</div>`}
function modal(){
  if(!M)return '';
  let h='';
  if(M.k==='proof'){const e=M.t.e;h=`<div class="center"><div class="stamp ${e?'gi':''}">${e?'⚡ ¡GIRO!':'NUEVA PRUEBA'}</div><p class="mut">${esc(M.t.c)}</p><p class="big">${esc(e?M.t.t:fill(M.t.t))}</p><p class="mut">${e?'Se aplica desde ya.':'Nadie sabe qué significa. Interpretadla a vuestro favor.'}</p></div>`}
  else if(M.k==='hist')h=`<h2>Historial</h2>`+(G.hist.length?G.hist.map(x=>`<div class="pr"><b>Juicio ${x.k}:</b> ${esc(x.a)} · ${esc(x.d)}<br><b>${esc(x.v)}</b></div>`).join(''):'<p class="mut">Todavía no hay juicios.</p>');
  else h=`<h2>Cómo se juega</h2><p>Cada ronda se juzga un delito absurdo. Se reparten papeles: <b>acusado, fiscal, abogado, testigos y jurado</b>.</p><p>Hablad en persona; la web reparte la información secreta, marca los tiempos y cuenta los votos.</p><p><b>⚡ Pruebas y giros:</b> en cualquier momento puede aparecer una prueba absurda (improvisad su significado) o un giro que cambia las reglas. Puede que no aparezca nada… o que aparezca todo.</p><p><b>🎯 Misiones:</b> cada papel recibe una misión secreta que vale 2 puntos si la cumple sin que lo noten.</p><p><b>🧠 Dilemas:</b> algunos casos obligan al jurado a decidir si algo estuvo bien o mal.</p><p class="mut">Los papeles rotan solos para que todos pasen por el estrado.</p>`;
  return `<div id="mo"><div class="card">${h}<div class="center"><button data-a="mc">${M.k==='proof'?'Entendido':'Cerrar'}</button></div></div></div>`;
}
function render(){
  const timedNow=G&&G.scr==='phase'&&G.r.ph>0;
  const g=!G?0:G.scr==='reveal'?0:G.scr==='phase'||G.scr==='peek'?PH[G.r.ph].g:5;
  const body=!G?setup():({phase:()=>G.r.ph===0?opening():timed(),reveal,vote:voteScr,verdict:verdictScr,special:specialScr,mis:misScr,qv:qvScr,peek:peekScr,summary,final})[G.scr]();
  const bar=G&&G.r&&((G.scr==='phase'&&G.r.ph>=1)||['vote','verdict','special','mis','qv'].includes(G.scr))?`<div class="card center" style="position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 12px"><small class="mut">⚖️ Se acusa a</small> <b>${nm(G.r.acu)}</b> <small class="mut">de</small> <b>${esc(CASOS[G.r.caso][0])}</b></div>`:'';
  $a.innerHTML=`<header><h1>⚖️ EL JUICIO</h1>${G&&G.scr!=='final'?`<div id="steps">${GR.map((x,i)=>`<span class="${i===g?'on':''}">${x}</span>`).join('')}</div>${timedNow?'<div id="clock"></div>':''}`:''}</header>${G?`<p class="mut small">Juicio ${G.k} de ${G.R}</p>`:''}${bar}${body}${tools()}${modal()}`;
  tick(true);
}
function tick(noAdvance){
  if(!G||G.scr!=='phase'||G.r.ph<1)return;
  const r=G.r,now=Date.now();if(M&&r.rem==null)r.t0+=Math.min(now-LT,1000);LT=now;const t=rem(r),c=document.getElementById('clock');
  if(c){const s=Math.max(0,Math.ceil(t/1000));c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');c.classList.toggle('low',s<=10)}
  if(noAdvance||r.rem!=null||M)return;
  const el=r.dur-t;
  for(const p of r.proofs)if(!p.sh&&p.ph===r.ph&&el>=p.at*1000){p.sh=1;if(p.x)r.dur+=p.x*1000;if(p.e)r.ev={c:p.c,t:p.t,ph:r.ph};M={k:'proof',t:p};beep(p.e?220:880,.12);setTimeout(()=>beep(p.e?330:1175,.2),140);save();render();return}
  if(t<=0){beep(300,.4);nextPh()}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v,b.dataset.i)});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.n!==undefined)S.names[+e.target.dataset.n]=e.target.value});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.r)S.R=+e.target.value;if(e.target.dataset&&e.target.dataset.t)S.T=+e.target.value});
setInterval(()=>tick(false),250);
render();
</script>
