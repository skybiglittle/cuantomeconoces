<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Juicio</title>
<style>
:root{--wood:#22140d;--wood2:#3a2417;--felt:#14402d;--brass:#d8ad4b;--ink:#f5eddc;--mut:#c2b49a;--red:#d9543f;--grn:#4fbf87}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,var(--wood2),var(--wood) 70%);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",sans-serif}
#app{max-width:1020px;margin:0 auto;padding:12px}
h1,h2,h3,.stamp{font-family:"Palatino Linotype","Book Antiqua",Palatino,serif;margin:0 0 6px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-bottom:10px}
h1{font-size:clamp(28px,6vw,44px);letter-spacing:2px;color:var(--brass)}
#steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
#steps span{padding:3px 10px;border-radius:99px;border:1px solid #6b5230;color:var(--mut);font-size:13px}
#steps .on{background:var(--brass);color:#2a1a0c;border-color:var(--brass);font-weight:700}
#clock{font:700 36px "Palatino Linotype",serif;color:var(--brass);min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
#clock.low{color:var(--red)}
.card{background:var(--felt);border:2px solid #7a5d2a;border-radius:14px;padding:14px;margin-bottom:12px}
.center{text-align:center}.mut{color:var(--mut)}.small{font-size:13px;margin:0 0 6px}.big{font-size:20px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
button,select,input{font:inherit;border-radius:10px;border:1px solid #7a5d2a}
button{background:var(--brass);color:#2a1a0c;font-weight:700;padding:10px 16px;cursor:pointer;margin:6px 6px 0 0}
button.sec{background:#2a1a10;color:var(--ink)}button.bad{background:var(--red);color:#fff}button.good{background:var(--grn);color:#08241a}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
input,select{background:#0d2a1d;color:var(--ink);padding:9px 12px}
.pl{display:flex;gap:6px;margin-bottom:6px}.pl input{flex:1}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.seat{background:#0d2a1d;border:1px solid #7a5d2a;border-radius:10px;padding:6px 12px;text-align:center;min-width:110px}
.seat small{display:block;color:var(--mut);font-size:12px}
.seat.acu{border-color:var(--brass);border-width:2px;min-width:150px}
.stamp{font-size:clamp(26px,6vw,46px);color:var(--brass);letter-spacing:3px}
.rk{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #3d6b55}
.pr{margin:8px 0;padding:8px;background:#0d2a1d;border-left:4px solid var(--brass);border-radius:6px}
.res{display:inline-block;font:700 clamp(34px,9vw,70px) "Palatino Linotype",serif;border:6px solid;padding:4px 22px;border-radius:10px;animation:st .7s both;margin:10px 0}
.res.C{color:var(--red)}.res.I{color:var(--grn)}.res.N{color:var(--mut)}
@keyframes st{0%{transform:scale(3) rotate(-12deg);opacity:0}60%{transform:scale(.9) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
#mo{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:14px;z-index:9}
#mo .card{max-width:520px;width:100%;max-height:90vh;overflow:auto;margin:0}
label{display:block;margin:8px 0 2px;text-align:left}select{width:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// <LOGIC>
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const roleCounts=n=>{const w=n>=9?2:n>=7?1:0;return{w,j:n-3-w}};
// Reparto de papeles: gana quien menos veces ha tenido ese papel; se evita repetir papel importante dos rondas seguidas.
function assign(P){
  const n=P.length,{w}=roleCounts(n),left=P.map((_,i)=>i);
  const pick=k=>{const s=left.map(i=>({i,v:P[i][k]*10+(['acu','fis','abo'].includes(P[i].last)?3:0)+Math.random()})).sort((x,y)=>x.v-y.v)[0].i;left.splice(left.indexOf(s),1);return s};
  const acu=pick('acu'),fis=pick('fis'),abo=pick('abo'),tes=[];
  for(let k=0;k<w;k++)tes.push(pick('tes'));
  P.forEach(p=>p.last='jur');
  P[acu].acu++;P[acu].last='acu';P[fis].fis++;P[fis].last='fis';P[abo].abo++;P[abo].last='abo';
  tes.forEach(i=>{P[i].tes++;P[i].last='tes'});
  return{acu,fis,abo,tes,jur:left.slice()};
}
const verdict=v=>{const c=v.filter(x=>x==='C').length,i=v.length-c;return c>i?'C':i>c?'I':'N'};
function score(r,ver,sp){
  const o=[],add=(i,p,t)=>o.push([i,p,t]);
  if(ver==='C')add(r.fis,3,'Condena lograda');
  else if(ver==='I'){add(r.acu,3,'Absuelto');add(r.abo,3,'Absolución lograda')}
  else[r.acu,r.fis,r.abo].forEach(i=>add(i,1,'Juicio nulo'));
  r.jur.forEach((i,k)=>{if(ver!=='N'&&r.votes[k]===ver)add(i,1,'Voto acertado')});
  const c={};sp.forEach(i=>c[i]=(c[i]||0)+1);
  Object.keys(c).forEach(i=>add(+i,c[i],c[i]+(c[i]>1?' votos especiales':' voto especial')));
  return o;
}
// </LOGIC>

// ---- Casos: [delito, descripción, info acusado, info fiscal, info abogado, [3 pistas para testigos]] ({a} = nombre del acusado)
const CASOS=[
['haber sustituido 300 kilos de croquetas por brócoli','La cena de la comunidad de vecinos terminó en una crisis nacional de verduras.','Compraste el brócoli, pero fue por «salud». Las croquetas ya habían desaparecido cuando llegaste.','Sabes que {a} salió de la tienda con 12 bolsas y una sonrisa que nadie había visto antes.','Tu cliente es alérgico a la bechamel. Úsalo con elegancia, aunque nadie lo crea.',['Vi a {a} entrar en la cocina con guantes de horno a las 3:00.','Esa noche olía a verdura hervida desde la calle, y {a} estaba durmiendo en casa.','Un pato con gafas de sol vigilaba la puerta de la cocina.']],
['haber enseñado a hablar a las palomas para que reclamen impuestos','Desde el lunes, las palomas de la plaza exigen el 21 % de cada bocadillo.','Solo enseñaste a una paloma a decir «buenos días». Las demás aprendieron solas.','Hay un vídeo en el que {a} susurra «tú puedes» a una paloma. No sabes qué prueba, pero suena fatal.','Tu cliente dio miguitas a las palomas durante años. Eso es cariño, no una conspiración.',['Oí a una paloma decir «tienes que declarar los ingresos» con el acento de {a}.','Las palomas ya hablaban así antes de que {a} llegara al barrio.','La paloma más gorda lleva un maletín y nadie sabe de dónde lo ha sacado.']],
['haber cambiado el himno nacional por la canción del Mercadona','El partido de gala empezó con una voz anunciando «hacendado, hacendado».','Solo querías probar el altavoz nuevo. Tenías la lista de reproducción en aleatorio.','El móvil de {a} tiene una playlist llamada «Himno Oficial v2 definitivo».','Tu cliente tiene un oído tan fino que confundió los dos cantos. Cualquiera se equivoca.',['{a} se levantó a cantar con la mano en el pecho y los ojos cerrados.','El técnico de sonido estaba dormido, y {a} no estaba ni cerca.','Había una cesta de la compra junto al micrófono, llena de aceitunas.']],
['haber cambiado el nombre del wifi de todo el edificio a «Aquí vive un fantasma»','Los vecinos del segundo no vuelven a conectarse ni por favor.','Solo cambiaste el tuyo. El resto se contagió, como un resfriado.','El router del portal guarda un registro a nombre de {a} a las 2:47 de la madrugada.','Tu cliente no sabe ni reiniciar un router. Haz que ese desconocimiento sea evidente.',['Vi a {a} bajar al trastero con una linterna y una sábana.','El wifi empezó a llamarse así cuando {a} estaba de viaje.','Cada noche, a las 2:47, se oyen arrastrar cadenas hechas de cables de red.']],
['haber convencido a 40 turistas de que la fuente de la plaza era un cenote sagrado','Los turistas llevaban incienso y bañador y cantaban en un idioma inventado.','Dijiste «es una fuente muy especial». Lo del cenote lo añadieron ellos.','Hay un cartel pintado a mano: «CENOTE · ENTRADA 5 €». La letra se parece mucho a la de {a}.','Tu cliente es guía sin licencia pero con una pasión desbordante. Eso no es delito, es entusiasmo.',['{a} cobraba la entrada con una hucha en forma de cerdito.','Los turistas aseguran que {a} solo señaló la fuente y se encogió de hombros.','El agua de la fuente brillaba, seguramente por culpa de un exceso de purpurina.']],
['haber patentado «el abrazo en conserva»','Ya hay 2.000 latas a la venta con una etiqueta que dice «abrir cuando lo necesites».','Solo dabas abrazos de muestra. La fábrica la montó tu primo.','En la primera lata aparece la huella de {a} y la frase «gracias por la inspiración».','Tu cliente es un incomprendido: los abrazos de verdad no caducan. Eso es una buena noticia.',['Compré una lata y estaba vacía, pero me sentí raramente reconfortado.','{a} me dijo que las latas se abren con cariño y no se devuelven.','La fecha de caducidad de la lata dice «cuando te acuerdes».']],
['haber escondido todos los mandos de la televisión del barrio','Cuarenta salones llevan tres días con el mismo canal y nadie puede cambiarlo.','Hiciste una colecta de mandos «para reciclar». Se te olvidó devolverlos.','En el trastero de {a} hay 38 mandos y una mantita para cada uno.','Tu cliente quería que sus vecinos probaran el silencio. Sé creativo.',['Vi a {a} salir de un portal con una bolsa que sonaba a pilas.','El mando de mi tele apareció dentro de una maceta, con una pegatina de corazón.','Un gato con bufanda lleva dos días maullando exactamente «canal 7».']],
['haber convencido a un grupo de jubilados para fundar una banda de rock','Se hacen llamar «Los Reumas del Infierno» y han reventado la sala de bingo.','Solo diste una clase de guitarra. Ellos eligieron el nombre, el maquillaje y el volumen.','Existe una carta de {a} al grupo que dice «ni se os ocurra parar».','Tu cliente cree en el rock a cualquier edad. Lo que importa es el ruido bien hecho.',['La batería la tocaba Pepita, 84 años, con los ojos cerrados y mucho sentimiento.','Fue {a} quien sugirió que el concierto fuera «de pie y con andador».','Se encontró una guitarra eléctrica envuelta en una mantita de ganchillo.']]
];
// ---- Pruebas sorpresa: [categoría, texto]. Sin interpretación correcta: los jugadores improvisan.
const PRUEBAS=[
['📷 Fotografía','Una foto borrosa de {a} sosteniendo una bolsa enorme y sospechosamente llena de patatas.'],
['📷 Fotografía','Una foto de {a} saludando con mucha complicidad a un pato.'],
['📷 Fotografía','Una selfie de {a} con la fecha del delito y una cara de «yo no he sido» demasiado ensayada.'],
['🧤 Objeto encontrado','Una patata con las iniciales de {a} grabadas con cariño.'],
['🧤 Objeto encontrado','Un calcetín con una nota: «Perdón por lo del jueves».'],
['🧤 Objeto encontrado','Un silbato de árbitro con las huellas de {a}.'],
['💬 Mensaje','Una nota que dice: «La operación Croqueta comienza a las 22:00».'],
['💬 Mensaje','Un mensaje de {a} a las 4:12: «ya está hecho, no se lo digas a mamá».'],
['💬 Mensaje','Un chat de grupo llamado «Los Inocentes» donde {a} escribe «borrad esto».'],
['🧾 Recibo','Un recibo por 450 kilos de algo ilegible, a nombre de {a}.'],
['🧾 Recibo','Una factura por 12 disfraces de langosta, pagada por {a} en efectivo.'],
['📄 Documento oficial','Un permiso firmado por «El Excelentísimo Señor de las Cuatro de la Tarde».'],
['📄 Documento oficial','Un carnet de socio del Club de Amigos de la Confusión, con la foto de {a}.'],
['🎙️ Grabación','Una grabación de 9 segundos donde alguien se ríe y dice «¡ahora ya no hay vuelta atrás!».'],
['🎙️ Grabación','Un audio de {a} tarareando con muchísima concentración.'],
['🎙️ Grabación','Una cinta con ruido de fondo de ollas, un pato y alguien susurrando «tranquilo, tranquilo».'],
['👣 Rastro','Huellas de zapato del número 43 con un trozo de papel higiénico pegado.'],
['👣 Rastro','Un rastro de purpurina que va desde la escena hasta la casa de {a}.'],
['👣 Rastro','Una miga de pan con forma sospechosa, justo debajo de la silla de {a}.'],
['🤪 Absurda','Un loro que solo repite «¡pregunta a Mari Carmen!».'],
['🤪 Absurda','Una carta de un vecino que asegura haber visto a {a} hablando con una paloma.'],
['🤪 Absurda','Una cámara de seguridad muestra a alguien huyendo con un carrito de supermercado.'],
['🤪 Absurda','Un dibujo infantil titulado «Mi tío {a} y el gran secreto».'],
['🤪 Absurda','Un horóscopo recortado que dice: «hoy cometerás un error. Y {a} también».']
];
const PH=[
{k:'del',g:0,n:'El delito',d:0},
{k:'pre',g:1,n:'Preparación',d:45,i:'El acusado y su abogado preparan la defensa. El fiscal prepara la acusación.'},
{k:'int',g:2,n:'Interrogatorio',d:45,i:'El fiscal interroga al acusado, que responde en directo. El abogado puede intervenir UNA vez.'},
{k:'tes',g:3,n:'Testigos',d:60,i:'Los testigos declaran (pueden mentir). El fiscal y el abogado pueden hacerles preguntas.'},
{k:'alf',g:4,n:'Alegato del fiscal',d:30,i:'El fiscal presenta sus conclusiones al jurado.'},
{k:'ala',g:4,n:'Alegato de la defensa',d:30,i:'El abogado defensor intenta convencer al jurado.'},
{k:'alc',g:4,n:'Última palabra',d:15,i:'El acusado hace su última declaración.'}
];
const GR=['El delito','Defensa','Interrogatorio','Testigos','Alegatos','Veredicto'];
const VER={C:'CULPABLE',I:'INOCENTE',N:'JUICIO NULO'};

// ---- Estado ----
const $a=document.getElementById('app'),KEY='juicio-partida-v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let G=null,S={names:['','','',''],R:5},M=null,AC;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}};
const saved=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const beep=(f=660,d=.15)=>{try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
const nm=i=>esc(G.P[i].n);
const fill=s=>s.replace(/\{a\}/g,G.P[G.r.acu].n);
const rem=r=>r.rem!=null?r.rem:r.dur-(Date.now()-r.t0);
function pickUnused(n,used){let c=[...Array(n).keys()].filter(i=>!used.includes(i));if(!c.length){used.length=0;c=[...Array(n).keys()]}const i=c[Math.floor(Math.random()*c.length)];used.push(i);return i}

function newRound(){
  const ci=pickUnused(CASOS.length,G.used.c),roles=assign(G.P);
  const r={...roles,caso:ci,ph:0,votes:[],sp:[],proofs:[],queue:[roles.acu,roles.fis,roles.abo,...roles.tes],q:0,show:false,t0:0,dur:0,rem:null};
  r.pist=sh(CASOS[ci][5]).slice(0,roles.tes.length);
  const slots=sh(['int','int','tes','alf','ala']).filter(s=>s!=='tes'||roles.tes.length).slice(0,2+(Math.random()<.5?1:0));
  G.r=r;
  for(const s of slots){const pi=PH.findIndex(p=>p.k===s),pr=pickUnused(PRUEBAS.length,G.used.p);r.proofs.push({c:PRUEBAS[pr][0],t:PRUEBAS[pr][1],ph:pi,at:5+Math.random()*(PH[pi].d-12),sh:0})}
  G.scr='phase';save();render();
}
function startPh(){const r=G.r;r.t0=Date.now();r.dur=PH[r.ph].d*1000;r.rem=null;beep(520,.2)}
function nextPh(){
  const r=G.r;r.ph++;
  if(PH[r.ph]&&PH[r.ph].k==='tes'&&!r.tes.length)r.ph++;
  if(r.ph>=PH.length){G.scr='vote';r.q=0;r.show=false}else startPh();
  save();render();
}
function startGame(){
  let names=S.names.map(x=>x.trim()).filter(Boolean);
  if(names.length<4){alert('Hacen falta al menos 4 jugadores con nombre.');return}
  const seen={};names=names.map(n=>{seen[n]=(seen[n]||0)+1;return seen[n]>1?n+' '+seen[n]:n});
  G={P:names.map(n=>({n,s:0,acu:0,fis:0,abo:0,tes:0,last:''})),R:S.R,k:1,used:{c:[],p:[]},hist:[],scr:'phase'};
  newRound();
}
function finishRound(skipped){
  const r=G.r;
  G.hist.push({k:G.k,d:CASOS[r.caso][0],a:G.P[r.acu].n,v:skipped?'Ronda saltada':VER[r.ver]});
  if(skipped)r.pts=[];
  G.scr='summary';save();render();
}
function act(a,v,i){
  const r=G&&G.r;
  switch(a){
  case 'add':if(S.names.length<12)S.names.push('');break;
  case 'del':S.names.splice(+i,1);break;
  case 'start':return startGame();
  case 'cont':G=saved();break;
  case 'rev':G.scr='reveal';r.q=0;r.show=false;break;
  case 'show':r.show=true;break;
  case 'hide':r.show=false;r.q++;if(r.q>=r.queue.length){G.scr='phase';r.ph=1;startPh()}break;
  case 'pz':if(r.rem==null)r.rem=r.dur-(Date.now()-r.t0);else{r.t0=Date.now()-(r.dur-r.rem);r.rem=null}break;
  case 'nx':return nextPh();
  case 'skip':if(!confirm('¿Saltar esta ronda? No se darán puntos.'))return;return finishRound(true);
  case 'vt':if(v!=='C'&&v!=='I')return;r.votes.push(v);r.show=false;r.q++;
    if(r.q>=r.jur.length){r.ver=verdict(r.votes);G.scr='verdict'}break;
  case 'spgo':G.scr='special';r.q=0;r.show=false;break;
  case 'sp':{
    const p=r.q;[0,1,2].forEach(c=>{const el=document.getElementById('sp'+c);if(!el||el.value==='')return;const t=+el.value;
      if(t===p||t<0||t>=G.P.length||(c===2&&!r.tes.includes(t)))return;r.sp.push(t)});   // no se puede votar a uno mismo
    r.show=false;r.q++;
    if(r.q>=G.P.length){r.pts=score(r,r.ver,r.sp);r.pts.forEach(([j,p])=>G.P[j].s+=p);return finishRound(false)}break}
  case 'next':if(G.k>=G.R)G.scr='final';else{G.k++;return newRound()}break;
  case 'new':G=null;try{localStorage.removeItem(KEY)}catch(e){}break;
  case 'm':M={k:v};break;
  case 'mc':M=null;break;
  }
  save();render();
}

// ---- Pantallas ----
const priv=i=>{const r=G.r,c=CASOS[r.caso];return i===r.acu?c[2]:i===r.fis?c[3]:i===r.abo?c[4]:r.pist[r.tes.indexOf(i)]};
const roleName=i=>{const r=G.r;return i===r.acu?'🔒 Eres el ACUSADO':i===r.fis?'⚖️ Eres el FISCAL':i===r.abo?'🛡️ Eres el ABOGADO DEFENSOR':'🎤 Eres TESTIGO'};
const skipBtn=()=>'<button class="sec" data-a="skip">⏭ Saltar ronda</button>';
function court(){
  const r=G.r,s=(c,l,i)=>`<div class="seat ${c}"><small>${l}</small><b>${nm(i)}</b></div>`;
  return `<div class="card"><div class="row">${s('','⚖️ Fiscal',r.fis)}${s('acu','🔒 Estrado · Acusado',r.acu)}${s('','🛡️ Abogado',r.abo)}</div>`+
    (r.tes.length?`<div class="row">${r.tes.map(i=>s('','🎤 Testigo',i)).join('')}</div>`:'')+
    `<div class="row">${r.jur.map(i=>s('','👥 Jurado',i)).join('')}</div></div>`;
}
const board=()=>`<div class="card"><h3>🏆 Ranking</h3>${G.P.map(p=>[p.n,p.s]).sort((a,b)=>b[1]-a[1]).map(([n,s],k)=>`<div class="rk"><span>${k+1}. ${esc(n)}</span><b>${s}</b></div>`).join('')}</div>`;
function side(){
  const vis=G.r.proofs.filter(p=>p.sh);
  return `<div class="card"><h3>🔎 Pruebas</h3>${vis.length?vis.map(p=>`<div class="pr"><small>${p.c}</small><br>${esc(fill(p.t))}</div>`).join(''):'<p class="mut">Aún no ha aparecido ninguna prueba…</p>'}</div>`+board();
}
function setup(){
  const sv=saved();
  return `<div class="card"><h2>Jugadores</h2><p class="mut">De 4 a 12. Jugáis en persona y usáis la web para repartir papeles, tiempos y votos: cada uno ve su información secreta cuando le pasáis el móvil.</p>`+
  S.names.map((n,i)=>`<div class="pl"><input data-n="${i}" value="${esc(n)}" placeholder="Jugador ${i+1}" maxlength="16">${S.names.length>4?`<button class="sec" data-a="del" data-i="${i}" aria-label="Quitar">✕</button>`:''}</div>`).join('')+
  `<button class="sec" data-a="add">+ Jugador</button><p>Rondas: <select data-r="1" style="width:auto">${[3,5,8,10].map(x=>`<option ${x===S.R?'selected':''}>${x}</option>`).join('')}</select></p><button data-a="start">Abrir la sesión ▶</button>${sv&&sv.scr?'<button class="sec" data-a="cont">Continuar partida guardada</button>':''}</div>`;
}
function opening(){
  const r=G.r,c=CASOS[r.caso];
  return `<div class="card center"><div class="stamp">SE ABRE LA SESIÓN</div><p class="big">Se acusa a <b>${nm(r.acu)}</b> de <b>${esc(c[0])}</b>.</p><p class="mut">${esc(c[1])}</p></div>${court()}<div class="card"><p>Ahora cada jugador con papel secreto verá su información <b>en privado</b>. Pasad el móvil cuando se indique.</p><button data-a="rev">Repartir papeles ▶</button>${skipBtn()}</div>`;
}
function timed(){
  const r=G.r,p=PH[r.ph];
  return `<div class="grid"><div>${court()}<div class="card center"><h2>${p.n}</h2><p class="big">${esc(p.i)}</p><button class="sec" data-a="pz">${r.rem!=null?'▶ Reanudar':'⏸ Pausa'}</button><button data-a="nx">Siguiente fase ▶</button>${skipBtn()}</div></div><div>${side()}</div></div>`;
}
const pass=(i,a,t)=>`<div class="card center"><p>Pasa el móvil a</p><h2 class="big">${nm(i)}</h2><p class="mut">El resto, mirad a otro lado 👀</p><button data-a="${a}">Soy ${nm(i)} · ${t}</button></div>`;
function reveal(){
  const r=G.r,i=r.queue[r.q];
  return r.show?`<div class="card center"><h3>${roleName(i)}</h3><p class="big">${esc(fill(priv(i)))}</p><p class="mut">Solo tú puedes ver esto.</p><button data-a="hide">Ya lo leí · ocultar</button></div>`:pass(i,'show','ver mi papel');
}
function voteScr(){
  const r=G.r,i=r.jur[r.q];
  return r.show?`<div class="card center"><h3>Tu voto es secreto</h3><p class="big">¿${esc(G.P[r.acu].n)} es culpable?</p><button class="bad" data-a="vt" data-v="C">CULPABLE</button><button class="good" data-a="vt" data-v="I">INOCENTE</button></div>`:pass(i,'show','votar');
}
function verdictScr(){
  const r=G.r,c=r.votes.filter(x=>x==='C').length;
  return `<div class="card center"><p class="mut">El jurado ha votado…</p><div class="res ${r.ver}">${VER[r.ver]}</div><p>Culpable: <b>${c}</b> · Inocente: <b>${r.votes.length-c}</b>${r.ver==='N'?' · ¡Empate!':''}</p><button data-a="spgo">Votaciones especiales ▶</button></div>${court()}`;
}
function specialScr(){
  const r=G.r,i=r.q;
  if(!r.show)return pass(i,'show','votar');
  const opts=l=>`<option value="">— nadie —</option>`+l.filter(j=>j!==i).map(j=>`<option value="${j}">${nm(j)}</option>`).join('');
  const all=G.P.map((_,j)=>j);
  return `<div class="card"><h3 class="center">Votaciones especiales</h3><p class="mut center">Cada voto recibido vale 1 punto. No puedes votarte a ti mismo.</p><label>🎭 Mejor actuación<select id="sp0">${opts(all)}</select></label><label>💡 Mejor argumento<select id="sp1">${opts(all)}</select></label>${r.tes.length?`<label>🤪 Testimonio más absurdo<select id="sp2">${opts(r.tes)}</select></label>`:''}<div class="center"><button data-a="sp">Enviar y pasar</button></div></div>`;
}
function summary(){
  const r=G.r,by={};(r.pts||[]).forEach(([i,p,t])=>{(by[i]=by[i]||[]).push([p,t])});
  const rows=Object.keys(by).map(i=>`<div class="rk"><span>${nm(i)}: ${by[i].map(x=>esc(x[1])).join(', ')}</span><b>+${by[i].reduce((s,x)=>s+x[0],0)}</b></div>`).join('')||'<p class="mut">Sin puntos esta ronda.</p>';
  return `<div class="grid"><div class="card"><h2>${r.ver?'Veredicto: '+VER[r.ver]:'Ronda saltada'}</h2>${rows}<button data-a="next">${G.k>=G.R?'Ver ranking final ▶':'Siguiente juicio ▶'}</button></div><div>${board()}</div></div>`;
}
function final(){
  const m=['🥇','🥈','🥉'];
  return `<div class="card center"><div class="stamp">SE LEVANTA LA SESIÓN</div>${G.P.map(p=>[p.n,p.s]).sort((a,b)=>b[1]-a[1]).map(([n,s],k)=>`<div class="rk big"><span>${m[k]||k+1+'.'} ${esc(n)}</span><b>${s}</b></div>`).join('')}<button data-a="new">Nueva partida</button></div>`;
}
function tools(){return `<div class="center"><button class="sec" data-a="m" data-v="tut">Tutorial</button>${G?'<button class="sec" data-a="m" data-v="hist">Historial</button><button class="sec" data-a="new">Salir</button>':''}</div>`}
function modal(){
  if(!M)return '';
  let h='';
  if(M.k==='proof')h=`<div class="center"><div class="stamp">NUEVA PRUEBA</div><p class="mut">${M.t.c}</p><p class="big">${esc(fill(M.t.t))}</p><p class="mut">Nadie sabe qué significa. Interpretadla a vuestro favor.</p></div>`;
  else if(M.k==='hist')h=`<h2>Historial</h2>`+(G.hist.length?G.hist.map(x=>`<div class="pr"><b>Juicio ${x.k}:</b> ${esc(x.a)} · ${esc(x.d)}<br><b>${esc(x.v)}</b></div>`).join(''):'<p class="mut">Todavía no hay juicios.</p>');
  else h=`<h2>Cómo se juega</h2><p>Cada ronda se juzga un delito absurdo. Se reparten papeles: <b>acusado, fiscal, abogado, testigos y jurado</b>.</p><p>Hablad en persona; la web reparte la información secreta, marca los tiempos, lanza <b>pruebas sorpresa</b> (no tienen explicación: ¡improvisad!) y cuenta los votos.</p><p>El jurado vota en secreto culpable o inocente. Después todos dan votos especiales (mejor actuación, argumento y testimonio más absurdo).</p><p class="mut">Los papeles rotan solos para que todos pasen por el estrado.</p>`;
  return `<div id="mo"><div class="card">${h}<div class="center"><button data-a="mc">${M.k==='proof'?'Entendido':'Cerrar'}</button></div></div></div>`;
}
function render(){
  const timedNow=G&&G.scr==='phase'&&G.r.ph>0;
  const g=!G?0:G.scr==='reveal'?0:G.scr==='phase'?PH[G.r.ph].g:5;
  const body=!G?setup():({phase:()=>G.r.ph===0?opening():timed(),reveal,vote:voteScr,verdict:verdictScr,special:specialScr,summary,final})[G.scr]();
  $a.innerHTML=`<header><h1>⚖️ EL JUICIO</h1>${G&&G.scr!=='final'?`<div id="steps">${GR.map((x,i)=>`<span class="${i===g?'on':''}">${x}</span>`).join('')}</div>${timedNow?'<div id="clock"></div>':''}`:''}</header>${G?`<p class="mut small">Juicio ${G.k} de ${G.R}</p>`:''}${body}${tools()}${modal()}`;
  tick(true);
}
function tick(noAdvance){
  if(!G||G.scr!=='phase'||G.r.ph<1)return;
  const r=G.r,t=rem(r),c=document.getElementById('clock');
  if(c){const s=Math.max(0,Math.ceil(t/1000));c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');c.classList.toggle('low',s<=10)}
  if(noAdvance||r.rem!=null||M)return;
  const el=r.dur-t;
  for(const p of r.proofs)if(!p.sh&&p.ph===r.ph&&el>=p.at*1000){p.sh=1;M={k:'proof',t:p};beep(880,.12);setTimeout(()=>beep(1175,.2),140);save();render();return}
  if(t<=0){beep(300,.4);nextPh()}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v,b.dataset.i)});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.n!==undefined)S.names[+e.target.dataset.n]=e.target.value});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.r)S.R=+e.target.value});
setInterval(()=>tick(false),250);
render();
</script>
</body>
</html>
