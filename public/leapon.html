<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Leap Core</title>
<style>
:root{--bg:#090d18;--ink:#fff;--sub:#8d96ad;--mint:#65f3d0;--danger:#171b25;--pink:#ff5d9e;--gold:#ffd45a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.stat{text-align:center;min-width:75px}.stat small{display:block;color:var(--sub);font-size:10px;letter-spacing:.18em}.stat b{font-size:25px}
#combo{color:var(--gold);font-weight:900;font-size:19px;opacity:.35;transition:.15s}
#combo.on{opacity:1;transform:scale(1.12)}
#sound{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:8;width:48px;height:48px;border-radius:50%;border:1px solid #566078;background:#101523;color:#fff;font-size:20px}
.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;background:linear-gradient(#090d18aa,#090d18dd)}
.hide{display:none!important}
h1{font-size:clamp(48px,14vw,82px);margin:0;font-weight:950;letter-spacing:.03em;background:linear-gradient(90deg,var(--mint),#fff,var(--pink));background-clip:text;-webkit-background-clip:text;color:transparent}
h2{font-size:50px;margin:0;color:var(--pink)}
p{max-width:330px;color:var(--sub);line-height:1.45}
button.play{border:0;border-radius:18px;background:var(--mint);color:#06251e;font-weight:950;font-size:20px;padding:17px 48px;min-width:230px}
button.alt{margin-top:8px;background:transparent;border:1px solid #65708a;color:#fff}
#hint{font-size:13px;color:#69738c}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="stat"><small>PUNTOS</small><b id="score">0</b></div>
  <div class="stat"><span id="combo">COMBO x1</span></div>
  <div class="stat"><small>RÉCORD</small><b id="best">0</b></div>
</div>

<button id="sound">🔊</button>

<div class="overlay" id="menu">
  <h1>LEAP CORE</h1>
  <p>Balancea, rebota y asciende sin tocar los obstáculos.</p>
  <button class="play" id="start">JUGAR</button>
  <p id="hint">Mantén pulsado para atraer la bola hacia el núcleo. Suelta para impulsarla.</p>
</div>

<div class="overlay hide" id="gameover">
  <h2>GAME OVER</h2>
  <p>Puntuación: <b id="finalScore">0</b><br>Récord: <b id="finalBest">0</b></p>
  <p id="newBest"></p>
  <button class="play" id="again">JUGAR DE NUEVO</button>
  <button class="play alt" id="back">MENÚ</button>
</div>

<script>
(() => {
"use strict";

const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W=0,H=0,DPR=1,cx=0,cy=0,scale=1;
let state="menu",last=performance.now(),time=0,score=0,best=0;
let holding=false,muted=false,audio=null;
let shake=0,combo=0,comboTimer=0;
let particles=[],rings=[],targets=[],hazards=[],powerups=[],trail=[];
let worldY=0,nextTargetY=0,nextHazardY=0,nextPowerY=0;
let player={x:0,y:0,vx:0,vy:0,angle:0,radius:155,ropeLength:155,orbitSpeed:2.4};
let cameraY=0;

try{best=Number(localStorage.getItem("leapcore-best")||0)}catch(e){best=0}

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  cx=W/2;cy=H*.60;
  scale=Math.min(W/700,H/900);
}
addEventListener("resize",resize);

function sound(freq,d=.12,type="sine",vol=.05){
  if(muted)return;
  try{
    if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended")audio.resume();
    const o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;
    o.type=type;o.frequency.setValueAtTime(freq,n);
    g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d);
  }catch(e){}
}

function burst(x,y,color,n=12,speed=180){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=speed*(.35+Math.random()*.8);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.45+Math.random()*.5,max:1,size:2+Math.random()*3,color});
  }
}

function ring(x,y,color){
  rings.push({x,y,r:5,life:.38,color});
}

function addScore(v){
  const mult=Math.min(5,Math.max(1,combo));
  const gain=Math.round(v*mult);
  score+=gain;
  return gain;
}

function difficulty(){
  return Math.min(1,time/100);
}

function worldToScreen(x,y){
  return {x:cx+x*scale,y:cy+(y-cameraY)*scale};
}

/*
  La generación está organizada verticalmente.
  Los objetivos forman rutas alcanzables y el jugador asciende
  después de cada rebote.
*/
function reset(){
  score=0;time=0;combo=0;comboTimer=0;
  particles=[];rings=[];targets=[];hazards=[];powerups=[];trail=[];
  worldY=0;cameraY=0;
  nextTargetY=170;nextHazardY=360;nextPowerY=850;

  player={x:0,y:0,vx:0,vy:240,angle:0,radius:155,ropeLength:155,orbitSpeed:2.5};

  for(let i=0;i<8;i++)spawnTarget(true);
  for(let i=0;i<3;i++)spawnHazard(true);
}

function spawnTarget(initial=false){
  const d=difficulty();
  const y=nextTargetY;
  const previous=targets.length?targets[targets.length-1]:{x:0,y:0};
  let x=previous.x+(Math.random()-.5)*(260+80*d);
  x=Math.max(-290,Math.min(290,x));

  const type=Math.random()<.07+d*.04?"gold":"normal";
  targets.push({
    x,y,
    r:type==="gold"?18:16,
    type,
    pulse:Math.random()*6.28
  });

  nextTargetY+=initial?115+Math.random()*70:125+Math.random()*75;
}

function spawnHazard(initial=false){
  const d=difficulty();
  const y=nextHazardY;
  let x=(Math.random()-.5)*480;

  const type=Math.random()<.65?"circle":"bar";
  hazards.push({
    x,y,
    type,
    r:type==="circle"?23:0,
    length:type==="bar"?150+Math.random()*80:0,
    angle:Math.random()*Math.PI*2,
    speed:(Math.random()<.5?-1:1)*(1.1+d*1.8)
  });

  nextHazardY+=initial?260+Math.random()*170:310-d*100+Math.random()*130;
}

function spawnPower(){
  const types=[
    {type:"shield",emoji:"🛡️",color:"#6aa8ff"},
    {type:"magnet",emoji:"🧲",color:"#65f3d0"},
    {type:"boost",emoji:"⚡",color:"#ffd45a"}
  ];
  const p=types[Math.floor(Math.random()*types.length)];
  powerups.push({...p,x:(Math.random()-.5)*430,y:nextPowerY,r:23,life:0});
  nextPowerY+=900+Math.random()*500;
}

function start(){
  reset();
  state="play";
  $("menu").classList.add("hide");
  $("gameover").classList.add("hide");
  holding=false;
  last=performance.now();
}

function finish(){
  if(state!=="play")return;
  state="dead";
  const p=worldToScreen(player.x,player.y);
  burst(p.x,p.y,"#65f3d0",35,330);
  burst(p.x,p.y,"#ff5d9e",20,260);
  shake=.5;
  sound(180,.5,"sawtooth",.08);

  const old=best;
  if(score>best){
    best=score;
    try{localStorage.setItem("leapcore-best",best)}catch(e){}
  }

  setTimeout(()=>{
    $("finalScore").textContent=score;
    $("finalBest").textContent=best;
    $("newBest").textContent=score>old?"🏆 ¡NUEVO RÉCORD!":"";
    $("gameover").classList.remove("hide");
  },550);
}

function bounce(target){
  combo++;
  comboTimer=2.3;
  const base=target.type==="gold"?35:10;
  const gain=addScore(base);

  /*
    Rebote principal: fuerte impulso vertical y pequeña componente
    horizontal hacia el siguiente objetivo.
  */
  const next=targets.find(t=>t.y>target.y);
  let dx=next?next.x-player.x:(Math.random()-.5)*100;

  player.vy=-Math.max(430,540+difficulty()*180);
  player.vx+=dx*.7;
  player.vx=Math.max(-420,Math.min(420,player.vx));

  burst(target.x,target.y,target.type==="gold"?"#ffd45a":"#fff",15,210);
  ring(target.x,target.y,target.type==="gold"?"#ffd45a":"#fff");

  score+=Math.max(0,Math.round(gain*.0)); // el valor ya se añadió en addScore
  sound(target.type==="gold"?720:470,.13,"triangle",.07);

  target.hit=true;
}

function update(dt){
  time+=dt;

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=.96;p.vy*=.96;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }

  for(let i=rings.length-1;i>=0;i--){
    rings[i].r+=260*dt;rings[i].life-=dt;
    if(rings[i].life<=0)rings.splice(i,1);
  }

  if(state!=="play")return;

  const d=difficulty();

  comboTimer-=dt;
  if(comboTimer<=0)combo=0;

  /*
    Control estilo balanceo:
    mantener pulsado acorta la cuerda y tira hacia el centro.
    al soltar, la tensión se convierte en impulso.
  */
  const targetR=holding?72:player.radius;
  player.ropeLength+=(targetR-player.ropeLength)*dt*(holding?8:4);

  const angular=player.orbitSpeed*(1+d*.55);
  player.angle+=angular*dt;

  const desiredX=Math.cos(player.angle)*player.ropeLength;
  const desiredY=Math.sin(player.angle)*player.ropeLength;

  const spring=holding?13:5;
  player.vx+=(desiredX-player.x)*spring*dt;
  player.vy+=(desiredY-player.y)*spring*dt;

  // gravedad vertical que genera el ascenso/descenso entre rebotes
  player.vy+=310*dt;

  player.vx*=Math.pow(.985,dt*60);
  player.vy*=Math.pow(.992,dt*60);

  player.x+=player.vx*dt;
  player.y+=player.vy*dt;

  // Rebote automático al pasar por un objetivo desde arriba
  for(const t of targets){
    if(t.hit)continue;
    const dx=player.x-t.x,dy=player.y-t.y;
    if(dx*dx+dy*dy<(player.radius+t.r)**2 && player.vy>0 && player.y<t.y+25){
      player.y=t.y-22;
      bounce(t);
      break;
    }
  }

  // magnetismo suave
  if(powerups.some(p=>p.type==="magnet")){
    for(const t of targets){
      const dx=player.x-t.x,dy=player.y-t.y,dist=Math.hypot(dx,dy);
      if(dist<150&&dist>1){
        t.x+=dx/dist*70*dt;
        t.y+=dy/dist*70*dt;
      }
    }
  }

  // Potenciadores
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];
    p.life+=dt;
    const dist=Math.hypot(player.x-p.x,player.y-p.y);
    if(dist<player.radius+p.r){
      if(p.type==="shield") player.shield=8;
      if(p.type==="magnet") player.magnet=7;
      if(p.type==="boost") player.boost=6;
      burst(p.x,p.y,p.color,20,230);
      ring(p.x,p.y,p.color);
      sound(700,.2,"sine",.06);
      powerups.splice(i,1);
    }
  }

  if(player.shield)player.shield=Math.max(0,player.shield-dt);
  if(player.magnet)player.magnet=Math.max(0,player.magnet-dt);
  if(player.boost)player.boost=Math.max(0,player.boost-dt);

  // Obstáculos
  for(const h of hazards){
    h.angle+=h.speed*dt;

    if(h.type==="circle"){
      const dist=Math.hypot(player.x-h.x,player.y-h.y);
      if(dist<player.radius+h.r-4){
        if(player.shield){
          player.shield=0;
          burst(h.x,h.y,"#6aa8ff",22,260);
          h.dead=true;
          sound(220,.25,"square",.08);
        }else finish();
      }
    }else{
      const dx=Math.cos(h.angle)*h.length/2;
      const dy=Math.sin(h.angle)*h.length/2;
      const ax=h.x-dx,ay=h.y-dy,bx=h.x+dx,by=h.y+dy;
      const abx=bx-ax,aby=by-ay;
      const u=Math.max(0,Math.min(1,((player.x-ax)*abx+(player.y-ay)*aby)/(abx*abx+aby*aby)));
      const qx=ax+u*abx,qy=ay+u*aby;
      if(Math.hypot(player.x-qx,player.y-qy)<player.radius+9){
        if(player.shield){
          player.shield=0;h.dead=true;
          burst(h.x,h.y,"#6aa8ff",22,260);
        }else finish();
      }
    }
  }

  hazards=hazards.filter(h=>!h.dead && h.y>cameraY-500 && h.y<cameraY+1400);
  targets=targets.filter(t=>!t.hit && t.y>cameraY-500);
  powerups=powerups.filter(p=>p.y>cameraY-500);

  // Generación vertical
  while(nextTargetY<cameraY+1400)spawnTarget();
  while(nextHazardY<cameraY+1500)spawnHazard();
  if(nextPowerY<cameraY+1600)spawnPower();

  // Cámara sigue al jugador hacia arriba
  const targetCamera=player.y-H/(2*scale)+120;
  if(targetCamera>cameraY)cameraY+=(targetCamera-cameraY)*Math.min(1,dt*4);

  worldY=Math.max(worldY,-player.y);

  // Puntuación por altura
  const heightScore=Math.max(0,Math.floor((-player.y)/20));
  score=Math.max(score,heightScore);

  // Caída fuera del área
  if(player.y>cameraY+H/scale*.65)finish();

  // Trail
  trail.push({x:player.x,y:player.y});
  if(trail.length>18)trail.shift();

  shake=Math.max(0,shake-dt*2);
}

function circle(x,y,r,fill,stroke,lw=2){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#090d18";ctx.fillRect(0,0,W,H);

  // fondo minimalista
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#0b1020");grad.addColorStop(1,"#060913");
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  const sx=shake?(Math.random()-.5)*shake*18:0;
  const sy=shake?(Math.random()-.5)*shake*18:0;

  ctx.save();
  ctx.translate(cx+sx,cy+sy);

  // líneas de profundidad
  ctx.globalAlpha=.13;
  for(let y=-1000;y<1200;y+=120){
    ctx.strokeStyle="#63708b";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-500,y);ctx.lineTo(500,y);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Cámara y escala
  ctx.scale(scale,scale);

  // objetivos
  for(const t of targets){
    const syy=t.y-cameraY;
    const pulse=1+Math.sin(time*4+t.pulse)*.08;
    const r=t.r*pulse;
    const col=t.type==="gold"?"#ffd45a":"#fff";

    ctx.globalAlpha=.12;
    circle(t.x,syy,r+13,col);
    ctx.globalAlpha=1;
    circle(t.x,syy,r,col);
    circle(t.x,syy,r*.48,"#0b1020");
  }

  // potenciadores
  for(const p of powerups){
    const yy=p.y-cameraY;
    const pulse=1+Math.sin(time*5+p.x)*.1;
    ctx.globalAlpha=.16;
    circle(p.x,yy,p.r*1.7,p.color);
    ctx.globalAlpha=1;
    circle(p.x,yy,p.r,"#101624",p.color,3);
    ctx.font="22px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle="#fff";ctx.fillText(p.emoji,p.x,yy);
  }

  // obstáculos negros
  for(const h of hazards){
    const yy=h.y-cameraY;
    ctx.save();
    ctx.translate(h.x,yy);
    ctx.rotate(h.angle);

    ctx.fillStyle="#11151f";ctx.strokeStyle="#30394b";ctx.lineWidth=3;

    if(h.type==="circle"){
      circle(0,0,h.r,"#11151f","#252c3b",3);
      circle(0,0,h.r*.42,"#070a11");
    }else{
      ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(-h.length/2,0);ctx.lineTo(h.length/2,0);
      ctx.lineWidth=19;ctx.strokeStyle="#05070c";ctx.stroke();
      ctx.lineWidth=11;ctx.strokeStyle="#252c3b";ctx.stroke();
      circle(0,0,7,"#080b12","#ff5d9e",2);
    }
    ctx.restore();
  }

  // cuerda
  const px=player.x,py=player.y-cameraY;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(px*.45,py*.45,px,py);
  ctx.strokeStyle=holding?"#65f3d0aa":"#71809caa";
  ctx.lineWidth=3;
  ctx.stroke();

  // centro
  const danger=Math.hypot(px,py)<105;
  ctx.globalAlpha=.16;
  circle(0,0,65,danger?"#ff5d9e":"#65f3d0");
  ctx.globalAlpha=1;
  circle(0,0,31,"#111522",danger?"#ff5d9e":"#65f3d0",3);
  circle(0,0,12,danger?"#ff5d9e":"#65f3d0");

  // trail
  for(let i=0;i<trail.length;i++){
    const q=trail[i],a=(i/trail.length)*.3;
    ctx.globalAlpha=a;
    circle(q.x,q.y-cameraY,Math.max(2,player.radius*(i/trail.length)*.35),"#65f3d0");
  }
  ctx.globalAlpha=1;

  // jugador
  const pcol=player.boost?"#ffd45a":"#65f3d0";
  ctx.globalAlpha=.15;circle(px,py,player.radius+15,pcol);ctx.globalAlpha=1;
  if(player.shield)circle(px,py,player.radius+10,null,"#6aa8ff",3);
  circle(px,py,player.radius,"#65f3d0","#07120f",3);
  circle(px-4,py-4,3,"#fff");

  ctx.restore();

  // Indicador de potenciadores
  const powers=[];
  if(player.shield)powers.push(["🛡️",player.shield/8,"#6aa8ff"]);
  if(player.magnet)powers.push(["🧲",player.magnet/7,"#65f3d0"]);
  if(player.boost)powers.push(["⚡",player.boost/6,"#ffd45a"]);

  let x=W/2-powers.length*30;
  for(const q of powers){
    x+=60;
    ctx.font="20px system-ui";ctx.textAlign="center";
    ctx.fillText(q[0],x,92);
    ctx.fillStyle="#ffffff22";ctx.fillRect(x-18,104,36,3);
    ctx.fillStyle=q[2];ctx.fillRect(x-18,104,36*q[1],3);
  }
}

function hud(){
  $("score").textContent=score;
  $("best").textContent=best;
  const c=Math.min(5,Math.max(1,combo));
  $("combo").textContent="COMBO x"+c;
  $("combo").classList.toggle("on",combo>0);
}

function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);draw();hud();
  requestAnimationFrame(loop);
}

function setHold(v){
  if(state==="play")holding=v;
}

canvas.addEventListener("pointerdown",e=>{e.preventDefault();setHold(true)},{passive:false});
addEventListener("pointerup",()=>setHold(false));
addEventListener("pointercancel",()=>setHold(false));

addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp"){
    e.preventDefault();
    if(state==="menu"||state==="dead"){start();return}
    setHold(true);
  }
});
addEventListener("keyup",e=>{
  if(e.code==="Space"||e.code==="ArrowUp")setHold(false);
});

$("start").onclick=start;
$("again").onclick=start;
$("back").onclick=()=>{
  state="menu";$("gameover").classList.add("hide");$("menu").classList.remove("hide");
};
$("sound").onclick=()=>{
  muted=!muted;$("sound").textContent=muted?"🔇":"🔊";
};

resize();
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
