      leave:function(){closed=true;try{ws.close()}catch(e){}}

      ws=new WebSocket(url);

      ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}

        else if(m.t==='peers'){
          arr=m.peers.map(function(q){return{peer:q.id,isMe:q.id===id,presence:q.p||{}}});
          if(!done){done=true;resolve(room)}
          subs.slice().forEach(function(f){f(arr)});
        }else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}
      };
      ws.onclose=function(){if(room._st)room._st(false);if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
    }
    open();
    setTimeout(function(){if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},20000);
  })}};
}

function buildOpts(g){
  var seen={},o=[],L=lies(g);
  Object.keys(L).forEach(function(u){var z=nz(L[u]);if(!z||seen[z]||isTruth(g,L[u]))return;seen[z]=1;o.push(L[u])});
  o.push(truths(g)[0]);
  return shuffle(o,rng(g.s+g.r*13+1));
}
function roundScore(g){
  var gain={},by=(g.o||[]).map(function(t){return{t:t,truth:isTruth(g,t),au:[],vo:[]}}),ps=players(),ro=RO(g);
  ro.forEach(function(r){gain[r[0]]=0});
  ps.forEach(function(p){
    if(!gain.hasOwnProperty(p.u)||!p.v||p.v.r!==g.r||typeof p.v.i!=='number'||!by[p.v.i])return;
    var o=by[p.v.i];o.vo.push(p.n);
    if(o.truth)gain[p.u]+=2;
    else ps.forEach(function(q){if(q.u!==p.u&&gain.hasOwnProperty(q.u)&&q.a&&q.a.r===g.r&&nz(q.a.x)===nz(o.t))gain[q.u]+=1});
  });
  ps.forEach(function(q){if(gain.hasOwnProperty(q.u)&&q.a&&q.a.r===g.r)by.forEach(function(o){if(!o.truth&&nz(o.t)===nz(q.a.x))o.au.push(q.n)})});
  return{gain:gain,by:by};
}
// ---- acciones
async function enter(code,host){
  if(S.busy)return;S.busy=true;S.err='';render(true);
  try{
    var room=await RM.join(ROOM_PREFIX+code.toLowerCase(),uid);
    S.room=room;S.code=code;S.host=host;S.view='room';
    room.onPeers(function(arr){S.peers=arr;onPeers()});
    room.onStatus(function(ok){S.online=ok;if(ok)pub();render()});
    S.peers=room.peers();
    var m=null;try{m=JSON.parse(ls('men-m-'+code))}catch(e){}if(m){S.a=m.a||null;S.v=m.v||null}
    if(host){var g=null;try{g=JSON.parse(ls('men-g-'+code))}catch(e){}S.g=g||{id:Date.now(),s:Math.floor(Math.random()*1e9),ph:'lobby',r:0,R:S.R,rs:'',o:[],tot:{},t0:0}}
    ls('men-last',JSON.stringify({code:code,host:host}));pub();
  }catch(e){S.err=e&&e.code==='room_full'?'La sala está llena.':'No se ha podido conectar con la sala. Inténtalo de nuevo.';S.view='home'}
  S.busy=false;render(true);
}
function onPeers(){
  var ps=players(),dup=ps.filter(function(p){return !p.me&&p.n.toLowerCase()===S.name.toLowerCase()}).length;
  if(dup&&!S.renamed){S.renamed=1;S.name=S.name+' 2';ls('men-name',S.name);pub()}
  render();
}
function leaveRoom(){if(S.room)S.room.leave();ls('men-last',null);S.room=null;S.peers=[];S.g=null;S.host=false;S.view='home';S.renamed=0;S.a=null;S.v=null;render(true)}
function startGame(){
  var ps=players().slice(0,MAXP);if(ps.length<2)return;
  S.a=null;S.v=null;S.lv='';
  setG({ph:'write',r:0,o:[],tot:{},t0:Date.now(),id:Date.now(),s:Math.floor(Math.random()*1e9),rs:ps.map(function(p){return p.u}).join(',')});
}
function toVote(){setG({ph:'vote',o:buildOpts(S.g),t0:Date.now()})}
function toReveal(){var g=S.g,sc=roundScore(g),t=Object.assign({},g.tot);Object.keys(sc.gain).forEach(function(u){t[u]=(t[u]||0)+sc.gain[u]});setG({ph:'reveal',tot:t,t0:Date.now()})}
function nextRound(){var g=S.g;S.lv='';if(g.r+1>=g.R)setG({ph:'end'});else setG({ph:'write',r:g.r+1,o:[],t0:Date.now()})}
function sendLie(){
  var g=G(),x=cl(S.lv,40);
  if(!x)return flash('Escribe una respuesta falsa.');
  if(isTruth(g,x))return flash('¡Esa es la verdadera! Inventa otra que suene creíble.');
  S.a={r:g.r,x:x};pub();flash('✅ Mentira enviada. Puedes cambiarla hasta que acabe el tiempo.');
}
function vote(i){
  var g=G();if(!g||g.ph!=='vote'||!RO(g).some(function(r){return r[0]===uid}))return;
  if(S.a&&S.a.r===g.r&&nz(S.a.x)===nz(g.o[i]))return;
  S.v={r:g.r,i:i};pub();render(true);
}
// ---- vistas
function topbar(left){return '<div class="row" style="margin-bottom:4px"><span class="small"><span class="dot'+(S.online?'':' off')+'"></span>'+left+'</span><button class="link" data-a="leave">Salir</button></div>'+(S.flash?'<div class="ok">'+esc(S.flash)+'</div>':'')}
function viewHome(){
  var last=null;try{last=JSON.parse(ls('men-last'))}catch(e){}
  var h='<a href="/" class="link" style="padding:0">← ¿Cuánto me conoces?</a><br><div class="tag">🤥 MULTIJUGADOR · SALAS PRIVADAS</div><h1>Mentiroso</h1><p class="sub">Sale una frase real con un hueco. Inventa la respuesta falsa más creíble… y no te creas las de los demás.</p>';
  if(S.err)h+='<div class="err">'+esc(S.err)+'</div>';
  h+='<div class="panel"><label style="margin-top:0">Tu nombre</label><input id="nm" type="text" maxlength="18" placeholder="¿Cómo te llamas?" value="'+esc(S.name)+'" autocomplete="off"></div>';
  if(last&&last.code)h+='<button class="btn secondary" data-a="resume">↩️ Volver a la sala '+esc(last.code)+'</button>';
  h+='<div class="panel"><h2>Crear sala</h2><div class="kick">Número de preguntas</div><div class="grid g4">'+[5,8,10,15].map(function(r){return '<button class="opt'+(S.R===r?' on':'')+'" data-a="rounds" data-v="'+r+'">'+r+'</button>'}).join('')+'</div><p class="small" style="margin:10px 0 0">De 2 a '+MAXP+' jugadores. Hay 100 preguntas distintas.</p><button class="btn" data-a="create">Crear sala</button></div>';
  h+='<div class="panel"><h2>Unirme a una sala</h2><input id="cd" type="text" maxlength="6" placeholder="CÓDIGO" value="'+esc(S.cd)+'" style="text-transform:uppercase;letter-spacing:.25em;text-align:center;font-weight:800" autocomplete="off"><button class="btn" data-a="join">Unirme</button></div>';
  return h;
}
function viewLobby(g){
  var ps=players(),inn=ps.slice(0,MAXP),h=topbar(S.online?'Conectado':'Reconectando…');
  h+='<div class="panel" style="text-align:center"><div class="kick">Código de la sala</div><div class="code">'+esc(S.code)+'</div><button class="btn secondary" data-a="share" style="margin-top:6px">🔗 Compartir enlace</button></div>';
  h+='<div class="panel"><div class="row"><div class="kick" style="margin:0">Jugadores ('+inn.length+'/'+MAXP+')</div><span class="small">'+g.R+' preguntas</span></div>'+inn.map(function(p,i){return '<div class="pl'+(i?'':' first')+'"><div class="av">'+esc(p.n[0].toUpperCase())+'</div><b>'+esc(p.n)+(p.me?' (tú)':'')+'</b>'+(p.h?'<span class="small" style="margin-left:auto">👑 anfitrión</span>':'')+'</div>'}).join('')+'</div>';
  h+='<div class="panel"><div class="kick">Cómo se juega</div><p class="small" style="margin:0">1) Sale una frase con un hueco. Escribe una respuesta falsa que suene real. 2) Se mezclan todas con la verdadera: elige la que creas cierta. 3) <b>+2</b> si aciertas, <b>+1</b> por cada persona que se crea tu mentira.</p></div>';
  return h+(S.host?'<button class="btn" data-a="start"'+(ps.length<2?' disabled':'')+'>¡Empezar! ('+inn.length+' jugadores)</button>':'<p class="muted" style="text-align:center">Esperando a que el anfitrión empiece…</p>');
}
function nameList(a){return a.length>6?a.slice(0,5).join(', ')+' y '+(a.length-5)+' más':a.join(', ')}
function rankHtml(g){var ro=RO(g),t=g.tot||{},r=ro.slice().sort(function(a,b){return (t[b[0]]||0)-(t[a[0]]||0)}),med=['🥇','🥈','🥉'];return r.map(function(x,i){return '<div class="rk'+(i?'':' first')+'"><span class="n">'+(med[i]||(i+1))+'</span><b>'+esc(x[1])+(x[0]===uid?' (tú)':'')+'</b><span class="v">'+(t[x[0]]||0)+' pts</span></div>'}).join('')}
function viewPlay(g){
  var ro=RO(g),inn=ro.some(function(r){return r[0]===uid}),ps=players(),q=Q[qi(g,g.r)];
  var h=topbar('Pregunta '+(g.r+1)+' de '+g.R);
  h+='<div class="panel"><div class="kick">Completa la frase</div><div class="topic">'+esc(q[0])+'</div>'+(g.ph!=='reveal'?'<div class="tm" id="tm"></div>':'')+'</div>';
  if(!inn)h+='<div class="err">Estás mirando: la partida ya había empezado cuando entraste.</div>';
  if(g.ph==='write'){
    var L=lies(g),n=Object.keys(L).length,mine=S.a&&S.a.r===g.r;
    if(inn)h+='<div class="panel"><h2>Tu mentira</h2><input id="li" type="text" maxlength="40" placeholder="Escribe lo que iría en el hueco…" value="'+esc(S.lv||(mine?S.a.x:''))+'" autocomplete="off"><button class="btn" data-a="sendlie">'+(mine?'Cambiar mi mentira':'Enviar mentira')+'</button>'+(mine?'<p class="small">✅ Enviada: «'+esc(S.a.x)+'»</p>':'')+'</div>';
    h+='<div class="panel"><b>Han escrito '+n+' de '+ro.length+'</b></div>';
    return h+(S.host?'<button class="btn" data-a="tovote">Pasar a la votación →</button>':'<p class="small" style="text-align:center">Cuando todos escriban, empieza la votación.</p>');
  }
  if(g.ph==='vote'){
    var vd=ps.filter(function(p){return p.v&&p.v.r===g.r&&ro.some(function(r){return r[0]===p.u})}).length;
    h+='<div class="panel"><h2>¿Cuál es la verdadera?</h2><div class="small" style="margin-bottom:6px">No puedes votar tu propia mentira.</div>'+g.o.map(function(t,i){var own=S.a&&S.a.r===g.r&&nz(S.a.x)===nz(t),on=S.v&&S.v.r===g.r&&S.v.i===i;return '<button class="votebtn'+(on?' on':'')+'" data-a="vote" data-v="'+i+'"'+(own||!inn?' disabled':'')+'><b>'+esc(t)+'</b>'+(own?'<div class="small">tu mentira</div>':'')+'</button>'}).join('')+'<div class="small" style="margin-top:8px">Han votado '+vd+' de '+ro.length+'</div></div>';
    return h+(S.host?'<button class="btn" data-a="toreveal">Mostrar la respuesta →</button>':'<p class="small" style="text-align:center">Esperando al anfitrión…</p>');
  }
  var sc=roundScore(g),win=ro.filter(function(r){return sc.gain[r[0]]>0});
  h+='<div class="ok">✅ La respuesta era: <b>'+esc(q[1].split('/')[0])+'</b></div>';
  h+=sc.by.slice().sort(function(a,b){return b.truth-a.truth}).map(function(o){
    return '<div class="st" style="--sc:'+(o.truth?'var(--good)':'var(--bad)')+'"><div class="lb">'+(o.truth?'✅ Verdad':'🤥 Mentira de '+(o.au.length?esc(nameList(o.au)):'nadie'))+'</div><div class="tx">'+esc(o.t)+'</div><div class="small">'+(o.vo.length?(o.truth?'La encontraron: ':'Cayeron: ')+esc(nameList(o.vo)):(o.truth?'Nadie la encontró':'Nadie cayó'))+'</div></div>'}).join('');
  h+='<div class="panel"><div class="kick">Puntos de esta pregunta</div>'+(win.length?win.map(function(r){return '<div class="qi"><b style="color:var(--text)">'+esc(r[1])+'</b> +'+sc.gain[r[0]]+'</div>'}).join(''):'<div class="qi">Nadie ha puntuado.</div>')+'</div>';
  h+='<div class="panel"><div class="kick">Clasificación</div>'+rankHtml(g)+'</div>';
  return h+(S.host?'<button class="btn" data-a="next">'+(g.r+1>=g.R?'Ver resultados 🏆':'Siguiente pregunta →')+'</button>':'<p class="small" style="text-align:center">Esperando al anfitrión…</p>');
}
function viewEnd(g){
  var t=g.tot||{},ro=RO(g).slice().sort(function(a,b){return (t[b[0]]||0)-(t[a[0]]||0)}),top=ro[0];
  var h=topbar('🏆 Resultados');
  h+='<div class="panel"><h2>'+(top&&(t[top[0]]||0)>0?'¡'+esc(top[1])+' es el/la mejor mentiroso/a!':'Fin de la partida')+'</h2>'+rankHtml(g)+'</div>';
  return h+(S.host?'<button class="btn" data-a="again">Jugar otra vez</button>':'<p class="muted" style="text-align:center">El anfitrión puede empezar otra partida.</p>');
}
function viewRoom(){
  var g=G(),hostHere=players().some(function(p){return p.h});
  if(!g)return '<div class="panel"><p>'+(hostHere?'Conectando con el anfitrión…':'Esperando al anfitrión…')+'</p><p class="small">Si no aparece: comprueba el código y que el anfitrión tenga la sala abierta y haya recargado la página.</p><button class="link" data-a="leave">Salir</button></div>';
  if(!hostHere&&!S.host)return '<div class="err">El anfitrión se ha desconectado. Si vuelve, la partida continuará.</div><button class="btn secondary" data-a="leave">Salir</button>';
  return g.ph==='lobby'?viewLobby(g):g.ph==='end'?viewEnd(g):viewPlay(g);
}
function typing(){var a=document.activeElement;return !!(a&&a.id==='li')}
function render(force){
  if(!force&&typing()){S.dirty=true;return}
  S.dirty=false;var a=document.activeElement,keep=null;
  if(a&&a.tagName==='INPUT'&&a.id)keep={id:a.id,s:a.selectionStart,e:a.selectionEnd};
  app.innerHTML=S.view==='home'?viewHome():viewRoom();
  if(keep&&$(keep.id)){var el=$(keep.id);el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}
  tick();
}
function tick(){
  var g=G();if(!g||S.view!=='room')return;
  var dur=g.ph==='write'?DW:g.ph==='vote'?DV:0;if(!dur)return;
  var el=Date.now()-g.t0,left=Math.max(0,dur-Math.floor(el/1000)),t=$('tm');
  if(t){t.textContent=left>0?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'⏰ ¡Tiempo!';t.className='tm'+(left?'':' end')}
  if(S.host&&S.g){
    var ro=RO(S.g),ps=players();
    if(g.ph==='write'){var n=Object.keys(lies(g)).length;if((n>=ro.length&&el>1500)||el>(DW+4)*1000)toVote()}
    else if(g.ph==='vote'){var vd=ps.filter(function(p){return p.v&&p.v.r===g.r&&ro.some(function(r){return r[0]===p.u})}).length;if((vd>=ro.length&&el>1500)||el>(DV+3)*1000)toReveal()}
  }
}
setInterval(tick,500);
app.addEventListener('input',function(e){var id=e.target.id;if(id==='nm')S.name=e.target.value;else if(id==='cd')S.cd=e.target.value.toUpperCase();else if(id==='li')S.lv=e.target.value});
app.addEventListener('focusout',function(){setTimeout(function(){if(S.dirty&&!typing())render(true)},300)});
function nm(){S.name=cl(S.name,18);ls('men-name',S.name);return S.name}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),v=b.getAttribute('data-v');
  if(a==='rounds'){S.R=+v;render(true)}
  else if(a==='create'){if(!nm()){S.err='Escribe tu nombre primero.';return render(true)}enter(rid(4),true)}
  else if(a==='join'){var c=(S.cd||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!nm()){S.err='Escribe tu nombre primero.';return render(true)}if(c.length<3){S.err='Escribe el código de la sala.';return render(true)}enter(c,false)}
  else if(a==='resume'){var l=JSON.parse(ls('men-last'));if(!nm()){S.err='Escribe tu nombre primero.';return render(true)}enter(l.code,l.host)}
  else if(a==='leave'){if(confirm('¿Salir de la sala?'))leaveRoom()}
  else if(a==='share'){var u=location.origin+location.pathname+'?sala='+S.code;if(navigator.share)navigator.share({title:'Mentiroso',text:'Únete a mi sala: '+S.code,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){b.textContent='✅ Enlace copiado'})}
  else if(a==='start')startGame();
  else if(a==='sendlie')sendLie();
  else if(a==='tovote'&&S.host)toVote();
  else if(a==='vote')vote(+v);
  else if(a==='toreveal'&&S.host)toReveal();
  else if(a==='next'&&S.host)nextRound();
  else if(a==='again'&&S.host){S.a=null;S.v=null;setG({ph:'lobby',r:0,o:[],tot:{},rs:'',id:Date.now()})}
});
app.addEventListener('keydown',function(e){if(e.key==='Enter'){if(e.target.id==='cd')app.querySelector('[data-a=join]').click();else if(e.target.id==='li')sendLie()}});
render(true);
</script>
</body>
