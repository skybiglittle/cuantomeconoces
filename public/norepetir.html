<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020">
<title>Basta · ¿Cuánto me conoces?</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d32;--panel2:#1d2943;--line:#2b3854;--text:#f4f7ff;--muted:#a8b4cc;--accent:#8b9cff;--green:#39d6a0;--yellow:#ffd166;--red:#ff7185;--shadow:0 18px 50px #0005}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#24365d 0,transparent 48%),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.wrap{width:min(920px,100%);margin:auto;padding:22px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:850;letter-spacing:.02em}.brand span{color:var(--accent)}a{color:inherit;text-decoration:none}.back{color:var(--muted);font-size:14px}.card{background:linear-gradient(145deg,#19243b,#111a2d);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}.center{text-align:center}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:850}.title{font-size:clamp(30px,6vw,48px);line-height:1.04;margin:8px 0 12px;font-weight:900}.muted,.small{color:var(--muted)}.small{font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.btn{border:0;border-radius:13px;padding:13px 17px;background:linear-gradient(135deg,#8292ff,#6575ed);color:white;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 7px 20px #6475ed30}.btn.secondary{background:#263451;border:1px solid #405174;box-shadow:none}.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--muted)}.btn:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #3b4a69;border-radius:12px;background:#0d1628;color:var(--text);font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8292ff22}label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:12px 0 6px}.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:14px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}.hidden{display:none!important}.code{font-size:32px;font-weight:950;letter-spacing:.22em;color:var(--yellow);margin:8px 0}.players{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pill{padding:7px 11px;background:#202e49;border:1px solid #344564;border-radius:999px;font-size:13px}.pill.me{border-color:var(--green);color:var(--green)}.letter{width:116px;height:116px;margin:14px auto;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#8b9cff,#5d6de0);font-size:76px;font-weight:950;box-shadow:0 15px 40px #6475ed55;color:white}.meta{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px}.timer{height:9px;border-radius:99px;background:#283651;overflow:hidden;margin:14px 0 5px}.timer>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));width:100%;transition:width .3s linear}.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.cat{background:#111b2e;border:1px solid #2d3c59;border-radius:14px;padding:12px}.cat b{display:block;font-size:13px;margin-bottom:7px;color:#c7d1e6}.cat input{padding:10px 11px}.cat .hint{font-size:11px;color:var(--muted);margin-top:5px}.status{padding:11px 13px;background:#111b2e;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13px;margin:12px 0}.score{font-size:20px;font-weight:900;color:var(--green)}.resultcat{margin:14px 0}.resultcat h3{margin:0 0 8px;color:#c9d3eb;font-size:14px}.answerline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 11px;border-radius:10px;background:#111b2e;margin:6px 0;font-size:14px}.answerline.good{border-left:3px solid var(--green)}.answerline.dup{border-left:3px solid var(--yellow)}.answerline.bad{border-left:3px solid var(--red);opacity:.7}.points{white-space:nowrap;font-weight:850}.rank{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}.rank:last-child{border:0}.rank .num{width:28px;color:var(--muted);font-weight:900}.rank .pts{margin-left:auto;font-weight:900;color:var(--green)}.foot{margin-top:18px;text-align:center;color:#73819d;font-size:12px}.notice{color:var(--yellow);font-size:13px;min-height:20px;margin:8px 0}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:560px){.wrap{padding:14px 12px 40px}.card{padding:16px;border-radius:17px}.catgrid{grid-template-columns:1fr}.settings{grid-template-columns:1fr}.letter{width:100px;height:100px;font-size:66px}.code{font-size:27px}}
</style>
</head>
<body><div class="wrap">
<header class="top"><a class="brand" href="/">¿Cuánto me <span>conoces?</span></a><a class="back" href="/">← Volver a juegos</a></header>
<main id="app"><section class="card center"><div class="eyebrow">Juego multijugador</div><h1 class="title">BASTA</h1><p class="muted">Una letra, varias categorías y todos contra el reloj. ¡Gana quien encuentre las respuestas menos repetidas!</p></section></main>
<div class="foot">Basta · Juego de grupo en tiempo real</div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),app=$('app');
const STORE='cmc_basta_session_v1',CID='cmc_basta_cid_v1',KEY='cmc_basta_key_v1';
const letters='ABCDEFGHIJLMNOPQRSTUVZ';
const categoryPool=['Animal','Comida','Nombre propio','Ciudad o país','Profesión','Objeto de casa','Marca','Algo que da miedo','Excusa para llegar tarde','Cosa que hay en un baño','Personaje famoso','Película o serie','Deporte','Prenda de ropa','Algo que llevarías de viaje','Cosa que hace ruido','Regalo','Aplicación móvil','Algo que da asco','Cosa que encontrarías en un colegio','Bebida','Instrumento musical','Vehículo','Algo que se rompe','Palabra relacionada con el verano','Cosa que te llevarías a una isla','Superpoder','Motivo para celebrar','Algo que no dirías en una entrevista','Cosa que hay en un supermercado','Un insulto suave','Algo que puede estar debajo de la cama','Personaje de dibujos','Plan de fin de semana','Algo que se pierde fácilmente','Cosa que llevarías a una boda','Algo que huele bien','Algo que huele mal','Una aplicación o web','Un famoso'];
const $safe=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}};
let saved=load(),name=saved?.name||'',roomCode=saved?.room||'',isHost=!!saved?.host,myKey=localStorage.getItem(KEY)||Math.random().toString(36).slice(2,11),cid=localStorage.getItem(CID)||Math.random().toString(36).slice(2)+Date.now().toString(36);
localStorage.setItem(KEY,myKey);localStorage.setItem(CID,cid);
let socket=null,peers=[],state=saved?.state||null,own={answers:saved?.answers||{},done:!!saved?.done,basta:!!saved?.basta,score:Number(saved?.score)||0,scoredRound:saved?.scoredRound??-1},closed=false,retry=0,connecting=false,lastRound=state?.round||0,rendering=false;
function persist(){localStorage.setItem(STORE,JSON.stringify({name,room:roomCode,host:isHost,state,answers:own.answers,done:own.done,basta:own.basta,score:own.score,scoredRound:own.scoredRound}));}
function myPresence(){return peers.find(p=>p.p?.b_key===myKey)?.p||{};}
function playerList(){return peers.filter(p=>p.p?.b_key).map(p=>({key:p.p.b_key,name:p.p.b_name||'Jugador',host:!!p.p.b_host,answers:p.p.b_answers||{},done:!!p.p.b_done,basta:!!p.p.b_basta,score:Number(p.p.b_score)||0,scoredRound:Number.isFinite(p.p.b_scored)?p.p.b_scored:-1,peer:p}));}
function publish(extra={}){if(!socket||socket.readyState!==1)return;const patch={b_name:name,b_key:myKey,b_host:isHost?1:0,b_answers:own.answers,b_done:own.done?1:0,b_basta:own.basta?1:0,b_score:own.score,b_scored:own.scoredRound,...extra};socket.send(JSON.stringify({t:'pres',p:patch}));}
function publishState(){if(!isHost)return;publish({b_state:state});persist();}
function hostPeer(){return peers.find(p=>p.p?.b_host===1&&p.p?.b_state);}
function updateFromPeers(){const hp=hostPeer();if(hp&&!isHost){const incoming=hp.p.b_state;if(incoming&&(!state||incoming.updated!==state.updated||incoming.round!==state.round||incoming.phase!==state.phase||incoming.deadline!==state.deadline)){const old=state?.round;state=incoming;if(old!==state.round){own.answers={};own.done=false;own.basta=false;own.scoredRound=-1;if(incoming.phase==='lobby'&&incoming.round===0)own.score=0;lastRound=state.round;publish();}persist();}}
 if(state?.phase==='play'&&playerList().some(p=>p.basta)&&!own.done)submitAnswers(false);
 if(state?.phase==='results')scoreMyRound();
 if(state?.phase==='play'&&document.activeElement?.matches('[data-cat]'))return;
 render();
}
function connect(){if(connecting||!roomCode)return;connecting=true;closed=false;const proto=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(proto+'//'+location.host);socket.onopen=()=>{retry=0;socket.send(JSON.stringify({t:'join',room:'cmd-basta-'+roomCode.toLowerCase(),cid}));};socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.t==='hello')return;if(m.t==='err'){closed=true;connecting=false;try{socket.close()}catch{}const msg=m.code==='room_full'?'La sala ha alcanzado el máximo de jugadores.':'No se ha podido entrar en esa sala.';if(!state||state.phase==='lobby'){roomCode='';renderHome(msg)}else showNotice(msg);return}if(m.t==='peers'){peers=m.peers||[];connecting=false;if(!peers.some(p=>p.p?.b_key===myKey)){publish({b_state:isHost?state:undefined});}updateFromPeers();}};socket.onclose=()=>{connecting=false;if(closed)return;retry++;showNotice('Conexión interrumpida. Reconectando…');setTimeout(()=>{if(!closed)connect()},Math.min(1000*retry,8000));};socket.onerror=()=>{};}
function showNotice(msg){const el=$('notice');if(el)el.textContent=msg;}
function randomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s;}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function pickLetter(){const used=state?.usedLetters||[];let choices=letters.split('').filter(x=>!used.includes(x));if(!choices.length){state.usedLetters=[];choices=letters.split('');}const l=choices[Math.floor(Math.random()*choices.length)];state.usedLetters.push(l);return l;}
function pickCats(n){return shuffle(categoryPool).slice(0,n);}
function createRoom(){name=($('name')?.value.trim()||'Jugador').slice(0,18);roomCode=randomCode();isHost=true;state={phase:'lobby',round:0,rounds:5,time:60,catCount:7,letter:'',categories:[],deadline:0,usedLetters:[],updated:Date.now()};own={answers:{},done:false,basta:false,score:0,scoredRound:-1};persist();connect();render();}
function joinRoom(){name=($('name')?.value.trim()||'Jugador').slice(0,18);const c=($('code')?.value||'').trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(c)){renderHome('Escribe un código de sala de cinco caracteres.');return;}roomCode=c;isHost=false;state=null;own={answers:{},done:false,basta:false,score:0,scoredRound:-1};persist();connect();render();}
function startGame(){if(!isHost||playerList().length<2)return;state.phase='play';state.round=1;state.letter=pickLetter();state.categories=pickCats(state.catCount);state.deadline=Date.now()+state.time*1000;state.updated=Date.now();own.answers={};own.done=false;own.basta=false;own.scoredRound=-1;state.stopDeadline=0;publishState();publish();render();}
function norm(s){return String(s||'').trim().toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ ]/g,'').replace(/\s+/g,' ');}
function valid(s){const v=norm(s);if(!v)return false;const first=v[0].toUpperCase();return first===state.letter;}
function roundPoints(key){let total=0;for(const cat of state.categories){const mine=playerList().find(p=>p.key===key)?.answers?.[cat]||'';if(!valid(mine))continue;const n=norm(mine);const count=playerList().filter(p=>valid(p.answers?.[cat])&&norm(p.answers[cat])===n).length;total+=count===1?10:5;}return total;}
function scoreMyRound(){if(own.scoredRound===state.round)return;own.score+=roundPoints(myKey);own.scoredRound=state.round;persist();publish();}
function finishRound(){if(!isHost||!state||state.phase!=='play')return;state.phase='results';state.deadline=0;state.updated=Date.now();publishState();render();}
function nextRound(){if(!isHost||!state)return;if(state.round>=state.rounds){state.phase='finished';state.updated=Date.now();publishState();render();return;}state.round++;state.phase='play';state.letter=pickLetter();state.categories=pickCats(state.catCount);state.deadline=Date.now()+state.time*1000;state.updated=Date.now();own.answers={};own.done=false;own.basta=false;own.scoredRound=-1;state.stopDeadline=0;publishState();publish();render();}
function rank(){return playerList().sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'es'));}
function renderHome(msg=''){app.innerHTML='<section class="card center"><div class="eyebrow">Juego multijugador · 2–200 jugadores</div><h1 class="title">BASTA</h1><p class="muted">Una letra, varias categorías y todos contra el reloj. Las respuestas originales valen más.</p><div class="letter" aria-hidden="true">A</div><div class="small">Crea una sala y comparte el código, o únete a la de otra persona.</div></section><section class="card"><label for="name">Tu nombre</label><input id="name" maxlength="18" placeholder="¿Cómo te llamas?" value="'+$safe(name)+'"><div class="row" style="margin-top:14px"><button class="btn" id="create">Crear sala</button><button class="btn secondary" id="toggleJoin">Unirme con código</button></div><div id="joinArea" class="hidden"><label for="code">Código de sala</label><input id="code" maxlength="5" placeholder="ABCDE" autocapitalize="characters"><button class="btn secondary" id="join" style="width:100%;margin-top:10px">Entrar en la sala</button></div><p class="notice" id="notice">'+$safe(msg)+'</p></section><section class="card"><div class="eyebrow">Reglas rápidas</div><p class="muted" style="margin-bottom:0">10 puntos si nadie más ha escrito lo mismo; 5 si se repite; 0 si está en blanco o no empieza por la letra. El juego comprueba automáticamente la letra y las coincidencias; el grupo decide si una palabra es válida de verdad.</p></section>';
 $('create').onclick=createRoom;$('toggleJoin').onclick=()=>{$('joinArea').classList.toggle('hidden');$('code')?.focus()};$('join').onclick=joinRoom;$('code')?.addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5));}
function renderLobby(){const ps=playerList();app.innerHTML='<section class="card center"><div class="eyebrow">Sala de Basta</div><h1 class="title">Esperando jugadores</h1><div class="code">'+$safe(roomCode)+'</div><button class="btn secondary" id="copy">Copiar código</button><p class="muted">Comparte este código. Cuando haya al menos dos jugadores, el anfitrión podrá empezar.</p><div class="players">'+ps.map(p=>'<span class="pill '+(p.key===myKey?'me':'')+'">'+$safe(p.name)+(p.host?' · anfitrión':'')+(p.key===myKey?' · tú':'')+'</span>').join('')+'</div><p class="small">'+ps.length+' jugador'+(ps.length===1?'':'es')+' conectado'+(ps.length===1?'':'s')+'</p></section>'+(isHost?'<section class="card"><div class="eyebrow">Ajustes de partida</div><div class="settings"><div><label>Rondas</label><select id="rounds"><option value="3">3 rondas</option><option value="5" selected>5 rondas</option><option value="8">8 rondas</option></select></div><div><label>Tiempo</label><select id="time"><option value="45">45 segundos</option><option value="60" selected>60 segundos</option><option value="90">90 segundos</option></select></div><div><label>Categorías</label><select id="cats"><option value="5">5 categorías</option><option value="7" selected>7 categorías</option><option value="9">9 categorías</option></select></div></div><button class="btn" id="start" style="width:100%;margin-top:16px" '+(ps.length<2?'disabled':'')+'>Empezar partida</button></section>':'<section class="card center"><p class="muted">El anfitrión está preparando la partida…</p></section>')+'<button class="btn ghost" id="leave" style="width:100%">Salir de la sala</button>';
 $('copy')?.addEventListener('click',()=>navigator.clipboard?.writeText(roomCode).then(()=>$('copy').textContent='¡Copiado!').catch(()=>{}));$('start')?.addEventListener('click',()=>{state.rounds=Number($('rounds').value);state.time=Number($('time').value);state.catCount=Number($('cats').value);startGame()});$('leave').onclick=leaveRoom;}
function renderPlay(){const left=Math.max(0,state.deadline-Date.now()),ps=playerList();app.innerHTML='<section class="card center"><div class="eyebrow">Ronda '+state.round+' de '+state.rounds+'</div><div class="letter">'+$safe(state.letter)+'</div><div class="meta"><span class="tag">⏱ '+Math.ceil(left/1000)+' s</span><span class="tag">'+ps.length+' jugadores</span><span class="tag">'+state.categories.length+' categorías</span></div><div class="timer"><i id="bar" style="width:'+Math.max(0,left/(state.time*1000)*100)+'%"></i></div><p class="muted">Escribe una respuesta por categoría. ¡No mires las de los demás!</p></section><section class="card"><div class="catgrid">'+state.categories.map((cat,i)=>'<div class="cat"><b>'+(i+1)+'. '+$safe(cat)+'</b><input data-cat="'+$safe(cat)+'" maxlength="45" autocomplete="off" placeholder="Empieza por '+$safe(state.letter)+'…" value="'+$safe(own.answers[cat]||'')+'" '+(own.done?'disabled':'')+'><div class="hint">Una respuesta por categoría</div></div>').join('')+'</div><button class="btn" id="done" style="width:100%;margin-top:16px" '+(own.done?'disabled':'')+'>'+(own.done?'Respuesta enviada ✓':'¡BASTA! · Terminar la ronda')+'</button><p class="notice" id="notice">'+(own.done?'Tus respuestas están guardadas. Esperando al resto…':'Al pulsar ¡BASTA!, se cierra la ronda para todos. También termina al agotarse el tiempo.')+'</p></section><section class="card"><div class="eyebrow">Marcador</div>'+rank().map((p,i)=>'<div class="rank"><span class="num">'+(i+1)+'</span><b>'+$safe(p.name)+'</b><span class="pts">'+p.score+' pts</span></div>').join('')+'</section>';
 app.querySelectorAll('[data-cat]').forEach(inp=>inp.addEventListener('input',()=>{own.answers[inp.dataset.cat]=inp.value;persist();}));$('done').onclick=submitAnswers;}
function submitAnswers(triggerBasta=true){if(own.done||state?.phase!=='play')return;app.querySelectorAll('[data-cat]').forEach(inp=>own.answers[inp.dataset.cat]=inp.value.trim());own.done=true;own.basta=!!triggerBasta;persist();publish();render();}
function renderResults(){scoreMyRound();const ps=playerList(),allScored=ps.length>0&&ps.every(p=>p.scoredRound===state.round);let html='<section class="card center"><div class="eyebrow">Fin de la ronda '+state.round+'</div><h1 class="title">¡Resultados!</h1><p class="muted">Letra: <b style="color:var(--yellow);font-size:22px">'+$safe(state.letter)+'</b> · Se han comparado las respuestas de todos.</p></section>';
 for(const cat of state.categories){const vals=ps.map(p=>({name:p.name,key:p.key,answer:p.answers[cat]||''}));const groups={};vals.forEach(v=>{if(valid(v.answer)){const n=norm(v.answer);groups[n]=(groups[n]||0)+1;}});html+='<section class="card resultcat"><h3>'+$safe(cat)+'</h3>'+vals.map(v=>{const ok=valid(v.answer),count=ok?groups[norm(v.answer)]:0,pts=!ok?0:count===1?10:5;return '<div class="answerline '+(!ok?'bad':count===1?'good':'dup')+'"><span><b>'+$safe(v.name)+'</b><br>'+$safe(v.answer||'— Sin respuesta')+'</span><span class="points">'+pts+' pts</span></div>';}).join('')+'</section>';}
 html+='<section class="card"><div class="eyebrow">Clasificación</div>'+rank().map((p,i)=>'<div class="rank"><span class="num">'+(i+1)+'</span><b>'+$safe(p.name)+'</b><span class="pts">'+p.score+' pts</span></div>').join('')+'</section>';
 if(isHost)html+='<section class="card center"><p class="small">'+(allScored?'Todos los marcadores están actualizados.':'Actualizando puntuaciones de los jugadores…')+'</p><button class="btn" id="next" '+(!allScored?'disabled':'')+'>'+(state.round>=state.rounds?'Ver clasificación final':'Siguiente ronda')+'</button></section>';else html+='<section class="card center"><p class="muted">Esperando a que el anfitrión inicie la siguiente ronda…</p></section>';
 app.innerHTML=html;$('next')?.addEventListener('click',nextRound);}
function renderFinished(){app.innerHTML='<section class="card center"><div class="eyebrow">Partida terminada</div><h1 class="title">🏆 ¡Basta!</h1><p class="muted">Clasificación final después de '+state.round+' rondas.</p></section><section class="card">'+rank().map((p,i)=>'<div class="rank"><span class="num">'+(['🥇','🥈','🥉'][i]||i+1)+'</span><b>'+$safe(p.name)+'</b><span class="pts">'+p.score+' pts</span></div>').join('')+'</section><button class="btn" id="again" style="width:100%">Volver a jugar en esta sala</button><button class="btn ghost" id="leave" style="width:100%;margin-top:9px">Salir</button>';$('again').onclick=()=>{if(!isHost)return;state.phase='lobby';state.round=0;state.usedLetters=[];state.updated=Date.now();own.score=0;own.scoredRound=-1;own.done=false;own.basta=false;own.answers={};publishState();publish();render();};$('leave').onclick=leaveRoom;}
function render(){if(!roomCode){renderHome();return;}if(!socket||socket.readyState!==1){app.innerHTML='<section class="card center"><div class="eyebrow">Conectando</div><h1 class="title">Entrando en la sala…</h1><p class="muted">Código '+$safe(roomCode)+'</p><p class="notice" id="notice">'+(retry?'Reconectando…':'Estableciendo conexión…')+'</p><button class="btn ghost" id="cancel">Cancelar</button></section>';$('cancel').onclick=leaveRoom;return;}if(!state){app.innerHTML='<section class="card center"><h1 class="title">Esperando al anfitrión…</h1><p class="muted">La sala '+$safe(roomCode)+' está conectada.</p><button class="btn ghost" id="leave">Salir</button></section>';$('leave').onclick=leaveRoom;return;}if(state.phase==='lobby')renderLobby();else if(state.phase==='play')renderPlay();else if(state.phase==='results')renderResults();else renderFinished();}
function leaveRoom(){closed=true;try{socket?.close()}catch{};socket=null;peers=[];roomCode='';state=null;own={answers:{},done:false,basta:false,score:0,scoredRound:-1};localStorage.removeItem(STORE);renderHome();}
function autoSubmitAtDeadline(){if(!state||state.phase!=='play'||own.done||Date.now()<state.deadline)return;app.querySelectorAll('[data-cat]').forEach(inp=>own.answers[inp.dataset.cat]=inp.value.trim());own.done=true;own.basta=false;persist();publish();if(app.querySelector('[data-cat]'))render();}
function hostTick(){if(!isHost||!state||state.phase!=='play')return;const ps=playerList();const allDone=ps.length>=2&&ps.every(p=>p.done);if(ps.some(p=>p.basta)&&!state.stopDeadline){state.stopDeadline=Date.now()+1400;state.updated=Date.now();publishState();}if(allDone||(state.stopDeadline&&Date.now()>=state.stopDeadline)||Date.now()>=state.deadline+2500)finishRound();}
setInterval(()=>{if(!roomCode)return;autoSubmitAtDeadline();hostTick();if(state?.phase==='play'&&$('bar')){const left=Math.max(0,state.deadline-Date.now());$('bar').style.width=Math.max(0,left/(state.time*1000)*100)+'%';const tag=app.querySelector('.meta .tag');if(tag)tag.textContent='⏱ '+Math.ceil(left/1000)+' s';}},250);
// Reanudar automáticamente una sesión anterior; el mismo cid sustituye la conexión anterior.
if(saved?.room&&saved?.name){name=saved.name;roomCode=saved.room;isHost=!!saved.host;connect();}else renderHome();
})();
</script></body></html>
