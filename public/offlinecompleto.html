body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 8px;font-size:22px}
p{margin:0 0 12px}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin:14px 0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .25s}
.kick{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:4px}
.q{font-size:21px;font-weight:650;line-height:1.3;margin:0 0 16px}
.who{font-size:14px;color:var(--mut);margin-bottom:10px}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx)}
.opt:active,.opt:hover{border-color:var(--ac)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:700;margin-top:10px}
.btn[disabled]{opacity:.45}
.btn.sec{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;padding:0;font-size:14px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:6px 0 10px}
.big{font-size:64px;font-weight:800;text-align:center;line-height:1;margin:6px 0}
.center{text-align:center}
.score{display:flex;gap:10px}
.score div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.score b{display:block;font-size:26px}
ul{list-style:none;padding:0;margin:0}
li{padding:10px 12px;border-radius:12px;margin:8px 0;border:1px solid var(--bd);background:var(--card);font-size:15px}
li.ok{border-left:5px solid var(--ok)}
li.ko{border-left:5px solid var(--ko)}
li small{display:block;color:var(--mut)}
/* ---------- Animaciones ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:var(--from,0%)}}
@keyframes pop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{to{background-position:200% 0}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#app>*:not(.top):not(.bar):not(h1){animation:rise .4s ease both}
#app>*:nth-child(3){animation-delay:.05s}
#app>*:nth-child(4){animation-delay:.1s}
#app>*:nth-child(5){animation-delay:.15s}
#app>h1{background-size:200% 100%;animation:rise .4s ease both,shimmer 6s linear infinite}
.card>.opt{animation:rise .4s ease both;animation-delay:var(--d,0ms)}
.opt{transition:transform .15s,border-color .15s,background .15s}
.opt:hover{transform:translateX(3px)}
.opt.picked{transform:scale(.97);border-color:var(--ac);background:rgba(224,69,123,.12);font-weight:700}
.btn{transition:transform .15s,box-shadow .15s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(124,77,255,.28)}
.btn:active{transform:scale(.98)}
.big{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
li{animation:rise .4s ease both;animation-delay:var(--d,0ms)}
.bar i{animation:fill .35s ease both}
.dots i{display:inline-block;width:6px;height:6px;margin-left:5px;border-radius:50%;background:var(--ac);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear both}
.chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bd);color:#fff}
.chip.new{animation:pop .3s both}
.chip.me{outline:2px solid var(--tx)}
#app.still *{animation:none!important}
#app.still .chip.new,#app.still .pill.new{animation:pop .35s both!important}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(224,69,123,.55)}100%{box-shadow:0 0 0 14px rgba(224,69,123,0)}}

@keyframes floatup{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-62vh) translateX(var(--sx)) scale(1.25)}}

.pl{display:flex;flex-wrap:wrap;gap:8px}

  var ps=gPeers(),n=G.ro.length,u=G.used=G.used||{},conn=gConn(),sq=null,by=null;
  G.pb=null;G.cq=null;G.pr=null;
  if(!n)return;
  var pool=conn.length?conn:G.ro;
  // 1) preguntas enviadas por los jugadores (por turnos entre quienes las envían)
  for(var s=0;s<n&&!sq;s++){
    var k=G.ro[(G.rp+s)%n],pe=ps.filter(function(x){return x.p.k===k})[0];
    if(!pe||!Array.isArray(pe.p.qs))continue;
    for(var j=0;j<pe.p.qs.length;j++){var c=cleanQ(pe.p.qs[j]);if(c&&!u[c.i]){sq=c;by=k;G.rp=((G.rp+s)+1)%n;break}}
  }
  if(sq){
    var tgt=(sq.to!=='any'&&pool.indexOf(sq.to)>-1)?sq.to:null;
    if(!tgt){
      var opts=pool.filter(function(x){return x!==by&&x!==G.sk});
      if(!opts.length)opts=pool.filter(function(x){return x!==by});
      if(!opts.length)opts=pool;
      tgt=opts[Math.floor(Math.random()*opts.length)];
    }
    G.sk=tgt;u[sq.i]=1;G.cq={q:G.q,i:sq.i,k:tgt,by:by,t:sq.t,o:sq.o};return;
  }
  // 2) cada 4 preguntas: ronda de votación "¿quién es más probable?"
  if((G.q+1)%4===0&&n>=2){G.pbn=(G.pbn||0)+1;G.pb=((G.seed||0)+G.pbn*7)%PROB.length;G.sk=null;return}
  // 3) pregunta del mazo para el siguiente jugador conectado
  var pick=null;
  for(var s2=0;s2<n&&!pick;s2++){var i2=(G.sp+s2)%n;if(pool.indexOf(G.ro[i2])>-1){pick=G.ro[i2];G.sp=(i2+1)%n}}
  G.sk=pick||G.ro[G.sp%n];
}

}
function endG(){
  var ps=gPeers(),r=sortedG(ps),pod=[1,0,2].filter(function(i){return r[i]}).map(function(i){return '<div class="pod"><div>'+av(r[i].p.n,true)+'</div><b>'+esc(r[i].p.n)+'</b><span>'+(r[i].p.sc||0)+' pts</span><div class="blk" style="--h:'+[130,100,76][i]+'px;--d:'+(300+(2-i)*250)+'ms">'+['🥇','🥈','🥉'][i]+'</div></div>'}).join('');
  gPaint('end','<h1>Resultado final</h1><div class="card center" data-confetti="1"><div class="kick">Mejor adivino</div><h2>'+esc(r[0]?r[0].p.n:'')+'</h2><div class="podium">'+pod+'</div></div><div class="card"><ul>'+rankG(ps)+'</ul></div><button class="btn sec" data-a="g-leave">Salir</button>');
}


function segH(){return '<div class="seg">'+[['normal','Clásico ('+QN.length+')'],['profundo','Profundo ('+QD.length+')'],['gracioso','Gracioso 😂 ('+QG.length+')']].map(function(x){return '<button data-m="'+x[0]+'"'+(MODE===x[0]?' class="on"':'')+'>'+x[1]+'</button>'}).join('')+'</div>'}
function homeKeep(){var ids=['gn','gc'],v=ids.map(function(i){var e=document.getElementById(i);return e?e.value:''});home();ids.forEach(function(i,k){var e=document.getElementById(i);if(e)e.value=v[k]})}
function home(){
  app.classList.remove('still');
  var oldG=gLoad();if(oldG&&oldG.ph==='end')oldG=null;
  var msg=OMSG?'<p style="color:var(--ko);font-size:14px">'+esc(OMSG)+'</p>':'';
  app.innerHTML='<h1>¿Cuánto me conoces?</h1><div class="card"><div class="kick">Modo offline · sin base de datos</div><p class="mut" style="font-size:14px">Las preguntas van incluidas en esta página, así que funciona aunque la base de datos esté caída. A cada jugador le toca responder en secreto y los demás adivinan. Además, todos pueden enviar sus propias preguntas (✉️) y cada 4 preguntas hay una votación de «¿quién es más probable?».</p><div class="kick" style="margin-top:14px">Tipo de preguntas</div>'+segH()
  +'<label style="display:block;margin-top:12px">Tu nombre<input id="gn" maxlength="20" placeholder="Nombre"></label><button class="btn" data-a="g-create"'+(RM?'':' disabled')+'>Crear sala</button><div class="or">o únete a una sala</div><input id="gc" maxlength="8" placeholder="Código de sala (ej: k7f3m)" autocapitalize="none"><button class="btn sec" data-a="g-join"'+(RM?'':' disabled')+'>Unirme</button>'
  +(oldG?'<button class="btn sec" data-a="g-reconnect">Reconectar al grupo '+esc(oldG.code.toUpperCase())+'</button>':'')+msg+'</div>';
}
app.addEventListener('click',function(e){
  var m=e.target.closest('[data-m]');if(m){setMode(m.getAttribute('data-m'));homeKeep();return}
  var gk=e.target.closest('[data-gk]');if(gk&&G){gVote(gk.getAttribute('data-gk'));return}
  var gv=e.target.closest('[data-gv]');if(gv&&G){gChoose(+gv.getAttribute('data-gv'));return}
  var gr=e.target.closest('[data-gr]');if(gr&&G){gReact(gr.getAttribute('data-gr'));return}
  var gl=e.target.closest('[data-gl]');if(gl&&G&&G.host&&G.ph==='lobby'){G.tot=+gl.getAttribute('data-gl');gPub();syncG();return}
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a');
  if(a==='g-create')gStart(true,false);
  else if(a==='g-join')gStart(false,false);
  else if(a==='g-reconnect')gStart(false,true);
  else if(a==='g-start')gBegin();
  else if(a==='g-next'||a==='g-skip')gNext();
  else if(a==='g-dbl')gDouble();
  else if(a==='g-ask')qmOpen();
  else if(a==='g-host')hmOpen();
  else if(a==='g-leave'){if(G&&G.host&&NR){var o2=gPeers().filter(function(x){return !x.me});if(o2.length){gHandOver(o2[0].p.k);setTimeout(gLeave,600);return}}gLeave()}
});
var RED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el){
  if(RED||el.dataset.done)return;el.dataset.done=1;
  var n=+el.dataset.n,suf=el.dataset.suf||'',t0=null;el.textContent='0'+suf;
  function f(t){if(!t0)t0=t;var p=Math.min((t-t0)/800,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(f)}
  requestAnimationFrame(f);
}
function confetti(){
  if(RED)return;
  var box=document.createElement('div');box.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:50';
  var cols=['#e0457b','#7c4dff','#1f9d63','#ffb020','#2bb3ff'];
  for(var i=0;i<46;i++){var c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'%';c.style.background=cols[i%5];c.style.animationDuration=(1.8+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*.5)+'s';box.appendChild(c)}
  document.body.appendChild(box);setTimeout(function(){box.remove()},4200);
}
function fx(){
  var b=app.querySelector('.big[data-n]');if(b)countUp(b);
  var c=app.querySelector('[data-confetti]');if(c&&!c.dataset.done){c.dataset.done=1;confetti()}
}
new MutationObserver(fx).observe(app,{childList:true});
home();
</script>
</body>
