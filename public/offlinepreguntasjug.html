<style>

.card>.opt.right{animation:boom .7s ease both}

li.rk{display:flex;justify-content:space-between;align-items:center}
li.rk span:first-child{display:flex;align-items:center}
li.rk .sc{font-weight:800;font-size:18px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:14px}
.pod{flex:1;max-width:120px;text-align:center;font-size:14px}
.pod span{display:block;color:var(--mut)}
.pod .blk{height:var(--h);margin-top:6px;border-radius:12px 12px 0 0;background:linear-gradient(180deg,var(--ac),var(--ac2));transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:var(--d);display:flex;justify-content:center;padding-top:8px;font-size:28px}
.qm{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:70}
.qm .card{max-width:520px;width:100%;margin:8px 0}
.qm textarea{width:100%;min-height:70px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:6px 0 10px}
.fe{position:fixed;bottom:12px;font-size:36px;pointer-events:none;z-index:60;text-align:center;animation:floatup 2.5s ease-out forwards}
.fe small{display:block;font-size:11px;background:var(--card);color:var(--tx);border-radius:8px;padding:0 6px;margin-top:2px}
.opt.mine{border-color:var(--ac);background:rgba(224,69,123,.1)}
.opt.right{border-color:var(--ok);background:rgba(31,157,99,.14)}
.seg.tabs{margin:10px 0 0}
.seg.tabs button{font-weight:600;padding:12px 4px;font-size:14px}
.eds label{display:block;margin-top:10px;font-size:14px}
.eds li .seg{margin-top:8px}
.eds li .seg button{padding:6px;font-size:13px}
.or{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 4px}
.combo{text-align:center;font-weight:700;color:var(--ac);margin-top:8px;animation:pop .4s both}
.vo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between}
.vo .chips{width:100%}
.vrow{display:flex;align-items:center}
.vc{font-weight:800;color:var(--ac)}
.qm select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:6px 0 10px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dg .opt{padding:8px;text-align:center;margin:0}.dg .opt[disabled]{opacity:.45}.dcv{width:100%;max-width:260px;aspect-ratio:1;border-radius:10px;background:#fff;display:block;margin:0 auto 6px;touch-action:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<main id="app"><div class="card"><p class="mut" style="margin:0">Cargando preguntas…</p></div></main>
<script>function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
var QN=[],QD=[],QG=[];
var PROB=['se quede dormido/a en el cine', 'llegue tarde a su propia boda', 'se pierda con el GPS puesto', 'gane un concurso de baile', 'se ría en un momento serio', 'olvide su propio cumpleaños', 'sobreviva en una isla desierta', 'acabe siendo famoso/a', 'se coma el último trozo de pizza sin avisar', 'hable solo/a por la calle', 'pierda las llaves esta semana', 'llore con un anuncio', 'monte una empresa absurda', 'le cante en público a alguien', 'se haga amigo/a de un desconocido en el autobús', 'acabe viviendo en otro país', 'gaste una broma pesada', 'tenga una mascota rarísima', 'gane la lotería y lo pierda todo', 'se apunte a un plan sin saber de qué va', 'mande un mensaje a la persona equivocada', 'se duerma en una videollamada', 'hable con su mascota como si fuera una persona', 'aguante más tiempo sin móvil', 'cocine mejor que un chef', 'se tropiece en una entrada triunfal', 'haga la mejor imitación', 'organice un viaje sin planificar nada', 'sea el último en irse de la fiesta', 'se haga un tatuaje absurdo', 'llegue el primero a todo', 'cuente el mismo chiste cinco veces', 'haga trampas en un juego de mesa', 'aprenda un idioma rarísimo', 'se quede encerrado/a en un ascensor', 'se enamore en un viaje', 'salve el día en una emergencia', 'acabe con un disfraz en un día normal', 'compre algo inútil por impulso', 'diga una frase que se haga viral'];
var QS=[],QN=[],QD=[],QG=[],ROUNDS=0,MODE='normal';
function setMode(m){MODE=m}
var S=null,app=document.getElementById('app');
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function mkOrder(seed){return shuffle(QS.map(function(_,i){return i}),rng(seed))}
function newCode(){var c='abcdefghjkmnpqrstuvwxyz23456789',s='';for(var i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
var RM=null,NR=null,OMSG='';
function makeWsRoom(){
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
  return {join:function(name){return new Promise(function(resolve,reject){
    var ws=null,id=null,pres={},arr=[],subs=[],done=false,closed=false,retry=0,cid=Math.random().toString(36).slice(2);
    var room={
      peers:function(){return arr},
      onPeers:function(fn){subs.push(fn);return function(){subs=subs.filter(function(x){return x!==fn})}},
      presence:function(p){Object.keys(p).forEach(function(k){if(p[k]===null)delete pres[k];else pres[k]=p[k]});send({t:'pres',p:p});return Promise.resolve()},
      leave:function(){closed=true;try{ws.close()}catch(e){}return Promise.resolve()}
    };
    function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
    function open(){
      ws=new WebSocket(url);
      ws.onopen=function(){retry=0;send({t:'join',room:name,cid:cid});if(Object.keys(pres).length)send({t:'pres',p:pres})};
      ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
        if(m.t==='hello'){id=m.id}
        else if(m.t==='peers'){
          arr=m.peers.map(function(q){return{peer:q.id,isMe:q.id===id,sameTab:q.id===id,kind:'viewer',guest:false,by:null,presence:q.p||{},updatedAt:Date.now()}});
          if(!done){done=true;resolve(room)}
          subs.slice().forEach(function(f){f({peers:arr})});
        }
        else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}
      };
      ws.onclose=function(){if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
    }
    open();
    setTimeout(function(){if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},70000);
  })}};
}
RM=makeWsRoom();// ---------- Modo grupo (sin límite de jugadores) ----------
var G=null,GT=20000,gTimer=null;
function hue(n){var h=0;n=String(n);for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}
function av(n,big){return '<i class="av'+(big?' big':'')+'" style="background:hsl('+hue(n)+',62%,46%)">'+esc((String(n).trim().charAt(0)||'?').toUpperCase())+'</i>'}
function gSave(){try{if(G){var c=Object.assign({},G);['order','sn','rxs','rh','rk'].forEach(function(k){delete c[k]});localStorage.setItem('cmc-group',JSON.stringify(c))}}catch(e){}}
function gLoad(){try{return JSON.parse(localStorage.getItem('cmc-group'))}catch(e){return null}}
function pidN(x){return parseInt(String(x.id).slice(1))||0}
function gPeers(){if(!NR)return[];return NR.peers().filter(function(p){return p.presence&&p.presence.gm}).map(function(p){return{id:p.peer,me:p.isMe,p:p.presence}}).sort(function(a,b){return pidN(a)-pidN(b)})}
function nameOf(ps,k){for(var i=0;i<ps.length;i++)if(ps[i].p.k===k)return ps[i].p.n;return '?'}
function floatEmoji(e,n){if(RED)return;var s=document.createElement('div');s.className='fe';s.style.left=(8+Math.random()*78)+'%';s.style.setProperty('--sx',(Math.random()*70-35)+'px');s.innerHTML=esc(e)+'<small>'+esc(n)+'</small>';document.body.appendChild(s);setTimeout(function(){s.remove()},2700)}
function gStart(create,resume){
  if(!RM){OMSG='Online no disponible en este navegador.';homeKeep();return}
  if(resume){G=gLoad();if(!G)return;setMode(G.mode);G.order=G.seed?mkOrder(G.seed):null;G.qt=Date.now()}
  else{
    var name=(document.getElementById('gn').value||'').trim().slice(0,20)||(create?'Anfitrión':'Jugador'),code=create?newCode():(document.getElementById('gc').value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
    if(!code){OMSG='Escribe el código de la sala de grupo.';homeKeep();return}
    G={code:code,me:Math.random().toString(36).slice(2,8),name:name,host:!!create,seed:create?Math.floor(Math.random()*16777215)+1:0,mode:MODE,sc:0,ph:'lobby',q:-1,tot:10,ro:[],dblUsed:false,dblQ:-1,streak:0,qs:[],used:{},rp:0,sp:0,pbn:0,pb:null,pr:null,gcombo:0,xf:null,sk:null,cq:null};
    G.order=create?mkOrder(G.seed):null;
  }
  G.c=G.c||null;G.a=G.a||null;if(!G.qs)G.qs=[];if(!G.used)G.used={};if(G.sp==null)G.sp=0;if(G.pbn==null)G.pbn=0;if(G.gcombo==null)G.gcombo=0;if(G.my===undefined)G.my=null;if(G.scored==null)G.scored=-1;G.sn={};G.rxs={};G.rh='';G.rk='';OMSG='';
  if(gTimer)clearInterval(gTimer);gTimer=setInterval(gTick,250);
  gRender();
  RM.join('cmg-'+G.code).then(function(r){NR=r;NR.onPeers(syncG);gPub();syncG()}).catch(function(e){OMSG=e&&e.code==='room_full'?'La sala está llena.':'No se pudo entrar a la sala ('+((e&&e.code)||'error')+').';gLeave(true)});
}
function gLeave(keepMsg){
  if(NR){NR.leave().catch(function(){});NR=null}
  if(gTimer){clearInterval(gTimer);gTimer=null}
  var qm=document.getElementById('qm');if(qm)qm.remove();
  var hm=document.getElementById('hm');if(hm)hm.remove();
  G=null;try{localStorage.removeItem('cmc-group')}catch(e){}
  if(!keepMsg)OMSG='';home();
}
function gPub(){if(!NR||!G)return;var p={n:G.name,k:G.me,gm:1,sc:G.sc,c:G.c||null,a:G.a||null,rx:G.rx||null,qs:(G.qs&&G.qs.length)?G.qs:null};p.xf=G.xf||null;if(G.host){p.h=1;p.ph=G.ph;p.sd=G.seed;p.m=G.mode;p.q=G.q;p.tot=G.tot;p.ro=G.ro;p.sk=G.sk;p.cq=G.cq||null;p.pb=G.pb==null?null:G.pb;p.pr=G.pr||null;p.emp=G.emp?1:0}else{p.h=null;p.ph=null;p.sd=null;p.m=null;p.q=null;p.tot=null;p.ro=null;p.sk=null;p.cq=null;p.pb=null;p.pr=null;p.emp=null}NR.presence(p).catch(function(){});gSave()}
function gState(){
  var ps=gPeers(),q=G.q,sk=G.sk||null;
  var gs=ps.filter(function(x){return x.p.k!==sk&&G.ro.indexOf(x.p.k)>-1});
  var done=gs.filter(function(x){return x.p.c&&x.p.c.q===q&&typeof x.p.c.v==='number'}).length;
  var sp=ps.filter(function(x){return x.p.k===sk})[0],a=sp&&sp.p.a&&sp.p.a.q===q?sp.p.a:null;
  return{ps:ps,q:q,sk:sk,isSub:sk===G.me,gs:gs,done:done,rv:a?a.v:null,bm:a?a.bm:0,gold:(q+1)%5===0};
}
function gTrySub(st){
  if(!st.isSub||G.my===null||G.a||!st.gs.length)return false;
  if(st.done<st.gs.length&&Date.now()-(G.qt||0)<GT)return false;
  var ok=st.gs.filter(function(x){return x.p.c&&x.p.c.q===st.q&&x.p.c.v===G.my}).length,bm=ok===0;
  if(bm)G.sc+=st.gold?4:2;
  G.a={q:st.q,v:G.my,bm:bm?1:0};gPub();return true;
}
var NHT=7000;
function gTick(){
  if(!G||!NR||!G.order)return;
  var ps=gPeers();
  if(!G.host){
    if(ps.some(function(x){return x.p.h===1}))G.nh=0;
    else{
      G.nh=G.nh||Date.now();
      if(Date.now()-G.nh>NHT){
        var el=ps.filter(function(x){return G.ph==='lobby'||G.ro.indexOf(x.p.k)>-1});
        if(el.length&&el[0].me){gBecomeHost(null);syncG();return}
      }
    }

  if(mi>=5)out+='<li class="mut center" style="padding:2px">…</li>'+row(r[mi],mi);
  return out+(r.length>5?'<li class="mut center" style="border:0;background:none">'+r.length+' jugadores</li>':'');
}
function playG(){
  var st=gState(),sn=esc(nameOf(st.ps,st.sk)),Q=(G.cq&&G.cq.q===st.q)?{k:'✉️ Pregunta de '+nameOf(st.ps,G.cq.by),q:G.cq.t,o:G.cq.o}:null,rv=st.rv,sub=st.isSub,mk=G.sn;
  if(!Q){waitG();return}
  var wrongMine=!sub&&rv!==null&&G.c&&G.c.q===st.q&&G.c.v!==rv;
  var opts=Q.o.map(function(t,j){
    var chips=(sub&&rv===null)?'':st.gs.filter(function(x){return x.p.c&&x.p.c.q===st.q&&x.p.c.v===j}).map(function(x){var key=st.q+'|'+x.p.k+'|'+j,nw=!mk[key];mk[key]=1;return '<span class="chip'+(x.me?' me':'')+(nw?' new':'')+'" style="background:hsl('+hue(x.p.n)+',55%,40%)">'+esc(x.p.n)+(x.p.c.x?' ⚡':'')+'</span>'}).join('');
    var cls='opt'+(rv===j?' right':'')+(((!sub&&G.c&&G.c.v===j)||(sub&&G.my===j))?' mine':'')+(wrongMine&&G.c.v===j?' wrong':'');
    return '<button class="'+cls+'" style="--d:'+(j*60)+'ms" data-gv="'+j+'">'+esc(t)+(rv===j?' ✓':'')+(chips?'<div class="chips">'+chips+'</div>':'')+'</button>';
  }).join('');
  var f=Math.max(0,1-(Date.now()-(G.qt||0))/GT),info,banner='';
  if(rv===null){
    info=sub?(G.my===null?'Elige tu respuesta. Los demás no la verán hasta el final.':'Respuesta guardada. Han adivinado '+st.done+' de '+st.gs.length+'…'):'Han elegido '+st.done+' de '+st.gs.length+'. Ves lo que eligen los demás, pero no la respuesta de '+sn+'. Puedes cambiar la tuya hasta que se revele.';
    if(f<=0&&sub&&G.my===null)info='¡Se acabó el tiempo! Elige tu respuesta para revelar.';
  }else{
    var ok=st.gs.filter(function(x){return x.p.c&&x.p.c.q===st.q&&x.p.c.v===rv});
    info='Acertaron '+ok.length+' de '+st.gs.length+(ok.length&&ok.length<=6?': '+ok.map(function(x){return esc(x.p.n)}).join(', '):'');
    if(sub)banner=st.bm?'<div class="pts up">🕵️ +'+(st.gold?4:2)+'</div><p class="center">¡Misterioso! Nadie te ha adivinado</p>':'<div class="pts">😊</div><p class="center">Te conocen: han acertado '+ok.length+'</p>';
    else if(G.last&&G.last.q===st.q)banner='<div class="pts '+(G.last.d>0?'up':G.last.d<0?'dn':'')+'">'+(G.last.d>0?'+':'')+G.last.d+'</div><p class="center">'+(G.last.cor?'¡Acertaste!':'Esta vez no')+(G.last.dbl?' · ⚡ Doble':'')+(G.last.tag?' · '+G.last.tag:'')+'</p>';
  }
  var canDbl=!sub&&rv===null&&!G.dblUsed&&G.c&&typeof G.c.v==='number';
  var dbl=sub?'':'<button class="btn sec" data-a="g-dbl"'+(canDbl?'':' disabled')+'>⚡ Doble o nada'+(G.dblQ===st.q?' · activado':G.dblUsed?' · usado':'')+'</button><p class="mut center" style="font-size:12px;margin:4px 0 0">Una vez por partida: acierto +2, fallo −1</p>';
  var host=G.host?'<button class="btn" data-a="g-next"'+(rv===null?' disabled':'')+'>'+(st.q+1>=G.tot?'Ver resultado final':'Siguiente pregunta')+'</button><p class="center" style="margin:8px 0 0"><button class="link" data-a="g-skip">Saltar pregunta</button> · <button class="link" data-a="g-end">🏁 Terminar</button> · <button class="link" data-a="g-host">👑 Pasar anfitrión</button></p>':(rv!==null?'<p class="mut center">Esperando al anfitrión…</p>':'');
  var rx='<div class="rxs">'+['😂','🔥','😮','❤️','👏'].map(function(e){return '<button data-gr="'+e+'">'+e+'</button>'}).join('')+'</div>';
  gPaint('p'+st.q+(rv===null?'a':'r'),
   '<div class="top"><span>Pregunta '+(st.q+1)+' de '+G.tot+' · Sala '+esc(G.code.toUpperCase())+'</span><button class="link" data-a="g-leave">Salir</button></div><div class="bar"><i style="--from:'+(Math.max(st.q-1,0)/G.tot*100)+'%;width:'+(st.q/G.tot*100)+'%"></i></div>'
  +(st.gold?'<div class="gold">✨ Ronda de oro: puntos x2</div>':'')+(G.gcombo>=2?'<div class="combo">🤝 Combo del grupo x'+G.gcombo+'</div>':'')
  +'<div class="card spot">'+av(nameOf(st.ps,st.sk),true)+'<div><div class="kick">'+(sub?'Te toca a ti':'En el foco')+'</div><b style="font-size:18px">'+sn+'</b></div></div>'
  +(rv===null?'<div class="tbar"><i id="tb" style="width:'+(f*100)+'%"></i></div>':'')
  +'<div class="card'+(wrongMine?' shake':'')+(st.gold?' goldc':'')+'"><div class="kick">'+esc(Q.k)+'</div><p class="q">'+esc(Q.q)+'</p>'+opts+'<p class="mut" style="font-size:14px;margin:10px 0 0">'+info+'</p></div>'
  +banner+dbl+rx+askBtn()+host+'<div class="card"><div class="kick">Marcador</div><ul>'+rankG(st.ps)+'</ul></div>');
}
function endG(){
  var ps=gPeers(),r=sortedG(ps),pod=[1,0,2].filter(function(i){return r[i]}).map(function(i){return '<div class="pod"><div>'+av(r[i].p.n,true)+'</div><b>'+esc(r[i].p.n)+'</b><span>'+(r[i].p.sc||0)+' pts</span><div class="blk" style="--h:'+[130,100,76][i]+'px;--d:'+(300+(2-i)*250)+'ms">'+['🥇','🥈','🥉'][i]+'</div></div>'}).join('');
  gPaint('end','<h1>Resultado final</h1><div class="card center" data-confetti="1"><div class="kick">Mejor adivino</div><h2>'+esc(r[0]?r[0].p.n:'')+'</h2><div class="podium">'+pod+'</div></div><div class="card"><ul>'+rankG(ps)+'</ul></div><button class="btn sec" data-a="g-leave">Salir</button>');
}


function waitG(){
  var ps=gPeers();
  gPaint('wait'+G.q,'<div class="top"><span>Pregunta '+(G.q+1)+' · Sala '+esc(G.code.toUpperCase())+'</span><button class="link" data-a="g-leave">Salir</button></div><div class="card center"><div class="kick">Sin preguntas pendientes</div><h2>¡Faltan preguntas!</h2><p class="mut">Aquí solo se juegan las preguntas que envían los jugadores. Pulsa ✉️ y envía la tuya: saldrá enseguida.</p><span class="dots"><i></i><i></i><i></i></span></div>'+askBtn()+(G.host?'<button class="btn sec" data-a="g-end">🏁 Terminar partida</button>':'')+'<div class="card"><div class="kick">Marcador</div><ul>'+rankG(ps)+'</ul></div>');
}

function homeKeep(){var ids=['gn','gc'],v=ids.map(function(i){var e=document.getElementById(i);return e?e.value:''});home();ids.forEach(function(i,k){var e=document.getElementById(i);if(e)e.value=v[k]})}
function home(){
  app.classList.remove('still');
  var oldG=gLoad();if(oldG&&oldG.ph==='end')oldG=null;
  var msg=OMSG?'<p style="color:var(--ko);font-size:14px">'+esc(OMSG)+'</p>':'';
  app.innerHTML='<h1>¿Cuánto me conoces?</h1><div class="card"><div class="kick">Modo solo preguntas · sin base de datos</div><p class="mut" style="font-size:14px">Cada jugador envía sus propias preguntas (✉️) y el grupo las juega por turnos: a quien le toca responde en secreto y los demás intentan adivinar. Funciona aunque la base de datos esté caída. Cada 4 preguntas hay una votación de «¿quién es más probable?».</p>'
  +'<label style="display:block;margin-top:12px">Tu nombre<input id="gn" maxlength="20" placeholder="Nombre"></label><button class="btn" data-a="g-create"'+(RM?'':' disabled')+'>Crear sala</button><div class="or">o únete a una sala</div><input id="gc" maxlength="8" placeholder="Código de sala (ej: k7f3m)" autocapitalize="none"><button class="btn sec" data-a="g-join"'+(RM?'':' disabled')+'>Unirme</button>'
  +(oldG?'<button class="btn sec" data-a="g-reconnect">Reconectar al grupo '+esc(oldG.code.toUpperCase())+'</button>':'')+msg+'</div>';
}
app.addEventListener('click',function(e){
  var gk=e.target.closest('[data-gk]');if(gk&&G){gVote(gk.getAttribute('data-gk'));return}
  var gv=e.target.closest('[data-gv]');if(gv&&G){gChoose(+gv.getAttribute('data-gv'));return}
  var gr=e.target.closest('[data-gr]');if(gr&&G){gReact(gr.getAttribute('data-gr'));return}
  var gl=e.target.closest('[data-gl]');if(gl&&G&&G.host&&G.ph==='lobby'){G.tot=+gl.getAttribute('data-gl');gPub();syncG();return}
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a');
  if(a==='g-create')gStart(true,false);
  else if(a==='g-join')gStart(false,false);
  else if(a==='g-reconnect')gStart(false,true);
  else if(a==='g-start')gBegin();
  else if(a==='g-next'||a==='g-skip')gNext();
  else if(a==='g-end'){if(G&&G.host&&confirm('¿Terminar la partida?')){G.ph='end';gPub();syncG()}}
  else if(a==='g-dbl')gDouble();
  else if(a==='g-ask')qmOpen();
  else if(a==='g-host')hmOpen();
  else if(a==='g-leave'){if(G&&G.host&&NR){var o2=gPeers().filter(function(x){return !x.me});if(o2.length){gHandOver(o2[0].p.k);setTimeout(gLeave,600);return}}gLeave()}
});
var RED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el){
  if(RED||el.dataset.done)return;el.dataset.done=1;
  var n=+el.dataset.n,suf=el.dataset.suf||'',t0=null;el.textContent='0'+suf;
  function f(t){if(!t0)t0=t;var p=Math.min((t-t0)/800,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(f)}
  requestAnimationFrame(f);
}
function confetti(){
  if(RED)return;
  var box=document.createElement('div');box.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:50';
  var cols=['#e0457b','#7c4dff','#1f9d63','#ffb020','#2bb3ff'];
  for(var i=0;i<46;i++){var c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'%';c.style.background=cols[i%5];c.style.animationDuration=(1.8+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*.5)+'s';box.appendChild(c)}
  document.body.appendChild(box);setTimeout(function(){box.remove()},4200);
}
function fx(){
  var b=app.querySelector('.big[data-n]');if(b)countUp(b);
  var c=app.querySelector('[data-confetti]');if(c&&!c.dataset.done){c.dataset.done=1;confetti()}
}
new MutationObserver(fx).observe(app,{childList:true});
home();
</script>
