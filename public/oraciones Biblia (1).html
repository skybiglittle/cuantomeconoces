*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Spectral,Georgia,serif}
header{padding:28px 18px 8px;max-width:900px;margin:auto}
h1{font-size:2rem;margin:0 0 4px;font-weight:600}
header p{margin:0;color:var(--mut)}
.bar{max-width:900px;margin:auto;padding:10px 18px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
button,select,input{font:inherit;color:var(--ink)}
.tab,.chip{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:99px;cursor:pointer;flex:0 0 auto;white-space:nowrap;min-height:40px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip.on{border-color:var(--ac);color:var(--ac);font-weight:600}
input[type=search],select{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:10px}
input[type=search]{flex:1;min-width:160px}
main{max-width:900px;margin:auto;padding:10px 18px 60px}
.grp{margin:22px 0 6px;font-size:1.15rem;font-weight:600;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ref{font-weight:600;font-size:1.1rem}
.who{color:var(--mut);font-size:.92rem}
.stars{color:var(--gold);white-space:nowrap;font-size:.95rem}
.card p{margin:6px 0 10px;font-style:italic}
.acts a,.acts button{margin-right:8px;border:1px solid var(--ac);color:var(--ac);background:none;padding:4px 12px;border-radius:8px;text-decoration:none;font-size:.9rem;cursor:pointer}
.acts a:focus-visible,.acts button:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
html{-webkit-text-size-adjust:100%}
.row.sc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.row.sc::-webkit-scrollbar{display:none}
select{max-width:46%}
input[type=search]{min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts a,.acts button{margin:0;min-height:40px;display:inline-flex;align-items:center}
#mb{min-height:0}#mh{flex-wrap:wrap}#fr{min-height:0}
@media(max-width:600px){
body{font-size:16px}h1{font-size:1.45rem}
header,.bar,main{padding-left:14px;padding-right:14px}
.bar{padding-top:max(8px,env(safe-area-inset-top))}
.top{flex-direction:column;gap:0}.card{padding:12px}
#m{padding:0}#mb{border-radius:0;padding-top:env(safe-area-inset-top)}
#note{padding-bottom:max(8px,env(safe-area-inset-bottom))}}
</style>
</head>

function card(x){
