<main><div id="app"></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY=(()=>{let k=sessionStorage.getItem('pp_key');if(!k){k=Math.random().toString(36).slice(2,9);sessionStorage.setItem('pp_key',k)}return k})();
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
const okAns=(a,w)=>{a=norm(a);w=norm(w);return a.length>0&&(a===w||(w.length>=7&&lev(a,w)<=1))};

/* ===== Banco de preguntas: palabra|definición ===== */
const LET='ABCDEFGHIJLMNÑOPQRSTUVXYZ'.split('');
const CONT={'Ñ':1,'X':1};
const BK={

Y:`yate|Barco de lujo para recreo.

const BANK={};LET.forEach(l=>{BANK[l]=BK[l].split('\n').map(x=>{const i=x.indexOf('|');return[x.slice(0,i),x.slice(i+1)]})});
const MAXP=5;

/* ===== Salas (misma abstracción que usan tus otros juegos) ===== */
function makeWsRoom(){
 const url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
 return{join:name=>new Promise((resolve,reject)=>{
  let ws=null,id=null,pres={},arr=[],subs=[],done=false,closed=false,retry=0;const cid=Math.random().toString(36).slice(2);
  const room={
   peers:()=>arr,
   onPeers:fn=>{subs.push(fn);return()=>{subs=subs.filter(x=>x!==fn)}},
   presence:p=>{Object.keys(p).forEach(k=>{if(p[k]===null)delete pres[k];else pres[k]=p[k]});send({t:'pres',p});return Promise.resolve()},
   leave:()=>{closed=true;try{ws.close()}catch(e){}return Promise.resolve()}
  };
  function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
  function open(){
   ws=new WebSocket(url);
   ws.onopen=()=>{retry=0;send({t:'join',room:name,cid});if(Object.keys(pres).length)send({t:'pres',p:pres})};
   ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==='hello'){id=m.id}
    else if(m.t==='peers'){
     arr=m.peers.map(q=>({peer:q.id,isMe:q.id===id,presence:q.p||{}}));
     if(!done){done=true;resolve(room)}
     subs.slice().forEach(f=>f({peers:arr}));
    }else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}
   };
   ws.onclose=()=>{if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
  }
  open();
  setTimeout(()=>{if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},70000);
 })};
}
const RM=makeWsRoom();

/* ===== Estado ===== */
let G=null,R=null,tmr=null,MSG='';
const newCode=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s};
const players=()=>R?R.peers().filter(p=>p.presence&&p.presence.xm===1):[];
const by=k=>players().find(p=>p.presence.k===k);
const nm=k=>(by(k)&&by(k).presence.n)||G.names[k]||'Jugador';
function pub(extra){if(R&&G)R.presence(Object.assign({n:G.name,k:KEY,xm:1},extra)).catch(()=>{})}
function hp(){if(!G||!G.host)return;pub({xh:1,hph:G.ph,hro:G.ro,hturn:G.turn,hpas:G.pas,htm:G.tm,hgid:G.gid})}
const pend=(ps,from)=>{for(let s=0;s<25;s++){const i=(from+s)%25;if(ps[i]==='p')return i}return -1};
const view=k=>{ // datos de un jugador: yo desde el estado local, el resto desde su presencia
 if(k===KEY&&G.my)return G.my;
 const p=by(k);if(!p||p.presence.pg!==G.gid)return{ps:'p'.repeat(25),pi:0,pl:G.tm*1000,pa:0,done:0};
 const x=p.presence;return{ps:x.ps||'p'.repeat(25),pi:x.pi||0,pl:x.pl==null?G.tm*1000:x.pl,pa:x.pa||0,done:x.pdone===1?1:0};
};
const remain=k=>{const v=view(k);if(k===KEY)return v.pl;const r=G.seen[k];if(!r||G.turn!==k||G.ph!=='play')return v.pl;return Math.max(0,r.v-(Date.now()-r.t))};

/* ===== Lógica del anfitrión ===== */
function startGame(){
 const ps=players();if(ps.length<2||ps.length>MAXP)return;
 G.ro=shuffle(ps.map(p=>p.presence.k));
 G.tm=Number(($('tm')||{}).value)||150;
 G.pas={};G.ro.forEach(k=>{G.pas[k]=[]});
 for(let l=0;l<25;l++){const perm=shuffle([0,1,2,3,4]);G.ro.forEach((k,j)=>{G.pas[k][l]=perm[j]})}
 G.gid=Math.random().toString(36).slice(2,8);G.turn=G.ro[0];G.seenA={};G.ph='play';hp();sync();
}
function fin(k){const p=by(k);return!p||p.presence.pg!==G.gid||p.presence.pdone===1}
function advance(){
 const N=G.ro.length,idx=G.ro.indexOf(G.turn);
 for(let s=1;s<=N;s++){const k=G.ro[(idx+s)%N];if(by(k)&&!fin(k)){G.turn=k;hp();render();return}}
 G.ph='end';hp();render();
}
function loop(){
 if(!G||!G.host||G.ph!=='play')return;
 const alive=G.ro.filter(k=>by(k));
 if(!alive.length||alive.every(k=>{const p=by(k).presence;return p.pg===G.gid&&p.pdone===1})){G.ph='end';hp();render();return}
 const cur=by(G.turn);
 if(!cur||(cur.presence.pg===G.gid&&cur.presence.pdone===1)){advance();return}
 const pa=cur.presence.pg===G.gid?(cur.presence.pa||0):0;
 if(pa>(G.seenA[G.turn]||0)){G.seenA[G.turn]=pa;advance()}
}

/* ===== Acciones del jugador ===== */
function initMine(){
 G.my={ps:'p'.repeat(25),pi:0,pl:G.tm*1000,pa:0,done:0};G.localGid=G.gid;G.feed=[];G.seen={};G.pe={};G.draft='';G.lastTick=Date.now();
 pub({pg:G.gid,ps:G.my.ps,pi:0,pl:G.my.pl,pa:0,pdone:0,pm:null,pe:0});
}
function pubMine(msg,endTurn){
 const m=G.my;if(msg){G.mypeN=(G.mypeN||0)+1}
 if(endTurn)m.pa++;
 pub({pg:G.gid,ps:m.ps,pi:m.pi,pl:Math.round(m.pl),pa:m.pa,pdone:m.done?1:0,pm:msg||null,pe:G.mypeN||0});
 if(msg)addFeed(KEY,msg);
}
function addFeed(k,msg){G.feed.unshift({k,msg});G.feed=G.feed.slice(0,6)}
function curQ(k){const v=view(k),li=v.pi;const e=BANK[LET[li]][(G.pas[k]||[])[li]||0];return{li,l:LET[li],w:e[0],d:e[1]}}
function answer(val,pass){
 if(!G||G.ph!=='play'||G.turn!==KEY||G.my.done)return;
 const m=G.my,q=curQ(KEY),ps=m.ps.split('');
 let endT=false,msg='';
 if(pass){m.pi=pend(ps,q.li+1);endT=true;msg='⏭ '+q.l+': pasapalabra'}
 else if(okAns(val,q.w)){ps[q.li]='o';m.ps=ps.join('');const n=pend(ps,q.li+1);if(n<0)m.done=1;else m.pi=n;msg='✅ '+q.l+': acierto'}
 else{ps[q.li]='x';m.ps=ps.join('');const n=pend(ps,q.li+1);if(n<0)m.done=1;else m.pi=n;endT=true;msg='❌ '+q.l+': era «'+q.w+'»'}
 if(pass&&m.pi<0)m.pi=q.li;
 if(m.done)endT=true;
 G.draft='';pubMine(msg,endT);G.lastSig='';render();
}
function tick(){
 if(!G)return;const now=Date.now(),dt=now-G.lastTick;G.lastTick=now;
 if(G.host)loop();
 if(G.ph==='play'&&G.turn===KEY&&G.my&&!G.my.done){
  G.my.pl-=dt;G.pubT=(G.pubT||0)+dt;
  if(G.my.pl<=0){G.my.pl=0;G.my.done=1;pubMine('⏰ Tiempo agotado',true);G.lastSig='';render();return}
  if(G.pubT>=2000){G.pubT=0;pub({pl:Math.round(G.my.pl)})}
 }
 if(!G.host&&G.noHost&&G.ph!=='lobby'&&now-G.noHost>20000){leave('El anfitrión se ha desconectado.');return}
 const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
 const c=$('clk');if(c)c.textContent=fmt(remain(G.turn));
 G.ro.forEach(k=>{const e=$('t_'+k);if(e)e.textContent=fmt(remain(k))});
}

/* ===== Conexión ===== */
function start(create){
 const name=(($('nm')||{}).value||'').trim().slice(0,20)||(create?'Anfitrión':'Jugador');
 const code=create?newCode():((($('cd')||{}).value)||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
 if(!code){MSG='Escribe el código de la sala.';home();return}
 G={code,name,host:!!create,ph:'lobby',ro:[],turn:'',pas:{},tm:150,gid:'',names:{},my:null,localGid:'',feed:[],seen:{},pe:{},seenA:{},draft:'',lastSig:'',noHost:0,lastTick:Date.now()};
 MSG='';render();
 RM.join('cmp-'+code).then(r=>{R=r;R.onPeers(sync);pub(G.host?{xh:1}:{});sync()})
  .catch(e=>leave(e&&e.code==='room_full'?'La sala está llena (límite del servidor).':'No se pudo entrar en la sala.'));
 tmr=setInterval(tick,500);
}
function leave(msg){if(R){R.leave().catch(()=>{});R=null}if(tmr){clearInterval(tmr);tmr=null}G=null;MSG=msg||'';home()}
function sync(){
 if(!G||!R)return;
 players().forEach(p=>{const x=p.presence;if(x.n)G.names[x.k]=x.n;
  if(x.pe!==undefined&&G.pe[x.k]!==x.pe){if(G.pe[x.k]!==undefined&&x.k!==KEY&&x.pm)addFeed(x.k,x.pm);G.pe[x.k]=x.pe}
  if(x.k!==KEY&&x.pl!=null){const r=G.seen[x.k];if(!r||r.raw!==x.pl){G.seen[x.k]={raw:x.pl,v:x.pl,t:Date.now()}}}});
 if(!G.host){
  const h=players().find(p=>p.presence.xh===1);
  if(h){const x=h.presence;G.noHost=0;G.ph=x.hph||'lobby';G.ro=x.hro||[];G.turn=x.hturn||'';G.pas=x.hpas||{};G.tm=x.htm||150;G.gid=x.hgid||''}
  else G.noHost=G.noHost||Date.now();
 }
 if(G.gid&&G.ph==='play'&&G.localGid!==G.gid&&G.ro.includes(KEY))initMine();
 if(G.ph==='lobby'&&G.localGid){G.localGid='';G.my=null}
 loop();render();
}

/* ===== Interfaz ===== */
const app=$('app');
function paint(html,sig){if(G&&sig===G.lastSig)return;if(G)G.lastSig=sig;app.innerHTML=html;const i=$('ans');if(i&&G){i.value=G.draft||'';if(G.turn===KEY)i.focus()}}
function home(){
 const v=k=>(($(k)||{}).value||'');const n=v('nm'),c=v('cd');
 app.innerHTML='<h1>PASAPALABRA</h1><p class="mut">Completa el rosco antes de que se agote tu tiempo. Si fallas o dices «pasapalabra», pasa el turno al rival.</p><div class="card"><h2>Crear una sala</h2><input id="nm" maxlength="20" placeholder="Tu nombre"><button class="btn" data-a="create">Crear sala</button><hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><h2>Unirse</h2><input id="cd" maxlength="5" placeholder="Código" autocomplete="off"><button class="btn sec" data-a="join">Entrar</button>'+(MSG?'<p class="ko" style="margin-top:10px">'+esc(MSG)+'</p>':'')+'</div><p class="mut" style="font-size:13px">De 2 a '+MAXP+' jugadores, cada uno desde su dispositivo.</p>';
 if($('nm'))$('nm').value=n;if($('cd'))$('cd').value=c;
}
function rosco(k){
 const v=view(k),cur=v.done?-1:v.pi;
 let h='<div class="rs">';
 for(let i=0;i<25;i++){const a=(-90+i*360/25)*Math.PI/180,c=v.ps[i];h+='<div class="lt'+(c==='o'?' o':c==='x'?' x':'')+(i===cur?' cu':'')+'" style="left:'+(50+42*Math.cos(a)).toFixed(2)+'%;top:'+(50+42*Math.sin(a)).toFixed(2)+'%">'+LET[i]+'</div>'}
 return h+'<div class="mid"><div class="mut" style="font-size:13px">'+esc(nm(k))+'</div><div class="clk" id="clk">0:00</div></div></div>';
}
const dots=ps=>'<div class="dots">'+ps.split('').map(c=>'<i class="'+(c==='o'?'o':c==='x'?'x':'')+'"></i>').join('')+'</div>';
function stats(k){const v=view(k);return{o:(v.ps.match(/o/g)||[]).length,x:(v.ps.match(/x/g)||[]).length,v}}
function render(){
 if(!G){home();return}
 const ps=players(),host=ps.find(p=>p.presence.xh===1);
 const top='<div class="top"><span>Sala <b>'+esc(G.code.toUpperCase())+'</b></span><button class="link" data-a="leave">Salir</button></div>';
 let html='<h1>PASAPALABRA</h1>'+top,sig;
 const names=ps.map(p=>p.presence.k+(p.presence.n||'')).join();
 if(G.ph==='lobby'){
  sig='L|'+names+'|'+(host?1:0);
  html+='<div class="card"><div class="code">'+esc(G.code.toUpperCase())+'</div><p class="mut center">Pasa este código a los demás.</p></div><div class="card"><h2>Jugadores ('+ps.length+')</h2>'+ps.map(p=>'<div class="pl"><span>'+esc(p.presence.n||'Jugador')+(p.presence.xh===1?'<span class="tag">anfitrión</span>':'')+(p.presence.k===KEY?'<span class="tag">tú</span>':'')+'</span></div>').join('')+(G.host?'<label class="mut" style="font-size:13px">Tiempo por jugador</label><select id="tm"><option value="120">2 minutos</option><option value="150" selected>2 min 30 s</option><option value="180">3 minutos</option></select><button class="btn" data-a="start"'+(ps.length<2||ps.length>MAXP?' disabled':'')+'>Empezar partida</button>'+(ps.length<2?'<p class="mut" style="margin-top:8px">Hacen falta al menos 2 jugadores.</p>':ps.length>MAXP?'<p class="ko" style="margin-top:8px">Máximo '+MAXP+' jugadores.</p>':''):'<p class="mut" style="margin-top:10px">'+(host?'Esperando a que el anfitrión empiece…':'Buscando al anfitrión…')+'</p>')+'</div>';
 }else if(G.ph==='play'){
  const mine=G.turn===KEY&&G.my&&!G.my.done,hv=view(G.turn),q=G.ro.includes(G.turn)?curQ(G.turn):null;
  sig=['P',G.turn,G.gid,names,G.ro.map(k=>{const v=view(k);return v.ps+v.pi+v.done}).join(),mine,G.feed.length+(G.feed[0]?G.feed[0].msg:'')].join('|');
  html+='<div class="card center"><div class="mut">Turno de <b style="color:var(--ac)">'+esc(nm(G.turn))+(G.turn===KEY?' (tú)':'')+'</b></div>'+rosco(G.turn)+'</div>';
  if(q&&!hv.done)html+='<div class="card q"><div class="mode">'+(CONT[q.l]?'Contiene la '+q.l:'Empieza por '+q.l)+'</div><div class="def">'+esc(q.d)+'</div>'+(mine?'<input id="ans" autocomplete="off" autocapitalize="off" placeholder="Tu respuesta…"><div class="row"><button class="btn" data-a="ok">Responder</button><button class="btn sec" data-a="pass">Pasapalabra</button></div>':'<p class="mut" style="margin:0">'+(G.my&&G.my.done?'Tu rosco ha terminado. Espera a los demás.':'Esperando respuesta de '+esc(nm(G.turn))+'…')+'</p>')+'</div>';
  html+='<div class="card feed"><h2>Últimas jugadas</h2>'+(G.feed.length?G.feed.map(f=>'<div><b>'+esc(nm(f.k))+'</b> · '+esc(f.msg)+'</div>').join(''):'<p class="mut" style="margin:0">Aún no hay jugadas.</p>')+'</div>';
  html+='<div class="card"><h2>Marcador</h2>'+G.ro.map(k=>{const s=stats(k);return'<div class="pl'+(k===G.turn?' cur':'')+'" style="flex-wrap:wrap"><span><b>'+esc(nm(k))+'</b>'+(by(k)?'':' <span class="mut">(desconectado)</span>')+'</span><span><span class="ok">'+s.o+' ✓</span> · <span class="ko">'+s.x+' ✗</span> · <span id="t_'+k+'">0:00</span></span><div style="width:100%">'+dots(s.v.ps)+'</div></div>'}).join('')+'</div>';
 }else{
  const rk=G.ro.map(k=>({k,...stats(k)})).sort((a,b)=>b.o-a.o||a.x-b.x||b.v.pl-a.v.pl);
  sig='E|'+rk.map(r=>r.k+r.o+r.x).join();
  html+='<div class="card center"><div style="font-size:54px">🏆</div><h2>'+esc(rk.length?nm(rk[0].k):'Fin')+' gana</h2></div><div class="card"><h2>Clasificación</h2>'+rk.map((r,i)=>'<div class="pl" style="flex-wrap:wrap"><span>'+(i+1)+'. <b>'+esc(nm(r.k))+'</b></span><span><span class="ok">'+r.o+' ✓</span> · <span class="ko">'+r.x+' ✗</span> · '+Math.ceil(r.v.pl/1000)+' s</span><div style="width:100%">'+dots(r.v.ps)+'</div></div>').join('')+(G.host?'<button class="btn" data-a="again">Volver a la sala</button>':'<p class="mut" style="margin-top:10px">El anfitrión puede volver a la sala.</p>')+'</div>';
 }
 paint(html,sig);
}

/* ===== Eventos ===== */
app.addEventListener('input',e=>{if(e.target.id==='ans'&&G)G.draft=e.target.value});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'&&G){e.preventDefault();const v=e.target.value;if(v.trim())answer(v,false)}});
app.addEventListener('click',e=>{
 const a=e.target.closest('[data-a]');if(!a)return;
 const x=a.dataset.a;
 if(x==='create')start(true);
 else if(x==='join')start(false);
 else if(x==='leave')leave();
 else if(x==='start'&&G&&G.host)startGame();
 else if(x==='ok'&&G){const v=($('ans')||{}).value||'';if(v.trim())answer(v,false)}
 else if(x==='pass'&&G)answer('',true);
 else if(x==='again'&&G&&G.host){G.ph='lobby';G.ro=[];G.turn='';G.gid='';G.pas={};G.my=null;G.localGid='';pub({pg:null,ps:null,pi:null,pl:null,pa:null,pdone:null,pm:null,pe:null});hp();render()}
});
home();
})();
</script>
</body>
</html>
