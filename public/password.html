<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PASSWORD · Juego multijugador</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--line:#34425f;--text:#f4f6ff;--muted:#aab6d0;--a:#8b7cff;--b:#43d9c5;--gold:#ffd166;--red:#ff6b7a;--good:#48d597}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 8% 0%,#29244d 0,transparent 42%),radial-gradient(ellipse at 100% 15%,#103e4b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{width:min(980px,100%);margin:auto;padding:20px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:900}.brand span{color:var(--b)}.back{color:var(--muted)}
h1{font-size:clamp(38px,8vw,62px);line-height:1;margin:0;letter-spacing:-.05em;background:linear-gradient(100deg,#fff,#b8adff 48%,#64e8d7);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:22px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}.muted,.small{color:var(--muted)}.small{font-size:12px}
.card{background:linear-gradient(145deg,rgba(29,41,67,.97),rgba(17,26,45,.97));border:1px solid var(--line);border-radius:19px;padding:17px;margin:12px 0;box-shadow:0 12px 35px #0003}.center{text-align:center}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:0}label{display:block;color:var(--muted);font-size:13px;margin:9px 0 4px}
input,select{width:100%;border:1px solid var(--line);background:#0d1629;color:var(--text);border-radius:11px;padding:12px;font:inherit;outline:none}input:focus,select:focus{border-color:var(--a)}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:12px;padding:12px 15px;background:linear-gradient(100deg,var(--a),#638cff);color:#fff;font-weight:800}.btn.secondary{background:#293753;border:1px solid var(--line)}.btn.good{background:linear-gradient(100deg,#149b69,#27c99b)}.btn.red{background:linear-gradient(100deg,#b83b54,#ff6376)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none!important}
.code{font-size:30px;letter-spacing:.22em;font-weight:950;color:var(--gold);text-align:center}.tag,.player{display:inline-flex;align-items:center;padding:5px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px;margin:3px}.player.me{border-color:var(--b);color:var(--b)}
.notice{color:var(--gold);font-size:13px;min-height:18px;margin:6px 0}.status{padding:11px 13px;border:1px solid #258d69;border-radius:12px;background:#0e1f1d;color:#a2f0ce;margin:10px 0;font-weight:700}.status.no{border-color:#9a7730;background:#1f1a0e;color:#ffe09a}
.word{font-size:clamp(34px,8vw,62px);font-weight:950;color:var(--gold);letter-spacing:.03em;margin:10px 0}.secret{border:1px solid #8f6f20;background:linear-gradient(145deg,#241e0d,#17130b);border-radius:16px;padding:18px}
.attempt{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;padding:9px;border-radius:10px;background:#101a2e;margin:6px 0}.attempt b{color:var(--gold)}.clue{font-weight:800}.guess{color:#dfe5f7}.ok{color:var(--good);font-weight:900}.no{color:#ffb4bd}.teamgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{border:1px solid var(--line);border-radius:15px;padding:12px}.team.blue{border-color:#557dff}.team.red{border-color:#ff6376}.score{font-size:30px;font-weight:950;color:var(--gold)}.sc{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:#101a2e;margin:5px 0}.sc strong{color:var(--gold)}
.timer{font-size:30px;font-weight:900}.foot{font-size:11px;color:var(--muted);text-align:center;margin:18px 0}
@media(max-width:650px){.teamgrid{grid-template-columns:1fr}.attempt{grid-template-columns:52px 1fr}.attempt .guess{grid-column:2}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div class="brand">PASS<span>WORD</span></div><a class="back" href="/">← Juegos</a></header>
<main id="app"></main><p class="foot">PASSWORD · Salas en directo · de 4 a 12 jugadores</p>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),app=$('app');
const STORE='cmc_password_session_v1',CID='cmc_password_cid_v1',KEY='cmc_password_key_v1';
const MINP=4,MAXP=12;
const WORDS={
facil:["ELEFANTE","PLAYA","PIZZA","CASTILLO","PERRO","AVIÓN","FÚTBOL","HELADO","BICICLETA","PIRATA","LUNA","JARDÍN","COCHE","GUITARRA","VOLCÁN","BOSQUE","RELOJ","MONTAÑA","OCÉANO","TREN"],
media:["AEROPUERTO","LABERINTO","DESIERTO","DETECTIVE","CARNAVAL","BIBLIOTECA","SUPERMERCADO","ASTRONAUTA","VOLCÁN","MUSEO","TEATRO","FOTOGRAFÍA","TESORO","PARAGUAS","DINOSAURIO","FARO","TORMENTA","ROBOT","CIRCO","PIRÁMIDE"],
dificil:["HIPOPÓTAMO","MICROSCOPIO","ARQUEÓLOGO","TELESCOPIO","ESFINGE","CALEIDOSCOPIO","METAMORFOSIS","PARACAÍDAS","ELECTRICIDAD","INVERNADERO","CONSTELACIÓN","ECOSISTEMA","IMPRENTA","ANTÁRTIDA","ORQUESTA","CRIPTOMONEDA","FERROCARRIL","MURCIÉLAGO","ESCULTURA","VOLUNTARIADO"]
};
const rand=n=>Math.floor(Math.random()*n),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved=(()=>{try{return JSON.parse(sessionStorage.getItem(STORE)||'null')}catch{return null}})();
let name=saved?.name||'',roomCode=saved?.room||'',isHost=!!saved?.host,state=saved?.state||null;
let myKey=sessionStorage.getItem(KEY)||Math.random().toString(36).slice(2,11),cid=sessionStorage.getItem(CID)||Math.random().toString(36).slice(2)+Date.now().toString(36);
let socket=null,peers=[],closed=false,retry=0,connecting=false,curSig='',own={round:0,action:''},myPres={};
sessionStorage.setItem(KEY,myKey);sessionStorage.setItem(CID,cid);
const persist=()=>sessionStorage.setItem(STORE,JSON.stringify({name,room:roomCode,host:isHost,state,own}));
const P=x=>x.p||{}, plist=()=>peers.map(x=>P(x)).filter(p=>p.c_key).map(p=>({key:p.c_key,name:p.c_name||'Jugador',p}));
const pname=k=>state?.names?.[k]||plist().find(p=>p.key===k)?.name||'Jugador';
const team=k=>state?.teams?.[k]||'blue';
function publish(extra={}){Object.assign(myPres,extra);if(socket?.readyState===1)socket.send(JSON.stringify({t:'pres',p:{c_name:name,c_key:myKey,c_host:isHost?1:0,...myPres}}))}
function commit(){if(!isHost)return;state.v=(state.v||0)+1;publish({c_state:state});persist();render()}
function connect(){if(connecting||!roomCode)return;connecting=true;closed=false;socket=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);
socket.onopen=()=>socket.send(JSON.stringify({t:'join',room:'cmb-password-'+roomCode.toLowerCase(),cid}));
socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
if(m.t==='hello')return;if(m.t==='err'){closed=true;connecting=false;roomCode='';state=null;renderHome(m.code==='room_full'?'La sala está llena.':'No se ha podido entrar.');return}
if(m.t==='peers'){peers=m.peers||[];connecting=false;
if(!peers.some(x=>P(x).c_key===myKey))publish(isHost&&state?{c_state:state}:{});
if(!isHost){const hp=peers.find(x=>P(x).c_host===1&&P(x).c_state),inc=hp&&P(hp).c_state;if(inc&&(!state||inc.v!==state.v)){state=inc;persist()}}
hostStep();render()}};socket.onclose=()=>{connecting=false;if(closed)return;retry++;setTimeout(()=>{if(!closed)connect()},Math.min(1000*retry,8000))};socket.onerror=()=>{}}
function code5(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:5},()=>c[rand(c.length)]).join('')}
function createRoom(){name=($('name')?.value.trim()||'Jugador').slice(0,16);roomCode=code5();isHost=true;state={v:0,phase:'lobby',target:25,difficulty:'facil',timer:30,round:0};own={round:0,action:''};persist();connect();render()}
function joinRoom(){name=($('name')?.value.trim()||'Jugador').slice(0,16);let c=($('code')?.value||'').trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(c))return renderHome('Escribe un código de 5 caracteres.');roomCode=c;isHost=false;state=null;own={round:0,action:''};persist();connect();render()}
function leaveRoom(){closed=true;try{socket?.close()}catch{}socket=null;peers=[];roomCode='';state=null;sessionStorage.removeItem(STORE);renderHome()}
function startGame(){
const ps=plist().slice(0,MAXP);if(ps.length<MINP)return;
let order=shuffle(ps.map(p=>p.key)),names={},teams={};
ps.forEach((p,i)=>{names[p.key]=p.name;teams[p.key]=i%2?'red':'blue'});
let deck=shuffle(WORDS[state.difficulty].map(w=>w));Object.assign(state,{order,names,teams,scores:{blue:0,red:0},deck,round:0,attempts:[],secret:null,phase:'playing',turnIndex:0,clueTeam:'blue',guessKey:null,clueKey:null,result:null});newRound()}
function members(t){return state.order.filter(k=>team(k)===t)}
function roleKeys(){let t=state.clueTeam,ms=members(t),opp=members(t==='blue'?'red':'blue');return {clue:ms[(state.round-1)%ms.length],guess:ms[((state.round-1)+1)%ms.length],oppClue:opp[(state.round-1)%opp.length],oppGuess:opp[((state.round-1)+1)%opp.length]}}
function newRound(){
if(Math.max(state.scores.blue,state.scores.red)>=state.target||!state.deck.length){state.phase='finished';return commit()}
state.round++;state.secret=state.deck.pop();state.attempts=[];state.result=null;state.clueTeam=state.round%2?'blue':'red';state.turn=0;state.phase='playing';state.clueKey=roleKeys().clue;state.guessKey=roleKeys().guess;commit()}
function nextAttempt(){
let prev=state.clueTeam;state.clueTeam=prev==='blue'?'red':'blue';state.clueKey=roleKeys().clue;state.guessKey=roleKeys().guess;state.turn++;commit()}
function resolve(correct,reason){
let points=correct?Math.max(1,5-state.attempts.length):0;
if(correct)state.scores[state.clueTeam]+=points;
else if(state.attempts.length>=5){state.scores[state.clueTeam]+=0;reason='Se agotaron las 5 pistas.'}
state.result={correct,points,reason,word:state.secret};state.phase='result';commit()}
function hostStep(){
if(!isHost||!state||state.phase!=='playing')return;
const ps={};plist().forEach(p=>ps[p.key]=p.p);
const ck=state.clueKey,gk=state.guessKey;
if(state.turn!==undefined){
 const c=ps[ck]?.c_pw_clue;if(c&&c.r===state.round&&c.turn===state.turn&&c.text&&state.attempts.length===state.turn){
  state.attempts.push({team:state.clueTeam,clue:String(c.text).slice(0,40)});commit();return}
 const g=ps[gk]?.c_pw_guess;if(g&&g.r===state.round&&g.turn===state.turn&&state.attempts.length===state.turn+1){
  const guess=String(g.text).trim().toUpperCase();if(guess===state.secret)return resolve(true,'¡Palabra acertada!');if(state.attempts.length>=5)return resolve(false,'Última oportunidad fallida.');return nextAttempt()}
}}
function doClue(){let t=($('clue')?.value||'').trim();if(!t)return $('msg').textContent='Escribe una pista.';if(/\s/.test(t)||t.length>25)return $('msg').textContent='La pista debe ser una sola palabra.';publish({c_pw_clue:{r:state.round,turn:state.turn,text:t}});own={round:state.round,action:'clue'};persist();render()}
function doGuess(){let t=($('guess')?.value||'').trim();if(!t)return $('msg').textContent='Escribe tu respuesta.';publish({c_pw_guess:{r:state.round,turn:state.turn,text:t}});own={round:state.round,action:'guess'};persist();render()}
function renderHome(msg=''){curSig='';app.innerHTML=`<section class="card center"><h1>PASSWORD</h1><p class="muted">El clásico juego de pistas de una sola palabra, convertido en sala multijugador.</p></section>
<section class="card"><label>Tu nombre</label><input id="name" maxlength="16" placeholder="¿Cómo te llamas?" value="${safe(name)}"><div class="row" style="margin-top:14px"><button class="btn" id="create">Crear sala</button><button class="btn secondary" id="tj">Unirme con código</button></div><div id="joinbox" class="hidden"><label>Código de sala</label><input id="code" maxlength="5" placeholder="ABCDE"><button class="btn secondary" id="join" style="width:100%;margin-top:10px">Entrar</button></div><p class="notice">${safe(msg)}</p></section>
<section class="card"><h3>Reglas</h3><p class="muted small">Dos equipos. En cada intento, una persona ve la palabra secreta y da <b>una sola palabra</b> como pista. Su compañero intenta adivinar. Si falla, el turno de pista pasa al otro equipo. Se alternan hasta acertar o llegar a 5 pistas.</p><div class="row"><span class="tag">5 pistas máx.</span><span class="tag">5 → 4 → 3 → 2 → 1 puntos</span><span class="tag">4–12 jugadores</span></div></section>`;
$('create').onclick=createRoom;$('tj').onclick=()=>{$('joinbox').classList.toggle('hidden');$('code')?.focus()};$('join')?.addEventListener('click',joinRoom);$('code')?.addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5))}
function renderLobby(){curSig='lobby';app.innerHTML=`<section class="card center"><div class="tag">CÓDIGO DE SALA</div><div class="code">${safe(roomCode)}</div><button class="btn secondary" id="copy">Copiar código</button><div id="players" style="margin-top:10px"></div></section>
${isHost?`<section class="card"><h3>Ajustes</h3><div class="settings row"><div><label>Puntos para ganar</label><select id="target"><option>15</option><option selected>25</option><option>40</option></select></div><div><label>Dificultad</label><select id="difficulty"><option value="facil">Fácil</option><option value="media">Media</option><option value="dificil">Difícil</option></select></div><div><label>Temporizador</label><select id="timer"><option value="0">Sin límite</option><option value="30" selected>30 segundos</option></select></div></div><button class="btn" id="start" style="width:100%;margin-top:14px">Empezar partida</button></section>`:`<section class="card center"><p class="muted">Esperando al anfitrión…</p></section>`}<button class="btn ghost" id="leave" style="width:100%">Salir</button>`;
$('copy').onclick=()=>navigator.clipboard?.writeText(roomCode).then(()=>{$('copy').textContent='¡Copiado!'});
$('leave').onclick=leaveRoom;
if($('start'))$('start').onclick=()=>{state.target=+$('target').value;state.difficulty=$('difficulty').value;state.timer=+$('timer').value;startGame()};
$('players').innerHTML=plist().map(p=>`<span class="player ${p.key===myKey?'me':''}">${safe(p.name)}${p.key===myKey?' · tú':''}</span>`).join('')+`<p class="small muted">${plist().length} conectados · mínimo ${MINP}</p>`;$('start')&&($('start').disabled=plist().length<MINP)}
function renderGame(){
const r=roleKeys(), meTeam=team(myKey), clueMe=myKey===state.clueKey,guessMe=myKey===state.guessKey,action=own.round===state.round?own.action:'';
let body='';
if(state.phase==='result'){let R=state.result;body=`<section class="card center"><div class="tag">${R.correct?'¡ACIERTO!':'FIN DE LA RONDA'}</div><div class="word">${safe(R.word)}</div><div class="status ${R.correct?'':'no'}">${safe(R.reason)} ${R.correct?`+${R.points} puntos para ${state.clueTeam==='blue'?'🔵 Azul':'🔴 Rojo'}`:''}</div><button class="btn" id="next" style="width:100%">Siguiente ronda</button></section>`}
else if(clueMe&&!action){body=`<section class="card secret center"><div class="tag">TU PALABRA SECRETA</div><div class="word">${safe(state.secret)}</div><p class="muted">Da una pista de <b>UNA SOLA PALABRA</b>. No digas partes de la palabra, derivados ni traducciones.</p><input id="clue" maxlength="25" placeholder="Tu pista…"><button class="btn" id="sendclue" style="width:100%;margin-top:8px">Dar pista</button></section>`}
else if(guessMe&&!action){body=`<section class="card center"><div class="tag">TU TURNO DE ADIVINAR · ${state.clueTeam==='blue'?'🔵':'🔴'}</div><div class="word">¿?</div><p class="muted">Pista recibida: <b>${safe(state.attempts.at(-1)?.clue||'—')}</b></p><input id="guess" maxlength="40" placeholder="Tu respuesta…"><button class="btn good" id="sendguess" style="width:100%;margin-top:8px">Responder</button></section>`}
else body=`<section class="card center"><h2>${clueMe?'Tu compañero está adivinando…':guessMe?'Esperando la pista…':'Turno en juego'}</h2><p class="muted">${clueMe?'La palabra secreta está protegida para ti.':guessMe?'El otro jugador debe dar la pista.':'Mira cómo avanza la ronda.'}</p></section>`;
body+=`<section class="card"><div class="row"><span class="tag">RONDA ${state.round}</span><span class="tag">PISTA ${state.attempts.length+1}/5</span><span class="tag">🎯 ${state.target} pts</span></div><div id="attempts">${state.attempts.map((a,i)=>`<div class="attempt"><b>${i+1}</b><span class="clue">${safe(a.clue)}</span><span class="muted">Intento de ${a.team==='blue'?'🔵 Azul':'🔴 Rojo'}</span></div>`).join('')}</div></section>
<section class="card teamgrid"><div class="team blue"><h3>🔵 AZUL</h3><div class="score">${state.scores.blue}</div><p class="small">${members('blue').map(k=>safe(pname(k))).join(' · ')}</p></div><div class="team red"><h3>🔴 ROJO</h3><div class="score">${state.scores.red}</div><p class="small">${members('red').map(k=>safe(pname(k))).join(' · ')}</p></div></section>`;
app.innerHTML=body+`<section class="card"><h3>Marcador</h3>${state.order.map(k=>`<div class="sc"><span>${safe(pname(k))} <span class="tag">${team(k)==='blue'?'Azul':'Rojo'}</span></span><strong>${state.scores[team(k)]} pts equipo</strong></div>`).join('')}</section><button class="btn ghost" id="leave" style="width:100%">Salir de la sala</button>`;
$('sendclue')?.addEventListener('click',doClue);$('clue')?.addEventListener('keydown',e=>{if(e.key==='Enter')doClue()});$('sendguess')?.addEventListener('click',doGuess);$('guess')?.addEventListener('keydown',e=>{if(e.key==='Enter')doGuess()});$('next')?.addEventListener('click',newRound);$('leave').onclick=leaveRoom}
function renderFinished(){let b=state.scores.blue,r=state.scores.red,w=b===r?'Empate':b>r?'🔵 AZUL':'🔴 ROJO';app.innerHTML=`<section class="card center"><div class="tag">PARTIDA TERMINADA</div><div style="font-size:70px">🏆</div><h1>${w}</h1><p class="muted">Azul ${b} · Rojo ${r}</p></section><section class="card">${state.order.map(k=>`<div class="sc"><span>${safe(pname(k))}</span><strong>${team(k)==='blue'?b:r} pts</strong></div>`).join('')}</section>${isHost?'<button class="btn" id="again" style="width:100%">Volver a la sala</button>':''}<button class="btn ghost" id="leave" style="width:100%;margin-top:9px">Salir</button>`;$('again')?.addEventListener('click',()=>{state.phase='lobby';commit()});$('leave').onclick=leaveRoom}
function render(){if(!roomCode)return renderHome();if(!socket||socket.readyState!==1){app.innerHTML=`<section class="card center"><h2>Entrando en la sala…</h2><p class="muted">${safe(roomCode)}</p><button class="btn ghost" id="cancel">Cancelar</button></section>`;$('cancel').onclick=leaveRoom;return}if(!state){app.innerHTML=`<section class="card center"><h2>Esperando al anfitrión…</h2><button class="btn ghost" id="leave">Salir</button></section>`;$('leave').onclick=leaveRoom;return}if(state.phase==='lobby')renderLobby();else if(state.phase==='finished')renderFinished();else renderGame()}
setInterval(()=>{if(roomCode&&state)hostStep()},500);
if(saved?.room&&saved?.name){connect();render()}else renderHome();
})();
</script></body></html>
