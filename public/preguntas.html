<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Preguntas · ¿Quién respondió qué?</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d32;--panel2:#1d2943;--text:#f4f6ff;--muted:#aab5d0;--line:#2e3b59;--a:#8b7cff;--b:#34d6c3;--good:#39d98a;--bad:#ff657a;--gold:#ffd166;--c0:#5f8cff;--c1:#ff9f4a;--c2:#39d98a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 15% 0%,#25234c 0,transparent 42%),radial-gradient(ellipse at 100% 20%,#123c4b 0,transparent 36%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{width:min(620px,100%);margin:auto;padding:20px 16px 48px}
h1{font-size:clamp(38px,9vw,60px);line-height:1;margin:6px 0 0;letter-spacing:-.05em;background:linear-gradient(100deg,#fff,#a89dff 45%,#53ead7);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:21px;margin:0 0 10px}
.sub{color:var(--muted);margin:8px 0 18px}.muted{color:var(--muted)}.small{font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
.panel{background:linear-gradient(145deg,rgba(29,41,67,.96),rgba(18,27,47,.96));border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 14px 40px #0003}
.kick{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 7px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text]{width:100%;border:1px solid var(--line);background:#0f172a;color:var(--text);border-radius:13px;padding:13px 14px;font:inherit;outline:none}
input[type=text]:focus{border-color:var(--a)}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;margin-top:12px;background:linear-gradient(100deg,var(--a),#5f8cff);color:#fff;font-weight:800;box-shadow:0 8px 22px #6d65ff33}
.btn.secondary{background:#263451;border:1px solid var(--line);box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 2px;font-size:14px}
.linkb{background:#263451;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.grid{display:grid;gap:8px}.g4{grid-template-columns:repeat(4,1fr)}
.opt{padding:11px 6px;border-radius:13px;border:1px solid var(--line);background:#121a2d;color:var(--muted);text-align:center;font-size:14px;font-weight:700}
.opt.on{background:#322d60;color:#fff;border-color:#8075ef}
.mode{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;color:var(--text)}
.mode .em{font-size:28px}.mode b{display:block}.mode small{color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.step{display:flex;align-items:center;gap:14px}.step button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#263451;color:#fff;font-size:22px}
.step b{font-size:24px;min-width:26px;text-align:center}
.code{font-size:44px;letter-spacing:.2em;font-weight:900;text-align:center;color:var(--gold);margin:2px 0}
.pl{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.pl.first{border-top:0}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));color:#0b1020;display:grid;place-items:center;font-weight:900}
.topic{font-size:25px;font-weight:850;line-height:1.2;margin:2px 0 4px}
.me{border:2px solid var(--sc);border-radius:20px;padding:16px;margin:12px 0;background:linear-gradient(145deg,color-mix(in srgb,var(--sc) 22%,#151d32),#151d32)}
.me .lb{font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--sc)}.me .tx{font-size:25px;font-weight:900;line-height:1.2;margin:6px 0}
.st{border-left:6px solid var(--sc);border:1px solid var(--line);border-left:6px solid var(--sc);border-radius:14px;padding:11px 13px;margin:9px 0;background:#111a2e}
.st .lb{font-size:12px;font-weight:900;letter-spacing:.06em;color:var(--sc);text-transform:uppercase}.st .tx{font-weight:800;font-size:18px;line-height:1.25;margin-top:2px}
.tm{font-size:36px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;color:var(--b)}.tm.end{color:var(--bad)}
.err{background:#ff657a22;border:1px solid var(--bad);border-radius:14px;padding:10px 12px;margin:12px 0;font-size:14px}
.ok{background:#39d98a22;border:1px solid var(--good);border-radius:14px;padding:10px 12px;margin:12px 0;font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);margin-right:6px}.dot.off{background:var(--bad)}
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.rk.first{border-top:0}.rk .n{font-size:24px;width:36px;text-align:center}.rk .v{margin-left:auto;font-weight:900;color:var(--gold)}
.votebtn{display:block;width:100%;text-align:left;margin:7px 0;padding:12px 14px;border-radius:13px;background:#111a2e;border:1px solid var(--line);color:var(--text)}
.votebtn.on{border-color:var(--b);background:#12303a}
.qi{font-size:13px;padding:4px 0;color:var(--muted)}
.hidden{display:none}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:#0f172a;color:var(--text);border-radius:13px;padding:13px 14px;font:inherit;outline:none;resize:vertical}textarea:focus{border-color:var(--a)}
.ans{border:1px solid var(--line);border-left:6px solid var(--b);border-radius:14px;padding:12px 14px;margin:9px 0;background:#111a2e}.ans.cur{border-color:var(--gold);background:#2a2440}.ans .tx{font-size:19px;font-weight:700;line-height:1.3;word-break:break-word}.ans .by{margin-top:6px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main id="app"></main>
<script>
var ROOM_PREFIX='cmd-pre-';
function makeWsRoom(){
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
  return {join:function(name,cid){return new Promise(function(resolve,reject){
    var ws=null,id=null,pres={},arr=[],subs=[],done=false,closed=false,retry=0;
    var room={
      peers:function(){return arr},
      onPeers:function(fn){subs.push(fn)},
      onStatus:function(fn){room._st=fn},
      presence:function(p){Object.keys(p).forEach(function(k){if(p[k]===null)delete pres[k];else pres[k]=p[k]});send({t:'pres',p:p})},
      leave:function(){closed=true;try{ws.close()}catch(e){}}
    };
    function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
    function open(){
      ws=new WebSocket(url);
      ws.onopen=function(){retry=0;send({t:'join',room:name,cid:cid});if(Object.keys(pres).length)send({t:'pres',p:pres});if(room._st)room._st(true)};
      ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
        if(m.t==='hello'){id=m.id}
        else if(m.t==='peers'){
          arr=m.peers.map(function(q){return{peer:q.id,isMe:q.id===id,presence:q.p||{}}});
          if(!done){done=true;resolve(room)}
          subs.slice().forEach(function(f){f(arr)});
        }else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}
      };
      ws.onclose=function(){if(room._st)room._st(false);if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
    }
    open();
    setTimeout(function(){if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},20000);
  })}};
}

var RM=makeWsRoom();
var IDEAS=['¿Cuál es tu mayor miedo irracional?','¿Qué es lo más vergonzoso que te ha pasado en público?','¿Qué serie has visto más veces?','¿Cuál es tu mayor manía?','¿A quién del grupo llamarías a las 3 de la mañana?','¿Qué superpoder elegirías y para qué lo usarías de verdad?','¿Cuál es la mentira más grande que has contado?','¿Qué canción te sabes entera y te da vergüenza?','¿Qué harías con un millón de euros en 24 horas?','¿Cuál ha sido tu peor cita o plan?','¿Qué cosa absurda te da muchísima rabia?','¿Qué le dirías a tu yo de hace 10 años?','¿Cuál es tu comida favorita de todos los tiempos?','¿Qué talento inútil tienes?','¿Quién del grupo sobreviviría más en una isla desierta?','¿Qué tres cosas te llevarías a una isla desierta?','¿Qué fue lo último que buscaste en Google?','¿Cuál es tu plan perfecto de domingo?','¿Qué hábito tuyo molesta más a los demás?','¿Qué te hace reír sin parar?','¿Qué recuerdo de infancia te hace más ilusión?','¿A qué viaje no renunciarías nunca?','¿Cuál ha sido tu mayor locura?','¿Qué cambiarías de tu forma de ser?'];
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function rid(n){var c='ABCDEFGHJKMNPQRSTUVWXYZ',s='';for(var i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function cl(s,n){return String(s||'').replace(/\s+/g,' ').trim().slice(0,n)}
var uid=(function(){try{var u=sessionStorage.getItem('pre-uid');if(!u){u=Math.random().toString(36).slice(2,12);sessionStorage.setItem('pre-uid',u)}return u}catch(e){return Math.random().toString(36).slice(2,12)}})();
var S={view:'home',code:'',host:false,room:null,peers:[],g:null,name:ls('pre-name')||'',cd:(new URLSearchParams(location.search).get('sala')||'').toUpperCase().slice(0,6),err:'',flash:'',online:true,busy:false,q:null,a:null,hist:[],qv:'',av:'',dirty:false};
var app=$('app'),NM={};
function RO(g){return (g.rs||'').split(',').filter(Boolean).map(function(u){return[u,NM[u]||'?']})}
function asker(g){var a=RO(g);return a.length?a[g.t%a.length][0]:''}
function players(){return S.peers.filter(function(p){return p.presence&&p.presence.u&&p.presence.n}).map(function(p){NM[p.presence.u]=p.presence.n;return{u:p.presence.u,n:p.presence.n,h:p.presence.h===1,q:p.presence.q,a:p.presence.a,me:p.isMe}})}
function G(){if(S.host)return S.g;var h=S.peers.filter(function(p){return p.presence&&p.presence.h===1&&p.presence.g})[0];return h?h.presence.g:null}
function answers(g){
  var by={};players().forEach(function(p){if(p.a&&p.a.t===g.t&&p.a.x)by[p.u]=p.a.x});
  return shuffle(RO(g).filter(function(r){return by[r[0]]}).map(function(r){return{u:r[0],n:r[1],x:by[r[0]]}}),rng(g.s+g.t*97+5));
}
function pub(){
  if(!S.room)return;
  S.room.presence({u:uid,n:S.name,h:S.host?1:0,g:S.host?S.g:null,q:S.q,a:S.a});
  if(S.host){ls('pre-g-'+S.code,JSON.stringify(S.g));ls('pre-h-'+S.code,JSON.stringify(S.hist))}
  ls('pre-m-'+S.code,JSON.stringify({q:S.q,a:S.a}));
}
function setG(p){S.g=Object.assign({},S.g,p);pub();render(true)}
function flash(m){S.flash=m;clearTimeout(S.ft);S.ft=setTimeout(function(){S.flash='';render(true)},4000);render(true)}

async function enter(code,host){
  if(S.busy)return;S.busy=true;S.err='';render(true);
  try{
    var room=await RM.join(ROOM_PREFIX+code.toLowerCase(),uid);
    S.room=room;S.code=code;S.host=host;S.view='room';
    room.onPeers(function(arr){S.peers=arr;onPeers()});
    room.onStatus(function(ok){S.online=ok;if(ok)pub();render()});
    S.peers=room.peers();
    var m=null;try{m=JSON.parse(ls('pre-m-'+code))}catch(e){}if(m){S.q=m.q||null;S.a=m.a||null}
    if(host){
      var g=null;try{g=JSON.parse(ls('pre-g-'+code))}catch(e){}
      S.g=g||{id:Date.now(),s:Math.floor(Math.random()*1e9),ph:'lobby',t:0,rv:0,q:'',rs:''};
      try{S.hist=JSON.parse(ls('pre-h-'+code))||[]}catch(e){S.hist=[]}
    }
    ls('pre-last',JSON.stringify({code:code,host:host}));
    pub();
  }catch(e){S.err=e&&e.code==='room_full'?'La sala está llena.':'No se ha podido conectar con la sala. Inténtalo de nuevo.';S.view='home'}
  S.busy=false;render(true);
}
function onPeers(){
  var ps=players(),dup=ps.filter(function(p){return !p.me&&p.n.toLowerCase()===S.name.toLowerCase()}).length;
  if(dup&&!S.renamed){S.renamed=1;S.name=S.name+' 2';ls('pre-name',S.name);pub()}
  var g=G();
  if(S.host&&g&&g.ph==='ask'){ // llega la pregunta de quien le toca → todos a responder
    var k=asker(g),p=ps.filter(function(x){return x.u===k})[0];
    if(p&&p.q&&p.q.t===g.t&&p.q.x){setG({ph:'answer',q:p.q.x,rv:0});return}
  }
  render();
}
function leaveRoom(){if(S.room)S.room.leave();ls('pre-last',null);S.room=null;S.peers=[];S.g=null;S.host=false;S.view='home';S.renamed=0;S.q=null;S.a=null;render(true)}
function startGame(){
  var ps=players().slice(0,100);if(ps.length<2)return;
  S.hist=[];S.q=null;S.a=null;S.qv='';S.av='';
  setG({ph:'ask',t:0,rv:0,q:'',id:Date.now(),s:Math.floor(Math.random()*1e9),rs:ps.map(function(p){return p.u}).join(',')});
}
function saveHist(){var g=S.g;if(g.ph!=='read')return;S.hist.push({q:g.q,by:NM[asker(g)]||'?',i:answers(g).map(function(a){return[a.n,a.x]})})}
function nextTurn(){saveHist();S.qv='';S.av='';setG({ph:'ask',t:S.g.t+1,rv:0,q:''})}
function finish(){saveHist();setG({ph:'end'})}
function sendQ(){var x=cl(S.qv,140),g=G();if(x.length<5)return flash('Escribe una pregunta (mínimo 5 letras).');S.q={t:g.t,x:x};S.qv='';pub();render(true)}
function sendA(){var x=cl(S.av,200),g=G();if(!x)return flash('Escribe tu respuesta.');S.a={t:g.t,x:x};pub();flash('✅ Respuesta enviada. Puedes cambiarla hasta que el anfitrión pase a leerlas.')}

function topbar(left){return '<div class="row" style="margin-bottom:4px"><span class="small"><span class="dot'+(S.online?'':' off')+'"></span>'+left+'</span><button class="link" data-a="leave">Salir</button></div>'+(S.flash?'<div class="ok">'+esc(S.flash)+'</div>':'')}
function nameList(a){return a.length>6?a.slice(0,5).join(', ')+' y '+(a.length-5)+' más':a.join(', ')}
function viewHome(){
  var last=null;try{last=JSON.parse(ls('pre-last'))}catch(e){}
  var h='<a href="/" class="link" style="padding:0">← ¿Cuánto me conoces?</a><br><div class="tag">❓ MULTIJUGADOR · SALAS PRIVADAS</div><h1>Preguntas</h1><p class="sub">Por turnos, cada uno pregunta. Todos responden sin nombre… y luego se revela de quién era cada respuesta.</p>';
  if(S.err)h+='<div class="err">'+esc(S.err)+'</div>';
  h+='<div class="panel"><label style="margin-top:0">Tu nombre</label><input id="nm" type="text" maxlength="18" placeholder="¿Cómo te llamas?" value="'+esc(S.name)+'" autocomplete="off"></div>';
  if(last&&last.code)h+='<button class="btn secondary" data-a="resume">↩️ Volver a la sala '+esc(last.code)+'</button>';
  h+='<div class="panel"><h2>Crear sala</h2><p class="small" style="margin:0">Sin límite de jugadores (hasta 100). Cuando estén todos, empiezas tú.</p><button class="btn" data-a="create">Crear sala</button></div>';
  h+='<div class="panel"><h2>Unirme a una sala</h2><input id="cd" type="text" maxlength="6" placeholder="CÓDIGO" value="'+esc(S.cd)+'" style="text-transform:uppercase;letter-spacing:.25em;text-align:center;font-weight:800" autocomplete="off"><button class="btn" data-a="join">Unirme</button></div>';
  return h;
}
function viewLobby(g){
  var ps=players(),h=topbar(S.online?'Conectado':'Reconectando…');
  h+='<div class="panel" style="text-align:center"><div class="kick">Código de la sala</div><div class="code">'+esc(S.code)+'</div><button class="btn secondary" data-a="share" style="margin-top:6px">🔗 Compartir enlace</button></div>';
  h+='<div class="panel"><div class="kick">Jugadores ('+ps.length+')</div>'+ps.map(function(p,i){return '<div class="pl'+(i?'':' first')+'"><div class="av">'+esc(p.n[0].toUpperCase())+'</div><b>'+esc(p.n)+(p.me?' (tú)':'')+'</b>'+(p.h?'<span class="small" style="margin-left:auto">👑 anfitrión</span>':'')+'</div>'}).join('')+'</div>';
  h+=S.host?'<button class="btn" data-a="start"'+(ps.length<2?' disabled':'')+'>¡Empezar! ('+ps.length+' jugadores)</button><p class="small" style="text-align:center">Cada jugador hará una pregunta por turnos.</p>':'<p class="muted" style="text-align:center">Esperando a que el anfitrión empiece…</p>';
  return h;
}
function viewPlay(g){
  var ro=RO(g),N=ro.length,ak=asker(g),akn=NM[ak]||'?',inGame=ro.some(function(r){return r[0]===uid}),an=answers(g);
  var h=topbar('Pregunta '+(g.t+1)+' · le toca a '+esc(akn)+(g.t>=N?' · ronda extra':' · '+Math.min(g.t+1,N)+'/'+N));
  var skip=S.host&&g.ph!=='read'?'<button class="btn ghost" data-a="next">⏭️ Pasar pregunta</button>':'';
  if(g.ph==='ask'){
    if(ak===uid){
      var sent=S.q&&S.q.t===g.t;
      h+='<div class="panel"><h2>🎤 ¡Te toca preguntar!</h2>'+(sent?'<div class="ok">✅ Pregunta enviada: «'+esc(S.q.x)+'». Ahora todos van a responder.</div>':'<textarea id="qi" maxlength="140" placeholder="Escribe tu pregunta para el grupo…">'+esc(S.qv)+'</textarea><button class="btn secondary" data-a="idea">🎲 Dame una idea</button><button class="btn" data-a="sendq">Enviar pregunta</button>')+'</div>';
    }else h+='<div class="panel" style="text-align:center"><div class="topic">💭 '+esc(akn)+' está pensando una pregunta…</div></div>';
    return h+skip;
  }
  h+='<div class="panel"><div class="kick">Pregunta de '+esc(akn)+'</div><div class="topic">'+esc(g.q)+'</div></div>';
  if(g.ph==='answer'){
    var mine=S.a&&S.a.t===g.t,miss=ro.filter(function(r){return !an.some(function(a){return a.u===r[0]})}).map(function(r){return esc(r[1])});
    if(inGame)h+='<div class="panel"><h2>Tu respuesta</h2><textarea id="ai" maxlength="200" placeholder="Responde con sinceridad (o no)…">'+esc(S.av||(mine?S.a.x:''))+'</textarea><button class="btn" data-a="senda">'+(mine?'Actualizar respuesta':'Enviar respuesta')+'</button>'+(mine?'<p class="small">✅ Ya has respondido. Nadie verá tu nombre hasta que se revele.</p>':'')+'</div>';
    else h+='<div class="err">Estás mirando: la partida ya había empezado cuando entraste.</div>';
    h+='<div class="panel"><b>Han respondido '+an.length+' de '+N+'</b>'+(S.host&&miss.length?'<div class="small">Faltan: '+nameList(miss)+'</div>':'')+'</div>';
    return h+(S.host?'<button class="btn" data-a="toread"'+(an.length?'':' disabled')+'>Ver las respuestas ('+an.length+') →</button>'+skip:'<p class="small" style="text-align:center">El anfitrión pasará a leer las respuestas.</p>');
  }
  var rv=Math.min(g.rv||0,an.length);
  h+='<div class="kick" style="margin-top:6px">'+an.length+' respuesta'+(an.length===1?'':'s')+' · reveladas '+rv+'</div>';
  h+=an.map(function(a,i){return '<div class="ans'+(i===rv-1?' cur':'')+'"><div class="tx">«'+esc(a.x)+'»</div><div class="by">'+(i<rv?'✍️ '+esc(a.n)+(a.u===uid?' (tú)':''):'❓ ¿De quién será?')+'</div></div>'}).join('');
  if(S.host){
    h+=rv<an.length?'<button class="btn" data-a="rev">👀 Revelar siguiente ('+rv+'/'+an.length+')</button><button class="btn ghost" data-a="revall">Revelar todas</button>':'<button class="btn" data-a="next">Siguiente pregunta ➜</button>';
    h+='<button class="link" data-a="finish" style="margin-top:8px">🏁 Terminar partida</button>';
  }else h+='<p class="small" style="text-align:center">El anfitrión va leyendo y revelando…</p>';
  return h;
}
function recap(){return S.hist.map(function(x,i){return (i+1)+'. '+x.q+' (pregunta de '+x.by+')\n'+x.i.map(function(a){return '   - '+a[0]+': '+a[1]}).join('\n')}).join('\n\n')}
function viewEnd(g){
  var h=topbar('🏁 Fin de la partida');
  h+='<div class="panel"><h2>¡Gracias por jugar!</h2>'+(S.host&&S.hist.length?'<div class="kick" style="margin-top:10px">Resumen (solo lo ves tú)</div>'+S.hist.map(function(x){return '<div class="qi"><b style="color:var(--text)">'+esc(x.q)+'</b> · '+esc(x.by)+'<br>'+x.i.map(function(a){return esc(a[0])+': '+esc(a[1])}).join('<br>')+'</div>'}).join('')+'<button class="btn secondary" data-a="copy">📋 Copiar resumen</button>':'<p class="muted">Se han leído '+'todas las preguntas que han salido.</p>')+'</div>';
  return h+(S.host?'<button class="btn" data-a="again">Jugar otra vez</button>':'<p class="muted" style="text-align:center">El anfitrión puede empezar otra partida.</p>');
}
function viewRoom(){
  var g=G(),hostHere=players().some(function(p){return p.h});
  if(!g)return '<div class="panel"><p>'+(hostHere?'Conectando con el anfitrión…':'Esperando al anfitrión…')+'</p><p class="small">Si no aparece: comprueba el código y que el anfitrión tenga la sala abierta y haya recargado la página.</p><button class="link" data-a="leave">Salir</button></div>';
  if(!hostHere&&!S.host)return '<div class="err">El anfitrión se ha desconectado. Si vuelve, la partida continuará.</div><button class="btn secondary" data-a="leave">Salir</button>';
  return g.ph==='lobby'?viewLobby(g):g.ph==='end'?viewEnd(g):viewPlay(g);
}
function typing(){var a=document.activeElement;return !!(a&&a.tagName==='TEXTAREA')}
function render(force){
  if(!force&&typing()){S.dirty=true;return}
  S.dirty=false;var a=document.activeElement,keep=null;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.id)keep={id:a.id,s:a.selectionStart,e:a.selectionEnd};
  app.innerHTML=S.view==='home'?viewHome():viewRoom();
  if(keep&&$(keep.id)){var el=$(keep.id);el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}
}
app.addEventListener('input',function(e){var id=e.target.id;if(id==='nm')S.name=e.target.value;else if(id==='cd')S.cd=e.target.value.toUpperCase();else if(id==='qi')S.qv=e.target.value;else if(id==='ai')S.av=e.target.value});
app.addEventListener('focusout',function(){setTimeout(function(){if(S.dirty&&!typing())render(true)},300)});
function nm(){S.name=cl(S.name,18);ls('pre-name',S.name);return S.name}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),g=S.g;
  if(a==='create'){if(!nm()){S.err='Escribe tu nombre primero.';return render(true)}enter(rid(4),true)}
  else if(a==='join'){var c=(S.cd||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!nm()){S.err='Escribe tu nombre primero.';return render(true)}if(c.length<3){S.err='Escribe el código de la sala.';return render(true)}enter(c,false)}
  else if(a==='resume'){var l=JSON.parse(ls('pre-last'));if(!nm()){S.err='Escribe tu nombre primero.';return render(true)}enter(l.code,l.host)}
  else if(a==='leave'){if(confirm('¿Salir de la sala?'))leaveRoom()}
  else if(a==='share'){var u=location.origin+location.pathname+'?sala='+S.code;if(navigator.share)navigator.share({title:'Preguntas',text:'Únete a mi sala: '+S.code,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){b.textContent='✅ Enlace copiado'})}
  else if(a==='start')startGame();
  else if(a==='sendq')sendQ();
  else if(a==='idea'){S.qv=IDEAS[Math.floor(Math.random()*IDEAS.length)];render(true)}
  else if(a==='senda')sendA();
  else if(a==='toread'&&S.host)setG({ph:'read',rv:0});
  else if(a==='rev'&&S.host)setG({rv:(g.rv||0)+1});
  else if(a==='revall'&&S.host)setG({rv:999});
  else if(a==='next'&&S.host)nextTurn();
  else if(a==='finish'&&S.host){if(confirm('¿Terminar la partida?'))finish()}
  else if(a==='again'&&S.host){S.hist=[];S.q=null;S.a=null;setG({ph:'lobby',t:0,rv:0,q:'',rs:'',id:Date.now()})}
  else if(a==='copy'&&navigator.clipboard)navigator.clipboard.writeText(recap()).then(function(){b.textContent='✅ Copiado'});
});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='cd')app.querySelector('[data-a=join]').click()});
render(true);
</script>
</body>
</html>
