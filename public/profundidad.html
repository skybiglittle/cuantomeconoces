<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profundidad · 200 preguntas para conocernos mejor</title>
<style>
:root{--bg1:#1b1233;--bg2:#0d1226;--card:#fbf6ea;--cardink:#241a33;--ink:#f4f1fb;--sub:#a79fc2;--line:rgba(255,255,255,.16);--acc:#ffb86b;--cat:#ffb86b;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root{--bg1:#f6ecdc;--bg2:#efe3f3;--card:#ffffff;--cardink:#2a2038;--ink:#2a2038;--sub:#6e6585;--line:rgba(42,32,56,.18)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
header{text-align:center}
h1{margin:6px 0 2px;font:700 clamp(30px,8vw,44px) Georgia,"Times New Roman",serif;letter-spacing:.01em}
header p{margin:0;color:var(--sub);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 15px inherit;font-family:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cat);border-color:var(--cat);color:#1d1428}
#stage{perspective:1200px;flex:1;display:flex;align-items:center;min-height:300px}
#card{width:100%;min-height:300px;background:var(--card);color:var(--cardink);border-radius:26px;padding:26px 24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 50px rgba(0,0,0,.35);border-top:8px solid var(--cat);cursor:pointer;position:relative}
#card.flip{animation:flip .5s ease}
@keyframes flip{from{transform:rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){#card.flip{animation:none}}
#tag{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--cat);filter:brightness(.75)}
#q{font:600 clamp(24px,6.4vw,34px)/1.28 Georgia,"Times New Roman",serif;margin:18px 0;text-wrap:balance}
#turn{min-height:22px;font-size:15px;font-weight:700;color:var(--sub)}
#num{position:absolute;right:20px;top:18px;font-size:13px;color:var(--sub)}
.row{display:flex;gap:10px}
.btn{min-height:56px;border-radius:16px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:700 17px inherit;font-family:inherit;cursor:pointer;padding:0 18px}
.btn:active{transform:scale(.97)}
.btn.main{flex:1;background:var(--cat);border-color:var(--cat);color:#1d1428;font-size:19px}
.btn.fav[aria-pressed="true"]{color:#ff5f87;border-color:#ff5f87}
.sm{min-height:48px;font-size:15px}
details{border:1.5px solid var(--line);border-radius:16px;padding:0 14px}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700;font-size:15px;color:var(--sub)}
.pl{display:flex;gap:10px;padding-bottom:14px;flex-wrap:wrap}
.pl input{flex:1;min-width:120px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:0 12px;font:16px inherit;font-family:inherit}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:var(--bg2);padding:12px 18px;border-radius:14px;font-weight:700;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Profundidad</h1>
    <p>200 preguntas para conocernos mejor</p>
  </header>
  <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
  <div id="stage">
    <div id="card" tabindex="0" aria-live="polite">
      <div><span id="tag"></span><span id="num"></span></div>
      <div id="q"></div>
      <div id="turn"></div>
    </div>
  </div>
  <div class="row">
    <button class="btn sm" id="prev" aria-label="Pregunta anterior">←</button>
    <button class="btn main" id="next">Siguiente pregunta</button>
    <button class="btn fav sm" id="fav" aria-pressed="false" aria-label="Guardar como favorita">♥</button>
  </div>
  <div class="row">
    <button class="btn sm" id="copy" style="flex:1">Copiar pregunta</button>
    <button class="btn sm" id="shuf" style="flex:1">Mezclar</button>
  </div>
  <details>
    <summary>Jugadores (opcional: turnos)</summary>
    <div class="pl">
      <input id="p1" placeholder="Nombre 1" maxlength="20" autocomplete="off">
      <input id="p2" placeholder="Nombre 2" maxlength="20" autocomplete="off">
    </div>
  </details>
</main>
<div id="toast" role="status"></div>

var ALL=[];CATS.forEach(function(c,ci){c.q.forEach(function(t,i){ALL.push({id:c.id+i,t:t,c:ci});});});

var $=function(i){return document.getElementById(i);};
var sel='all',deck=[],pos=-1,hist=[],favs={},turn=0,toastT;
try{favs=JSON.parse(localStorage.getItem('prof-fav')||'{}')||{};}catch(e){favs={};}
function saveFavs(){try{localStorage.setItem('prof-fav',JSON.stringify(favs));}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pool(){
  if(sel==='fav')return ALL.filter(function(x){return favs[x.id];});
  if(sel==='all')return ALL;
  return ALL.filter(function(x){return CATS[x.c].id===sel;});
}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2200);}
function names(){return [$('p1').value.trim(),$('p2').value.trim()].filter(Boolean);}

function buildChips(){
  var box=$('chips');box.innerHTML='';
  var opts=[{id:'all',n:'Todas ('+ALL.length+')',c:'#ffb86b'}].concat(CATS.map(function(c){return {id:c.id,n:c.n,c:c.c};}),[{id:'fav',n:'♥ Favoritas',c:'#ff5f87'}]);
  opts.forEach(function(o){
    var b=document.createElement('button');b.className='chip';b.textContent=o.n;b.setAttribute('aria-pressed',String(sel===o.id));
    b.addEventListener('click',function(){sel=o.id;document.documentElement.style.setProperty('--cat',o.c);buildChips();newDeck(true);});
    box.appendChild(b);
  });
}
function newDeck(show){deck=shuffle(pool());pos=-1;hist=[];if(show)next(true);}
function render(skipAnim){
  var item=deck[pos],card=$('card');
  if(!item){
    $('tag').textContent='';$('num').textContent='';
    $('q').textContent=sel==='fav'?'Todavía no tienes favoritas. Toca ♥ en las preguntas que quieras guardar.':'Sin preguntas.';
    $('turn').textContent='';$('fav').setAttribute('aria-pressed','false');return;
  }
  var c=CATS[item.c];
  document.documentElement.style.setProperty('--cat',sel==='all'||sel==='fav'?c.c:CATS.filter(function(x){return x.id===sel;})[0].c);
  $('tag').textContent=c.n;$('num').textContent=(pos+1)+' / '+deck.length;$('q').textContent=item.t;
  var n=names();$('turn').textContent=n.length?'Responde: '+n[turn%n.length]:'';
  $('fav').setAttribute('aria-pressed',String(!!favs[item.id]));
  if(!skipAnim){card.classList.remove('flip');void card.offsetWidth;card.classList.add('flip');}
}
function next(first){
  if(!deck.length){render(true);return;}
  if(pos>=0&&!first)turn++;
  pos++;
  if(pos>=deck.length){deck=shuffle(pool());pos=0;toast('¡Has recorrido todas! Se vuelven a mezclar.');}
  hist.push(pos);render();
}
function prev(){if(pos>0){pos--;if(turn>0)turn--;render();}}
function toggleFav(){var it=deck[pos];if(!it)return;if(favs[it.id])delete favs[it.id];else favs[it.id]=1;saveFavs();$('fav').setAttribute('aria-pressed',String(!!favs[it.id]));toast(favs[it.id]?'Guardada en favoritas':'Quitada de favoritas');}
function copyQ(){
  var it=deck[pos];if(!it)return;
  try{navigator.clipboard.writeText(it.t).then(function(){toast('Pregunta copiada');},function(){toast('No se pudo copiar');});}catch(e){toast('No se pudo copiar');}
}

$('next').addEventListener('click',function(){next();});
$('prev').addEventListener('click',prev);
$('card').addEventListener('click',function(){next();});
$('fav').addEventListener('click',toggleFav);
$('copy').addEventListener('click',copyQ);
$('shuf').addEventListener('click',function(){newDeck(true);toast('Preguntas mezcladas');});
$('p1').addEventListener('input',function(){render(true);});
$('p2').addEventListener('input',function(){render(true);});
addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='ArrowRight'||e.code==='Space'){e.preventDefault();next();}
  else if(e.code==='ArrowLeft'){prev();}
  else if(e.key==='f'||e.key==='F'){toggleFav();}
});
buildChips();newDeck(true);
})();
</script>
