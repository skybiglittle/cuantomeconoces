<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serpientes Salas</title>
<style>
:root{--bg:#111318;--fg:#eee;--card:#25272e;--ac:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:5}
.card{background:var(--card);padding:20px;border-radius:14px;width:min(320px,88%);text-align:center}
.card h1{margin:0 0 6px;font-size:22px}.card p{margin:6px 0;font-size:14px;opacity:.85}
input{width:100%;box-sizing:border-box;padding:10px;font-size:18px;text-align:center;border-radius:8px;border:1px solid #888;background:var(--bg);color:var(--fg);margin:8px 0}
button{padding:11px;margin:4px 0;font-size:16px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;touch-action:manipulation}
.card button{width:100%}button.s{background:#6b7280}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;font-size:15px;text-shadow:0 1px 2px #000;pointer-events:none;z-index:3}
#lb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;font-size:13px;text-align:right;text-shadow:0 1px 2px #000;pointer-events:none;z-index:3;line-height:1.5}
#bst{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:72px;height:72px;border-radius:50%;font-size:30px;padding:0;background:#f59f00;z-index:3;opacity:.85}
#msg{font-size:12px;color:#f87171}
.d{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;border:1px solid #fff}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div><div id="lb"></div><button id="bst">⚡</button>
<div class="ov" id="lobby"><div class="card">
<h1>🐍 Serpientes Salas</h1>
<p>Come para crecer y haz que los demás se estrellen contra ti. Ratón o dedo para dirigir; clic o ⚡ para acelerar.</p>
<input id="code" maxlength="8" placeholder="código de sala" autocomplete="off">
<button id="join">Unirse / crear sala</button>
<button class="s" id="rnd">Sala aleatoria</button>
<button class="s" id="solo">Practicar solo</button>
<div id="msg"></div>
</div></div>
<div class="ov" id="end" style="display:none"><div class="card"><h1>💀 Game over</h1><p id="sc"></p><button id="again">Jugar otra vez</button></div></div>
<script>
function makeRoom(){
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
  return{join:function(name){return new Promise(function(resolve,reject){
    var ws=null,id=null,arr=[],subs=[],done=false,closed=false,retry=0,pres={},cid=Math.random().toString(36).slice(2);
    var room={peers:function(){return arr},
      onPeers:function(f){subs.push(f)},
      presence:function(p){Object.keys(p).forEach(function(k){if(p[k]===null)delete pres[k];else pres[k]=p[k]});send({t:'pres',p:p});return Promise.resolve()},
      leave:function(){closed=true;try{ws.close()}catch(e){}return Promise.resolve()}};
    function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
    function open(){
      ws=new WebSocket(url);
      ws.onopen=function(){retry=0;send({t:'join',room:name,cid:cid});if(Object.keys(pres).length)send({t:'pres',p:pres})};
      ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
        if(m.t==='hello')id=m.id;
        else if(m.t==='peers'){arr=m.peers.map(function(q){return{peer:q.id,isMe:q.id===id,presence:q.p||{}}});if(!done){done=true;resolve(room)}subs.forEach(function(f){f()})}
        else if(m.t==='err'){closed=true;if(!done){done=true;reject({code:m.code})}}};
      ws.onclose=function(){if(closed)return;retry++;setTimeout(open,Math.min(1000*retry,8000))};
    }
    open();setTimeout(function(){if(!done){done=true;closed=true;try{ws.close()}catch(e){}reject({code:'timeout'})}},20000);
  })}};
}
var RM=window.WebSocket&&location.protocol.indexOf('http')===0?makeRoom():null;

const cv=document.getElementById('c'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
const WS=3000,CELL=120,N=25,SP=7;
let VW=0,VH=0,room=null,seed=1,rn='',peers=[],hue=Math.floor(Math.random()*360),run=false,alive=false;
let sn=[],len=12,ang=0,tAng=0,boost=0,best=0,eaten={},dyn=[],lastE=[],drc=0,drLast=null,lastDr={},gh={},lastP=0,cells={},cx=0,cy=0;
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const now=()=>Date.now()/1000,rad=l=>6+Math.min(16,l/35);
function resize(){VW=cv.width=innerWidth;VH=cv.height=innerHeight}addEventListener('resize',resize);resize();
function cell(i,j){const k=i*N+j;if(cells[k])return cells[k];const R=rng(seed^Math.imul(k+1,2654435761)),a=[],n=2+Math.floor(R()*2);
  for(let q=0;q<n;q++)a.push({id:k*4+q,x:(i+R())*CELL,y:(j+R())*CELL,h:Math.floor(R()*360),v:R()<.08?3:1});return cells[k]=a}
const isE=id=>eaten[id]&&now()-eaten[id]<40;
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function spawn(){
  const x=400+Math.random()*2200,y=400+Math.random()*2200;ang=tAng=Math.random()*6.28;len=12;boost=0;
  sn=Array.from({length:12},(_,i)=>({x:x-i*SP*Math.cos(ang),y:y-i*SP*Math.sin(ang)}));alive=true;$('end').style.display='none';push(1);
}
function die(){
  alive=false;best=Math.max(best,Math.floor(len));const p=[];
  for(let i=0;i<sn.length&&p.length<50;i+=Math.max(2,Math.floor(sn.length/25))){p.push(Math.round(sn[i].x),Math.round(sn[i].y));dyn.push({x:sn[i].x,y:sn[i].y,v:Math.max(1,len/40),t:now()})}
  drLast=[++drc,p];$('sc').textContent='Longitud: '+Math.floor(len)+' · Mejor: '+best;$('end').style.display='flex';push(1);
}
function update(dt){
  if(!alive)return;
  let da=((tAng-ang+9.42)%6.283)-3.1416;const b=boost&&len>10;ang+=Math.max(-1,Math.min(1,da/.05))*Math.min(Math.abs(da)/dt,b?3.5:4.5)*dt;
  const h=sn[0],sp=b?260:150;h.x+=Math.cos(ang)*sp*dt;h.y+=Math.sin(ang)*sp*dt;
  for(let i=1;i<sn.length;i++){const a=sn[i-1],c=sn[i],dx=a.x-c.x,dy=a.y-c.y,d=Math.hypot(dx,dy)||1;if(d>SP){c.x+=dx/d*(d-SP);c.y+=dy/d*(d-SP)}}
  if(b)len-=3*dt;
  while(sn.length<Math.floor(len))sn.push({...sn[sn.length-1]});while(sn.length>Math.floor(len)&&sn.length>10)sn.pop();
  const r=rad(len),ci=Math.floor(h.x/CELL),cj=Math.floor(h.y/CELL);
  for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++){if(i<0||j<0||i>=N||j>=N)continue;
    for(const f of cell(i,j))if(!isE(f.id)&&Math.hypot(f.x-h.x,f.y-h.y)<r+12){eaten[f.id]=now();lastE.unshift([f.id,Math.floor(now())]);lastE.length=Math.min(lastE.length,12);len+=f.v*.5}}
  dyn=dyn.filter(d=>{if(now()-d.t>60)return false;if(Math.hypot(d.x-h.x,d.y-h.y)<r+14){len+=d.v*.5;return false}return true});
  if(h.x<0||h.y<0||h.x>WS||h.y>WS){die();return}
  for(const p of peers){const q=p.presence;if(p.isMe||!q||!q.pt||q.dd)continue;const P=q.pt;
    for(let i=0;i+3<P.length;i+=2)if(segD(h.x,h.y,P[i],P[i+1],P[i+2],P[i+3])<(q.r+r)*.7){die();return}}
}
function push(f){
  if(!room)return;const n=Date.now();if(!f&&n-lastP<100)return;lastP=n;
  const pt=[];if(alive){const st=Math.max(1,Math.ceil(sn.length/60));for(let i=0;i<sn.length;i+=st)pt.push(Math.round(sn[i].x),Math.round(sn[i].y));const l=sn[sn.length-1];if((sn.length-1)%st)pt.push(Math.round(l.x),Math.round(l.y))}
  room.presence({pt,a:+ang.toFixed(2),r:+rad(len).toFixed(1),L:Math.floor(len),h:hue,dd:alive?0:1,e:lastE,dr:drLast}).catch(()=>{});
}
function net(){
  for(const p of peers){const q=p.presence;if(p.isMe||!q)continue;
    if(q.e)for(const [id,t] of q.e)if(now()-t<40&&(!eaten[id]||eaten[id]<t))eaten[id]=t;
    if(q.dr){if(lastDr[p.peer]===undefined)lastDr[p.peer]=q.dr[0];else if(q.dr[0]>lastDr[p.peer]){lastDr[p.peer]=q.dr[0];for(let i=0;i+1<q.dr[1].length;i+=2)dyn.push({x:q.dr[1][i],y:q.dr[1][i+1],v:2,t:now()})}}
    else if(lastDr[p.peer]===undefined)lastDr[p.peer]=0;
    if(q.pt&&q.pt.length){let s=gh[p.peer];if(!s||s.length!==q.pt.length)s=gh[p.peer]=q.pt.slice();else for(let i=0;i<s.length;i++)s[i]+=(q.pt[i]-s[i])*.35}}
}
function eyes(x,y,a,r){g.fillStyle='#fff';for(const s of[-1,1]){const ex=x+Math.cos(a+s*.7)*r*.6,ey=y+Math.sin(a+s*.7)*r*.6;g.beginPath();g.arc(ex,ey,r*.35,0,6.3);g.fill();g.fillStyle='#111';g.beginPath();g.arc(ex+Math.cos(a)*r*.12,ey+Math.sin(a)*r*.12,r*.17,0,6.3);g.fill();g.fillStyle='#fff'}}
function body(P,r,h,a){
  g.lineCap=g.lineJoin='round';g.beginPath();g.moveTo(P[0],P[1]);for(let i=2;i<P.length;i+=2)g.lineTo(P[i],P[i+1]);
  g.strokeStyle='hsl('+h+',65%,38%)';g.lineWidth=r*2;g.stroke();g.strokeStyle='hsl('+h+',75%,55%)';g.lineWidth=r*1.2;g.stroke();eyes(P[0],P[1],a,r)}
function draw(){
  const L=sn.length?sn.length:12,s=Math.max(.55,1-L/1500);
  if(alive){cx+=(sn[0].x-cx)*.2;cy+=(sn[0].y-cy)*.2}
  g.fillStyle='#14171c';g.fillRect(0,0,VW,VH);
  g.save();g.translate(VW/2,VH/2);g.scale(s,s);g.translate(-cx,-cy);
  const x0=cx-VW/2/s,x1=cx+VW/2/s,y0=cy-VH/2/s,y1=cy+VH/2/s;
  g.fillStyle='#1c2028';for(let x=Math.floor(x0/60)*60;x<x1;x+=60)for(let y=Math.floor(y0/60)*60;y<y1;y+=60)g.fillRect(x,y,3,3);
  g.strokeStyle='#e03131';g.lineWidth=8;g.strokeRect(0,0,WS,WS);
  for(let i=Math.max(0,Math.floor(x0/CELL));i<=Math.min(N-1,Math.floor(x1/CELL));i++)for(let j=Math.max(0,Math.floor(y0/CELL));j<=Math.min(N-1,Math.floor(y1/CELL));j++)
    for(const f of cell(i,j)){if(isE(f.id))continue;g.fillStyle='hsl('+f.h+',80%,60%)';g.beginPath();g.arc(f.x,f.y,f.v>1?8:5,0,6.3);g.fill()}
  for(const d of dyn){g.fillStyle='#ffe066';g.beginPath();g.arc(d.x,d.y,5+d.v,0,6.3);g.fill()}
  for(const p of peers){const q=p.presence,P=gh[p.peer];if(p.isMe||!q||q.dd||!P||P.length<4)continue;body(P,q.r,q.h||0,q.a||0)}
  if(alive){const P=[];for(const c of sn)P.push(c.x,c.y);body(P,rad(len),hue,ang)}
  g.restore();
}
function hud(){
  $('hud').innerHTML='Longitud: <b>'+(alive?Math.floor(len):0)+'</b>'+(room?'<br><small>Sala '+rn+'</small>':'');
  const l=[{h:hue,L:alive?Math.floor(len):0,m:1}];for(const p of peers)if(!p.isMe&&p.presence&&p.presence.L!=null&&!p.presence.dd)l.push({h:p.presence.h||0,L:p.presence.L,m:0});
  l.sort((a,b)=>b.L-a.L);$('lb').innerHTML=l.slice(0,6).map(e=>'<span class="d" style="background:hsl('+e.h+',70%,55%)"></span>'+e.L+(e.m?' (tú)':'')).join('<br>');
}
let l0=performance.now();
function loop(n){const dt=Math.min(.05,(n-l0)/1000);l0=n;if(run){update(dt);net();draw();push()}requestAnimationFrame(loop)}
setInterval(()=>{if(run)hud()},300);
async function start(code){
  $('msg').textContent='';
  if(code){
    if(!RM){$('msg').textContent='Las salas necesitan abrir este archivo desde tu servidor (http).';return}
    try{room=await RM.join('sl-'+code);rn=code}catch(e){$('msg').textContent=(e&&e.code==='room_full')?'La sala está llena.':'No se pudo entrar ('+((e&&e.code)||'error')+')';return}
    room.onPeers(()=>{peers=room.peers()});peers=room.peers();seed=hash(code);
  }else{room=null;peers=[];seed=Math.floor(Math.random()*1e9)}
  $('lobby').style.display='none';run=true;spawn();cx=sn[0].x;cy=sn[0].y;
}
const clean=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
$('join').onclick=()=>{const c=clean($('code').value);c?start(c):$('msg').textContent='Escribe un código de sala'};
$('rnd').onclick=()=>start(Math.random().toString(36).slice(2,6));
$('solo').onclick=()=>start('');
$('again').onclick=spawn;
const aim=e=>{tAng=Math.atan2(e.clientY-VH/2,e.clientX-VW/2)};
cv.addEventListener('pointermove',aim);
cv.addEventListener('pointerdown',e=>{aim(e);if(e.pointerType==='mouse')boost=1});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')boost=0});
$('bst').addEventListener('pointerdown',e=>{e.preventDefault();boost=1});
['pointerup','pointerleave','pointercancel'].forEach(v=>$('bst').addEventListener(v,()=>boost=0));
addEventListener('keydown',e=>{if(e.key===' ')boost=1});addEventListener('keyup',e=>{if(e.key===' ')boost=0});
requestAnimationFrame(loop);
</script></body></html>
