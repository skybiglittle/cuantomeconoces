const $=id=>document.getElementById(id),PFX="vf-",esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TM=[["Naranja","#ff6a1a"],["Azul","#2f7de1"],["Verde","#1b9e5a"],["Morado","#8b4fd6"]];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let peer=null,myId=null,hostConn=null,conns=[],code="",host=false,test=false,name="",myTeam=0,V=null,endAt=0,myV=null,lastQ=-2,sig="",retries=0,retryP=false,gone=false,joinCode="",started=false,msg="";
/* ---------- Anfitrión: estado y reglas ---------- */
const H={ph:"lobby",rounds:10,time:20,qi:-1,order:[],endAt:0,res:null,hist:[]},PL={};let TS=[0,1,2,3].map(()=>({cor:0,tot:0}));
function build(n){const F=sh(Q.filter(q=>!q[1])),T=sh(Q.filter(q=>q[1])),o=[];while(o.length<n&&(F.length||T.length)){const f=F.length&&(!T.length||Math.random()<.5);o.push(f?F.pop():T.pop())}return o}
function join(id,n,t){
  if(!PL[id]){
    const nm=String(n||"Jugador").slice(0,14),old=Object.values(PL).find(p=>p.off&&p.n===nm&&!p.bot);
    if(old){delete PL[old.id];old.id=id;old.off=false;PL[id]=old}
    else if(Object.keys(PL).length>=30)return;else PL[id]={id,n:nm,team:0,vote:null,sc:0};
  }
  const p=PL[id];p.off=false;p.n=String(n||"Jugador").slice(0,14);if(H.ph==="lobby"||!p.team)p.team=t>=0&&t<4?t|0:0;bc();
}
function setTeam(id,t){const p=PL[id];if(p&&H.ph==="lobby"&&t>=0&&t<4){p.team=t|0;bc()}}
function castVote(id,v){const p=PL[id];if(!p||H.ph!=="vote")return;p.vote=!!v;if(Object.values(PL).filter(x=>!x.off).every(x=>x.vote!==null))reveal();else bc()}
function reveal(){
  if(H.ph!=="vote")return;const q=H.order[H.qi],ans=!!q[1],ps=Object.values(PL).filter(p=>!p.off);let y=0,no=0,ni=0,w=0;
  ps.forEach(p=>{const ok=p.vote===ans;if(p.vote===true)y++;else if(p.vote===false)no++;else ni++;TS[p.team].tot++;if(ok){p.sc++;TS[p.team].cor++}else w++});
  H.res={y,no,ni,w,n:ps.length,pct:ps.length?Math.round(w/ps.length*100):0};H.hist.push({t:q[0],a:q[1],e:q[3],pct:H.res.pct});H.ph="reveal";bc();
}
function nextQ(){H.qi++;if(H.qi>=H.order.length){H.ph="end";bc();return}Object.values(PL).forEach(p=>p.vote=null);H.ph="vote";H.endAt=Date.now()+H.time*1000;bc()}
function startGame(){
  H.order=build(H.rounds);H.qi=-1;H.hist=[];TS=[0,1,2,3].map(()=>({cor:0,tot:0}));
  Object.values(PL).forEach(p=>{p.sc=0;p.vote=null});
  if(test)for(let k=1;k<=3;k++)PL["bot"+k]={id:"bot"+k,n:"Bot "+k,team:k%4,vote:null,sc:0,bot:true};
  nextQ();
}
function snap(){
  const q=H.order[H.qi],pls=Object.values(PL),rv=H.ph==="reveal";
  return{ph:H.ph,rounds:H.order.length||H.rounds,qi:H.qi,time:H.time,rcfg:H.rounds,left:H.ph==="vote"?Math.max(0,H.endAt-Date.now()):0,
    q:q&&H.ph!=="lobby"&&H.ph!=="end"?{t:q[0],c:q[2]}:null,ans:rv?!!q[1]:null,e:rv?q[3]:null,res:rv?H.res:null,
    tm:TM.map((t,i)=>({cor:TS[i].cor,tot:TS[i].tot,m:pls.filter(p=>p.team===i&&!p.off).length})),
    pl:pls.map(p=>({id:p.id,n:p.n,team:p.team,sc:p.sc,off:!!p.off,voted:p.vote!==null,vote:rv?p.vote:undefined})),
    top:H.ph==="end"?H.hist.slice().sort((a,b)=>b.pct-a.pct).slice(0,3):null};
}
function bc(){const s=snap();apply(s);conns.forEach(c=>{try{c.open&&c.send({t:"s",s})}catch(e){}})}
function hostLoop(){
  if(H.ph!=="vote")return;
  if(test)Object.values(PL).forEach(p=>{if(p.bot&&p.vote===null&&Math.random()<.2)castVote(p.id,Math.random()<.5)});
  if(H.ph==="vote"&&Date.now()>=H.endAt)reveal();
}
/* ---------- Red (PeerJS: el anfitrión es el servidor de la sala) ---------- */
function apply(s){V=s;endAt=Date.now()+(s.left||0);if(s.qi!==lastQ||s.ph==="lobby"){lastQ=s.qi;myV=null}render()}
const newCode=()=>{const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
function setName(){const n=$("nm").value.trim();if(!n){$("jm").textContent="Pon tu nombre.";return false}name=n.slice(0,14);return true}
function createRoom(tries){
  const c=newCode();peer=new Peer(PFX+c);
  peer.on("open",id=>{myId=id;code=c;host=true;join(id,name,myTeam);enter();
    peer.on("connection",cn=>{
      cn.on("open",()=>{conns=conns.filter(x=>x.peer!==cn.peer);conns.push(cn);cn.send({t:"s",s:snap()})});
      cn.on("data",m=>{if(!m)return;if(m.t==="j")join(cn.peer,m.n,m.team);else if(m.t==="v")castVote(cn.peer,m.v);else if(m.t==="team")setTeam(cn.peer,m.team)});
      cn.on("close",()=>{conns=conns.filter(x=>x!==cn);const p=PL[cn.peer];if(p){p.off=true;if(H.ph==="vote"&&Object.values(PL).filter(x=>!x.off).every(x=>x.vote!==null))reveal();else bc()}});
    });
  });
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",e=>{if(e.type==="unavailable-id"&&tries<5){peer.destroy();createRoom(tries+1)}else if(!started)$("jm").textContent="No se pudo crear la sala ("+e.type+")."});
}
function joinRoom(c){
  joinCode=c;peer=new Peer();
  peer.on("open",id=>{myId=id;connectHost()});
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",e=>{if(started)retry();else $("jm").textContent=e.type==="peer-unavailable"?"Esa sala no existe.":"Error de conexión ("+e.type+")."});
}
function connectHost(){
  const c=peer.connect(PFX+joinCode,{reliable:true});hostConn=c;
  c.on("open",()=>{retries=0;code=joinCode;msg="";c.send({t:"j",n:name,team:myTeam});enter()});
  c.on("data",m=>{if(m&&m.t==="s"&&m.s)apply(m.s)});
  c.on("close",()=>{if(c===hostConn)retry()});
}
function retry(){
  if(gone||retryP)return;
  if(retries>=8){gone=true;msg="El anfitrión se ha desconectado.";render();return}
  retries++;retryP=true;msg="Reconectando… ("+retries+"/8)";render();
  setTimeout(()=>{retryP=false;try{if(peer.disconnected)peer.reconnect();connectHost()}catch(e){retry()}},3000);
}
function enter(){if(started)return;started=true;sig="";setInterval(()=>{if(host)hostLoop();tickUI()},400);render()}
const act={
  vote(v){myV=v;if(host)castVote(myId,v);else if(hostConn&&hostConn.open)hostConn.send({t:"v",v});sig="";render()},
  team(t){myTeam=t;if(host)setTeam(myId,t);else if(hostConn&&hostConn.open)hostConn.send({t:"team",team:t})},
  start(){if(host)startGame()},next(){if(host)nextQ()},close(){if(host)reveal()},
  again(){if(host){H.ph="lobby";H.qi=-1;H.order=[];Object.values(PL).forEach(p=>{if(p.bot)delete PL[p.id];else p.vote=null});bc()}},
  copy(){navigator.clipboard&&navigator.clipboard.writeText(location.origin+location.pathname+"?sala="+code).then(()=>{$("cp").textContent="¡Enlace copiado!"}).catch(()=>{})}
};
/* ---------- Pantallas ---------- */
const tcol=i=>"style=\"--c:"+TM[i][1]+"\"";
function home(){
  const qs=new URLSearchParams(location.search).get("sala")||"";
  $("s").innerHTML='<div class="card"><p style="margin-top:0">Aparece una afirmación en todos los móviles. Cada uno vota <b>en secreto</b> y, al revelar, se ve cuánta gente ha caído. Las preguntas juegan con creencias muy extendidas: todas las respuestas están documentadas.</p>'
   +'<label>Tu nombre</label><input id="nm" maxlength="14" autocomplete="off"><label>Tu equipo</label><div class="row" id="tp">'+TM.map((t,i)=>'<button class="tbtn'+(i===myTeam?" on":"")+'" data-t="'+i+'" '+tcol(i)+'>'+t[0]+'</button>').join("")+'</div>'
   +'<label>Código de sala (vacío si vas a crear una)</label><input id="cd" maxlength="6" autocapitalize="characters" value="'+esc(qs.toUpperCase())+'" placeholder="p. ej. K7QX">'
   +'<button class="btn" id="bj">Unirme a la sala</button><button class="btn g" id="bm">Crear sala nueva</button><button class="btn g" id="bt">Modo prueba (1 jugador + 3 bots)</button><p class="mut" id="jm"></p></div>';
  $("tp").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;myTeam=+b.dataset.t;[...$("tp").children].forEach((x,i)=>x.classList.toggle("on",i===myTeam))};
  $("bj").onclick=()=>{if(!setName())return;const c=$("cd").value.trim().toUpperCase();if(!c){$("jm").textContent="Escribe el código.";return}$("jm").textContent="Conectando…";joinRoom(c)};
  $("bm").onclick=()=>{if(!setName())return;$("jm").textContent="Creando sala…";createRoom(0)};
  $("bt").onclick=()=>{name=($("nm").value.trim()||"Tú").slice(0,14);test=true;host=true;myId="me";code="PRUEBA";join(myId,name,myTeam);enter()};
}
function lobby(){
  const me=V.pl.find(p=>p.id===myId),t=me?me.team:myTeam;
  $("s").innerHTML='<div class="card c"><div class="mut">Código de sala</div><div style="font-size:30px;font-weight:900;letter-spacing:4px">'+esc(code)+'</div>'+(test?"":'<button class="btn g" data-a="copy" id="cp">Copiar enlace</button>')+'</div>'
   +'<div class="card"><b>Elige equipo</b><div class="row" style="margin-top:8px">'+TM.map((x,i)=>'<button class="tbtn'+(i===t?" on":"")+'" data-t="'+i+'" '+tcol(i)+'>'+x[0]+' · '+V.tm[i].m+'</button>').join("")+'</div></div>'
   +'<div class="card">'+(TM.map((x,i)=>{const m=V.pl.filter(p=>p.team===i&&!p.off);return m.length?'<div>'+m.map(p=>'<span class="chip" '+tcol(i)+'>'+esc(p.n)+(p.id===myId?" (tú)":"")+'</span>').join("")+'</div>':""}).join("")||'<span class="mut">Esperando jugadores…</span>')+'</div>'
   +(host?'<div class="card"><b>Ajustes</b><div class="row"><div><label>Preguntas</label><select id="rc">'+[6,10,15].map(n=>'<option'+(n===V.rcfg?" selected":"")+'>'+n+'</option>').join("")+'</select></div><div><label>Segundos por pregunta</label><select id="tc">'+[15,20,30].map(n=>'<option'+(n===V.time?" selected":"")+'>'+n+'</option>').join("")+'</select></div></div><button class="btn" data-a="start">Empezar</button></div>':'<p class="mut c">El anfitrión empezará la partida.</p>');
  if(host){$("rc").onchange=e=>{H.rounds=+e.target.value;bc()};$("tc").onchange=e=>{H.time=+e.target.value;bc()}}
}
function vote(){
  const my=myV;
  $("s").innerHTML='<div class="c"><span class="tag">Pregunta '+(V.qi+1)+' de '+V.rounds+' · '+esc(V.q.c)+'</span></div><div class="sign"><p>«'+esc(V.q.t)+'»</p></div>'
   +'<div class="clock" id="clk"></div><div class="bar" id="bar"><i id="bi"></i></div>'
   +'<div class="vf"><button class="vb v'+(my===false?" dim":"")+(my===true?" sel":"")+'" data-a="vote" data-v="1">✔ VERDADERO</button><button class="vb f'+(my===true?" dim":"")+(my===false?" sel":"")+'" data-a="vote" data-v="0">✖ FALSO</button></div>'
   +'<p class="mut c" id="cnt"></p><p class="mut c">'+(my===null?"Vota sin que te vean. Se revela cuando todos voten o acabe el tiempo.":"Voto guardado. Puedes cambiarlo mientras falte alguien por votar.")+'</p>'
   +(host?'<button class="btn g" data-a="close">Cerrar votación ya</button>':"");
}
function reveal_(){
  const r=V.res,me=V.pl.find(p=>p.id===myId),tot=Math.max(1,r.y+r.no),yw=Math.round(r.y/tot*100),last=V.qi+1>=V.rounds;
  const m=r.pct>=60?"¡Trampa maestra! Cayó casi todo el mundo":r.pct>=40?"Muy repartidos: la duda era razonable":r.pct>=20?"Una parte de la sala picó":"Esto lo sabía casi todo el mundo";
  const mine=!me?"":me.vote===null?"No votaste a tiempo":me.vote===V.ans?"✔ Tú acertaste":"✖ Tú has caído";
  const teams=V.tm.map((t,i)=>{const m=V.pl.filter(p=>p.team===i&&!p.off);if(!m.length)return"";const ok=m.filter(p=>p.vote===V.ans).length;return'<div class="pr" '+tcol(i)+'><b>'+TM[i][0]+'</b><div class="bar"><i style="width:'+Math.round(ok/m.length*100)+'%"></i></div><span>'+ok+'/'+m.length+'</span></div>'}).join("");
  $("s").innerHTML='<div class="c"><span class="tag">Pregunta '+(V.qi+1)+' de '+V.rounds+'</span></div><div class="sign" style="font-size:20px;padding:16px"><p>«'+esc(V.q.t)+'»</p></div>'
   +'<div class="stamp a '+(V.ans?"v":"f")+'" style="--d:.5s">'+(V.ans?"VERDADERO":"FALSO")+'</div>'
   +'<div class="split a" style="--d:1.3s"><div class="sv" data-w="'+yw+'%">✔ '+r.y+'</div><div class="sf" data-w="'+(100-yw)+'%">✖ '+r.no+'</div></div>'
   +'<div class="fell a" style="--d:2.3s">🎯 Han caído <b>'+r.w+' de '+r.n+'</b> ('+r.pct+' %)<br><span class="mut">Cayeron: '+(V.pl.filter(p=>!p.off&&p.vote!==V.ans).map(p=>esc(p.n)).join(", ")||"nadie")+'</span></div><div class="msg a" style="--d:2.3s">'+m+'</div>'
   +'<div class="why a" style="--d:3.2s">'+esc(V.e)+'</div><div class="a" style="--d:3.8s"><p class="c" style="font-weight:800;margin:6px 0">'+mine+'</p><div class="card">'+teams+'</div>'
   +(host?'<button class="btn" data-a="next">'+(last?"Ver resultados":"Siguiente pregunta")+'</button>':'<p class="mut c">Espera al anfitrión…</p>')+'</div>';
  setTimeout(()=>document.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w),1400);
}
function end(){
  const tm=V.tm.map((t,i)=>({i,p:t.tot?Math.round(t.cor/t.tot*100):0,t})).filter(x=>x.t.tot>0).sort((a,b)=>b.p-a.p),best=V.pl.slice().sort((a,b)=>b.sc-a.sc)[0];
  const win=tm.filter(x=>x.p===(tm[0]&&tm[0].p));
  $("s").innerHTML='<div class="card c"><div class="mut">Fin de la partida</div><div class="pt" style="color:'+(win.length===1?TM[win[0].i][1]:"var(--ink)")+'">'+(win.length===1?"Gana el equipo "+TM[win[0].i][0]:"¡Empate!")+'</div></div>'
   +'<div class="card">'+tm.map(x=>'<div class="pr" '+tcol(x.i)+'><b>'+TM[x.i][0]+'</b><div class="bar"><i style="width:'+x.p+'%"></i></div><span>'+x.p+' %</span></div>').join("")+'<p class="mut" style="margin-bottom:0">Porcentaje de aciertos del equipo.'+(best?" Mejor jugador: <b>"+esc(best.n)+"</b> con "+best.sc+" aciertos.":"")+'</p></div>'
   +'<div class="card"><b>Ranking</b>'+V.pl.slice().sort((a,b)=>b.sc-a.sc).slice(0,8).map((p,k)=>'<div class="pr" '+tcol(p.team)+'><span style="width:30px">'+(["🥇","🥈","🥉"][k]||k+1)+'</span><span style="flex:1;font-weight:700">'+esc(p.n)+'</span><span>'+p.sc+'/'+V.rounds+'</span></div>').join("")+'</div>'
   +'<div class="card"><b>Las que más engañaron</b>'+(V.top||[]).map(h=>'<p style="margin:10px 0 2px"><b>«'+esc(h.t)+'»</b></p><p class="mut" style="margin:0">'+(h.a?"Verdadero":"Falso")+' · cayó el '+h.pct+' %. '+esc(h.e)+'</p>').join("")+'</div>'
   +(host?'<button class="btn" data-a="again">Jugar otra vez</button>':'<p class="mut c">El anfitrión puede empezar otra partida.</p>');
}
function render(){
  if(!started){if(!$("nm"))home();return}
  if(!V)return;
  const s=V.ph+"|"+V.qi+"|"+(V.ph==="lobby"?V.pl.map(p=>p.id+p.n+p.team+p.off).join()+V.rcfg+V.time:"")+"|"+myV+"|"+msg;
  if(s===sig)return;sig=s;
  if(V.ph==="lobby")lobby();else if(V.ph==="vote")vote();else if(V.ph==="reveal")reveal_();else end();
  if(msg)$("s").insertAdjacentHTML("afterbegin",'<div class="card" style="background:var(--no);color:#fff">'+esc(msg)+'</div>');
  tickUI();
}
function tickUI(){
  if(!V||V.ph!=="vote")return;
  const left=Math.max(0,endAt-Date.now()),b=$("bi"),c=$("clk"),k=$("cnt");
  if(b){b.style.width=(left/(V.time*1000)*100)+"%";$("bar").classList.toggle("hot",left<6000)}
  if(c)c.textContent=Math.ceil(left/1000);
  if(k){const a=V.pl.filter(p=>!p.off);k.textContent=a.filter(p=>p.voted).length+" de "+a.length+" han votado"}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t&&started&&V&&V.ph==="lobby"){act.team(+t.dataset.t);return}
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="vote")act.vote(b.dataset.v==="1");else act[a]&&act[a]();
});
render();
</script></main></body></html>
