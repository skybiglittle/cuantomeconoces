<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navegador con la mano</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--bar:#f2f2f5;--acc:#3b6cf6;--mut:#6b6b76}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececf0;--bar:#232327;--mut:#9a9aa6}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;padding:10px;background:var(--bar);align-items:center}
header button,header input{font:inherit;border-radius:10px;border:1px solid #8884;padding:10px 14px;background:var(--bg);color:var(--fg)}
header input{flex:1;min-width:0}
header button{cursor:pointer}
#main{flex:1;overflow-y:auto;padding:20px max(16px,calc(50% - 400px))}
#main img{max-width:100%;height:auto}
#main a{color:var(--acc)}
.hov{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px;background:#3b6cf633}
table{max-width:100%;display:block;overflow-x:auto}
.res{padding:14px;border:1px solid #8883;border-radius:12px;margin:10px 0;cursor:pointer}
.res b{font-size:1.1em}
.sn{color:var(--mut);font-size:.9em}
.hide{display:none!important}
#cam{position:fixed;right:12px;bottom:12px;width:200px;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 4px 18px #0006;z-index:5}
#cam video{width:100%;display:block;transform:scaleX(-1)}
#st{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:12px;color:#fff;background:#000a}
#cur{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--acc);background:#3b6cf655;pointer-events:none;z-index:9;display:none;transition:transform .08s}
#cur.p{transform:scale(.6);background:var(--acc)}
#cur.s{border-color:#e8a317;background:#e8a31755}
#help{color:var(--mut);font-size:.92em}
#start{margin:12px 0;padding:14px 22px;font-size:1.1em;background:var(--acc);color:#fff;border:0;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
<header>
  <button id="back">←</button>
  <button id="home">⌂</button>
  <input id="q" placeholder="Busca en Wikipedia…" autocomplete="off">
  <button id="go">Buscar</button>
</header>
<div id="main"></div>
<div id="cam" class="hide"><video id="v" playsinline muted></video><div id="st">Cargando…</div></div>
<div id="cur"></div>

<script type="module">
import {HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const $=s=>document.querySelector(s), main=$('#main'), cur=$('#cur'), st=$('#st');
const API='https://es.wikipedia.org/w/api.php?format=json&origin=*&';
const hist=[];

/* ---------- Navegador (Wikipedia) ---------- */
function home(){
  main.innerHTML=`<h1>Navegador con la mano ✋</h1>
  <p id="help"><b>Gestos:</b><br>
  ☝️ <b>Índice levantado</b> → mueve el cursor<br>
  🤏 <b>Pellizco</b> (pulgar + índice) → clic / abrir<br>
  ✌️ <b>Índice + corazón</b> y mover la mano arriba/abajo → scroll<br>
  ✊ <b>Puño</b> → pausa</p>
  <button id="start">Activar cámara y control con la mano</button>
  <p class="sn">Mientras tanto puedes usar el ratón. Prueba a buscar algo arriba.</p>`;
  $('#start').onclick=startHand;
}
async function search(t){
  if(!t)return;
  main.innerHTML='<p>Buscando…</p>';
  try{
    const r=await (await fetch(API+'action=query&list=search&srlimit=10&srsearch='+encodeURIComponent(t))).json();
    main.innerHTML='<h2>Resultados</h2>';
    r.query.search.forEach(x=>{
      const d=document.createElement('div');d.className='res';
      d.innerHTML=`<b>${x.title}</b><div class="sn">${x.snippet}</div>`;
      d.onclick=()=>open(x.title);main.appendChild(d);
    });
    hist.push(()=>search(t));main.scrollTop=0;
  }catch(e){main.innerHTML='<p>Error de red.</p>'}
}
async function open(title,push=true){
  main.innerHTML='<p>Cargando…</p>';
  try{
    const r=await (await fetch(API+'action=parse&prop=text&redirects=1&disableeditsection=1&page='+encodeURIComponent(title))).json();
    const box=document.createElement('div');
    box.innerHTML=`<h1>${r.parse.title}</h1>`+r.parse.text['*'];
    box.querySelectorAll('script,style,.mw-editsection,.navbox,.reflist,.references,sup.reference,.mw-references-wrap').forEach(e=>e.remove());
    box.querySelectorAll('img').forEach(i=>{if(i.src.startsWith('file:'))i.src=i.src.replace('file:','https:');i.removeAttribute('srcset')});
    box.querySelectorAll('a').forEach(a=>{
      const h=a.getAttribute('href')||'';
      if(h.startsWith('/wiki/')&&!h.includes(':')){
        const t=decodeURIComponent(h.slice(6).split('#')[0]);
        a.removeAttribute('href');a.dataset.t=t;a.style.cursor='pointer';
        a.onclick=e=>{e.preventDefault();open(t)};
      }else{a.removeAttribute('href');a.style.color='inherit';}
    });
    main.innerHTML='';main.appendChild(box);main.scrollTop=0;
    if(push)hist.push(()=>open(title,false));
  }catch(e){main.innerHTML='<p>No se pudo cargar el artículo.</p>'}
}
$('#go').onclick=()=>search($('#q').value);
$('#q').onkeydown=e=>{if(e.key==='Enter')search(e.target.value)};
$('#home').onclick=()=>{hist.length=0;home()};
$('#back').onclick=()=>{hist.pop();const f=hist[hist.length-1];if(f){hist.pop();f()}else home()};
home();

/* ---------- Control con la mano ---------- */
let lm,running=false,paused=false,cx=innerWidth/2,cy=innerHeight/2,trail=[],pinched=false,lastClick=0,prevSY=null,hovered=null;

async function startHand(){
  const v=$('#v'),cam=$('#cam');cam.classList.remove('hide');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
    v.srcObject=stream;await v.play();
    st.textContent='Cargando modelo…';
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    lm=await HandLandmarker.createFromOptions(fs,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},
      runningMode:"VIDEO",numHands:1});
    running=true;cur.style.display='block';st.textContent='Listo';loop();
  }catch(e){st.textContent='Error: '+e.message}
}
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const up=(l,t,p)=>l[t].y<l[p].y-0.02;

function loop(){
  if(!running)return;
  const v=$('#v');
  if(v.readyState>=2){
    const r=lm.detectForVideo(v,performance.now());
    if(r.landmarks&&r.landmarks.length)handle(r.landmarks[0]);
    else{st.textContent='Sin mano';prevSY=null;cur.className='';}
  }
  requestAnimationFrame(loop);
}
function handle(l){
  const idx=up(l,8,6),mid=up(l,12,10),ring=up(l,16,14),pin=up(l,20,18);
  const size=d2(l[0],l[9])||1;
  const pinch=d2(l[4],l[8])/size<0.28;
  const fist=!idx&&!mid&&!ring&&!pin&&!pinch;
  // cursor (espejo)
  const tx=(1-l[8].x)*innerWidth, ty=l[8].y*innerHeight;
  // amplía el rango para llegar a los bordes
  const gx=Math.min(innerWidth,Math.max(0,(tx-innerWidth/2)*1.5+innerWidth/2));
  const gy=Math.min(innerHeight,Math.max(0,(ty-innerHeight/2)*1.5+innerHeight/2));
  if(fist){st.textContent='✊ Pausa';cur.className='';prevSY=null;return}

  if(idx&&mid&&!ring&&!pin){ // scroll
    st.textContent='✌️ Scroll';cur.className='s';
    const y=l[9].y*innerHeight;
    if(prevSY!==null)main.scrollTop+=(prevSY-y)*-2.2;
    prevSY=y;
    return;
  }
  prevSY=null;
  cx+=(gx-cx)*0.35;cy+=(gy-cy)*0.35;
  trail.push([cx,cy]);if(trail.length>8)trail.shift();
  cur.style.left=cx+'px';cur.style.top=cy+'px';
  hover(cx,cy);

  if(pinch){
    cur.className='p';st.textContent='🤏 Clic';
    if(!pinched&&performance.now()-lastClick>600){
      pinched=true;lastClick=performance.now();
      const [px,py]=trail[0]; // posición antes del pellizco
      click(px,py);
    }
  }else{pinched=false;cur.className='';st.textContent='☝️ Cursor'}
}
function target(x,y){
  cur.style.display='none';
  const e=document.elementFromPoint(x,y);cur.style.display='block';
  return e&&e.closest('a[data-t],button,.res,input');
}
function hover(x,y){
  const t=target(x,y);
  if(t!==hovered){hovered&&hovered.classList.remove('hov');hovered=t;t&&t.classList.add('hov')}
}
function click(x,y){
  const t=target(x,y);
  if(t){t.tagName==='INPUT'?t.focus():t.click()}
}
</script>
</body>
</html>
