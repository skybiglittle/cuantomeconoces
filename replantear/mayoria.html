<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unánime — Sintonía de Grupo</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --card-border: #334155;
  --tx: #f8fafc;
  --mut: #94a3b8;
  --ac: #6366f1;
  --ac-glow: rgba(99, 102, 241, 0.35);
  --mode-same: #10b981;
  --mode-diff: #f59e0b;
  --danger: #ef4444;
  --radius: 16px;
  box-sizing: border-box;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body { background: var(--bg); color: var(--tx); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
main { max-width: 500px; width: 100%; }

.card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
h1 { font-size: 32px; font-weight: 800; text-align: center; margin-bottom: 6px; background: linear-gradient(135deg, #a855f7, #6366f1, #3b82f6); -webkit-background-clip: text; color: transparent; }
p.subtitle { text-align: center; color: var(--mut); font-size: 14px; margin-bottom: 20px; }

.badge { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
.badge.same { background: rgba(16, 185, 129, 0.15); color: var(--mode-same); border: 1px solid var(--mode-same); }
.badge.diff { background: rgba(245, 158, 11, 0.15); color: var(--mode-diff); border: 1px solid var(--mode-diff); }

.field { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--mut); margin-bottom: 6px; text-transform: uppercase; }
input[type="text"] { width: 100%; padding: 14px 16px; background: #0f172a; border: 1.5px solid var(--card-border); border-radius: 12px; color: var(--tx); font-size: 16px; outline: none; transition: border-color 0.2s; }
input[type="text"]:focus { border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-glow); }

button.btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; box-shadow: 0 4px 12px var(--ac-glow); margin-top: 8px; }
button.btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
button.btn:active { transform: translateY(0); }
button.btn.sec { background: transparent; border: 1.5px solid var(--card-border); color: var(--tx); box-shadow: none; margin-top: 8px; }
button.btn.sec:hover { background: rgba(255,255,255,0.05); }

.mode-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.mode-btn { padding: 12px; border-radius: 12px; border: 1.5px solid var(--card-border); background: #0f172a; color: var(--mut); font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s; }
.mode-btn.active.same { border-color: var(--mode-same); background: rgba(16, 185, 129, 0.1); color: var(--mode-same); }
.mode-btn.active.diff { border-color: var(--mode-diff); background: rgba(245, 158, 11, 0.1); color: var(--mode-diff); }

.timer-bar { height: 6px; background: var(--card-border); border-radius: 6px; overflow: hidden; margin: 16px 0; }
.timer-fill { height: 100%; background: var(--ac); width: 100%; transition: width 0.1s linear; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 99px; font-size: 13px; margin: 4px; }
.pill-list { display: flex; flex-wrap: wrap; margin-bottom: 16px; }

.res-group { background: #0f172a; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--card-border); }
.res-word { font-size: 18px; font-weight: 800; color: var(--ac); text-transform: uppercase; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.res-players { font-size: 13px; color: var(--mut); }

.leaderboard { list-style: none; }
.leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; margin-bottom: 6px; }
.leaderboard-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.leaderboard-pts { font-weight: 800; color: var(--ac); }

.dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--mut); margin: 0 2px; animation: blink 1.4s infinite; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
</style>
</head>
<body>

<main id="app"></main>

<script>
// --- BANCO DE CATEGORÍAS ---
const CATEGORIES = [
  "Un ingrediente de la pizza",
  "Una película de Disney o Pixar",
  "Algo que llevas a la playa",
  "Un sabor de helado tradicional",
  "Una excusa típica para llegar tarde",
  "Un objeto que hay en el salón",
  "Un súper poder de cómic",
  "Una fruta tropical",
  "Un deporte olímpico",
  "Algo que encuentras en un hotel",
  "Un animal doméstico o de granja",
  "Una marca de ropa deportiva",
  "Un instrumento musical de viento o cuerda",
  "Algo que se compra en una panadería",
  "Un villano famoso del cine",
  "Una asignatura del colegio",
  "Algo que siempre guardas en el bolsillo o bolso",
  "Un medio de transporte urbano",
  "Un regalo típico de cumpleaños",
  "Una aplicación de móvil que usas a diario"
];

// --- ESTADO GLOBAL ---
let state = {
  playerName: '',
  roomCode: '',
  isHost: false,
  mode: 'same', // 'same' (Unánime / Mismo) o 'diff' (Rebelde / Diferente)
  phase: 'home', // home, lobby, write, waiting, reveal, scoreboard
  roundsTotal: 5,
  currentRound: 0,
  currentCategory: '',
  myAnswer: '',
  timer: 30,
  players: {}, // { id: { name, score, answer, submitted } }
  history: []
};

let channel = null;
let timerInterval = null;
const app = document.getElementById('app');

// --- SISTEMA DE RED EN TIEMPO REAL (BroadcastChannel) ---
function initChannel(code) {
  if (channel) channel.close();
  channel = new BroadcastChannel('unanime-room-' + code.toLowerCase());
  channel.onmessage = (e) => handleNetworkMessage(e.data);
}

function broadcast(type, payload = {}) {
  if (channel) {
    channel.postMessage({ type, sender: getMyId(), payload });
  }
}

function getMyId() {
  let id = sessionStorage.getItem('unanime_pid');
  if (!id) {
    id = 'p_' + Math.random().toString(36).substr(2, 9);
    sessionStorage.setItem('unanime_pid', id);
  }
  return id;
}

function handleNetworkMessage(msg) {
  const { type, sender, payload } = msg;

  if (type === 'JOIN_REQUEST') {
    if (state.isHost) {
      state.players[sender] = { name: payload.name, score: 0, answer: '', submitted: false };
      broadcastState();
      render();
    }
  } else if (type === 'STATE_UPDATE') {
    if (!state.isHost) {
      state.players = payload.players;
      state.phase = payload.phase;
      state.currentRound = payload.currentRound;
      state.currentCategory = payload.currentCategory;
      state.mode = payload.mode;
      state.roundsTotal = payload.roundsTotal;
      state.timer = payload.timer;
      render();
    }
  } else if (type === 'SUBMIT_ANSWER') {
    if (state.isHost && state.players[sender]) {
      state.players[sender].answer = payload.answer;
      state.players[sender].submitted = true;
      
      // Comprobar si todos han respondido
      const allSubmitted = Object.values(state.players).every(p => p.submitted);
      if (allSubmitted) {
        clearInterval(timerInterval);
        processResults();
      } else {
        broadcastState();
      }
      render();
    }
  }
}

function broadcastState() {
  broadcast('STATE_UPDATE', {
    players: state.players,
    phase: state.phase,
    currentRound: state.currentRound,
    currentCategory: state.currentCategory,
    mode: state.mode,
    roundsTotal: state.roundsTotal,
    timer: state.timer
  });
}

// --- LÓGICA DE JUEGO ---
function createRoom() {
  const nameInput = document.getElementById('player-name').value.trim();
  if (!nameInput) return alert("Introduce tu nombre");
  
  state.playerName = nameInput;
  state.roomCode = Math.random().toString(36).substr(2, 5).toUpperCase();
  state.isHost = true;
  state.players[getMyId()] = { name: nameInput, score: 0, answer: '', submitted: false };
  state.phase = 'lobby';
  
  initChannel(state.roomCode);
  render();
}

function joinRoom() {
  const nameInput = document.getElementById('player-name').value.trim();
  const codeInput = document.getElementById('room-code').value.trim().toUpperCase();
  if (!nameInput || !codeInput) return alert("Introduce nombre y código de sala");

  state.playerName = nameInput;
  state.roomCode = codeInput;
  state.isHost = false;
  state.phase = 'lobby';

  initChannel(codeInput);
  broadcast('JOIN_REQUEST', { name: nameInput });
  render();
}

function startNextRound() {
  if (!state.isHost) return;
  
  state.currentRound++;
  if (state.currentRound > state.roundsTotal) {
    state.phase = 'scoreboard';
    broadcastState();
    render();
    return;
  }

  // Limpiar respuestas
  Object.keys(state.players).forEach(id => {
    state.players[id].answer = '';
    state.players[id].submitted = false;
  });

  state.currentCategory = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
  state.phase = 'write';
  state.timer = 30;

  broadcastState();
  render();

  // Iniciar temporizador
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    state.timer--;
    if (state.timer <= 0) {
      clearInterval(timerInterval);
      processResults();
    } else {
      broadcastState();
      render();
    }
  }, 1000);
}

function submitMyAnswer() {
  const ansInput = document.getElementById('my-answer').value.trim();
  if (!ansInput) return alert("Escribe algo antes de enviar");

  state.myAnswer = ansInput;
  const myId = getMyId();

  if (state.isHost) {
    state.players[myId].answer = ansInput;
    state.players[myId].submitted = true;
    
    const allSubmitted = Object.values(state.players).every(p => p.submitted);
    if (allSubmitted) {
      clearInterval(timerInterval);
      processResults();
    } else {
      broadcastState();
    }
  } else {
    broadcast('SUBMIT_ANSWER', { answer: ansInput });
    state.phase = 'waiting';
  }
  render();
}

function sanitize(text) {
  return text.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Quitar acentos
    .replace(/[^a-z0-9 ]/g, "")
    .trim();
}

function processResults() {
  // Frecuencia de palabras
  const counts = {};
  Object.values(state.players).forEach(p => {
    const norm = sanitize(p.answer || "sin respuesta");
    counts[norm] = (counts[norm] || 0) + 1;
  });

  const totalPlayers = Object.keys(state.players).length;

  // Calcular puntos por jugador según el Modo
  Object.values(state.players).forEach(p => {
    const norm = sanitize(p.answer || "sin respuesta");
    const matches = counts[norm] || 0;

    if (!p.answer) {
      // Sin respuesta = 0 puntos siempre
      return;
    }

    if (state.mode === 'same') {
      // Modo Mismo / Unánime: Sumas puntos igual al número de personas que coincidieron contigo
      // Si coincides con 3 personas (tú + 2), te llevas 3 puntos.
      p.score += matches > 1 ? matches : 0;
    } else {
      // Modo Diferente / Rebelde:
      // Si tu respuesta es ÚNICA (matches === 1), te llevas 3 puntos.
      // Si tu respuesta la dijo alguien más, te llevas 0 puntos.
      if (matches === 1) {
        p.score += 3;
      }
    }
  });

  state.phase = 'reveal';
  broadcastState();
  render();
}

// --- VISTAS / RENDER ---
function renderHome() {
  return `
    <div class="card">
      <h1>UNÁNIME</h1>
      <p class="subtitle">Sintonía de Grupo & Deducción Colectiva</p>
      
      <div class="field">
        <label>Tu Nombre / Nickname</label>
        <input type="text" id="player-name" placeholder="Ej: Alex" maxlength="15">
      </div>

      <button class="btn" onclick="createRoom()">Crear Nueva Sala</button>
      
      <div style="margin: 16px 0; border-top: 1px solid var(--card-border);"></div>

      <div class="field">
        <label>Código de Sala</label>
        <input type="text" id="room-code" placeholder="Ej: X9K2L" style="text-transform: uppercase;">
      </div>
      <button class="btn sec" onclick="joinRoom()">Unirse a Sala</button>
    </div>
  `;
}

function renderLobby() {
  const playerList = Object.values(state.players);
  const myId = getMyId();

  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <span class="badge ${state.mode}">Modo: ${state.mode === 'same' ? 'Mismo (Unánime)' : 'Diferente (Rebelde)'}</span>
        <span style="font-size:12px; color:var(--mut); font-weight:700;">SALA: ${state.roomCode}</span>
      </div>

      <h1>Sala de Espera</h1>
      <p class="subtitle">Esperando a los jugadores...</p>

      ${state.isHost ? `
        <div class="field">
          <label>Modo de Juego</label>
          <div class="mode-selector">
            <div class="mode-btn ${state.mode === 'same' ? 'active same' : ''}" onclick="setMode('same')">
              🤝 MISMO
              <div style="font-size:10px; font-weight:400; margin-top:2px;">Coincidir con la mayoría</div>
            </div>
            <div class="mode-btn ${state.mode === 'diff' ? 'active diff' : ''}" onclick="setMode('diff')">
              🦄 DIFERENTE
              <div style="font-size:10px; font-weight:400; margin-top:2px;">Dar una respuesta única</div>
            </div>
          </div>
        </div>
      ` : ''}

      <div class="field">
        <label>Jugadores Conectados (${playerList.length})</label>
        <div class="pill-list">
          ${playerList.map(p => `
            <span class="pill">
              <span style="width:8px; height:8px; background:var(--mode-same); border-radius:50%;"></span>
              ${p.name}
            </span>
          `).join('')}
        </div>
      </div>

      ${state.isHost ? `
        <button class="btn" onclick="startNextRound()" ${playerList.length < 2 ? 'disabled style="opacity:0.5"' : ''}>
          ${playerList.length < 2 ? 'Faltan Jugadores (Mínimo 2)' : 'Empezar Partida'}
        </button>
      ` : `
        <p style="text-align:center; color:var(--mut); font-size:14px; margin-top:16px;">
          Esperando a que el anfitrión inicie la partida <span class="dots"><span></span><span></span><span></span></span>
        </p>
      `}
    </div>
  `;
}

function setMode(m) {
  if (!state.isHost) return;
  state.mode = m;
  broadcastState();
  render();
}

function renderWrite() {
  const myId = getMyId();
  const myPlayer = state.players[myId];
  const hasSubmitted = myPlayer && myPlayer.submitted;

  if (hasSubmitted) {
    return `
      <div class="card">
        <span class="badge ${state.mode}">Modo: ${state.mode === 'same' ? 'Mismo' : 'Diferente'}</span>
        <h2>Respuesta Enviada</h2>
        <p class="subtitle">Esperando a que los demás respondan...</p>
        
        <div style="text-align:center; padding: 20px 0;">
          <div style="font-size:14px; color:var(--mut);">Tu respuesta:</div>
          <div style="font-size:24px; font-weight:800; color:var(--ac); text-transform:uppercase; margin-top:4px;">
            "${state.myAnswer}"
          </div>
        </div>

        <div class="field">
          <label>Estado del Grupo</label>
          <div class="pill-list">
            ${Object.values(state.players).map(p => `
              <span class="pill" style="opacity: ${p.submitted ? '1' : '0.4'}">
                ${p.submitted ? '✓' : '⏳'} ${p.name}
              </span>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="badge ${state.mode}">Ronda ${state.currentRound} / ${state.roundsTotal}</span>
        <span style="font-size:14px; font-weight:800; color:var(--danger);">${state.timer}s</span>
      </div>

      <div class="timer-bar">
        <div class="timer-fill" style="width: ${(state.timer / 30) * 100}%;"></div>
      </div>

      <div style="margin: 16px 0; text-align:center;">
        <div style="font-size:12px; color:var(--mut); font-weight:700; text-transform:uppercase;">Categoría</div>
        <h2 style="font-size:22px; margin-top:4px;">${state.currentCategory}</h2>
      </div>

      <p style="font-size:13px; color:var(--mut); margin-bottom:12px; text-align:center;">
        ${state.mode === 'same' 
          ? '👉 Escribe lo que creas que responderá LA MAYORÍA.' 
          : '👉 Escribe algo válido pero ÚNICO que nadie más vaya a poner.'}
      </p>

      <div class="field">
        <input type="text" id="my-answer" placeholder="Escribe tu respuesta aquí..." maxlength="30" autocomplete="off">
      </div>

      <button class="btn" onclick="submitMyAnswer()">Enviar Respuesta</button>
    </div>
  `;
}

function renderReveal() {
  // Agrupar respuestas
  const groups = {};
  Object.values(state.players).forEach(p => {
    const raw = p.answer.trim();
    const norm = sanitize(raw || "Sin Respuesta");
    if (!groups[norm]) {
      groups[norm] = { display: raw || "Sin Respuesta", players: [] };
    }
    groups[norm].players.push(p.name);
  });

  const sortedGroups = Object.values(groups).sort((a,b) => b.players.length - a.players.length);

  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span class="badge ${state.mode}">${state.mode === 'same' ? 'Modo Mismo' : 'Modo Diferente'}</span>
        <span style="font-size:12px; color:var(--mut); font-weight:700;">Resultados Ronda ${state.currentRound}</span>
      </div>

      <h2 style="text-align:center; font-size:20px; margin-bottom:16px;">${state.currentCategory}</h2>

      ${sortedGroups.map(g => {
        const isMatch = g.players.length > 1;
        const pts = state.mode === 'same' 
          ? (isMatch ? g.players.length : 0)
          : (!isMatch && g.display !== "Sin Respuesta" ? 3 : 0);

        return `
          <div class="res-group" style="border-left: 4px solid ${pts > 0 ? (state.mode === 'same' ? 'var(--mode-same)' : 'var(--mode-diff)') : 'var(--card-border)'}">
            <div class="res-word">
              <span>${g.display}</span>
              <span style="font-size:14px; background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:6px;">+${pts} pts</span>
            </div>
            <div class="res-players">Jugadores: ${g.players.join(', ')}</div>
          </div>
        `;
      }).join('')}

      <div style="margin-top:20px;">
        <label>Clasificación General</label>
        <ul class="leaderboard">
          ${Object.values(state.players)
            .sort((a,b) => b.score - a.score)
            .map((p, idx) => `
              <li class="leaderboard-item">
                <span class="leaderboard-name">
                  <span style="font-weight:800; color:var(--mut);">${idx + 1}.</span> ${p.name}
                </span>
                <span class="leaderboard-pts">${p.score} pts</span>
              </li>
            `).join('')}
        </ul>
      </div>

      ${state.isHost ? `
        <button class="btn" style="margin-top:20px;" onclick="startNextRound()">
          ${state.currentRound >= state.roundsTotal ? 'Ver Resultado Final' : 'Siguiente Ronda'}
        </button>
      ` : `
        <p style="text-align:center; color:var(--mut); font-size:14px; margin-top:16px;">
          Esperando al anfitrión para continuar...
        </p>
      `}
    </div>
  `;
}

function renderScoreboard() {
  const sorted = Object.values(state.players).sort((a,b) => b.score - a.score);

  return `
    <div class="card" style="text-align:center;">
      <h1>🏆 FIN DE LA PARTIDA</h1>
      <p class="subtitle">Clasificación Definitiva</p>

      <div style="margin: 24px 0;">
        <div style="font-size:48px; margin-bottom:8px;">🥇</div>
        <h2 style="font-size:28px; color:var(--ac);">${sorted[0] ? sorted[0].name : '-'}</h2>
        <div style="font-size:18px; font-weight:800; color:var(--tx);">${sorted[0] ? sorted[0].score : 0} Puntos</div>
      </div>

      <ul class="leaderboard" style="margin-bottom:24px;">
        ${sorted.map((p, idx) => `
          <li class="leaderboard-item">
            <span class="leaderboard-name">
              <span style="font-weight:800; color:var(--mut);">${idx + 1}.</span> ${p.name}
            </span>
            <span class="leaderboard-pts">${p.score} pts</span>
          </li>
        `).join('')}
      </ul>

      <button class="btn" onclick="location.reload()">Jugar de Nuevo</button>
    </div>
  `;
}

function render() {
  switch (state.phase) {
    case 'home': app.innerHTML = renderHome(); break;
    case 'lobby': app.innerHTML = renderLobby(); break;
    case 'write': 
    case 'waiting': app.innerHTML = renderWrite(); break;
    case 'reveal': app.innerHTML = renderReveal(); break;
    case 'scoreboard': app.innerHTML = renderScoreboard(); break;
  }
}

// Inicializar vista
render();
</script>
</body>
</html>
